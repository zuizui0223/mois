name: MOIS offset64 second disjoint post-snapshot iNaturalist CC original ROI9
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-zero9-postsnapshot-offset64-next-original-ROI9.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-postsnapshot-64offset-154fe112-signed-once
  cancel-in-progress: false
jobs:
  signed-firstplus-history-ID-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      ready: ${{ steps.prescreen.outputs.ready }}
      has_new: ${{ steps.plan.outputs.has_new }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and prior actual image/audit signed ZIP receipts; refuse duplicate source
        id: prescreen
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          test "$(gh api "repos/$REPO/actions/runs/43547088936" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/43546479575" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/43547088936/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="mois-new-inat-post20261027-zero9-offset64-64taxa-source-only") | .digest')" = 'sha256:154fe112e36c76034dabc7f4f85f1cb24304ca087c50ee9fad2f0aa9557a5c83'
          test "$(gh api "repos/$REPO/actions/runs/43546479575/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="mois-postsnapshot-two-CC-photos-full-1231244-ID-source") | .digest')" = 'sha256:ac558f06e5a0f75cf0fab2d0a37e3f17b2fe3428f788cccb801b5a01dd2b81ac'
          test "$(gh api "repos/$REPO/actions/runs/43546479575/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="mois-postsnapshot-independent-real-ROI9-audit") | .digest')" = 'sha256:0885d6b4e6ea67b6244b848e875eafffcdcc384187f8e39178d20f0285200ba6'
          test "$(gh api "repos/$REPO/actions/runs/43470118921/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="mois-fiftysixth4096-verified-append-fiftyseventh-prioritized-original-source") | .digest')" = 'sha256:83ad6be61d001e8abeaca5b5d233700c86da35fa33195a0e22fd93ca561e7782'
          for prior in $(gh run list --repo "$REPO" --workflow mois-zero9-postsnapshot-offset64-next-original-ROI9.yml --limit 100 --json databaseId --jq ".[] | select(.databaseId < $GITHUB_RUN_ID) | .databaseId"); do
            if [ "$(gh api "repos/$REPO/actions/runs/$prior" --jq .status)" != completed ]; then
              echo "MOIS_PRIOR_OFFSET64_SOURCE_RUN_IN_FLIGHT $prior"; exit 0
            fi
            frozen="$(gh api "repos/$REPO/actions/runs/$prior/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="mois-offset64-CC-one-photo-full-prior-ID-source")] | length')"
            worked="$(gh api "repos/$REPO/actions/runs/$prior/jobs?per_page=100" --jq '[.jobs[] | select(.name=="real-new-offset64-original-pixel-worker" and .conclusion!="skipped")] | length')"
            if [ "$frozen" != 0 ] || [ "$worked" != 0 ]; then
              echo "MOIS_OFFSET64_SOURCE_ALREADY_FROZEN_OR_PIXELS_TRIED $prior"; exit 0
            fi
            echo "MOIS_PRIOR_GATE_ONLY_FAILURE $prior; safe fix can proceed before source/pixel"
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Restore latest source-only and previously signed 1.23M ID union, previous 2 originals; no old pixels
        if: steps.prescreen.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          python -m py_compile scripts/acquisition/mois_new_inat_postsnapshot_followup_fullID_roi9.py
          gh() {
            if [ "${1:-}" = run ] && [ "${2:-}" = download ]; then
              for attempt in 1 2 3; do
                if command gh "$@"; then return 0; fi
                if [ "$attempt" -eq 3 ]; then echo "MOIS_SIGNED_HISTORY_ID_REUSE_RESTORE_FAILED; NO PIXELS"; return 1; fi
                sleep $((attempt*15))
              done
            else command gh "$@"; fi
          }
          gh run download 43547088936 --repo "$REPO" --name mois-new-inat-post20261027-zero9-offset64-64taxa-source-only --dir recent
          gh run download 43546479575 --repo "$REPO" --name mois-postsnapshot-two-CC-photos-full-1231244-ID-source --dir first_source
          gh run download 43546479575 --repo "$REPO" --name mois-postsnapshot-independent-real-ROI9-audit --dir first_audit
          gh run download 43470118921 --repo "$REPO" --name mois-fiftysixth4096-verified-append-fiftyseventh-prioritized-original-source --dir atlas56
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('first_audit/receipt.json'))
          assert p['actual_genuine_strict9_numeric_success']==1 and p['actual_technical_unknowns']==1
          assert p['actual_image_downloaded']==p['original_licensed_photo_attempts']==2
          assert p['official_iNat_42111_original_frame_auto_appended'] is False
          q=json.load(open('recent/receipt.json'))
          assert q['source_deterministic_hash_offset']==64
          assert q['new_independent_original_iNaturalist_photo_IDs_seen']==1
          print('MOIS_NEXT_HASH_DISJOINT64_ONE_CC_SOURCE_AFTER_SIGNED_TWO_REAL_PIXELS',flush=True)
          PY
      - name: Full original 1,231,244 and first two new photo/UUID/raw-SHA exclusion; freeze next photo
        if: steps.prescreen.outputs.ready == 'true'
        id: plan
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_new_inat_postsnapshot_followup_fullID_roi9 gate \
            --meta recent/new_post20261027_inat_zeroROI_photo_candidates.csv \
            --receipt recent/receipt.json \
            --atlas atlas56/updated/mois_species_first_42111_after_fiftysixth.csv.gz \
            --earlier first_source --earlier-audit first_audit --output source
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          m=json.load(open('source/manifest.json'))
          assert m['source_fixed_hash_offset']==64
          assert m['source_prior_no_reused_original_photo_or_observation'] is True
          assert m['new_photo_attempts_planned']==1
          print('has_new='+str(m['work_units']>0).lower())
          PY
      - uses: actions/upload-artifact@v4
        if: steps.prescreen.outputs.ready == 'true'
        with:
          name: mois-offset64-CC-one-photo-full-prior-ID-source
          path: source/
          retention-days: 90
          if-no-files-found: error
  real-new-offset64-original-pixel-worker:
    needs: signed-firstplus-history-ID-gate
    if: needs.signed-firstplus-history-ID-gate.outputs.ready == 'true' && needs.signed-firstplus-history-ID-gate.outputs.has_new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-offset64-CC-one-photo-full-prior-ID-source
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap exactly frozen FCP YOLO11 EfficientSAM ROI-v4
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Fetch only genuinely unattempted CC S3 original pixel and apply ROI-v4 nine numerical fractions
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-postsnapshot-offset64-provider"
          python -m scripts.acquisition.mois_full_index_real_original_photo_measure work \
            --source source --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" --group 0 --output measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-offset64-one-new-authentic-original-photo-worker
          path: measured/
          retention-days: 90
          if-no-files-found: warn
  independent-second-wave-nineROI-audit:
    needs: [signed-firstplus-history-ID-gate,real-new-offset64-original-pixel-worker]
    if: needs.signed-firstplus-history-ID-gate.outputs.ready == 'true' && needs.signed-firstplus-history-ID-gate.outputs.has_new == 'true' && needs.real-new-offset64-original-pixel-worker.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-offset64-CC-one-photo-full-prior-ID-source
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: mois-offset64-one-new-authentic-original-photo-worker
          path: worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconfirm full prior 1.23M IDs plus first two photo/obs/raw SHAs, ROI9 and technical unknown
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          python -m scripts.acquisition.mois_new_inat_postsnapshot_followup_fullID_roi9 audit \
            --source source --worker worker --output audited
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('audited/receipt.json'))
          assert r['original_licensed_photo_attempts']==1
          assert r['photo_observation_taxon_collision_count']==0
          assert r['additional_first_new_photo_IDs_excluded']==2
          assert r['additional_first_new_raw_image_SHA_collisions']==0
          assert r['actual_genuine_strict9_numeric_success']+r['actual_technical_unknowns']==1
          assert r['full_historical_raw_image_SHA_collision_check_possible'] is False
          assert r['official_iNat_42111_original_frame_auto_appended'] is False
          print('MOIS_SECOND64_SIGNED_ONE_PHOTO_ROI9',r['actual_genuine_strict9_numeric_success'],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-offset64-new-original-independent-real-ROI9-audit
          path: audited/
          retention-days: 90
          if-no-files-found: warn
