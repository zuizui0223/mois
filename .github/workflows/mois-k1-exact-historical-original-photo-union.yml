name: MOIS exact historical plus completed K1 unique original photo ID audit
on:
  push:
    branches: [main]
    paths:
      - scripts/acquisition/mois_k1_historical_photo_id_union.py
      - tests/test_mois_k1_historical_photo_id_union.py
      - .github/workflows/mois-k1-exact-historical-original-photo-union.yml
  pull_request:
    paths:
      - scripts/acquisition/mois_k1_historical_photo_id_union.py
      - tests/test_mois_k1_historical_photo_id_union.py
      - .github/workflows/mois-k1-exact-historical-original-photo-union.yml
  workflow_run:
    workflows:
      - MOIS FCP K1 signed cumulative true original photo progress
    types: [completed]
    branches: [main]
  schedule:
    - cron: '46 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-929138-historical-plus-completed-K1-photo-ID-immutable-SHA-union
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source-photo ID overlap, exact RGB/terminal SHAs, technical unknown and shell syntax
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 pyarrow==19.0.1 PyYAML==6.0.2
          python -m py_compile scripts/acquisition/mois_k1_historical_photo_id_union.py
          python -m unittest discover -s tests -p test_mois_k1_historical_photo_id_union.py -v
          python - <<'PY'
          import subprocess,yaml
          s=yaml.safe_load(open('.github/workflows/mois-k1-exact-historical-original-photo-union.yml'))
          cmds=[step['run'] for job in s['jobs'].values()
                for step in job['steps'] if 'run' in step]
          assert len(cmds)>=5
          for c in cmds:
              p=subprocess.run(['bash','-n'],input=c,text=True,capture_output=True)
              assert p.returncode==0,p.stderr
          print('MOIS_EXACT_HISTORICAL_K1_PHOTO_UNION_ALL_SHELL_STEPS_VALID',len(cmds))
          PY
  genuine-photo-id-union:
    needs: tests
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'zuizui0223/mois' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Pick immutable signed K1 milestone only, never schedule unmeasured pixels
        id: gate
        run: |
          set -euo pipefail
          gh api --paginate --jq '.[] | {tag_name: .tag_name, published_at: .published_at, draft: .draft}' \
            "repos/$REPO/releases?per_page=100" > all-signed-releases.jsonl
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          text=Path('all-signed-releases.jsonl').read_text()
          decoder=json.JSONDecoder();found=[]
          pat=re.compile(r'mois-K1-genuine-completed-original-ROI-([0-9]+)groups-([0-9a-f]{16})-v1\Z')
          while text.strip():
              value,end=decoder.raw_decode(text.lstrip())
              text=text.lstrip()[end:]
              match=pat.fullmatch(str(value.get('tag_name') or ''))
              if match and value.get('draft') is False and value.get('published_at'):
                  n=int(match.group(1))
                  if 16<=n<=75 and (n%8==0 or n==75):
                      found.append((n,value['published_at'],value['tag_name'],match.group(2)))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              if not found:
                  f.write('ready=false\n')
                  print('No ≥16-group frozen genuine source K1 milestone to union')
              else:
                  n,published,source,suffix=max(found)
                  target=f'mois-verified-global929138-plus-K1-{n}groups-{suffix}-v1'
                  exists=subprocess.run(['gh','release','view',target,'--repo',
                      os.environ['REPO']],stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL).returncode==0
                  f.write('ready='+str(not exists).lower()+'\n')
                  if not exists:
                      with open(os.environ['GITHUB_ENV'],'a') as env:
                          env.write('K1_CUMULATIVE_SOURCE_TAG='+source+'\n')
                          env.write('OUTPUT_TAG='+target+'\n')
                  print('MOIS_UNIQUE_ORIGINAL_PIXELS_AFTER_GENUINE_K1',
                        json.dumps({'signed_groups':n,'source_tag':source,
                                    'global_target_tag':target,'already_SHA_published':exists,
                                    'no_image_download_or_ROI_inference':True}))
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Retrieve only four SHA-pinned historical photo metadata/ROI Parquets and exact cumulative K1 receipt
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 pyarrow==19.0.1
          gh release download mois-real-pixel-checkpoint-39969920310-v1 --repo "$REPO" \
            --dir historical/main \
            --pattern combined_actual_photo_checkpoint.parquet --pattern checkpoint_receipt.json
          gh release download mois-tier06-group00-first64bucket-warm-original-RGB-v1 --repo "$REPO" \
            --dir historical/group00 --pattern measured_photos.parquet --pattern receipt.json
          gh release download mois-tier06-all16-first4bucket-broad-warm-original-RGB-v1 --repo "$REPO" \
            --dir historical/r1 --pattern measured_photos.parquet --pattern receipt.json
          gh release download mois-tier06-all16-buckets004to011-broad-warm-original-RGB-v1 --repo "$REPO" \
            --dir historical/r2 --pattern measured_photos.parquet --pattern receipt.json
          gh release download "$K1_CUMULATIVE_SOURCE_TAG" --repo "$REPO" --dir cumulative \
            --pattern k1_cumulative_original_ROI_receipt.json
      - name: Fetch only released real K1 image-terminal Parquets and signed per-group JSON/coverage
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          c=json.loads(Path('cumulative/k1_cumulative_original_ROI_receipt.json').read_text())
          groups=c['completed_original_worker_group_IDs']
          assert groups and len(groups)==c['completed_and_SHA_sealed_original_worker_groups']
          assert len(groups)==len(set(groups))
          def fetch(group):
              tag=f'mois-full93m-balanced-onephoto-K1-original-RGB-append-group-{group}-v1'
              path=Path('groups')/f'group{group:02d}'
              path.mkdir(parents=True,exist_ok=False)
              subprocess.run(['gh','release','download',tag,'--repo',os.environ['REPO'],
                  '--dir',str(path),'--pattern','original_K1_group_receipt.json',
                  '--pattern','original_photo_ROIs.parquet',
                  '--pattern','original_photo_hue_counts.csv',
                  '--pattern','original_photo_source_coverage.json'],
                  check=True,capture_output=True,text=True)
              return str(path)
          with ThreadPoolExecutor(max_workers=4) as pool:
              folders=list(pool.map(fetch,groups))
          Path('verified-original-folders.json').write_text(json.dumps(folders,indent=2)+'\n')
          print('MOIS_SIGNED_K1_FULL_SOURCE_ROI_DATA_ONLY_READ',len(folders),
                'original_images_downloaded=0',flush=True)
          PY
      - name: Prove byte-exact original photo-ID disjointness from historical 929138 actual ROI outcomes
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.acquisition.mois_k1_historical_photo_id_union import run
          original=[Path(x) for x in json.loads(Path('verified-original-folders.json').read_text())]
          result=run(Path('historical'),
            Path('cumulative/k1_cumulative_original_ROI_receipt.json'),
            original,Path('union'))
          print('MOIS_TRUE_NEW_ORIGINAL_PIXELS_GLOBAL_SOURCE_DEDUP_COMPLETE',
                result['exact_global_historical_plus_K1_distinct_original_photo_IDs'],
                result['exact_global_historical_plus_K1_automatic_four_hue_photo_ROIs'],
                flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: mois-real-929138-plus-K1-source-verified-unique-original-photo-ledger-${{ github.run_id }}
          path: union/
          retention-days: 90
          if-no-files-found: error
      - name: Publish exact distinct historical and K1 original photo count or refuse contradictory source
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if gh release view "$OUTPUT_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release download "$OUTPUT_TAG" --repo "$REPO" --dir old \
              --pattern historical_plus_K1_source_signed_original_photo_ID_union.json
            cmp old/historical_plus_K1_source_signed_original_photo_ID_union.json \
                union/historical_plus_K1_source_signed_original_photo_ID_union.json
          else
            gh release create "$OUTPUT_TAG" \
              union/historical_plus_K1_source_signed_original_photo_ID_union.json \
              --repo "$REPO" --target "$GITHUB_SHA" \
              --title 'MOIS globally unique historical plus genuine K1 original photo IDs' \
              --notes 'Exact photo-ID union of SHA-certified 929138 historical original-image ROI attempts and ONLY completed original K1 image-worker terminals. Independent photo/observation ID and terminal hue/missingness/release byte SHA gates, per-photo selection probability preserved. Total is NOT 93209351 color classified photos, NOT botanically certified open wild/native flowers, and NOT an unbiased global native white-flora fraction. This operation only reads existing Parquet/JSON pixels, does not download any source images or refit YOLO11/EfficientSAM.'
          fi
