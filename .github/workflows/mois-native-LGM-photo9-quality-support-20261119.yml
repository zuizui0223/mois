name: "MOIS Paleo QA: WCVP-native photo9 quality and genus support"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - scripts/analysis/mois_native_LGM_photo9_quality_support_20261119.py
      - .github/workflows/mois-native-LGM-photo9-quality-support-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-native-LGM-photo9-quality-20261119
  cancel-in-progress: true
jobs:
  audited-quality-support:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact source readers
        run: |
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "pandas>=2.1,<3"
          python -m py_compile scripts/analysis/mois_native_LGM_photo9_quality_support_20261119.py
      - name: Retrieve and SHA check exact signed 10882 species result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14525280772/zip" \
            -o prior.zip
          echo "955f4c0fdf2ba1be49f3195e065db52b048e28400b4a7938dc8c97222c4e280d  prior.zip" | sha256sum -c
      - name: Verify photo ROI quality source and all hue-genus support denominators
        run: |
          python -m scripts.analysis.mois_native_LGM_photo9_quality_support_20261119 \
            --source prior.zip --out results/mois_WCVP_native_LGM_photo9_quality_support_20261119
      - name: Store checked quality-hue table, genus permutation contrasts and SHA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-WCVP-native-LGM-photo9-hue-quality-20261119
          path: results/mois_WCVP_native_LGM_photo9_quality_support_20261119/
          if-no-files-found: error
          retention-days: 30
