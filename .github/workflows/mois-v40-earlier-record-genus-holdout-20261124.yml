name: "MOIS ecology: earlier source records vs floral-colour predictor"
on:
  push:
    branches: [analysis/mois-global-floral-colour-assembly-null-20261118]
    paths:
      - scripts/analysis/mois_firstrecords_v40_earlier_record_genus_holdout_20261124.py
      - tests/test_mois_firstrecords_v40_earlier_record_genus_holdout_20261124.py
      - .github/workflows/mois-v40-earlier-record-genus-holdout-20261124.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-v40-earlier-record-genus-holdout-20261124
  cancel-in-progress: true
jobs:
  source-history-genus-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned predictive analysis requirements and test no leakage
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.1.3" "pandas==2.2.3" "scikit-learn==1.8.0" "pytest>=8,<10"
          python -m pytest -q tests/test_mois_firstrecords_v40_earlier_record_genus_holdout_20261124.py
      - name: Fetch prior certified source-history artifact and verify exact ZIP bytes
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14918250421/zip" \
            -o source/MOIS_v40_historical_earlier_record_source.zip
          echo "ee212ebd94d374e31d5511f22f0042f20f45618b47961faf8bce8fd45124e26e  source/MOIS_v40_historical_earlier_record_source.zip" | sha256sum -c
      - name: Run all five split repeats with source-historical completeness and photo9 contrasts
        run: |
          python -m scripts.analysis.mois_firstrecords_v40_earlier_record_genus_holdout_20261124 \
            --source source/MOIS_v40_historical_earlier_record_source.zip \
            --out results/mois_v40_earlier_record_genus_holdout_20261124
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-v40-earlier-record-5x5-genus-holdout-20261124
          path: results/mois_v40_earlier_record_genus_holdout_20261124/
          if-no-files-found: error
          retention-days: 60
