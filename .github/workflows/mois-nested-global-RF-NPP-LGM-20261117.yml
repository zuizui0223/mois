name: "MOIS: nested global RF current climate + NPP/AGB/NDVI + LGM"
on:
  push:
    branches:
      - analysis/mois-global-rf-ecology-npp-lgm-20261117
    paths:
      - scripts/analysis/mois_global_nested_rf_NPP_LGM_20261117.py
      - .github/workflows/mois-nested-global-RF-NPP-LGM-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-nested-global-RF-NPP-LGM-20261117
  cancel-in-progress: false
jobs:
  same-species-genus-heldout-real:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install explicitly pinned analytical packages
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "pyarrow>=17,<25" \
            "scipy>=1.11,<2" "scikit-learn>=1.5,<1.9"
      - name: Synthetic model and split invariants smoke test
        run: |
          python scripts/analysis/mois_global_nested_rf_NPP_LGM_20261117.py --selftest
      - name: Download two frozen signed genuine source artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14238869787/zip" \
            -o source/primary_NPP_LGM.zip
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14219399376/zip" \
            -o source/current_BIO19_AGB.zip
          echo "Expected strict ZIP hashes"
          echo "1da364ff63c506f9e2c06d1d71c9609a2c48fec7a428a21ba2c3c4c6ff8f4800  source/primary_NPP_LGM.zip" | sha256sum -c
          echo "d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc  source/current_BIO19_AGB.zip" | sha256sum -c
      - name: Fit real same-species three-stage genus-disjoint RF, HGB and nine-hue RF
        run: |
          python scripts/analysis/mois_global_nested_rf_NPP_LGM_20261117.py \
            --main source/primary_NPP_LGM.zip \
            --env source/current_BIO19_AGB.zip \
            --output results/mois_global_nested_rf_NPP_LGM_20261117
      - name: Upload genuine numeric results and source receipts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-global-nested-RF-37104-source-genus3fold-20261117
          path: results/mois_global_nested_rf_NPP_LGM_20261117/
          retention-days: 30
          if-no-files-found: error
