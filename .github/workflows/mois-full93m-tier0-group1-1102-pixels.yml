name: MOIS first full93m Stage1 Tier0 Group1 1102 original medium images
on:
  push:
    branches:
      - feat/full93m-medium-pixel-firstpass
    paths:
      - .github/workflows/mois-full93m-tier0-group1-1102-pixels.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-93m-first-new-complete-tier0-group1-1102-500px
  cancel-in-progress: false
jobs:
  actual-source-1102-medium-photo-pixels:
    if: github.repository == 'zuizui0223/mois' && github.ref == 'refs/heads/feat/full93m-medium-pixel-firstpass' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[warm1102]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      ULTRALYTICS_OFFLINE: 'True'
      WEIGHT_SHA: f1aaeec4664fe2c178e5cf2bc1f508977bef3e4aa7b40613026cb8ae3de789d5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install one warm YOLO flower detector only (not EfficientSAM)
        run: |
          set -euo pipefail
          python -m pip install -q Pillow==11.3.0 numpy==2.1.3 ultralytics==8.4.112
          python -m py_compile scripts/acquisition/mois_full93m_signed_tier_group_warm_scan.py
      - name: Fetch only Tier0 Group1 genuine source metadata, no raw photos
        run: |
          set -euo pipefail
          mkdir -p source weights
          gh release download mois-complete-93209351-original-photo-target-tiers-v1 \
            --repo zuizui0223/mois --dir source \
            --pattern tier-00-group-01.tar --pattern group-01-receipt.json \
            --pattern mois_all_original_photo_target_tiers_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('source')
          d=json.loads((p/'mois_all_original_photo_target_tiers_receipt.json').read_text())
          assert d['exact_original_photo_IDs_in_all_disjoint_tiers']==93209351
          r=json.loads((p/'group-01-receipt.json').read_text())
          assert int(r['counts_by_disjoint_tier']['0'])==1102
          print('MOIS_REAL_93M_SECOND_FULL_SOURCE_GROUP_TARGET',1102,flush=True)
          PY
      - name: Restore SHA-locked prior FCP item-class YOLO11 only
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp-detector"
          git -C "$RUNNER_TEMP/fcp-detector" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp-detector" fetch --no-tags --depth=1 origin 9fae6ccdf684a46026f72ba12e98de2c5c54bf2a
          git -C "$RUNNER_TEMP/fcp-detector" show FETCH_HEAD:data/atlas/qualification/roi_v4_training/jrc_yolo11n_last_v4.pt > weights/jrc_yolo11n_last_v4.pt
          echo "$WEIGHT_SHA  weights/jrc_yolo11n_last_v4.pt" | sha256sum -c -
      - name: Fetch and actually scan all 1102 new medium pixels using one warm model and a bounded provider rate
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_full93m_signed_tier_group_warm_scan \
            --registry source/mois_all_original_photo_target_tiers_receipt.json \
            --group-receipt source/group-01-receipt.json \
            --archive source/tier-00-group-01.tar \
            --tier 0 --group 1 --max-photo-ids 1200 \
            --weights weights/jrc_yolo11n_last_v4.pt \
            --weight-sha256 "$WEIGHT_SHA" \
            --workers 8 --requests-per-second 2.5 --device cpu \
            --output full93m_tier00_group01_real_pixels
      - name: Reconcile actual unique source photo attempts and all four stage1 statuses
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('full93m_tier00_group01_real_pixels')
          r=json.loads((root/'whole_group_receipt.json').read_text())
          assert r['actual_real_photo_stage1_completed_in_group']==1102
          assert r['new_original_medium_pixel_attempts_in_this_run']==1102
          assert r['previous_same_full_photo_model_photo_ids_reused_without_redownload']==0
          assert r['frozen_yolo_one_warm_model_initialization']==1
          assert r['source_group']==1 and r['source_group_tier']==0
          assert r['stage1_candidate_photos']+r['stage1_negative_photos_NOT_removed']+r['stage1_error']+r['stage1_uncertain']==1102
          assert len(list(root.glob('part-*/complete_receipt.json')))==8
          assert r['no_hue_label_imputed_or_source_rois_relabelled']
          print('MOIS_ALL93M_SECOND_GROUP_1102_GENUINE_IMAGE_PIXELS',json.dumps(r,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-93m-real-tier0-group1-1102-medium-image-YOLO-firstpass
          path: full93m_tier00_group01_real_pixels/
          retention-days: 90
          if-no-files-found: warn
