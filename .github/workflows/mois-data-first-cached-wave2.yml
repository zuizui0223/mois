name: MOIS data first - cached wave2 actual images and colour storage
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - scripts/acquisition/mois_collect_cached_wave2.py
      - tests/test_mois_collect_cached_wave2.py
      - .github/workflows/mois-data-first-cached-wave2.yml
  workflow_dispatch:
    inputs:
      resume_run:
        description: Optional earlier run whose completed photo shards should be reused
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-cached-broad-wave2-real-images-only
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 pytest==8.4.2
          python -m pytest -q tests/test_mois_collect_cached_wave2.py
      - name: Reuse saved candidates and confirm first broad image wave already finished
        run: |
          set -euo pipefail
          test "$(gh api repos/zuizui0223/mois/actions/runs/39097521005 --jq .conclusion)" = success
          gh release download mois-cached-global-angiosperm-second4096-source-only-v1 --repo zuizui0223/mois --dir source --pattern '*.csv' --pattern '*.json'
          python - <<'PY'
          from pathlib import Path
          from scripts.acquisition.mois_collect_cached_wave2 import verify_source
          ids=set()
          for shard in range(16):
              rows,receipt=verify_source(Path('source'),shard)
              assert not ids.intersection(rows.photo_id)
              ids.update(rows.photo_id)
          assert len(ids)==4096
          print('MOIS_READY_4096_UNMEASURED_PHOTO_IDS_NO_NEW_METADATA_SCAN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave2-cached-source
          path: source/
          if-no-files-found: error
          retention-days: 90
  images:
    needs: check
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == 'zuizui0223/mois'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [0,1,2,3]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      RESUME_RUN: ${{ inputs.resume_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wave2-cached-source
          path: source
      - name: Restore completed photo units when resuming; never silently discard a cache error
        run: |
          set -euo pipefail
          mkdir -p measurements
          if [ -n "$RESUME_RUN" ]; then
            gh run download "$RESUME_RUN" --repo zuizui0223/mois --name "wave2-measured-group-${{ matrix.group }}" --dir measurements
          fi
      - name: Install the existing frozen FCP image loader and unchanged flower model once per group
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy Pillow ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Download actual photos, measure colours and checkpoint; no ecological analysis
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-wave2-photo-rate"
          start=$(( ${{ matrix.group }} * 4 ))
          for shard in $(seq "$start" "$((start+3))"); do
            python -m scripts.acquisition.mois_collect_cached_wave2 measure --source source --shard "$shard" --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" --output measurements
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave2-measured-group-${{ matrix.group }}
          path: measurements/
          if-no-files-found: warn
          retention-days: 90
  save:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wave2-measured-group-*
          path: workers
          merge-multiple: false
      - name: Save exact photo records including unknowns and source/licence metadata
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          python -m scripts.acquisition.mois_collect_cached_wave2 collect --workers workers --output completed
      - uses: actions/upload-artifact@v4
        with:
          name: wave2-complete-image-measurements
          path: completed/
          if-no-files-found: error
          retention-days: 90
      - name: Archive data only in a separate versioned release
        run: |
          set -euo pipefail
          tag=mois-broad-wave2-4096-measured-data-only-v1
          if gh release view "$tag" --repo zuizui0223/mois >/dev/null 2>&1; then
            mkdir -p previous
            gh release download "$tag" --repo zuizui0223/mois --dir previous --pattern 'receipt.json'
            cmp completed/receipt.json previous/receipt.json
          else
            gh release create "$tag" completed/*.parquet completed/*.json --repo zuizui0223/mois --target "$GITHUB_SHA" --title 'MOIS cached second wave: actual image and colour records' --notes '4096 attempted original photos; acquired, failed and colour-unknown outcomes counted separately. Same frozen ROI-v4 model; source observation/date/location/licence retained. No ecological model, environmental ranking or manuscript analysis executed. Raw image bytes are not redistributed.'
          fi
