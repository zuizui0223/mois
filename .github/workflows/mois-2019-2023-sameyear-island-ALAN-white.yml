name: MOIS 2019 2021 2022 2023 original sameyear island nightlight white ROI analyses
on:
  push:
    branches: [analysis/mois-viirs-popmatch-20261105]
    paths:
      - .github/workflows/mois-2019-2023-sameyear-island-ALAN-white.yml
      - scripts/analysis/mois_2019_2023_sameyear_island_ALAN_white_20261107.py
      - tests/test_mois_2019_2023_sameyear_island_ALAN_white_20261107.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-photo-sameyear-island-white-light:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2019, 2021, 2022, 2023]
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test original year photo identity, source-year and geographic-support gates
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 statsmodels==0.14.5
          python -m unittest discover -s tests -p test_mois_2019_2023_sameyear_island_ALAN_white_20261107.py -v
          python -m py_compile scripts/analysis/mois_2019_2023_sameyear_island_ALAN_white_20261107.py
      - name: Recover immutable original photos, WCVP accepted taxa and genuine same-year island VIIRS population sources
        timeout-minutes: 9
        run: |
          set -euo pipefail
          mkdir -p src/photos src/wcvp src/viirs src/pop
          gh run download 41007444495 --repo zuizui0223/mois --name mois-nohuman-canonical-climate-joined-20261030 --dir src/photos
          gh run download 39225659840 --repo zuizui0223/mois --name mois-real350399-Kew-WCVP-native-source-TDWG3-no-point-status --dir src/wcvp
          gh run download 42337911536 --repo zuizui0223/mois --name mois-original-${{ matrix.year }}-global-mainland-island-monthly-VIIRS-source-SHA --dir src/viirs
          gh run download 42338121269 --repo zuizui0223/mois --name mois-original-${{ matrix.year }}-R2024B-UC-global-popdensity-photo-source --dir src/pop
          printf '%s\n' \
            'f033661d76e07898a5c13199a55c5d0ce6e55353daa48b0058c456979e90644c  src/photos/canonical_observations_climate.csv.gz' \
            'dc5bb0e3686fde0cfd327e4336245d0ceae3c7657b3bd12841bb814cc94d1eb2  src/wcvp/mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz' | sha256sum -c -
      - name: Run actual accepted species-equal photo white ROI vs sameyear VIIRS and population, by island
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_2019_2023_sameyear_island_ALAN_white_20261107 \
            --year ${{ matrix.year }} \
            --canonical src/photos/canonical_observations_climate.csv.gz \
            --wcvp src/wcvp/mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz \
            --geo src/viirs/source_year/${{ matrix.year }}/mois_${{ matrix.year }}_full_photo_landmass_source.csv \
            --source-receipt src/viirs/source_year/${{ matrix.year }}/source_receipt.json \
            --viirs src/viirs/VIIRS_${{ matrix.year }}/values.csv \
            --viirs-receipt src/viirs/VIIRS_${{ matrix.year }}/receipt.json \
            --population src/pop/2024B_UC_${{ matrix.year }}_worldpop_sameyear_photo_landmass_popdensity.csv \
            --pop-receipt src/pop/source_receipt.json \
            --out actual_photo_colour_ALAN_${{ matrix.year }}
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          year=${{ matrix.year }}
          out=Path(f'actual_photo_colour_ALAN_{year}')
          r=json.loads((out/'source_receipt.json').read_text())
          assert r['year']==year
          assert r['original_knownland_environment_sites']>=20000
          assert r['original_photo_white_ROI_not_botanical_white_species_fraction']
          assert r['technical_unknown_colour_imputed'] is False
          assert r['no_new_photos_or_ROI_inferences']
          assert r['no_night_pollination_or_causal_species_loss_claim']
          assert r['population_release']=='WorldPop Global2 R2024B UC v1'
          assert r['source_VIIRS_3months_sites']>=1
          assert r['2022_Oct_VIIRS_missing_not_replaced']==(year==2022)
          file=out/'sameyear_island_mainland_photo_white_descriptive.csv'
          assert hashlib.sha256(file.read_bytes()).hexdigest()==r['output_descriptive_SHA256']
          print('MOIS_REAL_YEAR_SOURCE_FLORAL_ISLAND_ALAN_DONE',json.dumps({
              k:r[k] for k in ('year','photographic_eligible_with_sameyear_light_and_pop_cells',
                  'photographic_eligible_island_cells','within_island_independent_islands',
                  'four_month_comparability_to_other_years','models')},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-actual-ROI-white-island-ALAN-year-${{ matrix.year }}-real-source
          path: actual_photo_colour_ALAN_${{ matrix.year }}/
          retention-days: 90
          if-no-files-found: warn
