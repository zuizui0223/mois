name: MOIS recover completed real pixels from active acquisition waves
on:
  pull_request:
    paths:
      - scripts/acquisition/mois_completed_pixel_checkpoint.py
      - tests/test_mois_completed_pixel_checkpoint.py
      - tests/test_mois_checkpoint_four_wave_wiring.py
      - tests/test_mois_checkpoint_bulk_artifact_download.py
      - .github/workflows/mois-completed-pixel-checkpoint.yml
  push:
    branches: [main]
    paths:
      - scripts/acquisition/mois_completed_pixel_checkpoint.py
      - .github/workflows/mois-completed-pixel-checkpoint.yml
      - docs/MOIS_CHECKPOINT_REQUEST_20261020.md
  workflow_run:
    workflows:
      - "MOIS second nested 93m observation RGB p0004 after first source"
      - "MOIS third nested 93m observation RGB p0008 after second full integration"
      - "MOIS new tier03 pixels and lowres screen shadow without image exclusion"
      - "MOIS full remaining tier03 original RGB p0016 without lowres exclusion"
      - "MOIS fifth disjoint tier04 original RGB p0032 without lowres exclusion"
      - "MOIS sixth geographic enrichment tier05 original RGB (tropics and south)"
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-sealed-pixel-checkpoint-no-image-acquisition
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m unittest discover -s tests -p 'test_mois_completed_pixel_checkpoint.py' -v
          python -m unittest discover -s tests -p 'test_mois_checkpoint_four_wave_wiring.py' -v
          python -m unittest discover -s tests -p 'test_mois_checkpoint_bulk_artifact_download.py' -v
          python -m py_compile scripts/acquisition/mois_completed_pixel_checkpoint.py
  freshness:
    needs: tests
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == 'zuizui0223/mois' &&
        github.event.workflow_run.head_branch == 'main' &&
        contains(fromJSON('[39353343403,39371199127,39369517433,39374811084,39401484641,39417990675]'), github.event.workflow_run.id)))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.compare.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare newly sealed RGB worker assets against latest immutable checkpoint
        id: compare
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from scripts.acquisition.mois_checkpoint_fresh_artifact_gate import (
              WAVES,PREFIXES,latest_checkpoint_tag,decide_checkpoint)
          repo='zuizui0223/mois'
          def gh_json(url):
              return json.loads(subprocess.check_output(
                  ['gh','api',url],text=True))
          tag=latest_checkpoint_tag(gh_json(f'repos/{repo}/releases?per_page=100'))
          previous=None
          if tag is not None:
              Path('previous-checkpoint').mkdir()
              subprocess.run([
                  'gh','release','download',tag,'--repo',repo,
                  '--dir','previous-checkpoint','--pattern','checkpoint_receipt.json'
              ],check=True)
              receipt=json.loads(Path('previous-checkpoint/checkpoint_receipt.json').read_text())
              assert receipt['schema']=='mois_sealed_actual_pixel_checkpoint_v1'
              assert receipt['image_downloads_or_colour_reinference_performed'] is False
              previous=receipt['source_artifact_snapshots']
          current={}
          for wave,run in WAVES.items():
              output=subprocess.check_output([
                  'gh','api','--paginate','--jq','.artifacts[]',
                  f'repos/{repo}/actions/runs/{run}/artifacts?per_page=100'
              ],text=True)
              decoder=json.JSONDecoder()
              artifacts=[]
              while output.strip():
                  output=output.lstrip()
                  item,end=decoder.raw_decode(output)
                  artifacts.append(item)
                  output=output[end:]
              matches=[a for a in artifacts if a['name'].startswith(PREFIXES[wave])]
              assert all(not a['expired'] for a in matches), 'Expired genuine photo pixels: '+wave
              current[wave]=dict(source_run_id=run,artifacts=[
                  {k:a[k] for k in ('id','name','digest','size_in_bytes')}
                  for a in matches])
          decision=decide_checkpoint(previous,current,WAVES)
          print('MOIS_SOURCE_SIGNED_CHECKPOINT_FRESHNESS',
                json.dumps({'previous_tag':tag,**decision},sort_keys=True),flush=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('ready='+('true' if decision['ready'] else 'false')+'\n')
          PY
  recover:
    needs: [tests, freshness]
    if: >-
      needs.freshness.outputs.ready == 'true' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == 'zuizui0223/mois' &&
        github.event.workflow_run.head_branch == 'main' &&
        contains(fromJSON('[39353343403,39371199127,39369517433,39374811084,39401484641,39417990675]'), github.event.workflow_run.id)))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
      - name: Reuse exact published baseline without reacquiring any images
        run: |
          set -euo pipefail
          gh release download mois-genuine-FCP447500-plus93m-first18462-photo-ID-union-v1 \
            --repo zuizui0223/mois --dir checkpoint-input/baseline \
            --pattern mois_source_verified_FCP447500_and_93m_p0002_combined_unique_photo_ROIs.parquet \
            --pattern mois_original_photo_RGB_FCP447500_plus_first93m_id_union_receipt.json
      - name: Freeze available worker artifacts and recover only their stored data
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          specs=[
              ('p0004',39353343403,'mois-93m-p0004-precolour-observation','mois-93m-p0004-RGB-group-'),
              ('p0008',39371199127,'mois-93m-p0008-precolour-observation','mois-93m-p0008-RGB-group-'),
              ('shadow',39369517433,'mois-tier03-shadow-b0-source','mois-tier03-shadow-b0-RGB-group-'),
              ('p0016',39374811084,'mois-93m-p0016-precolour-observation','mois-93m-p0016-RGB-group-'),
              ('p0032',39401484641,'mois-93m-p0032-precolour-observation','mois-93m-p0032-RGB-group-'),
              ('geo05',39417990675,'mois-93m-geo05-precolour-observation','mois-93m-geo05-RGB-group-')]
          for name,run,source,prefix in specs:
              root=Path('checkpoint-input/waves')/name
              (root/'workers').mkdir(parents=True)
              command=['gh','api','--paginate',f'repos/zuizui0223/mois/actions/runs/{run}/artifacts?per_page=100','--jq','.artifacts[]']
              text=subprocess.check_output(command,text=True)
              decoder=json.JSONDecoder();artifacts=[]
              while text.strip():
                  text=text.lstrip();value,end=decoder.raw_decode(text);artifacts.append(value);text=text[end:]
              selected=[a for a in artifacts if a['name'].startswith(prefix)]
              assert len({a['name'] for a in selected})==len(selected),'Duplicate worker artifacts'
              assert all(not a['expired'] for a in selected),'Stored pixel artifacts expired'
              record={'source_run_id':run,'captured_utc':datetime.now(timezone.utc).isoformat(),
                      'artifacts':[{'id':a['id'],'name':a['name'],'size_in_bytes':a['size_in_bytes'],
                                    'digest':a.get('digest')} for a in selected]}
              (root/'artifact_snapshot.json').write_text(json.dumps(record,indent=2,sort_keys=True)+'\n')
              subprocess.run(['gh','run','download',str(run),'--repo','zuizui0223/mois','--name',source,'--dir',str(root/'source')],check=True)
              # GitHub CLI accepts repeated --name flags in a single download.
              # Explicit names keep the frozen artifact snapshot race-free.
              if selected:
                  download_args=['gh','run','download',str(run),'--repo','zuizui0223/mois',
                                 '--dir',str(root/'workers')]
                  for a in selected:
                      download_args.extend(['--name',a['name']])
                  subprocess.run(download_args,check=True)
                  # Multiple selected artifacts are extracted into directories
                  # named after each artifact. Require an exact inventory.
                  # When only one is selected, CLI extracts directly under
                  # workers/, and the collector verifies every original unit.
                  if len(selected)>1:
                      expected_names={a['name'] for a in selected}
                      actual_names={p.name for p in (root/'workers').iterdir() if p.is_dir()}
                      assert actual_names==expected_names,'Worker artifact directories differ from frozen SHA snapshot'
              print('MOIS_STORED_PIXEL_ARTIFACTS_RECOVERED',name,len(selected),flush=True)
          PY
      - name: Validate actual terminals and append only measured IDs to baseline projection
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_completed_pixel_checkpoint \
            --inputs checkpoint-input --output sealed-checkpoint
      - uses: actions/upload-artifact@v4
        with:
          name: mois-actual-sealed-pixel-checkpoint-${{ github.run_id }}
          path: sealed-checkpoint/
          retention-days: 90
          if-no-files-found: error
      - name: Publish immutable partial checkpoint without replacing complete-wave releases
        run: |
          set -euo pipefail
          tag="mois-real-pixel-checkpoint-${GITHUB_RUN_ID}-v1"
          gh release create "$tag" sealed-checkpoint/* --repo zuizui0223/mois \
            --target "$GITHUB_SHA" --prerelease \
            --title "MOIS actual measured pixel checkpoint ${GITHUB_RUN_ID}" \
            --notes 'Only completed original-image units recovered from stored p0004, p0008, p0016, p0032, geo05 and shadow artifacts. Byte-checked original source IDs, full-model method, terminal outcomes and prior 612483-photo union. Pending work is explicitly listed and is not counted as measured. Combined Parquet is a compact metadata/hue projection; full new measurements are retained separately and original baseline releases are unchanged. Partial computation completion is not an unbiased ecological or complete-probability cohort. No new image download, model inference, native filtering or raw image redistribution.'
