name: "MOIS Ecology: WCVP-native paleo-rainfall and NPP same-cell validation"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - scripts/analysis/mois_WCVP_native_paleorain_NPP_20261119.py
      - .github/workflows/mois-native-paleorain-npp-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-wcvp-native-LGM-rain-NPP-20261119
  cancel-in-progress: false
jobs:
  WCVP-native-GBIF-rainfall:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install signed source Parquet and spatial regression requirements
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "pyarrow>=17,<25" \
            "scipy>=1.11,<2" "statsmodels>=0.14,<1" "scikit-learn>=1.5,<1.9"
          python -m py_compile scripts/analysis/mois_WCVP_native_paleorain_NPP_20261119.py
      - name: Download all three signed historical MOIS data artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source
          for spec in \
            '14400177816 geography cbe1eef381e3e1a0062dbf5134b047f947338b7c499d2ecc0cd22ee8855909fd' \
            '14397855889 environment 4f5d8fc3a308482fc3645d796a779d1a4725c51ed2afbf6a06e61fd6213f3ee6' \
            '14166701658 GBIF 422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2'; do
            set -- $spec
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" \
              -o "source/$2.zip"
            echo "$3  source/$2.zip" | sha256sum -c
          done
      - name: Audit exact original full-flora FE, then fit native-only and same-cell controls
        run: |
          python -m scripts.analysis.mois_WCVP_native_paleorain_NPP_20261119 \
            --geography source/geography.zip \
            --environment source/environment.zip \
            --GBIF source/GBIF.zip \
            --out results/mois_native_paleorain_NPP_original_WCVP_20261119
      - name: Keep signed numerical status effects and 1000km holdout
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-original-WCVP-native-LGM-rain-NPP-20261119
          path: results/mois_native_paleorain_NPP_original_WCVP_20261119/
          retention-days: 30
          if-no-files-found: error
