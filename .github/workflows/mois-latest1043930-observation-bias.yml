name: MOIS latest1043930 ROI photo-classifiability selection bias four gradients
on:
  push:
    branches: [feat/latest1043930-four-axes-20261025]
    paths:
      - scripts/analysis/mois_latest1043930_observation_bias.py
      - .github/workflows/mois-latest1043930-observation-bias.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  full-real-photo-selection-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p photo env geo
          gh run download 40187688390 --repo zuizui0223/mois \
            --name mois-1043930-latest-original-photo-four-hue-fully-signed-union --dir photo
          gh run download 40188040027 --repo zuizui0223/mois \
            --name mois-real-latest1043930-photoid-original-worldclim-humidity-elevation --dir env
          gh run download 40188478245 --repo zuizui0223/mois \
            --name mois-real-latest1043930-island-mainland-elevation-gshhg --dir geo
          python -m scripts.analysis.mois_latest1043930_observation_bias \
            --photo photo/mois_latest_1043930_true_original_photo_hue_observation.parquet \
            --clim env/mois_latest1043930_original_photo_climate_six_columns.parquet \
            --geo geo/latest1043930_all_original_photo_GSHHG_landmass.parquet \
            --output newest_photo_selection
      - uses: actions/upload-artifact@v4
        with:
          name: mois-real1043930-colour-classifiability-bias-by-four-ecological-axes
          path: newest_photo_selection/
          retention-days: 90
          if-no-files-found: error
