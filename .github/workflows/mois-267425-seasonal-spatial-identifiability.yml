name: MOIS original267425 summer-winter taxon turnover and local photo-positivity

on:
  pull_request:
    paths:
      - "scripts/analysis/mois_seasonal_spatial_identifiability_20261017.py"
      - "tests/test_mois_seasonal_spatial_identifiability_20261017.py"
      - "results/mois_267425_seasonal_taxon_spatial_support_decision_20261017.json"
      - "docs/MOIS_REAL_PHOTOGRAPHIC_SEASON_TAXON_TURNOVER_SPATIAL_IDENTIFIABILITY_20261017.md"
      - ".github/workflows/mois-267425-seasonal-spatial-identifiability.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  authentic-original-photo-taxon-turnover-and-spatial-eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test exact photo taxon turnover algebra and geographic-temporal overlap contracts
        run: |
          python -m pip install -q 'numpy==2.1.3' 'pandas==2.2.3' 'pytest==8.4.2'
          python -m pytest -q tests/test_mois_seasonal_spatial_identifiability_20261017.py tests/test_mois_taxon_season_composition_decomposition.py
      - name: Recover exact prior original photo ROI source; never redownload reclassify or impute photo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed_source
          gh run download 39002957961 --repo zuizui0223/mois \
            --name mois-actually-measured-FCP-wave4-completed-photo-partitions-snapshot \
            --dir signed_source
          test -s signed_source/mois_fcp_wave4_PARTIAL_completed_pixel_original_photo_union.csv.gz
          zip -j -q original267425.zip signed_source/*
      - name: Rebuild full real-photo taxon turnover and geographic resolution-by-year positivity ledger
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_seasonal_spatial_identifiability_20261017 \
            --photo-archive original267425.zip \
            --output original_photo_season_support
          python - <<'PY'
          import json
          from pathlib import Path
          live=json.loads(Path('original_photo_season_support/mois_seasonal_original_photo_spatial_identifiability_receipt.json').read_text())
          frozen=json.loads(Path('results/mois_267425_seasonal_taxon_spatial_support_decision_20261017.json').read_text())
          assert live['source_photo_union_SHA256']==frozen['original_photo_union_sha256']
          assert live['total_original_photo_ids']==frozen['n_measured_original_photos']==267425
          assert live['four_hue_original_photo_ids']==frozen['n_four_hue_classified']==129795
          assert live['dated_and_classified_original_photo_ids']==frozen['n_dated_and_classified']==81867
          assert live['spatial_result_count']==40
          import pandas as pd
          grid=pd.read_csv('original_photo_season_support/mois_seasonal_original_photo_spatial_resolution_support.csv')
          for region in ('north_extratropical','south_extratropical'):
              expected=frozen['regions'][region]
              observed=live['regions'][region]['full_source_photo_turnover']
              assert observed['n_taxa_common_both_seasons']==expected['taxa_common_both_seasons']
              assert observed['all_photo_summer_minus_winter_white_pp']==expected['original_photo_summer_minus_winter_white_pp']
              assert observed['common_taxa_photo_frequency_mix_pp']==expected['common_taxa_photo_frequency_mixing_pp']
              assert observed['common_taxa_within_taxon_white_photo_rate_pp']==expected['common_taxa_within_taxon_photo_white_pp']
              for width,min_yr,minn,name in ((0.25,False,1,'cell_0p25_all_years_min1'),
                   (0.25,True,1,'cell_0p25_same_year_min1'),
                   (0.25,True,2,'cell_0p25_same_year_min2'),
                   (1.0,True,2,'cell_1p0_same_year_min2'),
                   (5.0,True,2,'cell_5p0_same_year_min2')):
                  a=grid[(grid.hemisphere==region)&(grid.cell_degrees==width)&
                     (grid.same_local_meteorological_season_year==min_yr)&
                     (grid.min_distinct_observations_each_season==minn)].iloc[0]
                  b=expected['photo_hue_summer_winter_matched_site_support'][name]
                  assert (int(a.matched_groups),int(a.matched_taxa),int(a.matched_photos))==(b['groups'],b['taxa'],b['photos'])
          print('MOIS_ACTUAL_SOURCE_ORIGINAL_PHOTO_SITE_YEAR_SEASON_POSITIVITY_VALIDATED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-267425-real-photo-taxon-turnover-site-year-overlap
          path: original_photo_season_support/
          retention-days: 90
          if-no-files-found: error
