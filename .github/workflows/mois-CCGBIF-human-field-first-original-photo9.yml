name: MOIS first human-observation CCGBIF original image FCP ROI9 from signed 289-taxon field source
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - scripts/acquisition/mois_CCGBIF_human_field_photo_FCP_source.py
      - tests/test_mois_CCGBIF_human_field_photo_FCP_source.py
      - .github/workflows/mois-CCGBIF-human-field-first-original-photo9.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-CCGBIF-signed-289-human-CC-field-original-first-FCP-photo9
  cancel-in-progress: false
jobs:
  frozen-real-field-CC-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      SOURCE_RUN: '43540758186'
      SIGNED_SOURCE_DIGEST: 'sha256:2de4941ed7a0f51da6d43a778f1b44c2c0cb6e29cb69c53d2fd35c7508a80331'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No-network tests against specimen source promotion, repeated observation and CC host allowlist
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m unittest discover -s tests -p test_mois_CCGBIF_human_field_photo_FCP_source.py -v
          python -m py_compile scripts/acquisition/mois_CCGBIF_human_field_photo_FCP_source.py
      - name: Authenticate all 289 GBIF accepted source names and 18 genuine HUMAN_OBSERVATION media URLs, no photos
        run: |
          set -euo pipefail
          test "$(gh run view "$SOURCE_RUN" --repo "$REPO" --json conclusion --jq .conclusion)" = success
          digest="$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
             --jq '.artifacts[] | select(.name=="mois-zero9-GbifCOLXR-289-human-field-only-CC-original-photo-URL-source") | .digest')"
          test "$digest" = "$SIGNED_SOURCE_DIGEST"
          mkdir -p field
          gh run download "$SOURCE_RUN" --repo "$REPO" \
            --name mois-zero9-GbifCOLXR-289-human-field-only-CC-original-photo-URL-source \
            --dir field
          python - <<'PY'
          from pathlib import Path
          import json
          from scripts.acquisition.mois_zero9_gbif_other_cc_media_pilot import source_sha
          m=json.loads(Path('field/receipt.json').read_text())
          assert m['schema']=='mois_GBIF_COLXR_289taxa_field_original_CC_media_union_v1'
          assert m['source_accepted_species_without_iNat_numeric_ROI']==289
          assert m['source_taxa_with_actual_human_observation_CC_still_image']==7
          assert m['noninat_public_CC_human_observation_media_URLs_unique']==18
          p=Path('field/mois_CCGBIF_COLXR_289taxa_human_observation_original_CC_photo_URLs.csv.gz')
          assert source_sha(p)==m['outputs_sha256']['field']
          print('MOIS_GBIF_HUMAN_OBSERVATION_7TAXA_18_CC_MEDIA_SOURCE_VERIFIED',flush=True)
          PY
      - name: Choose only ALA and PlutoF public HTTPS live-observation photo media, exclude herbarium image hosts
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_CCGBIF_human_field_photo_FCP_source \
            --field-union field --output signed_field_original \
            --quota 8 \
            --allow-host images.ala.org.au \
            --allow-host s3.hpc.ut.ee
          python - <<'PY'
          from pathlib import Path
          import json,pandas as pd
          from scripts.acquisition.mois_zero9_gbif_other_cc_media_pilot import source_sha
          m=json.loads(Path('signed_field_original/manifest.json').read_text())
          p=Path('signed_field_original/shards/shard-000.csv')
          q=pd.read_csv(p,dtype=str,keep_default_na=False)
          assert m['schema']=='mois_zero9_gbif_other_CC_photo_source_v1'
          assert m['source_arm']=='MOIS_CCGBIF_EXPLICIT_HUMAN_OBSERVATION_ONLY'
          assert m['source_non_HUMAN_OBSERVATION_photos_allowed'] is False
          assert m['source_real_original_photo_urls_SHA256']==source_sha(p)
          assert len(q)==q.inat_taxon_id.nunique()==q.observation_id.nunique()==q.image_url.nunique()
          assert 1<=len(q)<=8
          assert q.media_host.isin(('images.ala.org.au','s3.hpc.ut.ee')).all()
          assert m['downstream_appending_to_iNaturalist_original_frame_allowed'] is False
          print('MOIS_REAL_HUMAN_CCGBIF_8_OR_FEWER_FIELD_PHOTO_SOURCE',len(q),
                sorted(q.source_binomial.tolist()),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-CCGBIF-289taxa-field-only-original-first-FCP-photo9-signed-source
          path: signed_field_original/
          retention-days: 90
          if-no-files-found: error
  genuinely-measure-field-original-photo-RGB9:
    needs: frozen-real-field-CC-original-source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-CCGBIF-289taxa-field-only-original-first-FCP-photo9-signed-source
          path: signed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap identical frozen FCP YOLO11/EfficientSAM original ROI-v4
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Download genuine ALA/PlutoF human-observation original photos and measure nine components
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          python -m scripts.acquisition.mois_external_gbif_CC_original_photo_roi_v4 work \
            --source signed --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" \
            --output measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-CCGBIF-289-human-original-photo-pixels-FCP-ROI9-worker
          path: measured/
          retention-days: 90
          if-no-files-found: warn
  independent-human-original-photo-RGB9-audit:
    needs: [frozen-real-field-CC-original-source,genuinely-measure-field-original-photo-RGB9]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-CCGBIF-289taxa-field-only-original-first-FCP-photo9-signed-source
          path: signed
      - uses: actions/download-artifact@v4
        with:
          name: mois-CCGBIF-289-human-original-photo-pixels-FCP-ROI9-worker
          path: measured
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate real original photo SHA and independent GBIF human field 9 component colour or unknown
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m scripts.acquisition.mois_external_gbif_CC_original_photo_roi_v4 audit \
            --source signed --measured measured --output audited
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('audited/receipt.json').read_text())
          assert d['schema']=='mois_zero9_noninat_CCGBIF_external_RGB9_independent_audit_v1'
          assert 1<=d['actual_external_original_photo_attempts']<=8
          assert d['actual_valid_numeric_nine_palette_vectors']<=d['actual_external_original_photo_attempts']
          assert d['actual_technical_unresolved_or_failed']+d['actual_valid_numeric_nine_palette_vectors']==d['actual_external_original_photo_attempts']
          assert d['allowed_to_add_external_hues_to_MOIS_iNaturalist_frame'] is False
          assert d['botanical_flower_only_pixel_true_verified'] is False
          print('MOIS_REAL_GBIF_HUMAN_ONLY_ORIGINAL_RGB9_AUDIT',
                json.dumps({k:d[k] for k in ('actual_external_original_photo_attempts',
                 'actual_valid_numeric_nine_palette_vectors',
                 'actual_clear_photo_nine_palette_labels',
                 'actual_technical_unresolved_or_failed',
                 'unique_external_source_taxa_with_numeric_photo9')},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-CCGBIF-289-human-original-pixel-9ROI-independent-audit
          path: audited/
          retention-days: 90
          if-no-files-found: warn
