name: "MOIS QA180: frozen authentic-photo IDs and HEAD-only link gate"
on:
  push:
    branches:
      - analysis/mois-qa180-original-photo-audit-20261117
    paths:
      - "qa/mois_QA180_20261117/blinded_original_photo_review_sheet.csv"
      - "scripts/analysis/mois_qa180_original_photo_head_audit_20261117.py"
      - ".github/workflows/mois-QA180-real-photo-HEAD-audit-20261117.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  authentic-source-and-link-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parser and HTTP-only audit dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "requests>=2.31,<3"
      - name: Recover both SHA-locked historical source archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .qa_signed_source
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14093884178/zip" \
            -o .qa_signed_source/historical_registry.zip
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14157705123/zip" \
            -o .qa_signed_source/COLXR_traits.zip
          echo "ac558f06e5a0f75cf0fab2d0a37e3f17b2fe3428f788cccb801b5a01dd2b81ac  .qa_signed_source/historical_registry.zip" | sha256sum -c
          echo "abcd3aee766c85a92b86a8f93f8ed696bbe49d0f6cf2f64e5f75b457abf78e6a  .qa_signed_source/COLXR_traits.zip" | sha256sum -c
      - name: Reconcile original 538 photo IDs with 1,231,244 historical source records and accepted colour taxa
        run: |
          python scripts/analysis/mois_qa180_original_photo_head_audit_20261117.py \
            --blind qa/mois_QA180_20261117/blinded_original_photo_review_sheet.csv \
            --registry .qa_signed_source/historical_registry.zip \
            --traits .qa_signed_source/COLXR_traits.zip \
            --probe 36 \
            --out .qa_results_pilot
      - name: Full 538 URL HEAD gate (no image downloads)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          a=json.load(open(".qa_results_pilot/receipt.json"))
          ok=a["head_gate"]["s3_http_200_image"]
          print(f"Pilot S3 image HEAD-200: {ok} of {a['head_gate']['probed_photos']}")
          # Server might block HEAD. Do not reinterpret 403/405/429 or timeouts as lost photographs.
          if ok < 1:
              raise SystemExit("Source identity validated; no S3 HEAD 200 image in pilot. Do not assume photo loss; inspect host/API method before full network scan.")
          PY
          python scripts/analysis/mois_qa180_original_photo_head_audit_20261117.py \
            --blind qa/mois_QA180_20261117/blinded_original_photo_review_sheet.csv \
            --registry .qa_signed_source/historical_registry.zip \
            --traits .qa_signed_source/COLXR_traits.zip \
            --probe 538 \
            --out .qa_results_full
      - name: Upload review-safe metadata and integrity receipts (no images, no sealed key)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mois-QA180-authentic-photo-head-only-20261117
          path: |
            .qa_results_pilot/
            .qa_results_full/
          retention-days: 21
          if-no-files-found: error
          include-hidden-files: true
