name: Mois WorldClim monthly rainfall source one-shot verification

on:
  push:
    branches:
      - manuscript/geographic-conditional-moisture-research-20261014
    paths:
      - .github/workflows/mois-worldclim-monthly-source-one-shot-20261016.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-worldclim-original-monthly:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned GeoTIFF reader only
        run: python -m pip install numpy==2.1.3 rasterio==1.4.3
      - name: Obtain and byte-pin one small official historical 10-minute monthly precipitation ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .trusted/source
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 \
            --user-agent 'Mois-source-raster-audit/1.0 (github.com/zuizui0223/mois)' \
            --output .trusted/source/wc2.1_10m_prec.zip \
            'https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_prec.zip'
          actual_bytes=$(stat -c%s .trusted/source/wc2.1_10m_prec.zip)
          if (( actual_bytes < 500000 || actual_bytes > 15000000 )); then
            echo 'Official WorldClim archive byte size unexpected: stop'
            exit 1
          fi
          original_sha=$(sha256sum .trusted/source/wc2.1_10m_prec.zip | cut -d' ' -f1)
          python scripts/acquisition/mois_pin_worldclim_monthly_precipitation_20261016.py \
            --original-worldclim-zip .trusted/source/wc2.1_10m_prec.zip \
            --original-zip-sha256 "$original_sha" \
            --output-private-raster-source .trusted/verified_monthly_precip
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('.trusted/verified_monthly_precip/monthly_source_receipt.json').read_text())
          assert r['n_byte_verified_monthly_rasters']==12
          assert r['n_gis_aligned_monthly_rasters']==12
          assert not r['original_plant_photos_opened']
          assert not r['worldwide_flowering_season_or_colour_result']
          assert r['requires_independent_original_site_bio12_reconciliation']
          assert r['synthetic_test_only'] is False
          print('MOIS_WORLDCLIM_12_REAL_GEOSPATIAL_RASTERS_BYTE_VERIFIED',json.dumps({
              'archive_sha256':r['input_archive_sha256'],
              'monthly_manifest_sha256':r['monthly_data_manifest_sha256'],
              'n_rasters':r['n_byte_verified_monthly_rasters'],
              'climatology':'1970-2000',
              'original_flower_photos_classified':0
          },sort_keys=True))
          PY
      - name: Save provenance checksums only (no third-party raster/photo bytes)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-worldclim-1970-2000-precip-12-month-source-pins
          path: |
            .trusted/verified_monthly_precip/monthly_source_receipt.json
            .trusted/verified_monthly_precip/monthly_precipitation_manifest.json
          retention-days: 14
          if-no-files-found: error
