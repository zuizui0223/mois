name: "MOIS Paleo: audited 3GCM source inventory for species palaeosuitability"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - .github/workflows/mois-paleo-3gcm-source-inventory-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install immutable source reader
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "pandas>=2.1,<3" "pyarrow>=17,<25"
      - name: Get source-authenticated 3GCM palaeoclimate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --location \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14225733755/zip" -o LGM.zip
          echo "db3b5b4fa2133194963be9233411bb6bb50bc86393d1dc50d996cc4cc78b25ab  LGM.zip" | sha256sum -c
      - name: Verify source 3GCM grid and print actual column inventory
        run: |
          python - <<'PY'
          import zipfile,json,io,hashlib,numpy as np,pandas as pd,pyarrow.parquet as pq
          from pathlib import Path
          z=zipfile.ZipFile("LGM.zip")
          rec=json.loads(z.read("receipt.json"))
          files=["WorldClim1p4_LGM_threeGCM_18577_cells.parquet","GBIF37104_photo9_LGM_climate_species.parquet"]
          inventory={}
          for name in files:
              raw=z.read(name)
              assert hashlib.sha256(raw).hexdigest()==rec["output_SHA256"][name]
              table=pq.read_table(io.BytesIO(raw))
              df=table.to_pandas()
              inventory[name]={"rows":len(df),"columns":list(df.columns),
                               "dtypes":{k:str(v) for k,v in df.dtypes.items()},
                               "example_first_2_rows":df.head(2).astype(str).to_dict(orient="records")}
              assert len(df)==(18577 if name.startswith("World") else 37104)
          Path("out").mkdir(exist_ok=True)
          Path("out/inventory.json").write_text(json.dumps(inventory,indent=2,ensure_ascii=False))
          print("MOIS_LGM_TRUE_3GCM_SCHEMA",json.dumps(inventory,ensure_ascii=False),flush=True)
          PY
      - name: Retain source mapping inventory
        uses: actions/upload-artifact@v4
        with:
          name: mois-paleo-threeGCM-schema-20261119
          path: out/
          retention-days: 30
