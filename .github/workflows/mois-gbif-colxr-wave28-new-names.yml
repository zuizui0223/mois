name: MOIS twentyeighth 26 new actual nine-hue photo taxa GBIF COL XR exact accepted names
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - scripts/analysis/mois_gbif_colxr_wave28_incremental.py
      - .github/workflows/mois-gbif-colxr-wave28-new-names.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-gbif-colxr-wave28-new26-photo-hues-only
  cancel-in-progress: false
jobs:
  only-new-colxr-name-match:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      APPENDED_RUN: ''
      PREVIOUS_COLXR_RUN: '43326233244'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test botanical exact species, key preservation and no synonym promotion
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3
          python -m unittest discover -s tests -p test_mois_gbif_colxr_wave18_incremental.py -v
          python -m py_compile scripts/analysis/mois_gbif_colxr_wave28_incremental.py
      - name: Resolve uniquely signed wave28 append source (no duplicate source)
        run: |
          set -euo pipefail
          for pass in $(seq 1 48); do
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              ok="$(gh api "repos/$REPO/actions/runs/$candidate/jobs?per_page=100" --jq '[.jobs[] | select(.name=="append-twentyeighth-and-source-twentyninth" and .conclusion=="success")] | length')"
              [ "$ok" = 1 ] || continue
              digest="$(gh api "repos/$REPO/actions/runs/$candidate/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="mois-twentyeighth4096-verified-append-twentyninth-prioritized-original-source") | .digest')"
              if [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                echo "APPENDED_RUN=$candidate" >> "$GITHUB_ENV"
                echo "MOIS_WAVE28_SIGNED_APPEND_SOURCE_RESOLVED $candidate $digest"
                exit 0
              fi
            done < <(gh run list --repo "$REPO" --workflow mois-species-first-twentyeighth-append-twentyninth.yml --branch analysis/mois-species-first-palette9-20261111 --limit 50 --json databaseId --jq '.[].databaseId')
            sleep 30
          done
          echo "MOIS_WAVE28_SOURCE_NOT_COMPLETE; NO_GBIF_QUERY_PERFORMED"
          exit 1
      - name: Enforce signed wave28 append and pinned original GBIF crosswalk artifacts
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/actions/runs/$APPENDED_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name=="append-twentyeighth-and-source-twentyninth" and .conclusion=="success")] | length')" = 1
          test "$(gh api "repos/$REPO/actions/runs/$PREVIOUS_COLXR_RUN" --jq '.conclusion')" = success
          source_digest="$(gh api "repos/$REPO/actions/runs/$APPENDED_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="mois-twentyeighth4096-verified-append-twentyninth-prioritized-original-source") | .digest')"
          [[ "$source_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$(gh api "repos/$REPO/actions/runs/$PREVIOUS_COLXR_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="mois-colxr-twentyseventh-only-30-original-photo-hue-accepted-nine-fractions") | .digest')" = 'sha256:cae4d700f58f37a51a0539d8ceaa3135334c97fab3ab4b6188cf0ec4f2f0a256'
      - name: Verify 42,111-taxon genuine wave28 nine-ROI atlas and prior 36,895 COL XR names
        run: |
          set -euo pipefail
          mkdir -p genuine prior
          gh run download "$APPENDED_RUN" --repo "$REPO" --name mois-twentyeighth4096-verified-append-twentyninth-prioritized-original-source --dir genuine
          gh run download "$PREVIOUS_COLXR_RUN" --repo "$REPO" --name mois-colxr-twentyseventh-only-30-original-photo-hue-accepted-nine-fractions --dir prior
          python - <<'PY'
          from pathlib import Path
          import json
          from scripts.analysis.mois_gbif_colxr_batch_match import source_sha
          a=Path('genuine/updated/mois_species_first_42111_after_twentyeighth.csv.gz')
          r=json.loads(Path('genuine/updated/receipt.json').read_text())
          assert r['schema']=='mois_species_first_twentyeighth4096_append_twentyninth4096_v1'
          assert r['twentyeighth_actual_independent_original_photo_attempts']==186
          assert r['twentyeighth_actual_strict9_photo_successes']==46
          assert r['twentyeighth_new_source_taxa_with_clear_dominant_hue9']==26
          assert r['source_taxa_with_numerical_nineROI']>=39853
          assert r['source_taxa_with_clear_sampled_nine_palette']==39008
          assert source_sha(a)==r['output_sha256']['atlas']
          p=Path('prior/all_current_photo9_gbif_colxr_names.csv.gz')
          prev=json.loads(Path('prior/receipt.json').read_text())
          assert prev['schema']=='mois_species_first_real_wave27_gbif_colxr_new_names_v1'
          assert prev['current_exact_colxr_accepted_species']==36921
          assert source_sha(p)==prev['signed_file_SHA256'][p.name]
          print('MOIS_WAVE27_42111_REALPHOTO_AND_PRIOR36921_COLXR_SIGNED_SOURCES',flush=True)
          PY
      - name: Official GBIF v2 COL XR GET only 26 newly photographed-hue taxa
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_gbif_colxr_wave28_incremental \
            --atlas genuine/updated/mois_species_first_42111_after_twentyeighth.csv.gz \
            --append-receipt genuine/updated/receipt.json \
            --prior-names prior/all_current_photo9_gbif_colxr_names.csv.gz \
            --prior-receipt prior/receipt.json \
            --output matching --batch-size 200 --pause 1.0
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('matching/receipt.json').read_text())
          assert r['schema']=='mois_species_first_real_wave28_gbif_colxr_new_names_v1'
          assert r['photo_source_taxa_dominant_hue']==39008
          assert 1<=r['new_nine_hue_nominal_taxa_queried']<=26
          assert r['previous_gbif_accepted_species']==36921
          assert r['current_exact_colxr_accepted_species']>=36921
          assert r['current_GBIF_species_numeric9_fractional_traits']==r['current_exact_colxr_accepted_species']
          assert not r['GBIF_authenticated_bulk_occurrence_download_submitted']
          print('MOIS_REAL_WAVE28_NEW_ONLY_COLXR_ACCEPTED',json.dumps({
            k:r[k] for k in ('new_nine_hue_nominal_taxa_queried',
                             'new_exact_colxr_accepted_species',
                             'current_exact_colxr_accepted_species',
                             'new_match_status_counts',
                             'GBIF_ISEA3H_SQL_request_count')},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-colxr-twentyeighth-only-26-original-photo-hue-accepted-nine-fractions
          path: matching/
          retention-days: 90
          if-no-files-found: warn
