name: MOIS LGM floral assemblage 100km and 500km spatial-block tests
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-LGM-photo9-100km-spatial-block-20261116.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-real-LGM-photo9-100km-geography-20261116
  cancel-in-progress: false

jobs:
  source-verified-spatial-block:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned geospatial tools and check compiled program
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 \
            rasterio==1.4.3 pyproj==3.7.1 statsmodels==0.14.4 scipy==1.15.2
          python -m py_compile scripts/analysis/mois_lgm_grid_spatial_block_20261116.py
      - name: Retrieve SHA-verified global GBIF, climate biomass, and LGM original result
        run: |
          set -euo pipefail
          mkdir -p sources
          for record in \
            '14166701658 GBIF 422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2' \
            '14219399376 ENV d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc' \
            '14225733755 LGM db3b5b4fa2133194963be9233411bb6bb50bc86393d1dc50d996cc4cc78b25ab'; do
            set -- $record
            curl --fail --location --silent --show-error --retry 3 --retry-delay 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/$1/zip" \
              --output "sources/$2.zip"
            echo "$3  sources/$2.zip" | sha256sum -c -
          done
          curl --fail --location --silent --show-error --retry 3 --retry-delay 4 \
            --max-time 600 \
            "https://geodata.ucdavis.edu/climate/worldclim/1_4/grid/cur/bio_10m_bil.zip" \
            --output sources/WC14.zip
          echo 'f289ff21c6c4bd24f0b7635dee9a57b0c93193d7194ae9e86b6ba8bcb442e6f1  sources/WC14.zip' | sha256sum -c -
      - name: Fit global versus 500km-block local patterns in genuine recorded plant assemblages
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_lgm_grid_spatial_block_20261116 \
            --gbif sources/GBIF.zip \
            --env sources/ENV.zip \
            --lgm sources/LGM.zip \
            --current sources/WC14.zip \
            --output MOIS_LGM_spatial_grid
          python - <<'PY'
          import json
          d=json.load(open("MOIS_LGM_spatial_grid/receipt.json"))
          assert d["all_cell_rows"]==18577
          assert d["retained_cell_rows"]>2000
          assert d["results"]["n_GBIF_species_x_cell_pairs"]==5493931
          assert d["source_current_climate_and_LGM_are_same_v1p4_baseline"]
          assert d["results"]["models"]["500km_within_block"]["status"]=="fitted"
          print("MOIS_LGM_SPATIAL_BLOCK_VERIFIED",json.dumps(d["results"],sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-LGM-3GCM-100km-photo9-assemblage-500km-block-currentclimate-AGB
          path: MOIS_LGM_spatial_grid/
          retention-days: 90
          if-no-files-found: warn
