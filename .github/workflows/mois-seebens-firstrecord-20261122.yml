name: "MOIS ecology: first-record cohort time test"
on:
  push:
    branches: [analysis/mois-global-floral-colour-assembly-null-20261118]
    paths:
      - scripts/analysis/mois_seebens_v31_first_record_link_20261122.py
      - tests/test_mois_seebens_first_record_20261122.py
      - .github/workflows/mois-seebens-firstrecord-20261122.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  first-record-original-year:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned source and analysis libraries
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.1.3" "pandas==2.2.3" \
            "openpyxl==3.1.5" "pycountry==24.6.1" "pytest>=8,<10"
          python -m pytest -q tests/test_mois_seebens_first_record_20261122.py
      - name: Download checksum-pinned curated first records and MOIS original species
        run: |
          set -euo pipefail
          mkdir -p source
          python - <<'PY'
          import json,urllib.request,hashlib,pathlib
          with urllib.request.urlopen("https://zenodo.org/api/records/10039630",timeout=60) as r:
              meta=json.load(r)
          name="GlobalAlienSpeciesFirstRecordDatabase_v3.1_freedata.xlsx"
          files=[v for v in meta["files"] if v["key"]==name]
          assert len(files)==1
          url=files[0].get("links",{}).get("content") or "https://zenodo.org/records/10039630/files/"+name+"?download=1"
          with urllib.request.urlopen(url,timeout=150) as r, open("source/SEEBENS_v31.xlsx","wb") as o:
              while (buf:=r.read(1024*1024)): o.write(buf)
          digest=hashlib.sha256(pathlib.Path("source/SEEBENS_v31.xlsx").read_bytes()).hexdigest()
          assert digest=="7897fbd88d300f48d63039767c5d99b4ddc4799cc88604be861456b5ef6ecbd4", digest
          print("SEEBENS_V31_SHA256_VERIFIED",digest,flush=True)
          PY
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14166701658/zip" \
            -o source/GBIF.zip
          echo "422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2  source/GBIF.zip" | sha256sum -c
      - name: Run synchronous species-hue permutations on exact original years
        run: |
          python -m scripts.analysis.mois_seebens_v31_first_record_link_20261122 \
            --seebens source/SEEBENS_v31.xlsx --gbif source/GBIF.zip \
            --permutations 999 --out results/seebens_first_record_20261122
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-seebens-firstrecord-999-20261122
          path: results/seebens_first_record_20261122/
          retention-days: 60
          if-no-files-found: error
