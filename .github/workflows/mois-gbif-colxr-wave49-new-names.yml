name: MOIS wave49 one new genuine nine-hue taxon GBIF COL XR accepted key only
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - scripts/analysis/mois_gbif_colxr_wave49_incremental.py
      - tests/test_mois_gbif_colxr_wave49_incremental.py
      - .github/workflows/mois-gbif-colxr-wave49-new-names.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-GBIF-ColXR-accepted-wave49-one-new-photo-hue
  cancel-in-progress: false
jobs:
  actual-new-colxr-name-match:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      SIGNED_APPEND_RUN: '43453938716'
      PRIOR_GBIF_RUN: '43452597104'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact species only, accepted unique keys, stable old 9-colour traits
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m unittest discover -s tests -p test_mois_gbif_colxr_wave49_incremental.py -v
          python -m py_compile scripts/analysis/mois_gbif_colxr_wave49_incremental.py
      - name: Download source-signed wave49 genuine original-photo atlas and 37071 official accepted names
        run: |
          set -euo pipefail
          mkdir -p genuine prior
          # The signed append job is already complete even while wave50 workers run.
          # Never treat the complete wave50 run as a prerequisite for wave49 name-matching.
          test "$(gh api "repos/$REPO/actions/runs/$SIGNED_APPEND_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name=="append-fortyninth-and-source-fiftieth" and .conclusion=="success")] | length')" = 1
          test "$(gh api "repos/$REPO/actions/runs/$SIGNED_APPEND_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="mois-fortyninth4096-verified-append-fiftieth-prioritized-original-source") | .digest')" = 'sha256:e8193a61f5f314e35b1d0629f3b9dc1554dcb46c80077534a028cb6c8f5a4706'
          gh run download "$SIGNED_APPEND_RUN" --repo "$REPO" \
            --name mois-fortyninth4096-verified-append-fiftieth-prioritized-original-source \
            --dir genuine
          gh run download "$PRIOR_GBIF_RUN" --repo "$REPO" \
            --name mois-colxr-fortyeighth-one-new-real-photo-hue-accepted-nine-fractions \
            --dir prior
          python - <<'PY'
          from pathlib import Path
          import json
          from scripts.analysis.mois_gbif_colxr_batch_match import source_sha
          a=Path('genuine/updated/mois_species_first_42111_after_fortyninth.csv.gz')
          d=json.loads(Path('genuine/updated/receipt.json').read_text())
          assert d['schema']=='mois_species_first_fortyninth4096_append_fiftieth4096_v1'
          assert d['fortyninth_actual_independent_original_photo_attempts']==7
          assert d['fortyninth_actual_strict9_photo_successes']==4
          assert d['fortyninth_new_source_taxa_with_clear_dominant_hue9']==1
          assert d['source_taxa_with_numerical_nineROI']==39882
          assert d['source_taxa_with_clear_sampled_nine_palette']==39140
          assert source_sha(a)==d['output_sha256']['atlas']
          assert source_sha(a)=='0a1a0b34211499324517d44d3799e2ee5b30445fbf97f846a60456fadb2ed04f'
          p=json.loads(Path('prior/receipt.json').read_text())
          assert p['schema']=='mois_species_first_real_wave48_gbif_colxr_new_names_v1'
          assert p['current_exact_colxr_accepted_species']==37071
          names=Path('prior/all_current_photo9_gbif_colxr_names.csv.gz')
          assert source_sha(names)==p['signed_file_SHA256'][names.name]
          print('MOIS_WAVE49_REAL_SOURCE_AND_PRIOR_37071_COLXR_ACCEPTED_KEYS_SHA_OK',flush=True)
          PY
      - name: Query official v2 COL XR only one novel source name and preserve unresolved state
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_gbif_colxr_wave49_incremental \
            --atlas genuine/updated/mois_species_first_42111_after_fortyninth.csv.gz \
            --append-receipt genuine/updated/receipt.json \
            --prior-names prior/all_current_photo9_gbif_colxr_names.csv.gz \
            --prior-receipt prior/receipt.json \
            --output matched --batch-size 50 --pause 1.0
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('matched/receipt.json').read_text())
          assert d['schema']=='mois_species_first_real_wave49_gbif_colxr_new_names_v1'
          assert d['photo_source_taxa_dominant_hue']==39140
          assert d['new_nine_hue_nominal_taxa_queried']==1
          assert d['previous_gbif_accepted_species']==37071
          assert 37071<=d['current_exact_colxr_accepted_species']<=37071
          assert d['GBIF_occurrence_records_downloaded']==0
          assert d['GBIF_authenticated_bulk_occurrence_download_submitted'] is False
          print('MOIS_OFFICIAL_COLXR_WAVE49_GENUINE_NEW_HUE_RESULT',
                json.dumps({k:d[k] for k in ('new_nine_hue_nominal_taxa_queried',
                    'new_exact_colxr_accepted_species','current_exact_colxr_accepted_species',
                    'GBIF_ISEA3H_SQL_request_count')},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-colxr-fortyninth-one-new-real-photo-hue-accepted-nine-fractions
          path: matched/
          retention-days: 90
          if-no-files-found: warn
