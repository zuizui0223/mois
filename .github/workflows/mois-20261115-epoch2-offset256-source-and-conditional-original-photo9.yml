          assert r['new_independent_taxa']==0 and r['original_pixels_fetched']==0
          assert r['strict9_numeric_photos']==0 and r['old_original_photo_obs_ID_overlap']==0
          assert r['old_all_image_raw_SHA_disjointness_proven'] is False
          h=lambda f:hashlib.sha256((p/f).read_bytes()).hexdigest()
