name: MOIS 20261115 epoch2 offset256 new-created independent CC originals conditional ROI9
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-20261115-epoch2-offset256-source-and-conditional-original-photo9.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-20261115-epoch2T0207-created-128taxa-offset0-original-once
  cancel-in-progress: false

jobs:
  source-only-historical-independent-new-created-CC-pictures:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      has_new: ${{ steps.freeze.outputs.has_new }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      PYTHONUNBUFFERED: '1'
      MOIS_TAXON_OFFSET: '256'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require completed epoch2 offset128 signed 128-taxon zero-source before disjoint offset256
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/actions/runs/43628729422" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/43628729422/artifacts?per_page=100" --jq '.artifacts[] | select(.id==14127630153 and .expired==false) | .digest')" = 'sha256:c632ba2db27a916bb9470e6f99c7d611ae0cdd03a96c7c60858531fb736707d1'
          mkdir -p prior_epoch2_offset128
          gh run download 43628729422 --repo "$REPO" --name mois-20261115-epoch2-offset128-new-created-128taxa-signed-1231340-ID-disjoint-source --dir prior_epoch2_offset128
          python - <<'PY'
          import json,hashlib,csv,pathlib
          p=pathlib.Path('prior_epoch2_offset128')
          r=json.loads((p/'receipt.json').read_bytes())
          assert r['schema']=='mois_incremental_20261115_epoch2_new_created_cc_original_photo9_v1'
          assert r['created_utc_lower_bound']=='2026-11-14T17:07:00+00:00'
          assert r['hash_disjoint_taxon_offset']==128 and r['searched_zero_numeric_taxa']==128
          assert r['old_original_photo_attempt_ID_count']==1231340
          assert r['source_API_error_count']==0 and r['new_independent_original_photo_candidates']==0
          assert r['new_independent_taxa']==0 and r['original_pixels_fetched']==0
          assert r['strict9_numeric_photos']==0 and r['old_original_photo_obs_ID_overlap']==0
          assert r['old_all_image_raw_SHA_disjointness_proven'] is False
          h=lambda f:hashlib.sha256((p/f).read_bytes()).hexdigest()
          assert h('source_taxon_status.csv')==r['source_status_SHA256']=='1f6caad754cc6b5c8de593641a15fc0a0b75763942f1d51efc5a451561a00163'
          assert h('source_candidates.csv')==r['source_candidates_SHA256']=='01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b'
          rows=list(csv.DictReader((p/'source_taxon_status.csv').open()))
          assert len(rows)==len({x['inat_taxon_id'] for x in rows})==128
          assert all(x['status']=='source_queried' and int(x['accepted_unused_photo'])==0 for x in rows)
          print('MOIS_EPOCH2_OFFSET128_SIGNED_NO_NEW_SOURCE_COHORT_COMPLETE',flush=True)
          PY
      - name: Require completed epoch2 offset0 signed 128-taxon zero-source before disjoint offset256
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/actions/runs/43628185595" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/43628185595/artifacts?per_page=100" --jq '.artifacts[] | select(.id==14127325221 and .expired==false) | .digest')" = 'sha256:e73aaf86aac76b5492d6ff8bfc7ba509e3f31481d6850ac5f4e87d79c60e9915'
