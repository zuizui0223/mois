        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/actions/runs/43619157128" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/43619157128/artifacts?per_page=100" --jq '.artifacts[] | select(.id==14123825861 and .expired==false) | .digest')" = 'sha256:a208fcfc8f7c4b288613ffbf0f19ba7ef5975601ce3d234241358fbb04483c9a'
