name: "MOIS Ecology: highland introduced versus native hue9 climate and NPP controls"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - scripts/analysis/mois_native_intro_hue9_highland_environment_FE_20261118.py
      - .github/workflows/mois-native-introduced-hue9-highland-environment-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-native-intro-photo9-altitude-climate-20261118
  cancel-in-progress: false
jobs:
  actual-highland-assemblages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install regression and signed ecological data readers
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" \
            "statsmodels>=0.14,<1" "scipy>=1.11,<2"
          python -m py_compile scripts/analysis/mois_native_intro_hue9_highland_environment_FE_20261118.py
      - name: Restore exact two signed real GBIF native-intro photo9 and environment source artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source
          for spec in \
            '14400177816 geography cbe1eef381e3e1a0062dbf5134b047f947338b7c499d2ecc0cd22ee8855909fd' \
            '14397855889 environment 4f5d8fc3a308482fc3645d796a779d1a4725c51ed2afbf6a06e61fd6213f3ee6'; do
            set -- $spec
            curl -fLsS --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" \
              --output "source/$2.zip"
            echo "$3  source/$2.zip" | sha256sum -c
          done
      - name: Test independent highland photo9 effects under modern climate NPP AGB and LGM controls
        run: |
          python scripts/analysis/mois_native_intro_hue9_highland_environment_FE_20261118.py \
            --geography source/geography.zip \
            --environment source/environment.zip \
            --out results/mois_samecell_nativeintro_hue9_elev_climate_NPP_20261118
      - name: Archive only verified numerical coefficients and source receipts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-samecell-nativeintro-highland-photo9-climate-NPP-controls-20261118
          path: results/mois_samecell_nativeintro_hue9_elev_climate_NPP_20261118/
          retention-days: 30
          if-no-files-found: error
