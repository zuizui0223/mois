name: MOIS authenticated full historical 100543 date plus 85 API fallbacks and 127504 photo season source

on:
  pull_request:
    paths:
      - "scripts/analysis/mois_final_original_photo_s3_api_seasonal_composition.py"
      - "tests/test_mois_final_original_photo_s3_api_seasonal_composition.py"
      - ".github/workflows/mois-final-full100543-source-date-s3-api-seasonal-reanalysis.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-original-photo-date-union-without-new-provider-requests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate original photo/observation IDs, monthly S3 precedence, missing hue and community/taxon separation
        run: |
          python -m pip install -q 'numpy==2.1.3' 'pandas==2.2.3' 'pytest==8.4.2'
          python -m pytest -q tests/test_mois_final_original_photo_s3_api_seasonal_composition.py
      - name: Retrieve ONLY completed source/photo-date artifacts; no repeat of 31.75GiB provider dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original_photo full_S3_date API_9600_date
          gh run download 39002957961 --repo zuizui0223/mois \
            --name mois-actually-measured-FCP-wave4-completed-photo-partitions-snapshot \
            --dir original_photo
          gh run download 39009539731 --repo zuizui0223/mois \
            --name mois-full-historic100543-real-photo-public20260927-S3-uuid-date-source-rejoin \
            --dir full_S3_date
          gh run download 39008584811 --repo zuizui0223/mois \
            --name mois-original9600-real-public-iNat-photo-date-recovery-and-season-aggregation \
            --dir API_9600_date
          test -s original_photo/mois_fcp_wave4_PARTIAL_completed_pixel_original_photo_union.csv.gz
          test -s full_S3_date/mois_historical_100543_original_photo_id_s3_uuid_date_real_snapshot.csv.gz
          test -s API_9600_date/mois_historical_9600_original_photo_dates_current_public.csv
          zip -j -q original_photo_source.zip original_photo/*
          zip -j -q original_full_S3_date_source.zip full_S3_date/*
          zip -j -q original_9600_API_date_source.zip API_9600_date/*
      - name: Reconcile historic S3/APIs without changing any photo-hue or taxon and calculate two seasonal estimands
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_final_original_photo_s3_api_seasonal_composition \
            --original-photo-zip original_photo_source.zip \
            --full-official-s3-zip original_full_S3_date_source.zip \
            --old9600-api-zip original_9600_API_date_source.zip \
            --output final_historic_dates_source
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('final_historic_dates_source/mois_real127504_original_photo_S3_plus_verified_API_local_season_result.json').read_text())
          r=j['full_historical_join']
          assert j['photo_original_full_source_SHA256']=='fbb54b58dc91e40e2e166081212588acc18adb19af4bdbcd1c7fe1778bee28d9'
          assert j['full_original_measured_photo_ids']==267425
          assert j['full_original_genuine_four_hue_classified_photo_ids']==129795
          assert r['historical_date_S3_source_verified']==99732
          assert r['historic_public_API_photo_id_and_numeric_observation_id_verified_fallback']==85
          assert r['history_original_dates_total_with_both_source_precedence']==99817
          assert r['still_unresolved_original_historical_dates']==726
          assert r['current_API_and_monthly_S3_dates_both_valid']==9512
          assert r['current_API_vs_official_S3_observed_on_disagreements']==1
          assert r['newly_source_date_recovered_historical_original_four_hue_photos']==45637
          assert r['real_original_photo_hue_and_date_after_all_verified_rejoins']==127504
          assert r['dated_and_classified_original_source_nominal_taxa']==25257
          assert r['original_photos_with_observation_date_after_all_verified_rejoins']==261578
          comp=j['zone_season_original_photo_taxonomic_composition_decomposition']
          assert comp['north_extratropical']['common_taxa_both_seasons']==562
          assert comp['south_extratropical']['common_taxa_both_seasons']==320
          assert comp['south_extratropical']['original_source_photo_white_summer_minus_winter_pp']>12.4
          assert comp['south_extratropical']['common_taxon_relative_photo_frequency_shift_pp']>10.5
          support=j['site_photo_community_and_taxon_local_source_season_support']
          def find(zone,n,taxa):
              return [x for x in support if x['geographic_cell_degrees']==0.25 and
                  x['minimum_distinct_original_observation_ID_per_summer_and_winter']==n and
                  x['minimum_named_original_taxa_per_season']==taxa and
                  x['hemisphere']==zone][0]
          assert find('north_extratropical',5,2)['same_cell_same_meteorological_season_year_comparisons']==16
          assert find('south_extratropical',5,2)['same_cell_same_meteorological_season_year_comparisons']==18
          assert find('north_extratropical',2,1)['same_cell_same_meteorological_season_year_comparisons']==2
          assert find('south_extratropical',2,1)['same_cell_same_meteorological_season_year_comparisons']==0
          for zone in ('north_extratropical','south_extratropical'):
              local=find(zone,5,2)
              assert local['locality_cluster_percentile_bootstrap95_pp'][0]<0
              assert local['locality_cluster_percentile_bootstrap95_pp'][1]>0
          assert j['historical_MOIS_annual_genus_rainfall_vapour_maxT_result_overwritten'] is False
          assert not j['any_photo_specific_open_flower_organs_botanically_confirmed_by_this_work']
          print('MOIS_FINAL_127504_S3_PLUS_API_PHOTOGRAPHIC_SEASONAL_SOURCE_SCIENCE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-final-authentic-original127504-dated-hue-photos-fullhistorical-S3-API-source-season
          path: final_historic_dates_source/
          retention-days: 90
          if-no-files-found: error
