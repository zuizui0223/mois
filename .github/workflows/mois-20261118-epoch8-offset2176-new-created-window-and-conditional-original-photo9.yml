          assert finjobs["source-only-first128"]==finjobs["independent-final-byte-audit"]=="success"
          assert all(finjobs[k]=="skipped" for k in ("pixel-worker-only-if-novel-original","independent-strict9-audit","formal-append-after-audit"))
          fina={x["id"]:x for x in get(f"repos/{repo}/actions/runs/44235063258/artifacts?per_page=100")["artifacts"]}
