name: MOIS epoch8 offset2176 final21 zero-ROI taxa in fresh observation-created window
# Frozen original hash order and already-signed source/audit history.
# The previous epoch6 offset128 path is immutable: do not substitute current epoch7 offset2176. Do not rescan prior source.
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-20261118-epoch8-offset2176-new-created-window-and-conditional-original-photo9.yml
      - scripts/acquisition/mois_epoch8_after_epoch7_new_created_photo9_offset2176.py
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-epoch8-offset2176-only-once-signed-history
  cancel-in-progress: false
jobs:
  source-only-first128:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      PYTHONUNBUFFERED: '1'
    outputs:
      has_new: ${{ steps.freeze.outputs.has_new }}
