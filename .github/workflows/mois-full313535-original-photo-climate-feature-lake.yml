name: MOIS full fourth4096 actual RGB photos extend immutable lake to 313535
on:
  pull_request:
    paths:
      - scripts/analysis/mois_full313535_immutable_photo_hue_annual_environment.py
      - tests/test_mois_full313535_immutable_photo_hue_annual_environment.py
      - docs/MOIS_FULL4096_313535_PHOTO_FEATURE_LAKE_20261017.md
      - .github/workflows/mois-full313535-original-photo-climate-feature-lake.yml
  push:
    branches: [main]
    paths:
      - scripts/analysis/mois_full313535_immutable_photo_hue_annual_environment.py
      - tests/test_mois_full313535_immutable_photo_hue_annual_environment.py
      - docs/MOIS_FULL4096_313535_PHOTO_FEATURE_LAKE_20261017.md
      - .github/workflows/mois-full313535-original-photo-climate-feature-lake.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-genuine-full4096-313535-photo-climate-parquet-source
  cancel-in-progress: false
jobs:
  full-original-photo4096-actual-pixel-feature-lake:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check actual image pixel results and original photo/colour source gates
        run: |
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 rasterio==1.4.3 pyarrow==19.0.1 pytest==8.4.2
          python -m pytest -q tests/test_mois_full313535_immutable_photo_hue_annual_environment.py
      - name: Restore all 4096 genuinely measured source originals and immutable previous source-feature release
        run: |
          set -euo pipefail
          mkdir -p actual313535 base309439 worldclim/{bio,srad}
          gh run download 39032258023 --repo zuizui0223/mois \
            --name mois-fourth4096-real309439-plus4096-original-photo-pixels-and-dated-four-hue-ecology \
            --dir actual313535
          gh release download mois-primary-309439-featurelake-546266e2bbaa-v1 \
            --repo zuizui0223/mois --dir base309439 \
            --pattern 'primary309439_*.parquet' \
            --pattern 'primary309439_immutable_photo_feature_lake_manifest.json'
          test -s actual313535/mois_full313535_original_pixel_ROIs_and_observation_dates.csv.gz
          test -s actual313535/mois_fourth_4096_actual_original_ROI_pixels_and_source_dates_decision.json
          test -s base309439/primary309439_photo_hue_source.parquet
          test -s base309439/primary309439_immutable_photo_feature_lake_manifest.json
      - name: Fetch original fully sourced WorldClim bio and solar rasters for genuinely NEW 4096 photo coordinates
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 420 \
            https://github.com/zuizui0223/fcp/releases/download/fcp-worldclim-2.1-10m-20260925/wc2.1_10m_bio.zip \
            -o worldclim/bio/wc2.1_10m_bio.zip
          curl --fail --location --silent --show-error --retry 3 --max-time 420 \
            https://github.com/zuizui0223/fcp/releases/download/fcp-worldclim-2.1-10m-20260925/wc2.1_10m_srad.zip \
            -o worldclim/srad/wc2.1_10m_srad.zip
          echo '00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf  worldclim/bio/wc2.1_10m_bio.zip' | sha256sum -c -
          echo 'c72ee7f4f9a0eb4b5f6cd7a003eddc05bda22a2e5666d968ed4e817fd36b9026  worldclim/srad/wc2.1_10m_srad.zip' | sha256sum -c -
          unzip -q worldclim/bio/wc2.1_10m_bio.zip -d worldclim/bio
          unzip -q worldclim/srad/wc2.1_10m_srad.zip -d worldclim/srad
      - name: Physically sample 4096 NEW RGB/photo sites, preserve 309439 earlier photo/soil and source identities
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_full313535_immutable_photo_hue_annual_environment \
            --original313535-pixels actual313535/mois_full313535_original_pixel_ROIs_and_observation_dates.csv.gz \
            --original313535-source-receipt actual313535/mois_fourth_4096_actual_original_ROI_pixels_and_source_dates_decision.json \
            --previous309439-feature-release base309439 \
            --worldclim-source worldclim \
            --output primary313535_featurelake
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('primary313535_featurelake')
          q=json.loads((p/'primary313535_fullfourth4096_featurelake_manifest.json').read_text())
          assert (q['actual_original_photo_attempts'],q['four_hue_labels'],q['dated_four_hue_labels'])==(313535,151239,151230)
          assert q['new_photo_pixels']==4096
          assert q['new_classifiable_visible_hues']==1577
          assert q['old512_1792_photos_not_double_counted']
          assert q['new_soil_terrain_not_imputed']
          assert not q['50_50_evolutionary_equilibrium_tested']
          print('MOIS_FULL_313535_COMPLETE_PIXEL_ROI_ENVIRONMENT_PERSISTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-real313535-original4096-complete-RGB-climate-feature-Parquet
          path: primary313535_featurelake/
          retention-days: 90
          if-no-files-found: error

  publish-upgraded-feature-lake:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: full-original-photo4096-actual-pixel-feature-lake
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-real313535-original4096-complete-RGB-climate-feature-Parquet
          path: lake
      - name: Archive the all-4096 real-photo data snapshot once
        run: |
          set -euo pipefail
          tag=mois-primary-313535-fullfourth4096-featurelake-v2
          if gh release view "$tag" --repo zuizui0223/mois >/dev/null 2>&1; then
            echo "Immutable photo source snapshot already released; will not overwrite"
          else
            gh release create "$tag" lake/*.parquet lake/*.json lake/*.csv \
              --repo zuizui0223/mois --target "$GITHUB_SHA" \
              --title 'MOIS real 313535 original photo ROI and annual environment feature lake v2' \
              --notes '309439 frozen original photo pixels PLUS all 4096 separately original-RGB-measured photo IDs. 151239 four-hue automatic visible ROI outcomes, 151230 with observation dates. Annual climate source values verified; extra soil/terrain unknown remains unknown. Descriptive white/chromatic fraction not adaptive 50:50 equilibrium; no raw images or season-targeted 256 photos.'
          fi
