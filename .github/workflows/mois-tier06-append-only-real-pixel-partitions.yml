name: MOIS append-only sealed original RGB partitions from broad tier06 workers
on:
  pull_request:
    paths:
      - scripts/acquisition/mois_append_only_original_worker_group.py
      - tests/test_mois_append_only_original_worker_group.py
      - .github/workflows/mois-tier06-append-only-real-pixel-partitions.yml
  push:
    branches: [main]
    paths:
      - scripts/acquisition/mois_append_only_original_worker_group.py
      - tests/test_mois_append_only_original_worker_group.py
      - .github/workflows/mois-tier06-append-only-real-pixel-partitions.yml
  workflow_dispatch:
  workflow_run:
    workflows:
      - MOIS broad all16 tier06 genuine warm RGB from signed source
    types: [completed]
    branches: [main]
  schedule:
    - cron: '11 */4 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-tier06-all16-append-only-original-worker-partitions-v1
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          python -m unittest discover -s tests -p test_mois_append_only_original_worker_group.py -v
          python -m py_compile scripts/acquisition/mois_append_only_original_worker_group.py
      - name: Syntax-check every shell run step including publication branches
        run: |
          set -euo pipefail
          python -m pip install -q PyYAML==6.0.2
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml
          p=Path('.github/workflows/mois-tier06-append-only-real-pixel-partitions.yml')
          data=yaml.safe_load(p.read_text())
          checked=0
          for jobname,job in data['jobs'].items():
              for step in job['steps']:
                  if 'run' not in step:
                      continue
                  result=subprocess.run(['bash','-n'],input=step['run'],
                                        text=True,capture_output=True)
                  assert result.returncode==0,(jobname,step.get('name'),result.stderr)
                  checked+=1
          assert checked>=6
          print('MOIS_SIGNED_APPEND_ORIGINAL_SHELL_STEPS_SYNTAX_VERIFIED',checked)
          PY
  scan-actual-sealed-workers:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      ready: ${{ steps.scan.outputs.ready }}
      groups: ${{ steps.scan.outputs.groups }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      ORIGINAL_RUN: '39880330611'
    steps:
      - uses: actions/checkout@v4
      - name: Match successful original image jobs to still unpublished worker assets
        id: scan
        run: |
          set -euo pipefail
          gh release view mois-tier06-all16-first4bucket-broad-warm-original-RGB-source-v1 \
            --repo "$REPO" --json isDraft --jq .isDraft | grep -qx false
          gh api "repos/$REPO/actions/runs/$ORIGINAL_RUN/jobs?per_page=100" > frozen-original-jobs.json
          gh api "repos/$REPO/actions/runs/$ORIGINAL_RUN/artifacts?per_page=100" > frozen-original-artifacts.json
          python - <<'PY'
          import json,os,subprocess
          jobs=json.load(open('frozen-original-jobs.json'))['jobs']
          artifacts=json.load(open('frozen-original-artifacts.json'))['artifacts']
          completed={x['name'] for x in jobs if x['conclusion']=='success'}
          byname={}
          for a in artifacts:
              if a['name'].startswith('mois-tier06-all16-broad-RGB-group-'):
                  assert a['name'] not in byname,'Duplicate original photo-worker artifact'
                  byname[a['name']]=a
          available=[]
          for i in range(5):
              key=f'mois-tier06-all16-broad-RGB-group-{i}'
              if f'measure ({i})' not in completed or key not in byname:
                  continue
              assert byname[key]['expired'] is False,'Original photo worker expired'
              tag=f'mois-tier06-all16-broad-original-RGB-append-group-{i}-v1'
              existing=subprocess.run(
                  ['gh','release','view',tag,'--repo',os.environ['REPO']],
                  stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if not existing:available.append(i)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('ready='+('true' if available else 'false')+'\n')
              f.write('groups='+json.dumps(available)+'\n')
          print('MOIS_NEW_ACTUAL_PHOTO_APPEND_PARTITIONS',
                json.dumps({'source_run':int(os.environ['ORIGINAL_RUN']),
                            'new_completed_groups':available},sort_keys=True),flush=True)
          PY
  seal-original-group:
    needs: scan-actual-sealed-workers
    if: needs.scan-actual-sealed-workers.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: ${{ fromJSON(needs.scan-actual-sealed-workers.outputs.groups) }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      ORIGINAL_RUN: '39880330611'
      GROUP: ${{ matrix.group }}
      RELEASE_TAG: mois-tier06-all16-broad-original-RGB-append-group-${{ matrix.group }}-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
      - name: Reuse only pinned source and completed original photo terminal artifacts
        run: |
          set -euo pipefail
          gh run download "$ORIGINAL_RUN" --repo "$REPO" \
            --name mois-tier06-all16-first4buckets-broad-precolour-source-shards \
            --dir source
          gh release download mois-tier06-all16-first4bucket-broad-warm-original-RGB-source-v1 \
            --repo "$REPO" --dir signed-source --pattern manifest.json
          cmp signed-source/manifest.json source/manifest.json
          echo '3e28ced8de85709ea4854cd3291aa00f56e98306b60a4c273c5c7bb47b68c858  source/manifest.json' | sha256sum -c -
          gh run download "$ORIGINAL_RUN" --repo "$REPO" \
            --name "mois-tier06-all16-broad-RGB-group-$GROUP" \
            --dir original-worker
      - name: Verify original photo IDs and frozen model, write immutable group Parquet
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_append_only_original_worker_group \
            --source source --workers original-worker --group "$GROUP" --output sealed
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('sealed/original_photo_group_receipt.json').read_text())
          assert d['original_source_warm_group']==int(os.environ['GROUP'])
          assert d['complete_expected_source_photo_attempts']==4468
          assert d['distinct_genuinely_completed_photo_ids']>0
          assert d['frozen_original_FCP_model_and_output_verified']
          assert not d['image_bytes_reacquired_in_sealing']
          assert not d['ROI_or_hue_reinference_in_sealing']
          print('MOIS_ORIGINAL_APPEND_GROUP_SEALED',
                d['original_source_warm_group'],
                d['distinct_genuinely_completed_photo_ids'],
                d['four_hue_model_classified'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-tier06-broad-append-only-RGB-group-${{ matrix.group }}
          path: sealed/
          retention-days: 90
          if-no-files-found: warn
      - name: Publish SHA-verified original photo Parquet group without downloads or inference
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --repo "$REPO" --dir old \
              --pattern original_photo_group_receipt.json
            cmp old/original_photo_group_receipt.json sealed/original_photo_group_receipt.json
          else
            gh release create "$RELEASE_TAG" sealed/*.json sealed/*.parquet sealed/*.csv \
              --repo "$REPO" --target "$GITHUB_SHA" \
              --title "MOIS genuine tier06 all16 original photo group $GROUP: immutable append" \
              --notes 'One SHA-verified completed original-image work group only; original source/photo/observation/image terminal and frozen full-resolution ROI-v4 model attestations checked. New photo downloads and hue inference are zero in this data-only release. All failed image acquisitions and unknown hues are retained, not treated as nonwhite. Restricted tier06 all16 first4of512 observation-bucket source arm, not a world-flora representative sample. Raw images are not redistributed.'
          fi
