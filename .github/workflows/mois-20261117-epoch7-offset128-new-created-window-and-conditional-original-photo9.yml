  formal-append-after-audit:
    needs: [source-only-first128, pixel-worker-only-if-novel-original, independent-strict9-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download verified previous atlas, source, worker, independent audit
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p latest signed pixel audited
          gh run download 44053424693 --repo "$REPO" --name mois-20261117-epoch6-offset1920-genuine-original-42111-taxonomy-append --dir latest
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261117-epoch7-offset128-signed-1231352-ID-source --dir signed
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261117-epoch7-offset128-genuine-FCP-ROI9-terminal --dir pixel
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261117-epoch7-offset128-independent-strict9-audit --dir audited
      - name: Append audited 9-colour measurements; never turn unknown into zero-vector
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_epoch7_after_epoch6_new_created_photo9_offset128 append --atlas latest/mois_42111_post20261114_new_independent_original_photo9.csv.gz --source signed --worker pixel --audit audited --output appended
          python - <<'PY'
          import json
          r=json.load(open("appended/receipt.json"))
          assert r["cumulative_photo_attempts"]==1231352+r["new_original_photo_attempts"]
          assert r["cumulative_numeric_taxa"]==39914+r["new_first_numeric_taxa"]
          assert r["cumulative_clear_sampled_photo_taxa"]==39174+r["new_clear_sampled_photo_hue_taxa"]
          assert r["old1231244_raw_SHA_fully_compared"] is False
          print("FORMAL_42111_ATLAS_APPEND_TERMINAL",json.dumps(r,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-20261117-epoch7-offset128-genuine-original-42111-taxonomy-append
          path: appended/
          retention-days: 90
          if-no-files-found: error

  independent-final-byte-audit:
    needs: [source-only-first128, pixel-worker-only-if-novel-original, independent-strict9-audit, formal-append-after-audit]
    if: always() && needs.source-only-first128.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      HAS_NEW: ${{ needs.source-only-first128.outputs.has_new }}
      PIXEL_RESULT: ${{ needs.pixel-worker-only-if-novel-original.result }}
      AUDIT_RESULT: ${{ needs.independent-strict9-audit.result }}
      APPEND_RESULT: ${{ needs.formal-append-after-audit.result }}
    steps:
      - name: Independently audit latest artifact ZIP bytes, receipt and four-stage terminal status
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,os
          repo="zuizui0223/mois";rid=os.environ["GITHUB_RUN_ID"]
          d=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/runs/{rid}/artifacts?per_page=100"]))
          a=d["artifacts"]
          expected=1 if os.environ["HAS_NEW"]=="false" else 4
          assert len(a)==expected,(expected,a)
          if expected==1:
            assert [os.environ[x] for x in ("PIXEL_RESULT","AUDIT_RESULT","APPEND_RESULT")]==["skipped"]*3
          else:
            assert [os.environ[x] for x in ("PIXEL_RESULT","AUDIT_RESULT","APPEND_RESULT")]==["success"]*3
          with open("/tmp/latest_artifacts.tsv","w") as f:
            for obj in a:
              assert not obj["expired"] and obj["digest"].startswith("sha256:")
              f.write(str(obj["id"])+" "+obj["digest"][7:]+" "+obj["name"]+"\n")
          print("TERMINAL_EXPECTED_ARTIFACTS",expected,"HAS_NEW",os.environ["HAS_NEW"],flush=True)
          PY
          mkdir -p /tmp/mois_artifacts
          while read -r id sha name; do
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" -o "/tmp/mois_artifacts/$id.zip"
            echo "$sha  /tmp/mois_artifacts/$id.zip" | sha256sum -c -
            echo "INDEPENDENT_BYTE_ZIP_SHA256 $id $name $sha"
          done < /tmp/latest_artifacts.tsv
          python - <<'PY'
          import json,csv,io,zipfile,hashlib,glob,os
          h=lambda b:hashlib.sha256(b).hexdigest()
          a={}
          for f in glob.glob("/tmp/mois_artifacts/*.zip"):
            with zipfile.ZipFile(f) as z:
              for n in z.namelist():
                if ".." in n.split("/"):raise AssertionError("unsafe zip path")
              # Explicit provenance check of every present inner receipt
              vals={n:z.read(n) for n in z.namelist() if not n.endswith("/")}
              a.update({os.path.basename(f)+"/"+n:v for n,v in vals.items()})
              name=" ".join(k for k in vals)
              if "source_taxon_status.csv" in vals:
                r=json.loads(vals["receipt.json"])
                if "manifest.json" in vals:
                  assert h(vals["manifest.json"])==r["source_manifest_SHA256"]
                else:
                  assert r["new_independent_original_photo_candidates"]==0
                if "shards/shard-000.csv" in vals:
                  assert h(vals["shards/shard-000.csv"])==r["source_shard_SHA256"]
                else:
                  assert r["new_independent_original_photo_candidates"]==0
                assert h(vals["source_taxon_status.csv"])==r["source_status_SHA256"]
                assert h(vals["source_candidates.csv"])==r["source_candidates_SHA256"]
                assert (r["hash_disjoint_taxon_offset"],r["searched_zero_numeric_taxa"],r["source_API_error_count"],r["old_original_photo_obs_ID_overlap"])==(128,128,0,0)
                assert r["old_all_image_raw_SHA_disjointness_proven"] is False
                rows=list(csv.DictReader(io.StringIO(vals["source_taxon_status.csv"].decode())))
                ids=[x["inat_taxon_id"] for x in rows]
                assert len(ids)==len(set(ids))==128
                assert all(x["status"]=="source_queried" for x in rows)
                print("SOURCE_MANIFEST_AND_RECEIPT_BYTE_SHA256",h(vals["receipt.json"]),h(vals["source_taxon_status.csv"]),h(vals["source_candidates.csv"]),flush=True)
                print("NEW_SOURCE_CANDIDATES",r["new_independent_original_photo_candidates"],flush=True)
              elif "receipt.json" in vals:
                receipt=json.loads(vals["receipt.json"])
                if "derived_atlas_sha256" in receipt:
                  assert h(vals["mois_42111_post20261114_new_independent_original_photo9.csv.gz"])==receipt["derived_atlas_sha256"]
                print("OTHER_INNER_RECEIPT_BYTE_SHA256",h(vals["receipt.json"]),flush=True)
          assert any(k.endswith("/source_taxon_status.csv") for k in a)
          print("INDEPENDENT_FINAL_BYTE_AUDIT_SUCCESS",len(a),flush=True)
          PY
