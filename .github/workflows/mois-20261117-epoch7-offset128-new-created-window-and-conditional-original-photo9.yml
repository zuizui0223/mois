name: MOIS epoch7 offset128 disjoint original ROI9 after terminal signed offset0
# Frozen original hash order and already-signed source/audit history. Do not rescan prior source.
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-20261117-epoch7-offset128-new-created-window-and-conditional-original-photo9.yml
      - scripts/acquisition/mois_epoch7_after_epoch6_new_created_photo9_offset128.py
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-epoch7-offset128-only-once-signed-history
  cancel-in-progress: false
jobs:
  source-only-first128:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      PYTHONUNBUFFERED: '1'
    outputs:
      has_new: ${{ steps.freeze.outputs.has_new }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify epoch6 terminal, source SHA uniqueness, eighteen historic signed artifacts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,os
          repo="zuizui0223/mois"
          get=lambda p:json.loads(subprocess.check_output(["gh","api",p]))
          old=get(f"repos/{repo}/actions/runs/44076781021")
          assert (old["status"],old["conclusion"])==("completed","success")
          jobs={j["name"]:j["conclusion"] for j in get(f"repos/{repo}/actions/runs/44076781021/jobs?per_page=100")["jobs"]}
          assert jobs["source-only-first128"]==jobs["independent-final-byte-audit"]=="success"
          assert all(jobs[x]=="skipped" for x in ("pixel-worker-only-if-novel-original","independent-strict9-audit","formal-append-after-audit"))
          wf="mois-20261117-epoch7-offset128-new-created-window-and-conditional-original-photo9.yml"
          for x in get(f"repos/{repo}/actions/workflows/{wf}/runs?per_page=100")["workflow_runs"]:
            if x["id"]==int(os.environ["GITHUB_RUN_ID"]):continue
            ar=get(f"repos/{repo}/actions/runs/{x['id']}/artifacts?per_page=100")["artifacts"]
            assert not ar and x["conclusion"]!="success","epoch7 offset128 already signed; source SHA replay forbidden"
          expected=[
            [0,43931289660,14258616417,"b119ef2b645ae6ff52340f728e6957fea25cced915caf9b2fcd4b858c080299c"],
            [128,43932884084,14259857099,"b0f0b1b1b113c7a58dbcf4fa879d44dba117e542219d5197076b508eef1612ec"],
            [256,43953442756,14271765487,"0b694af6857f4411760ab1782cd732f68dac99d2d95c4b1bbaaba053805e5b4b"],
            [384,43962573359,14273534566,"5ef3a3d2079183f3faabc1924d748c78d6bd17a0d14cd99d9dae749a2974395d"],
            [512,43969414117,14277358779,"f9f522488fa5f34c257e88051899b7660d402f670a872ff3382b2bd5db5cffc8"],
            [640,43980043678,14283177408,"ff7fb557850a68593ef1c6676ce9d6d04e6524cbebb3f0e91dee88fc4c5b4bcf"],
            [768,43988986347,14286299250,"e77af26461ca00087f5e07a495225f36674505a462716797d87ac3c6f17530f0"],
            [896,43991380179,14288730530,"1c9aba4e32f0ed38d75c3986d4946ce11bd7d0c71e6125e71deacbf6863c8c8d"],
            [1024,43999730753,14291129064,"18fad166856423bc8539965581cf9da264746fa24a78a68f0a187854ebef52f4"],
            [1152,44006976625,14294233102,"c3595b82cd09e94210d0f3af6a75d7234f968a2bd7984a82354d311af5b57001"],
            [1280,44017448959,14299157605,"0d3f20d72757da8a5b7bb97e4759379f438bc5d926b1bfaf993b3c246e5e4b3c"],
            [1408,44022783988,14301956335,"37dbb48cb32ce4af21447347732303b81248caa406d48668d56c93a2b084aaf8"],
            [1536,44031326990,14305297653,"ac17c7b660b78041596b584bc5d7f6f2fed79f7b08bb72ba712304977411bd08"],
            [1664,44036626739,14306973918,"7c74b3e27b445e433e71fcd0a61b203a6c29c69053381fb71f6f18c466ba57a8"],
            [1792,44044547320,14310234615,"de31532971c4baf601cd106b0450978b3dacedec40c21a0e26ee218e431df065"],
            [1920,44053424693,14315480458,"082ede598997efed8ec2a49b165663c42b27d402178549a20a303050d08f9a8b"],
            [2048,44060263139,14317009817,"e402ca847f31e82aab6cc16d1b885c7a74dee549b1949c306aa2cbbfb418295a"],
            [2176,44076781021,14324587518,"3ce764b6d837348d02009173513539772d71de569088832a2f768d09c22fb87e"]
          ]
          assert len(expected)==18
          with open("/tmp/mois_epoch6_all_signed_source.tsv","w") as f:
            for off,run_id,artifact_id,sha in expected:
              run=get(f"repos/{repo}/actions/runs/{run_id}")
              assert run["status"]=="completed" and run["conclusion"]==("failure" if off==896 else "success")
              artifacts={a["id"]:a for a in get(f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")["artifacts"]}
              assert artifact_id in artifacts and not artifacts[artifact_id]["expired"]
              assert artifacts[artifact_id]["digest"]=="sha256:"+sha
              f.write(f"{off} {artifact_id} {sha}\n")
          gb=get(f"repos/{repo}/actions/runs/44045912702")
          assert (gb["status"],gb["conclusion"])==("completed","success")
          ga={a["id"]:a for a in get(f"repos/{repo}/actions/runs/44045912702/artifacts?per_page=100")["artifacts"]}
          assert ga[14310764746]["digest"]=="sha256:3e73b0dc2d94f55812285f89f9f8248899841f92f66a0283aa197c1ef47807d3"
          print("EPOCH6_TERMINAL_AND_GBIF_COLXR_AND_EIGHTEEN_SOURCE_DIGESTS_PASS",flush=True)
          PY
      - name: Gate signed epoch7 offset0 before new source
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          repo="zuizui0223/mois"
          get=lambda p:json.loads(subprocess.check_output(["gh","api",p]))
          old=get(f"repos/{repo}/actions/runs/44084420377")
          assert (old["status"],old["conclusion"])==("completed","success")
          a={x["id"]:x for x in get(f"repos/{repo}/actions/runs/44084420377/artifacts?per_page=100")["artifacts"]}
          assert len(a)==1 and a[14329340951]["digest"]=="sha256:8eaee465a4d4b31c318a0abd26303cebcedaa23345fa32d57c16cbdd84ac28d2" and not a[14329340951]["expired"]
          jobs={j["name"]:j["conclusion"] for j in get(f"repos/{repo}/actions/runs/44084420377/jobs?per_page=100")["jobs"]}
          assert jobs["source-only-first128"]==jobs["independent-final-byte-audit"]=="success"
          assert all(jobs[x]=="skipped" for x in ("pixel-worker-only-if-novel-original","independent-strict9-audit","formal-append-after-audit"))
          print("PREVIOUS_EPOCH7_OFFSET0_TERMINAL_AND_SOURCE_SHA_PASS")
          PY
      - name: Independently compare eighteen actual ZIP bytes, receipt SHA and all 2199 exclusive taxon IDs
        run: |
          set -euo pipefail
          mkdir -p /tmp/mois_epoch6_zips
          while read -r off id sha; do
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" -o "/tmp/mois_epoch6_zips/$off.zip"
            echo "$sha  /tmp/mois_epoch6_zips/$off.zip" | sha256sum -c -
          done < /tmp/mois_epoch6_all_signed_source.tsv
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/artifacts/14329340951/zip" -o /tmp/mois_epoch6_zips/epoch7_0.zip
          echo "8eaee465a4d4b31c318a0abd26303cebcedaa23345fa32d57c16cbdd84ac28d2  /tmp/mois_epoch6_zips/epoch7_0.zip" | sha256sum -c -
          python - <<'PY'
          import csv,io,zipfile,json,hashlib
          h=lambda b:hashlib.sha256(b).hexdigest()
          seen=set()
          for off in [*range(0,2176,128),2176]:
            with zipfile.ZipFile(f"/tmp/mois_epoch6_zips/{off}.zip") as z:
              assert not any(".." in n.split("/") for n in z.namelist())
              r=json.loads(z.read("receipt.json"))
              for name,key in (("source_taxon_status.csv","source_status_SHA256"),("source_candidates.csv","source_candidates_SHA256")):
                assert h(z.read(name))==r[key],(off,name)
              if "manifest.json" in z.namelist():
                assert h(z.read("manifest.json"))==r["source_manifest_SHA256"]
                assert h(z.read("shards/shard-000.csv"))==r["source_shard_SHA256"]
              else:
                assert r["new_independent_original_photo_candidates"]==0
              n=23 if off==2176 else 128
              assert (r["hash_disjoint_taxon_offset"],r["searched_zero_numeric_taxa"],r["source_API_error_count"],r["old_original_photo_obs_ID_overlap"])==(off,n,0,0)
              assert r["old_all_image_raw_SHA_disjointness_proven"] is False
              rows=list(csv.DictReader(io.StringIO(z.read("source_taxon_status.csv").decode())))
              ids=[x["inat_taxon_id"] for x in rows]
              assert len(ids)==len(set(ids))==n and not seen.intersection(ids)
              assert all(x["status"]=="source_queried" for x in rows)
              seen.update(ids)
              if off==2176:
                assert h(z.read("receipt.json"))=="2ee2ef82f1708a996f905d441ae0c4339414e780a0ca33a981225fdd02fb7163"
                assert r["new_independent_original_photo_candidates"]==0 and r["old_original_photo_attempt_ID_count"]==1231352
          assert len(seen)==2199
          with zipfile.ZipFile("/tmp/mois_epoch6_zips/epoch7_0.zip") as z:
            r=json.loads(z.read("receipt.json"))
            assert (r["hash_disjoint_taxon_offset"],r["searched_zero_numeric_taxa"],r["new_independent_original_photo_candidates"],r["source_API_error_count"])==(0,128,0,0)
            assert r["old_original_photo_attempt_ID_count"]==1231352
            assert r["created_utc_lower_bound"]=="2026-11-17T11:47:06+00:00"
            assert h(z.read("source_taxon_status.csv"))==r["source_status_SHA256"]
            assert h(z.read("source_candidates.csv"))==r["source_candidates_SHA256"]
            assert r["old_all_image_raw_SHA_disjointness_proven"] is False
            prev=list(csv.DictReader(io.StringIO(z.read("source_taxon_status.csv").decode())))
            assert len(prev)==len({x["inat_taxon_id"] for x in prev})==128
            assert all(x["status"]=="source_queried" for x in prev)
          print("PREVIOUS_EPOCH7_OFFSET0_ACTUAL_ZIP_AND_RECEIPT_PASS",flush=True)
          print("EPOCH6_COMPLETE_2199_UNIQUE_TAXA_EIGHTEEN_ZIP_ACTUAL_BYTE_SHA256_PASS",flush=True)
          PY
      - name: Load signed 42111 atlas, full photo-ID and independent UUID history; audit numeric missingness
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p latest
          gh run download 44053424693 --repo "$REPO" --name mois-20261117-epoch6-offset1920-genuine-original-42111-taxonomy-append --dir latest
          mkdir -p old/history old/new11 old/new64 old/new18 old/offset1152 old/offset1536 old/offset1792 old/offset2048 old/epoch3_offset1792 old/epoch4_offset896 old/epoch4_offset1792 old/epoch4_offset2048 old/epoch5_offset896 old/epoch6_offset128 old/epoch6_offset640 old/epoch6_offset768 old/epoch6_offset1152 old/epoch6_offset1792 old/epoch6_offset1920
          gh run download 43546479575 --repo "$REPO" --name mois-postsnapshot-two-CC-photos-full-1231244-ID-source --dir old/history
          gh run download 43561529394 --repo "$REPO" --name mois-five-postsnapshot11-real-original-iNat-photo9-42111-taxa-append --dir old/new11
          gh run download 43562522326 --repo "$REPO" --name mois-new1909-fresh-original-real-ROI9-42111-taxonomy-appended --dir old/new64
          gh run download 43566369683 --repo "$REPO" --name mois-postsnap-remaining18-genuine-ROI9-cumulative-atlas --dir old/new18
          gh run download 43599310470 --repo "$REPO" --name mois-20261114-offset1152-independent-strict9-audit --dir old/offset1152
          gh run download 43608952945 --repo "$REPO" --name mois-20261114-offset1536-independent-strict9-audit --dir old/offset1536
          gh run download 43612554673 --repo "$REPO" --name mois-20261114-offset1792-independent-strict9-audit --dir old/offset1792
          gh run download 43669250173 --repo "$REPO" --name mois-20261115-epoch2-offset2048-independent-strict9-audit --dir old/offset2048
          gh run download 43702087793 --repo "$REPO" --name mois-20261115-epoch3-offset1792-independent-strict9-audit --dir old/epoch3_offset1792
          gh run download 43731496142 --repo "$REPO" --name mois-20261116-epoch4-offset896-independent-strict9-audit --dir old/epoch4_offset896
          gh run download 43748476569 --repo "$REPO" --name mois-20261116-epoch4-offset1792-independent-strict9-audit --dir old/epoch4_offset1792
          gh run download 43755422537 --repo "$REPO" --name mois-20261116-epoch4-offset2048-independent-strict9-audit --dir old/epoch4_offset2048
          gh run download 43814075592 --repo "$REPO" --name mois-20261116-epoch5-offset896-independent-strict9-audit --dir old/epoch5_offset896
          gh run download 43932884084 --repo "$REPO" --name mois-20261117-epoch6-offset128-independent-strict9-audit --dir old/epoch6_offset128
          gh run download 43980043678 --repo "$REPO" --name mois-20261117-epoch6-offset640-independent-strict9-audit --dir old/epoch6_offset640
          gh run download 43988986347 --repo "$REPO" --name mois-20261117-epoch6-offset768-independent-strict9-audit --dir old/epoch6_offset768
          gh run download 44006976625 --repo "$REPO" --name mois-20261117-epoch6-offset1152-independent-strict9-audit --dir old/epoch6_offset1152
          gh run download 44044547320 --repo "$REPO" --name mois-20261117-epoch6-offset1792-independent-strict9-audit --dir old/epoch6_offset1792
          gh run download 44053424693 --repo "$REPO" --name mois-20261117-epoch6-offset1920-independent-strict9-audit --dir old/epoch6_offset1920
          cp latest/mois_42111_post20261114_new_independent_original_photo9.csv.gz latest/atlas.csv.gz
          python - <<'PY'
          import numpy as np,pandas as pd,csv,io,zipfile
          from scripts.acquisition import mois_epoch7_after_epoch6_new_created_photo9_offset128 as c
          ids,uuids,raw=c.m.history()
          a=c.m.read_atlas("latest/atlas.csv.gz")
          cols=["observed_mean_"+s for s in c.m.PALETTE]
          vals=a.loc[a.after_strict9.gt(0),cols].to_numpy(float)
          missing=a.loc[a.after_strict9.eq(0),cols]
          assert len(a)==42111 and len(vals)==39914 and len(missing)==2197
          assert np.isfinite(vals).all() and (vals>=0).all()
          assert np.all(np.abs(vals.sum(axis=1)-1)<=.001)
          assert missing.isna().all().all()
          assert len(ids)==1231352 and len(raw)==108
          selected=c.select_taxa_epoch7(a,offset=128)
          with zipfile.ZipFile("/tmp/mois_epoch6_zips/epoch7_0.zip") as z:
            prev={x["inat_taxon_id"] for x in csv.DictReader(io.StringIO(z.read("source_taxon_status.csv").decode()))}
          assert len(prev)==128 and not prev.intersection(selected)
          assert len(selected)==len(set(selected))==128
          assert set(selected).issubset(set(a.loc[a.after_strict9.eq(0),"inat_taxon_id"]))
          d=pd.read_parquet("old/epoch6_offset1792/new_real_original_nine_photo9_delta.parquet")
          u=pd.read_parquet("old/epoch6_offset1920/new_real_original_nine_photo9_delta.parquet")
          assert len(d)==len(u)==1 and bool(d.iloc[0].strict9) and not bool(u.iloc[0].strict9)
          assert str(u.iloc[0].photo_id)=="764311044" and str(d.iloc[0].photo_id)=="764438797"
          assert u.loc[~u.strict9,["strict9_"+s for s in c.m.PALETTE]].isna().all().all()
          print("EPOCH7_1231352_FULL_PHOTO_ID_UUID_108_RECENT_RAW_SHA_42111_PALETTE_PASS",flush=True)
          PY
      - name: Search *new temporal interval* iNat observations; never mark source-only as measured
        id: freeze
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_epoch7_after_epoch6_new_created_photo9_offset128 source --atlas latest/atlas.csv.gz --output newest --offset 128
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,csv
          r=json.load(open("newest/receipt.json"))
          assert (r["hash_disjoint_taxon_offset"],r["searched_zero_numeric_taxa"],r["source_API_error_count"],r["old_original_photo_attempt_ID_count"],r["old_original_photo_obs_ID_overlap"])==(128,128,0,1231352,0)
          assert r["created_utc_lower_bound"]=="2026-11-17T11:47:06+00:00"
          assert r["old_all_image_raw_SHA_disjointness_proven"] is False
          st=list(csv.DictReader(open("newest/source_taxon_status.csv")))
          assert len(st)==len({x["inat_taxon_id"] for x in st})==128
          assert all(x["status"]=="source_queried" for x in st)
          print("has_new="+str(r["new_independent_original_photo_candidates"]>0).lower())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-20261117-epoch7-offset128-signed-1231352-ID-source
          path: newest/
          retention-days: 90
          if-no-files-found: error

  pixel-worker-only-if-novel-original:
    needs: source-only-first128
    if: needs.source-only-first128.outputs.has_new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-20261117-epoch7-offset128-signed-1231352-ID-source
          path: signed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned genuine FCP YOLO11/EfficientSAM RGB ROI-v4
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Download provider actual RGB and assess strict nine numerical ROI
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-epoch7-offset128-original-only"
          python -m scripts.acquisition.mois_full_index_real_original_photo_measure work --source signed --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" --group 0 --output pixel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-20261117-epoch7-offset128-genuine-FCP-ROI9-terminal
          path: pixel/
          retention-days: 90
          if-no-files-found: warn

  independent-strict9-audit:
    needs: [source-only-first128, pixel-worker-only-if-novel-original]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read signed source/worker and independent full-history photo/UUID ledger
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p signed pixel
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261117-epoch7-offset128-signed-1231352-ID-source --dir signed
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261117-epoch7-offset128-genuine-FCP-ROI9-terminal --dir pixel
          mkdir -p old/history old/new11 old/new64 old/new18 old/offset1152 old/offset1536 old/offset1792 old/offset2048 old/epoch3_offset1792 old/epoch4_offset896 old/epoch4_offset1792 old/epoch4_offset2048 old/epoch5_offset896 old/epoch6_offset128 old/epoch6_offset640 old/epoch6_offset768 old/epoch6_offset1152 old/epoch6_offset1792 old/epoch6_offset1920
          gh run download 43546479575 --repo "$REPO" --name mois-postsnapshot-two-CC-photos-full-1231244-ID-source --dir old/history
          gh run download 43561529394 --repo "$REPO" --name mois-five-postsnapshot11-real-original-iNat-photo9-42111-taxa-append --dir old/new11
          gh run download 43562522326 --repo "$REPO" --name mois-new1909-fresh-original-real-ROI9-42111-taxonomy-appended --dir old/new64
          gh run download 43566369683 --repo "$REPO" --name mois-postsnap-remaining18-genuine-ROI9-cumulative-atlas --dir old/new18
          gh run download 43599310470 --repo "$REPO" --name mois-20261114-offset1152-independent-strict9-audit --dir old/offset1152
          gh run download 43608952945 --repo "$REPO" --name mois-20261114-offset1536-independent-strict9-audit --dir old/offset1536
          gh run download 43612554673 --repo "$REPO" --name mois-20261114-offset1792-independent-strict9-audit --dir old/offset1792
          gh run download 43669250173 --repo "$REPO" --name mois-20261115-epoch2-offset2048-independent-strict9-audit --dir old/offset2048
          gh run download 43702087793 --repo "$REPO" --name mois-20261115-epoch3-offset1792-independent-strict9-audit --dir old/epoch3_offset1792
          gh run download 43731496142 --repo "$REPO" --name mois-20261116-epoch4-offset896-independent-strict9-audit --dir old/epoch4_offset896
          gh run download 43748476569 --repo "$REPO" --name mois-20261116-epoch4-offset1792-independent-strict9-audit --dir old/epoch4_offset1792
