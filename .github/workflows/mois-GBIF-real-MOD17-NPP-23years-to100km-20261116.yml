name: MOIS genuine MOD17 NPP 23 annual years to all GBIF 100km cells
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-GBIF-real-MOD17-NPP-23years-to100km-20261116.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-GBIF-true-MOD17A3HGF-v061-2001-2023-NPP-100km-20261116
  cancel-in-progress: false

jobs:
  original-source-NPP-GBIF-grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned NetCDF, Python and geospatial dependencies
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 \
            netCDF4==1.7.2 pyproj==3.7.1 scipy==1.15.2
          python -m py_compile scripts/analysis/mois_gbif_mod17_npp_annual_100km_20261116.py
          python -m unittest discover -s tests -p 'test_mois_gbif_mod17_npp_annual_100km_20261116.py' -v
      - name: Restore SHA-signed true GBIF accepted 37104 species global 100km cells
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --location --silent --show-error --retry 4 --retry-delay 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/14225733755/zip" \
            --output source/GBIF_LGM18577.zip
          echo 'db3b5b4fa2133194963be9233411bb6bb50bc86393d1dc50d996cc4cc78b25ab  source/GBIF_LGM18577.zip' | sha256sum -c -
      - name: Restore DOI-pinned open annual MOD17A3HGF C061 yearly NPP 2001-2023
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 5 --retry-delay 7 \
            --connect-timeout 30 --max-time 900 \
            "https://www.fdr.uni-hamburg.de/record/14635/files/MODIS-C061_MOD17A3HGF__NPP_GPP__Yearly__LPDAAC__GLOBAL_0.5degree__UHAM-ICDC__2001-2023__fv0.01.nc.zip?download=1" \
            -o source/MOD17_NPP_23years.zip
          echo 'be8e74e5cf3e4785c94a2799655efef903e3f0c5908af04f6fd114d28dab6c58  source/MOD17_NPP_23years.zip' | sha256sum -c -
      - name: Extract 23 complete years of genuine NPP and QC on 18577 original GBIF grid cells
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_gbif_mod17_npp_annual_100km_20261116 \
            --lgm source/GBIF_LGM18577.zip \
            --npp source/MOD17_NPP_23years.zip \
            --output MOIS_MOD17_2001_2023_true
          python - <<'PY'
          import json,pyarrow.parquet as pq
          from pathlib import Path
          r=json.loads(Path('MOIS_MOD17_2001_2023_true/receipt.json').read_text())
          assert r['counts']['source_accepted_GBIF_species']==37104
          assert r['counts']['source_GBIF_species_cell_pairs']==5493931
          assert r['counts']['source_100km_unique_cells']==18577
          assert r['counts']['source_years']==23
          assert r['counts']['cell_years_output']==18577*23
          assert r['counts']['cells_with_18plus_valid_annual_NPP']>9000
          assert r['no_photo_hue_in_NPP_measurement']
          c=pq.read_table('MOIS_MOD17_2001_2023_true/MOD17_C061_NPP_2001_2023_18577_true_GBIF100km_cells.parquet').to_pandas()
          assert len(c)==18577 and c[['grid_x','grid_y']].drop_duplicates().shape[0]==18577
          print('MOIS_AUTHENTIC_23YEAR_NPP_GBIF_CELL_JOIN_VERIFIED',
                json.dumps(r['counts'],sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-true-GBIF18577-cells-MOD17-C061-NPP-23annual-2001-2023
          path: MOIS_MOD17_2001_2023_true/
          retention-days: 90
          if-no-files-found: warn
