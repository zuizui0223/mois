name: "MOIS Ecology: nonwhite eight-hue assembly with white geography fixed"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - scripts/analysis/mois_nonwhite8_assembly_white_fixed_null_20261118.py
      - .github/workflows/mois-chromatic8-assembly-whitefixed-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-global-white-fixed-chromatic8-ecological-null-20261118
  cancel-in-progress: false
jobs:
  eight-colour-after-white-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original source Parquet reader and numeric tools
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "pyarrow>=17,<25"
      - name: Fetch signed global 37k accepted species × 5.49M grids and existing strict null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source
          for spec in \
            '14166701658 GBIF 422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2' \
            '14219399376 ENV d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc' \
            '14397106083 NINE 596166fa2fe8bfb28653c325a3a8f1a1495c0792688a7fdb781014cfedaa88c7'; do
            set -- $spec
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" \
              --output "source/$2.zip"
            echo "$3  source/$2.zip" | sha256sum -c
          done
      - name: Test global nonwhite 8 colours with 199 conditioned permutations that preserve white species exactly
        run: |
          python -m scripts.analysis.mois_nonwhite8_assembly_white_fixed_null_20261118 \
            --GBIF source/GBIF.zip \
            --ENV source/ENV.zip \
            --NINE source/NINE.zip \
            --out results/mois_nonwhite_8hue_genus_breadth_null_20261118
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-global-nonwhite8-assembly-genus-breadth-whitefixed-20261118
          path: results/mois_nonwhite_8hue_genus_breadth_null_20261118/
          retention-days: 30
          if-no-files-found: error
