name: MOIS epoch6 offset896 existing source ZIP independent read-only terminal byte audit
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-20261117-epoch6-offset896-readonly-terminal-source-byte-audit.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-epoch6-offset896-original-signed-source-readonly-audit
  cancel-in-progress: false
jobs:
  independent-existing-artifact-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze finished search run and exact signed source artifact; do not repeat photo/API operations
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          repo="zuizui0223/mois";rid=43991380179
          get=lambda p:json.loads(subprocess.check_output(["gh","api",p]))
          r=get(f"repos/{repo}/actions/runs/{rid}")
          assert (r["status"],r["conclusion"])==("completed","failure")
          jobs={x["name"]:x["conclusion"] for x in get(f"repos/{repo}/actions/runs/{rid}/jobs?per_page=100")["jobs"]}
          assert jobs=={"source-only-first128":"success","pixel-worker-only-if-novel-original":"skipped","independent-strict9-audit":"skipped","formal-append-after-audit":"skipped","independent-final-byte-audit":"failure"}
          a=get(f"repos/{repo}/actions/runs/{rid}/artifacts?per_page=100")["artifacts"]
          assert len(a)==1 and a[0]["id"]==14288730530 and a[0]["name"]=="mois-20261117-epoch6-offset896-signed-1231349-ID-source"
          assert a[0]["digest"]=="sha256:1c9aba4e32f0ed38d75c3986d4946ce11bd7d0c71e6125e71deacbf6863c8c8d" and not a[0]["expired"]
          # The final audit failed on a stale expected offset=768 hardcode, not on source search.
          expected=[
            (0,43931289660,14258616417,"b119ef2b645ae6ff52340f728e6957fea25cced915caf9b2fcd4b858c080299c"),
            (128,43932884084,14259857099,"b0f0b1b1b113c7a58dbcf4fa879d44dba117e542219d5197076b508eef1612ec"),
            (256,43953442756,14271765487,"0b694af6857f4411760ab1782cd732f68dac99d2d95c4b1bbaaba053805e5b4b"),
            (384,43962573359,14273534566,"5ef3a3d2079183f3faabc1924d748c78d6bd17a0d14cd99d9dae749a2974395d"),
            (512,43969414117,14277358779,"f9f522488fa5f34c257e88051899b7660d402f670a872ff3382b2bd5db5cffc8"),
            (640,43980043678,14283177408,"ff7fb557850a68593ef1c6676ce9d6d04e6524cbebb3f0e91dee88fc4c5b4bcf"),
            (768,43988986347,14286299250,"e77af26461ca00087f5e07a495225f36674505a462716797d87ac3c6f17530f0"),
            (896,43991380179,14288730530,"1c9aba4e32f0ed38d75c3986d4946ce11bd7d0c71e6125e71deacbf6863c8c8d")]
          assert len(expected)==8
          for off,rid,aid,sha in expected:
            r=get(f"repos/{repo}/actions/runs/{rid}")
            assert r["status"]=="completed"
            assert r["conclusion"]==("failure" if off==896 else "success")
            art={x["id"]:x for x in get(f"repos/{repo}/actions/runs/{rid}/artifacts?per_page=100")["artifacts"]}
            assert aid in art and art[aid]["digest"]=="sha256:"+sha and not art[aid]["expired"]
          with open("/tmp/expected.tsv","w") as f:
            for off,rid,aid,sha in expected:f.write(f"{off} {aid} {sha}\n")
          print("SOURCE_ONLY_FINISHED_NO_PIXEL_NO_APPEND_NO_RERUN",flush=True)
          PY
      - name: Verify byte SHA256 of eight signed source ZIPs and independent 1024 distinct taxa
        run: |
          set -euo pipefail
          mkdir -p /tmp/epoch6
          while read -r off id digest; do
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" -o "/tmp/epoch6/$off.zip"
            echo "$digest  /tmp/epoch6/$off.zip" | sha256sum -c -
            echo "INDEPENDENT_SIGNED_SOURCE_ZIP_BYTES $off $id $digest"
          done < /tmp/expected.tsv
          python - <<'PY'
          import zipfile,json,csv,io,hashlib
          h=lambda b:hashlib.sha256(b).hexdigest()
          seen=set()
          for off in range(0,1024,128):
            with zipfile.ZipFile(f"/tmp/epoch6/{off}.zip") as z:
              assert all(".." not in n.split("/") for n in z.namelist())
              rec=z.read("receipt.json");r=json.loads(rec)
              statuses=z.read("source_taxon_status.csv")
              candidate=z.read("source_candidates.csv")
              assert h(statuses)==r["source_status_SHA256"] and h(candidate)==r["source_candidates_SHA256"]
              assert (r["hash_disjoint_taxon_offset"],r["searched_zero_numeric_taxa"],r["source_API_error_count"],r["old_original_photo_obs_ID_overlap"])==(off,128,0,0)
              assert r["old_all_image_raw_SHA_disjointness_proven"] is False
              ids=[x["inat_taxon_id"] for x in csv.DictReader(io.StringIO(statuses.decode()))]
              assert len(ids)==len(set(ids))==128 and all(x["status"]=="source_queried" for x in csv.DictReader(io.StringIO(statuses.decode())))
              assert not set(ids).intersection(seen)
              seen.update(ids)
              if off==896:
                assert h(rec) and r["old_original_photo_attempt_ID_count"]==1231349
                assert r["new_independent_original_photo_candidates"]==0
                assert r["frozen_original_zero_numeric_taxon_frame"]==2199
                assert r["currently_zero_numeric_taxa"]==2198
                assert r["recent_known_original_image_raw_SHA_count"]==105
                assert r["new_numeric_taxon_removed_from_sampling_only"]=="1249987"
                assert h(candidate)=="01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b"
                print("OFFSET896_RECEIPT_BYTE_SHA256",h(rec))
                print("OFFSET896_STATUS_BYTE_SHA256",h(statuses))
                print("OFFSET896_EMPTY_CANDIDATE_BYTE_SHA256",h(candidate))
          assert len(seen)==1024
          print("EPOCH6_1024_HASH_DISJOINT_TAXA_SIGNED_SOURCE_BYTE_SUCCESS",flush=True)
          PY
      - name: Independently verify frozen atlas nine finite fractions and technical unknown missingness
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          mkdir -p /tmp/formal
          gh run download 43988986347 --repo "$REPO" --name mois-20261117-epoch6-offset768-genuine-original-42111-taxonomy-append --dir /tmp/formal
          python - <<'PY'
          import pandas as pd,numpy as np,hashlib
          from scripts.acquisition import mois_20261115_created_epoch2_disjoint_original_photo9_after2048 as m
          path="/tmp/formal/mois_42111_post20261114_new_independent_original_photo9.csv.gz"
          h=hashlib.sha256(open(path,"rb").read()).hexdigest()
          assert h=="124672d2073f490ceb26bd7132b234912221f278a7528c4063273743db03f9b4"
          a=pd.read_csv(path,compression="gzip",dtype={"inat_taxon_id":str})
          assert len(a)==42111 and a.inat_taxon_id.is_unique
          yes=a.after_strict9.gt(0);no=~yes
          assert (yes.sum(),no.sum())==(39913,2198)
          cols=["observed_mean_"+s for s in m.PALETTE]
          values=a.loc[yes,cols].to_numpy(float)
          assert np.isfinite(values).all() and (values>=0).all()
          assert np.all(np.abs(values.sum(axis=1)-1)<=.001)
          assert a.loc[no,cols].isna().all().all()
          assert a.loc[a.inat_taxon_id.eq("1249987"),"after_strict9"].iloc[0]==1
          print("FORMAL_42111_NUMERIC_39913_MISSING_2198_NINE_COLOUR_VALID_NO_RAW123M_CLAIM",flush=True)
          PY
