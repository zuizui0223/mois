name: "MOIS Ecology: global nine-colour community assembly genus-preserving null"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - scripts/analysis/mois_global_hue9_community_assembly_genus_null_20261118.py
      - .github/workflows/mois-global-9hue-community-assembly-genus-null-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-global-hue-assembly-genus-null-20261118
  cancel-in-progress: false
jobs:
  global-species-pool-assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reproducible 37104-species GBIF Parquet tools
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "pyarrow>=17,<25"
      - name: Synthetic species-hue permutation and cell-richness invariant smoke test
        run: |
          python scripts/analysis/mois_global_hue9_community_assembly_genus_null_20261118.py --selftest
      - name: Download exact original global accepted-species GBIF cell and nine-hue archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14166701658/zip" \
            --output source/GBIF_37104_species_5493931_grid_pairs.zip
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14219399376/zip" \
            --output source/ENV_37104_species_photo9.zip
          echo "422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2  source/GBIF_37104_species_5493931_grid_pairs.zip" | sha256sum -c
          echo "d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc  source/ENV_37104_species_photo9.zip" | sha256sum -c
      - name: Genuine 37k species 5.49M 100km-cell nine-colour community assembly with genus conditioned null
        run: |
          python scripts/analysis/mois_global_hue9_community_assembly_genus_null_20261118.py \
            --gbif source/GBIF_37104_species_5493931_grid_pairs.zip \
            --env source/ENV_37104_species_photo9.zip \
            --permutations 199 \
            --out results/mois_global_9hue_community_assembly_20261118
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-global-nine-hue-community-assembly-genus-conditional-null-20261118
          path: results/mois_global_9hue_community_assembly_20261118/
          retention-days: 30
          if-no-files-found: error
