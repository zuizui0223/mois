name: MOIS 400 original seasonal photos vs live iNaturalist flowering/fruiting annotations

# The genuine live public API can change and must not be fetched on every
# manuscript push or PR evaluation. The successful frozen 2026-10-17 result
# is preserved in an archived source artifact and audited by offline CI.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-20260927-original-400-photos-current-public-phenology-availability
  cancel-in-progress: false

jobs:
  read-only-current-observation-tags-not-anthesis-or-white:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: "38929402279"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test source-only original photo IDs, observations, missing annotations and code 21
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest==8.4.2 requests
          python -m pytest -q \
            tests/test_mois_live_inat_phenology_2025.py \
            tests/test_mois_audit_400_live_observation_phenology.py

      - name: Verify original 2026-09-27 photo selection without opening pixels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original_400
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > original_400/locked_400_original_photo_selection_run.json
          python - <<'PY'
          import json
          p=json.load(open("original_400/locked_400_original_photo_selection_run.json"))
          assert p['id']==38929402279
          assert p['status']=='completed' and p['conclusion']=='success'
          assert p['run_attempt']==1
          assert p['head_sha']=='adfd0a6edfc3438080ade2a3d9e76587d7322898'
          assert p['head_repository']['full_name']=='zuizui0223/mois'
          print('MOIS_ORIGINAL_400_PRECOLOUR_SOURCE_UUID_OBSERVER_SET_RECONCILED')
          PY
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name mois-5taxa-400-original-photo-ID-disjoint-season-wave-UNREVIEWED \
            --dir original_400

      - name: Audit present public 400 observation UUIDs for ancillary live flowering/fruiting labels
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_audit_400_live_observation_phenology \
            --original-400-photo-manifest original_400/new_mois_photo_wave/first_five_taxa_temporal_colour_blind_original_photo_manifest.csv \
            --original-400-source-receipt original_400/new_mois_photo_wave/mois_observer_disjoint_source_photo_selection_receipt.json \
            --outdir current_public_400_plant_phenology_qc

      - name: Check authentic original 400 intact; no photograph bloom/white claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          out=Path("current_public_400_plant_phenology_qc")
          d=json.loads((out/"mois_400_original_phenology_live_observation_ancillary_receipt.json").read_text())
          assert d["status"]=="CURRENT_PUBLIC_OBSERVATION_PHENOLOGY_EFFORT_ONLY_NOT_BOTANICAL_OPEN_FLOWERS"
          assert d["source_20260927_original_400_SHA256"]=="b961b50ee6efe9ec08a5575a8eb1e34b1edf7b7fcb426226fb11ee901cfd3329"
          assert d["n_original_outcome_blind_selected_photo_opportunities"]==400
          assert d["n_original_independent_observations"]==400
          assert d["n_original_source_independent_photographers"]==400
          assert d["n_source_taxon_siteyear_seasons"]==10
          assert d["source_original_photo_ids_never_replaced_or_filtered"] is True
          assert d["observation_level_annotation_does_not_confirm_open_petal_in_original_photo"] is True
          assert d["missing_live_annotation_is_unknown_not_nonflowering"] is True
          assert d["n_independently_botanically_verified_open_photo_petals"]==0
          assert d["no_colour_ROI_photo_measurements_from_these_400"] is True
          assert d["no_new_white_flower_frequency_or_weather_effect_estimated"] is True
          file=out/"current_live_iNaturalist_400_photo_original_observation_phenology_NOT_PHOTO.csv"
          with file.open(newline="") as h: photos=list(csv.DictReader(h))
          assert len(photos)==400 and len({p["original_source_photo_id"] for p in photos})==400
          assert all(p["original_picture_OPEN_petal_tepal_independently_reviewed"]=="False" for p in photos)
          summary=out/"current_live_iNaturalist_400_taxon_siteyear_season_phenology_availability.csv"
          with summary.open(newline="") as h: groups=list(csv.DictReader(h))
          assert len(groups)==10
          assert all(int(g["original_photo_observation_opportunities"])==40 for g in groups)
          for path,key in ((file,"source_400_original_photo_current_observation_annotations_sha256"),
                            (summary,"taxon_season_phenology_availability_sha256")):
              assert hashlib.sha256(path.read_bytes()).hexdigest()==d[key]
          print("MOIS_TRUE_SOURCE400_OBSERVATION_ONLY_PHENOLOGY_BY_FIVE_TAXA_TEN_SEASONS",json.dumps({
            "live_v2_uuids":d["n_live_current_v2_uuid_ids_resolved"],
            "live_v1":d["n_live_current_v1_full_annotation_records"],
            "unchanged_live_photos_dates":d["n_live_original_observed_on_and_photo_id_both_match"],
            "seasonal_labels":d["current_observation_status_by_source_local_season"],
          },sort_keys=True),flush=True)
          PY

      - name: Preserve only current public original-observation annotation QC; no extra photographic pixels
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: mois-400-original-source-live-observation-phenology-coverage-NOT-PHOTO-BLOOM
          retention-days: 90
          if-no-files-found: error
          path: |
            current_public_400_plant_phenology_qc/
            original_400/locked_400_original_photo_selection_run.json

      - name: Preserve source provenance only on incomplete public API
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mois-400-original-source-current-observation-annotation-INCOMPLETE-NOT-BIOLOGY
          retention-days: 20
          if-no-files-found: warn
          path: original_400/locked_400_original_photo_selection_run.json
