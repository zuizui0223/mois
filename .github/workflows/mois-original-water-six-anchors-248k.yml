name: MOIS original 100543-photo SIX-ANCHOR global moisture 999 genus bootstrap on 248k

on:
  pull_request:
    paths:
      - "scripts/analysis/mois_refit_original_100k_water_six_anchors_248k.py"
      - "tests/test_mois_refit_original_moisture_six_anchors.py"
      - ".github/workflows/mois-original-water-six-anchors-248k.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  historical-photo-macro-moisture-method-on-expanded-real-hues:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test original GEB six environmental anchors and shared genus bootstrap contracts
        run: |
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 rasterio==1.4.3 pytest==8.4.2
          python -m pytest -q tests/test_mois_refit_original_moisture_six_anchors.py
      - name: Restore 248312 real photo colour/site coordinates and signed climate normals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 248k_original
          gh run download 38992341847 --repo zuizui0223/mois \
            --name mois-248312-REAL-site-worldclim19-bio-elev2p5m-terrain-monthnormal \
            --dir 248k_original
          test -s 248k_original/mois_248312_original_photo_worldclim_static_monthly_normal_terrain.csv.gz
      - name: Obtain genuine global WorldClim 2.1 vapour-pressure 12 climatology rasters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official_vapr
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 \
            --connect-timeout 25 --max-time 500 \
            https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_vapr.zip \
            -o official_vapr/wc2.1_10m_vapr.zip
          unzip -q official_vapr/wc2.1_10m_vapr.zip -d official_vapr
          test "$(find official_vapr -name 'wc2.1_10m_vapr_??.tif' | wc -l)" -eq 12
          sha256sum official_vapr/wc2.1_10m_vapr.zip
      - name: Estimate new 248k and historical-only white precipitation/vapour slopes with unchanged six-anchor 999 genus bootstrap and maxT family
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_refit_original_100k_water_six_anchors_248k \
            --real-248k-site-worldclim 248k_original/mois_248312_original_photo_worldclim_static_monthly_normal_terrain.csv.gz \
            --site-worldclim-receipt 248k_original/mois_248312_worldclim_static_month_normal_receipt.json \
            --original-vapr-monthly-raster-dir official_vapr \
            --original-vapr-zip official_vapr/wc2.1_10m_vapr.zip \
            --output actual_mois_orig_water_maxT999
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('actual_mois_orig_water_maxT999/mois_248312_same_original_water_maxT999_genus_decision.json').read_text())
          assert d['status']=='REESTIMATED_SIX_ORIGINAL_ANCHORS_WITH_REAL_EXPANDED_248312_PHOTO_COLOURS'
          assert d['source_original_photos']==248312
          assert d['photo_source_four_hue_classified']==120807
          assert d['original_genus_cluster_bootstrap_draws']==999
          assert d['original_bootstrap_maxT_family_size']==24
          assert d['source_existing248312_worldclim_sha256']
          assert d['original_existing_MOIS_results_NOT_overwritten']
          assert d['FCP_within_species_polymorphism_D_W_50km_not_computed']
          e=d['primary_white_water_outcomes']['expanded248312_original_photo_union']
          assert e['genus_equal__wc_bio12']['anchor']=='wc_bio12'
          assert e['genus_equal__wc_vapr_annual_mean']['anchor']=='wc_vapr_annual_mean'
          print('MOIS_REAL_ORIGINAL_100543_GEB_SIX_ANCHOR_WATER_WITH_248312_PHOTOS_FAMILYWISE_QC_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-248312-original-100k-moisture-6anchor-999genus-bootstrap-maxT24
          path: actual_mois_orig_water_maxT999/
          retention-days: 90
          if-no-files-found: error
