name: "MOIS Ecology: independent same-study shared-genus FDR audit of positive DoPI visitor guild colours"
on:
  push:
    branches:
      - analysis/mois-gift-independent-pollination-mode-20261118
    paths:
      - scripts/analysis/mois_dopi_positive_visitor_study_genus_FDR_audit_20261118.py
      - .github/workflows/mois-dopi-same-study-shared-genus-fdr-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-signed-positive-visitor-FDR:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical FDR verification packages
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "scipy>=1.11,<2"
          python -m py_compile \
            scripts/analysis/mois_dopi_positive_visitor_study_genus_FDR_audit_20261118.py
      - name: Restore exact source evidence not raw 385MB DoPI dataset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p source
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14412072463/zip" \
            -o source/source_DoPI_v2_positive_676900_signed.zip
          echo "bf7dd9b41e8b71813a430f0a917ddfc949ed12156dfe833c91862c13f6dc7595  source/source_DoPI_v2_positive_676900_signed.zip" | sha256sum -c
      - name: Validate exact same-publication shared genus and zero supported pollen-only patterns
        run: |
          python scripts/analysis/mois_dopi_positive_visitor_study_genus_FDR_audit_20261118.py \
            --source source/source_DoPI_v2_positive_676900_signed.zip \
            --out results/mois_DoPI_guild_colour_sharedgenus_FDR_20261118
      - name: Upload only anonymous numerical source-control BH comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-original-DoPI-v2-study-sharedgenus-photo9-FDR-audit-20261118
          path: results/mois_DoPI_guild_colour_sharedgenus_FDR_20261118/
          retention-days: 30
          if-no-files-found: error
