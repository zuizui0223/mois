name: "MOIS ecology: regional species-pool constrained global nine-hue aggregation null"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - scripts/analysis/mois_global_hue9_regional_pool_conditional_null_20261121.py
      - .github/workflows/mois-global-hue9-species-georegion-conditioned-null-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-global-hue9-genus-breadth-georegion-null-20261121
  cancel-in-progress: false
jobs:
  actual-whole-global-species-hue-null:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numeric / projection / genuine parquet dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
             'numpy==2.1.3' 'pandas==2.2.3' 'pyarrow==19.0.1' 'pyproj==3.7.1'
          python -m py_compile scripts/analysis/mois_global_hue9_regional_pool_conditional_null_20261121.py
      - name: Download and SHA-verify unchanged global accepted 37,104 species/GBIF 5,493,931 pairs
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14166701658/zip" \
            -o source/GBIF_37104_species_5493931_grid_pairs.zip
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14219399376/zip" \
            -o source/ENV_37104_species_photo9.zip
          echo '422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2  source/GBIF_37104_species_5493931_grid_pairs.zip' | sha256sum -c
          echo 'd8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc  source/ENV_37104_species_photo9.zip' | sha256sum -c
      - name: Reproduce published strict genus×occupancy null then compare hemisphere and six-region matched species pools
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_global_hue9_regional_pool_conditional_null_20261121 \
            --gbif source/GBIF_37104_species_5493931_grid_pairs.zip \
            --env source/ENV_37104_species_photo9.zip \
            --permutations 199 \
            --out results/mois_species_affinity_georegion_null_20261121
      - name: Preserve all six-region cell residuals, model-permutation statistics and original input SHA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mois-global-genus-breadth-six-regions-with-matched-mobility-hue9-null-20261121
          path: results/mois_species_affinity_georegion_null_20261121/
          retention-days: 60
          if-no-files-found: warn