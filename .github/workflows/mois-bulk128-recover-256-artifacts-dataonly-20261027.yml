name: MOIS bulk128 recover 256 saved photo-result artifacts DATA ONLY
on:
  push:
    branches: [feat/mois-bulk128-131072-20261026]
    paths:
      - .github/workflows/mois-bulk128-recover-256-artifacts-dataonly-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-bulk128-256-saved-artifact-dataonly-recovery-v1
  cancel-in-progress: false
jobs:
  recover-roi9:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: \${{ github.token }}
      REPO: zuizui0223/mois
      ORIGINAL_RUN: '40340338433'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data libraries ONLY; never install or call photo inference models
        run: python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
      - name: Snapshot all 128 SHA metadata entries; fail closed on missing or duplicate artifact
        run: |
          set -euo pipefail
          mkdir -p snapshot
          gh api --paginate "repos/$REPO/actions/runs/$ORIGINAL_RUN/artifacts?per_page=100" \
            --jq '.artifacts[] | [.name,.digest,(.size_in_bytes|tostring),(.expired|tostring)] | @tsv' > snapshot/roi_artifacts.tsv
          python - <<'PY'
          from pathlib import Path
          lines=Path('snapshot/roi_artifacts.tsv').read_text().splitlines()
          ids=set();digests=set()
          prefix='mois-bulk128-real-originalROI9-part-'
          for line in lines:
              name,digest,size,expired=line.split('\t')
              assert name.startswith(prefix),name
              part=int(name[len(prefix):])
              assert 0<=part<128 and part not in ids
              assert digest.startswith('sha256:') and len(digest)==71 and digest not in digests
              assert int(size)>1000 and expired=='false'
              ids.add(part);digests.add(digest)
          assert ids==set(range(128)),sorted(set(range(128))-ids)
          assert len(lines)==128
          print('ROI128_GITHUB_ARTIFACT_DIGEST_META_COMPLETE',len(lines),flush=True)
          PY
      - name: Restore numeric ROI outcomes, NOT provider images, from original run
        run: |
          set -euo pipefail
          gh run download "$ORIGINAL_RUN" --repo "$REPO" \
            --pattern 'mois-bulk128-real-originalROI9-part-*' --dir workers
          python - <<'PY'
          from pathlib import Path
          for part in range(128):
              d=Path('workers')/f'mois-bulk128-real-originalROI9-part-{part}'
              assert d.is_dir(),str(d)
              for unit in range(part*4,part*4+4):
                  assert (d/f'shard_{unit:03d}'/'receipt.json').is_file(),unit
          print('ROI128_ALL_512_SAVED_TERMINAL_RECEIPTS_PRESENT_NO_REINFERENCE',flush=True)
          PY
      - name: Restore frozen SHA-verified source photo/observation roster, not RGB photos
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download mois-full93m-bulk128-tier10-131072-original-photo-source-v1 \
            --repo "$REPO" --dir source \
            --pattern manifest.json \
            --pattern bulk128_source_photo_shards.tar.gz \
            --pattern bulk128_source_photo_shards.sha256
          echo '7e975e701281ba812451acd48be7e91a7d17f2bbe6f9f53ad15ef4f8db9e557e  source/manifest.json' | sha256sum -c -
          (cd source && sha256sum -c bulk128_source_photo_shards.sha256)
          tar -xzf source/bulk128_source_photo_shards.tar.gz -C source
      - name: Audit all original ROI9 terminals, real strict9, unknowns and region/season
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_bulk128_collect_original_roi9 \
            --source source --workers workers --output roi_verified
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('roi_verified/bulk128_actual_original_photo_ROI9_receipt.json').read_text())
          assert d['attempted_new_original_photos']==131072
          assert d['distinct_original_observations']==131072
          assert d['number_completed_original_photo_model_units']==512
          assert d['reference_photo_attempts']==32768
          assert d['gap_targeted_photo_attempts']==98304
          assert d['targeted_previous_P5_source_taxa']==0
          assert d['original_photos_downloaded_OR_colour_inferred_in_THIS_collector']==0
          print('MOIS_ROI128_DATA_ONLY_VERIFIED',json.dumps({k:d[k] for k in (
            'attempted_new_original_photos','new_strict_original_nine_palette_ROIs',
            'new_original_four_hue_classifications','new_original_images_acquisition_failed',
            'newly_covered_source_taxa_with_previous_zero_strict9')},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-bulk128-roi9-128part-DATAONLY-source-verified
          path: |
            roi_verified/
            snapshot/roi_artifacts.tsv
          retention-days: 90
          if-no-files-found: error

  recover-500px:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: \${{ github.token }}
      REPO: zuizui0223/mois
      ORIGINAL_RUN: '40341341397'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data libraries ONLY, no photo download or YOLO execution
        run: python -m pip install -q numpy==2.1.3 pandas==2.2.3 Pillow==11.3.0 scikit-image==0.25.2
      - name: Verify and snapshot 128 unique SHA-digested worker artifacts
        run: |
          set -euo pipefail
          mkdir -p snapshot
          gh api --paginate "repos/$REPO/actions/runs/$ORIGINAL_RUN/artifacts?per_page=100" \
            --jq '.artifacts[] | [.name,.digest,(.size_in_bytes|tostring),(.expired|tostring)] | @tsv' > snapshot/medium_artifacts.tsv
          python - <<'PY'
          from pathlib import Path
          lines=Path('snapshot/medium_artifacts.tsv').read_text().splitlines()
          ids=set();digests=set()
          prefix='mois-bulk128-med500-part-'
          for line in lines:
              name,digest,size,expired=line.split('\t')
              if name=='mois-bulk128-131072-precolour-photo-source-v1':continue
              assert name.startswith(prefix),name
              part=int(name[len(prefix):])
              assert 0<=part<128 and part not in ids
              assert digest.startswith('sha256:') and len(digest)==71 and digest not in digests
              assert int(size)>1000 and expired=='false'
              ids.add(part);digests.add(digest)
          assert ids==set(range(128)),sorted(set(range(128))-ids)
          assert len(lines)==129
          print('MED500_128_ARTIFACT_DIGEST_META_COMPLETE',len(ids),flush=True)
          PY
      - name: Download existing 500px NUMERIC outputs only; normalize folder names
        run: |
          set -euo pipefail
          gh run download "$ORIGINAL_RUN" --repo "$REPO" \
            --pattern 'mois-bulk128-med500-part-*' --dir raw_workers
          mkdir -p workers
          python - <<'PY'
          from pathlib import Path
          for part in range(128):
              src=Path('raw_workers')/f'mois-bulk128-med500-part-{part}'
              dest=Path('workers')/f'mois-bulk128-med500-part-{part:03d}'
              assert src.is_dir(),str(src)
              assert (src/'bulk128_medium_photo_completion_receipt.json').is_file(),part
              src.rename(dest)
          print('MED500_ALL_128_WORKER_RECEIPTS_PRESENT_NO_IMAGE_REDOWLOAD',flush=True)
          PY
      - name: Restore immutable source manifest and summary without pixels
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download mois-full93m-bulk128-tier10-131072-original-photo-source-v1 \
            --repo "$REPO" --dir source \
            --pattern manifest.json --pattern bulk128_source_summary.csv
          echo '7e975e701281ba812451acd48be7e91a7d17f2bbe6f9f53ad15ef4f8db9e557e  source/manifest.json' | sha256sum -c -
          echo 'efe19bb147c439d14c9342b5a70a4ada6d4cb00da0494a8882653ec30520425d  source/bulk128_source_summary.csv' | sha256sum -c -
      - name: Verify 131072 actual photo statuses, decoded, BOX Lab and never strict9
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_bulk128_medium500_global_reconcile \
            --source-manifest source/manifest.json \
            --source-summary source/bulk128_source_summary.csv \
            --workers workers --output medium_verified
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('medium_verified/bulk128_real_medium_boxLab_completion_receipt.json').read_text())
          assert d['new_real_medium_picture_attempts']==131072
          assert d['128_frozen_original_taxon_photo_partitions_authenticated']==128
          assert d['new_original_strict9_color_ROI_count']==0
          assert d['new_image_downloads_or_ROI_inferences_by_collector']==0
          assert d['all_unclassifiable_photo_IDs_preserved_as_unknown']
          print('MOIS_MED500_DATA_ONLY_VERIFIED',json.dumps({
            'attempted':d['new_real_medium_picture_attempts'],
            'decoded':d['real_medium_RGB_downloaded_decoded'],
            'boxes':d['actual_original_photo_flower_candidate_boxes']
          },sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-bulk128-medium500-128part-DATAONLY-source-verified
          path: |
            medium_verified/
            snapshot/medium_artifacts.tsv
          retention-days: 90
          if-no-files-found: error
