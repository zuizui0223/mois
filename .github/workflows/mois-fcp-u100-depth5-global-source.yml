name: MOIS worldwide 20242 FCP U100 nested5 exact original photo source union
on:
  push:
    branches: [main]
    paths:
      - scripts/acquisition/mois_fcp_u100_depth5_global_source.py
      - tests/test_mois_fcp_u100_depth5_global_source.py
      - .github/workflows/mois-fcp-u100-depth5-global-source.yml
  pull_request:
    paths:
      - scripts/acquisition/mois_fcp_u100_depth5_global_source.py
      - tests/test_mois_fcp_u100_depth5_global_source.py
      - .github/workflows/mois-fcp-u100-depth5-global-source.yml
  workflow_run:
    workflows:
      - MOIS FCP U100 nested first5 original observation photo source no images
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-global-fcp-u100-first5-original-source-group-all16-union
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove all16 group source and nested photo IDs original SHA matches
        run: |
          set -euo pipefail
          python -m pip install -q PyYAML==6.0.2
          python -m py_compile scripts/acquisition/mois_fcp_u100_depth5_global_source.py
          python -m unittest discover -s tests -p test_mois_fcp_u100_depth5_global_source.py -v
          python - <<'PY'
          import subprocess,yaml
          d=yaml.safe_load(open('.github/workflows/mois-fcp-u100-depth5-global-source.yml'))
          steps=[s['run'] for job in d['jobs'].values() for s in job['steps'] if 'run' in s]
          assert len(steps)>=5
          for step in steps:
              p=subprocess.run(['bash','-n'],input=step,text=True,capture_output=True)
              assert p.returncode==0,p.stderr
          print('MOIS_FCP_NESTED_STAGE5_ALL_BASH_STEPS_PASS',len(steps))
          PY
  source-only-global:
    needs: tests
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'zuizui0223/mois' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      RESULT: mois-full93m-FCP-U100-nested5-20242-taxa-80968-rank2to5-source-v1
    steps:
      - uses: actions/checkout@v4
      - name: Ensure source stage is immutable and all 16 photo group releases exist
        id: inventory
        run: |
          set -euo pipefail
          if gh release view "$RESULT" --repo "$REPO" >/dev/null 2>&1; then
            echo ready=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ready=0
          for group in {0..15}; do
            tag="mois-FCP-U100-first5-93m-original-photo-taxongroup-$group-v1"
            if gh release view "$tag" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
              ready=$((ready+1))
            fi
          done
          if [ "$ready" -lt 16 ]; then
            echo "Only $ready/16 globally signed five-photo source groups have been published."
            echo ready=false >> "$GITHUB_OUTPUT"
          else
            test "$ready" -eq 16
            echo ready=true >> "$GITHUB_OUTPUT"
          fi
      - name: Recover only 16 signed source CSV groups with four metadata transfers concurrently
        if: steps.inventory.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import os,subprocess
          def one(group):
              tag=f'mois-FCP-U100-first5-93m-original-photo-taxongroup-{group}-v1'
              dest=Path('groups')/str(group)
              dest.mkdir(parents=True,exist_ok=False)
              p=subprocess.run(['gh','release','download',tag,
                  '--repo',os.environ['REPO'],'--dir',str(dest),
                  '--pattern','nested5_source_receipt.json',
                  '--pattern','original_FCP_U100_prefix5_rank1to5_candidates.csv',
                  '--pattern','original_FCP_U100_rank2to5_INCREMENTAL_CANDIDATES_not_new_ROIs.csv'],
                  capture_output=True,text=True)
              if p.returncode!=0:raise RuntimeError(f'Incomplete signed photo group {group}: {p.stderr}')
              assert all((dest/x).is_file() for x in (
                  'nested5_source_receipt.json',
                  'original_FCP_U100_prefix5_rank1to5_candidates.csv',
                  'original_FCP_U100_rank2to5_INCREMENTAL_CANDIDATES_not_new_ROIs.csv'))
              return group
          with ThreadPoolExecutor(max_workers=4) as executor:
              result=list(executor.map(one,range(16)))
          assert result==list(range(16))
          print('MOIS_FCP5_ALL16_FROZEN_SOURCE_GROUPS_ACQUIRED_NO_IMAGE_PIXELS',len(result))
          PY
          gh release download mois-full93m-FCP-U100-progressive-prefix1-20242-taxa-original-source-v1 \
            --repo "$REPO" --dir first \
            --pattern FCP_20242_taxa_prefix1_original_photo_candidates.csv
          echo '0403905f04d2def07d3f2e0caee28728a54923ef187f1fc2c63318857012b713  first/FCP_20242_taxa_prefix1_original_photo_candidates.csv' | sha256sum -c -
      - name: Independently verify exactly 20242 x5 source photo IDs and original rank1
        if: steps.inventory.outputs.ready == 'true'
        run: |
          set -euo pipefail
          set --
          for group in {0..15}; do
            set -- "$@" --group "groups/$group"
          done
          python -m scripts.acquisition.mois_fcp_u100_depth5_global_source \
            --first1 first/FCP_20242_taxa_prefix1_original_photo_candidates.csv \
            "$@" --output global
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('global/global_FCP_U100_depth5_source_receipt.json').read_text())
          assert m['eligible_taxa_with_at_least100_original_observations']==20242
          assert m['global_first5_nested_source_photo_IDs']==101210
          assert m['global_incremental_rank2to5_candidate_photo_IDs_NOT_NEW_INFERENCES']==80968
          assert len(m['group_original_photo_source_SHA_receipts'])==16
          assert m['new_image_downloads_and_original_ROI_inferences_performed']==0
          assert m['ranks2to5_genuine_never_measured_photo_IDs_not_yet_deduplicated']
          print('MOIS_FCP_NESTED_FIRST5_ALL42111_SOURCE_RECONCILED',20242,101210,80968,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: steps.inventory.outputs.ready == 'true'
        with:
          name: mois-FCP-U100-first5-20242-taxa-all16-global-photo-source
          path: global/
          retention-days: 90
          if-no-files-found: error
      - name: Publish immutable globally nested FCP stage5 original photo candidates
        if: steps.inventory.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if gh release view "$RESULT" --repo "$REPO" >/dev/null 2>&1; then
            gh release download "$RESULT" --repo "$REPO" --dir prior \
              --pattern global_FCP_U100_depth5_source_receipt.json
            cmp prior/global_FCP_U100_depth5_source_receipt.json global/global_FCP_U100_depth5_source_receipt.json
          else
            gh release create "$RESULT" global/* --repo "$REPO" --target "$GITHUB_SHA" \
              --title 'MOIS worldwide FCP U100 first5 genuine source photo IDs across 20242 nominal taxa' \
              --notes 'SHA-verified nested original observation photo source: full 93,209,351 source opportunity index, 42,111 nominal source taxa, 20,242 FCP U100 source eligible taxa. First5=101210 real original photo source ID candidates, exactly first1 frozen members +80968 rank2to5 candidates. Correct nested inclusion 5/N_i/M_o, delta-only 4/N_i/M_o; one photo per independent original observation. Additional 80968 source candidates are NOT yet never-measured image targets; prior FCP/MOIS/K1 original photo-ID overlap and technical unknowns MUST be removed first. No source photo images downloaded, flower ROI inferred, native/wild flowering status verified or globally unbiased white prevalence estimated.'
