name: MOIS 93m all-photo stage1 offline coverage and pixel scanner tests
on:
  push:
    branches:
      - main
      - feat/full93m-medium-pixel-firstpass
    paths:
      - scripts/acquisition/mois_full93m_every_photo_scan_manifest.py
      - scripts/acquisition/mois_full93m_medium_pixel_scan.py
      - scripts/acquisition/mois_k1_medium_pixel_256_benchmark.py
      - tests/test_mois_full93m_medium_pixel_scan.py
      - .github/workflows/mois-full93m-stage1-offline-tests.yml
  pull_request:
    paths:
      - scripts/acquisition/mois_full93m_every_photo_scan_manifest.py
      - scripts/acquisition/mois_full93m_medium_pixel_scan.py
      - tests/test_mois_full93m_medium_pixel_scan.py
      - .github/workflows/mois-full93m-stage1-offline-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 128×14 source completeness and medium image bytes without S3 requests
        run: |
          set -euo pipefail
          python -m pip install -q Pillow==11.3.0 numpy==2.1.3
          python -m py_compile \
            scripts/acquisition/mois_full93m_every_photo_scan_manifest.py \
            scripts/acquisition/mois_full93m_medium_pixel_scan.py
          python -m unittest discover -s tests \
            -p test_mois_full93m_medium_pixel_scan.py -v
          echo 'MOIS_ALL_93M_SOURCE_PHOTO_STAGE1_OFFLINE_TESTS_PASS'
  actual-K1-medium-256-calibration:
    if: github.event_name == 'push' && github.repository == 'zuizui0223/mois' && github.ref == 'refs/heads/feat/full93m-medium-pixel-firstpass' && contains(github.event.head_commit.message, '[pilot256]')
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only CPU image/decode and parquet dependencies
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 Pillow==11.3.0 pandas==2.2.3 pyarrow==19.0.1
          python -m py_compile \
            scripts/acquisition/mois_full93m_medium_pixel_scan.py \
            scripts/acquisition/mois_k1_medium_pixel_256_benchmark.py
      - name: Restore signed 76,753 actual K1 photo-ID and ROI outcome evidence (not raw images)
        run: |
          set -euo pipefail
          mkdir -p K1
          gh release download mois-full93m-tier06-balanced-onephoto-K1-new-original-warm8-RGB-v1 \
            --repo zuizui0223/mois --dir K1 \
            --pattern measured_photos.parquet --pattern receipt.json
          printf '%s\n' \
            '0d3de3374a06b1e7b9ad0281e2ab7844632ed139db871488524061191c8f34c1  K1/measured_photos.parquet' \
            'e86463bc61f9eebd8cbdbe01269f767c140bf243f9e374027008e9f095eb9044  K1/receipt.json' \
            | sha256sum -c -
      - name: Actually attempt at most 256 S3 medium pixels at 2 photo requests/sec
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_k1_medium_pixel_256_benchmark \
            --k1-parquet K1/measured_photos.parquet --k1-receipt K1/receipt.json \
            --source-output pilot_source --pixel-output pilot_pixels \
            --workers 8 --requests-per-second 2 --execute
      - name: Verify no forged full93m scan, image bytes or retrospective hue relabelling
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('pilot_source/calibration_source_receipt.json').read_text())
          s=json.loads(Path('pilot_pixels/K1_medium_pixel_benchmark_summary.json').read_text())
          assert a['selected_original_photo_ids']==256
          assert a['signed_K1_ROI_flip_gate_unknown_calibration']==128
          assert a['signed_K1_four_hue_success_calibration']==128
          assert s['pilot_images_attempted']==256
          assert s['actual_flower_detection_model_used'] is False
          assert s['flower_detection_recall_established'] is False
          assert s['no_raw_photo_bytes_published'] is True
          assert s['medium_decoded'] + s['medium_access_or_decode_unknown']==256
          assert s['stage1_wall_seconds']>0
          assert not Path('pilot_pixels/complete_receipt.json').exists()
          print('MOIS_256_REAL_MEDIUM_PIXEL_THROUGHPUT_CALIBRATION_SUCCESS',json.dumps(s,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-K1-256-actual-medium-pixel-transfer-benchmark
          path: |
            pilot_source/
            pilot_pixels/
          if-no-files-found: warn
          retention-days: 90
  source-93m-exact-1792-scan-jobs:
    if: github.event_name == 'push' && github.repository == 'zuizui0223/mois' && github.ref == 'refs/heads/feat/full93m-medium-pixel-firstpass' && contains(github.event.head_commit.message, '[plan1792]')
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      TAG: mois-complete-93209351-original-photo-target-tiers-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download ONLY signed 93m source receipt and 16 group receipts, NOT image data
        run: |
          set -euo pipefail
          mkdir -p source_receipts
          gh release download "$TAG" --repo "$REPO" --dir source_receipts \
            --pattern mois_all_original_photo_target_tiers_receipt.json \
            --pattern 'group-??-receipt.json'
          python - <<'PY'
          from pathlib import Path
          root=Path('source_receipts')
          group=sorted(root.glob('group-??-receipt.json'))
          assert len(group)==16, (len(group),group)
          assert (root/'mois_all_original_photo_target_tiers_receipt.json').exists()
          print('MOIS_AUTHENTIC_93M_16_GROUPS_RESTORED_WITHOUT_ORIGINAL_PIXELS',len(group))
          PY
      - name: Execute exact complete-source job manifest (128 signed parts x 14 hash tiers)
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_full93m_every_photo_scan_manifest \
            --registry source_receipts/mois_all_original_photo_target_tiers_receipt.json \
            --group-receipt source_receipts/group-??-receipt.json \
            --output full93m_plan
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('full93m_plan')
          receipt=json.loads((p/'plan_receipt.json').read_text())
          with (p/'all_original_photos_stage1_jobs.csv').open() as f:
            job=list(csv.DictReader(f))
          assert receipt['source_original_photo_ID_count']==93209351
          assert receipt['source_original_partitions']==128
          assert receipt['source_disjoint_tiers']==14
          assert receipt['all_disjoint_scan_jobs_including_empty']==1792
          assert len(job)==1792
          assert sum(int(x['expected_photo_rows']) for x in job)==93209351
          assert all(x['photo_level_sampling_probability']=='1' for x in job)
          assert receipt['actual_images_downloaded_or_scanned']==0
          assert receipt['scan_complete'] is False
          print('MOIS_GENUINE_COMPLETE_ALL93M_STAGE1_SOURCE_JOB_MANIFEST_VERIFIED',
                json.dumps({k:receipt[k] for k in
                  ('source_original_photo_ID_count','all_disjoint_scan_jobs_including_empty',
                   'actual_images_downloaded_or_scanned','manifest_sha256')},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-all-93209351-source-photo-stage1-1792-signed-jobs-v1
          path: full93m_plan/
          retention-days: 90
          if-no-files-found: error
  K1-real-500px-warm-flower-box-256-calibration:
    if: github.event_name == 'push' && github.repository == 'zuizui0223/mois' && github.ref == 'refs/heads/feat/full93m-medium-pixel-firstpass' && contains(github.event.head_commit.message, '[detector256]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      ULTRALYTICS_OFFLINE: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install warm detector inference, not EfficientSAM or fresh weights
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 Pillow==11.3.0 pandas==2.2.3 \
            pyarrow==19.0.1 ultralytics==8.4.112
          python -m py_compile \
            scripts/acquisition/mois_k1_medium_pixel_256_benchmark.py \
            scripts/acquisition/mois_full93m_medium_pixel_scan.py
      - name: Restore official SHA-locked K1 photo-ID ROI outcomes and frozen FCP YOLO detector only
        run: |
          set -euo pipefail
          mkdir -p K1 weights
          gh release download mois-full93m-tier06-balanced-onephoto-K1-new-original-warm8-RGB-v1 \
            --repo zuizui0223/mois --dir K1 \
            --pattern measured_photos.parquet --pattern receipt.json
          printf '%s\n' \
            '0d3de3374a06b1e7b9ad0281e2ab7844632ed139db871488524061191c8f34c1  K1/measured_photos.parquet' \
            'e86463bc61f9eebd8cbdbe01269f767c140bf243f9e374027008e9f095eb9044  K1/receipt.json' \
            | sha256sum -c -
          git init -q "$RUNNER_TEMP/fcp-model"
          git -C "$RUNNER_TEMP/fcp-model" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp-model" fetch --no-tags --depth=1 origin 9fae6ccdf684a46026f72ba12e98de2c5c54bf2a
          git -C "$RUNNER_TEMP/fcp-model" show FETCH_HEAD:data/atlas/qualification/roi_v4_training/jrc_yolo11n_last_v4.pt > weights/jrc_yolo11n_last_v4.pt
          echo 'f1aaeec4664fe2c178e5cf2bc1f508977bef3e4aa7b40613026cb8ae3de789d5  weights/jrc_yolo11n_last_v4.pt' | sha256sum -c -
          python - <<'PY'
          from ultralytics import YOLO
          y=YOLO('weights/jrc_yolo11n_last_v4.pt')
          print('MOIS_FROZEN_FLOWER_DETECTOR_CLASS_NAMES',y.names,flush=True)
          assert y.names.get(0)=='flower', 'Wrong class 0; do not invent a flower detector.'
          PY
      - name: Actually fetch original K1 medium images and run warm frozen YOLO11 without EfficientSAM
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_k1_medium_pixel_256_benchmark \
            --k1-parquet K1/measured_photos.parquet --k1-receipt K1/receipt.json \
            --source-output K1_calibration --pixel-output YOLO500_results \
            --weights weights/jrc_yolo11n_last_v4.pt \
            --weights-sha256 f1aaeec4664fe2c178e5cf2bc1f508977bef3e4aa7b40613026cb8ae3de789d5 \
            --flower-class-id 0 --flower-class-name flower \
            --device cpu --detector-conf 0.02 \
            --workers 8 --requests-per-second 2 --execute
      - name: Verify actual flower-box model evidence and preserve unknown labels
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('YOLO500_results/K1_medium_pixel_benchmark_summary.json').read_text())
          assert s['actual_flower_detection_model_used'] is True
          assert s['flower_box_model_original_weight_sha256']=='f1aaeec4664fe2c178e5cf2bc1f508977bef3e4aa7b40613026cb8ae3de789d5'
          assert s['pilot_images_attempted']==256
          assert s['medium_decoded']+s['medium_access_or_decode_unknown']==256
          assert s['flower_detection_recall_established'] is False
          assert not Path('YOLO500_results/complete_receipt.json').exists()
          print('MOIS_256_REAL_MEDIUM_PIXEL_FROZEN_YOLO_FLOWER_BOX_RESULT',
                json.dumps(s,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-K1-256-500px-original-YOLO-box-detection-and-timing
          path: |
            K1_calibration/
            YOLO500_results/
          retention-days: 90
          if-no-files-found: warn
