name: MOIS 93m all-photo stage1 offline coverage and pixel scanner tests
on:
  push:
    branches:
      - main
      - feat/full93m-medium-pixel-firstpass
    paths:
      - scripts/acquisition/mois_full93m_every_photo_scan_manifest.py
      - scripts/acquisition/mois_full93m_medium_pixel_scan.py
      - scripts/acquisition/mois_full93m_source_part_chunks.py
      - scripts/acquisition/mois_full93m_signed_chunk_pixel_scan.py
      - scripts/acquisition/mois_full93m_warm_chunk_batch.py
      - scripts/acquisition/mois_full93m_4096_chunk_warm_job_plan.py
      - tests/test_mois_full93m_4096_chunk_warm_job_plan.py
      - tests/test_mois_full93m_warm_chunk_batch.py
      - tests/test_mois_full93m_signed_chunk_pixel_scan.py
      - tests/test_mois_full93m_source_part_chunks.py
      - scripts/acquisition/mois_k1_medium_pixel_256_benchmark.py
      - tests/test_mois_full93m_medium_pixel_scan.py
      - tests/test_mois_medium_stage1_to_stage2_shadow.py
      - scripts/acquisition/mois_medium_stage1_to_stage2_shadow.py
      - scripts/acquisition/mois_93m_persistent_worker.py
      - tests/test_mois_93m_persistent_worker.py
      - scripts/acquisition/mois_93m_prepare_persistent_source.py
      - tests/test_mois_93m_prepare_persistent_source.py
      - scripts/acquisition/mois_flower_box_lab_colour.py
      - tests/test_mois_flower_box_lab_colour.py
      - tests/test_mois_full93m_floral_lab_v2.py
      - .github/workflows/mois-full93m-stage1-offline-tests.yml
  pull_request:
    paths:
      - scripts/acquisition/mois_full93m_every_photo_scan_manifest.py
      - scripts/acquisition/mois_full93m_medium_pixel_scan.py
      - scripts/acquisition/mois_full93m_source_part_chunks.py
      - scripts/acquisition/mois_full93m_signed_chunk_pixel_scan.py
      - scripts/acquisition/mois_full93m_warm_chunk_batch.py
      - scripts/acquisition/mois_full93m_4096_chunk_warm_job_plan.py
      - tests/test_mois_full93m_4096_chunk_warm_job_plan.py
      - tests/test_mois_full93m_warm_chunk_batch.py
      - tests/test_mois_full93m_signed_chunk_pixel_scan.py
      - tests/test_mois_full93m_source_part_chunks.py
      - tests/test_mois_full93m_medium_pixel_scan.py
      - scripts/acquisition/mois_93m_persistent_worker.py
      - tests/test_mois_93m_persistent_worker.py
      - scripts/acquisition/mois_93m_prepare_persistent_source.py
      - tests/test_mois_93m_prepare_persistent_source.py
      - scripts/acquisition/mois_flower_box_lab_colour.py
      - tests/test_mois_flower_box_lab_colour.py
      - tests/test_mois_full93m_floral_lab_v2.py
      - .github/workflows/mois-full93m-stage1-offline-tests.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 128×14 source completeness and medium image bytes without S3 requests
        run: |
          set -euo pipefail
          python -m pip install -q Pillow==11.3.0 numpy==2.1.3
          python -m py_compile \
            scripts/acquisition/mois_full93m_every_photo_scan_manifest.py \
            scripts/acquisition/mois_full93m_medium_pixel_scan.py \
            scripts/acquisition/mois_full93m_source_part_chunks.py \
            scripts/acquisition/mois_full93m_signed_chunk_pixel_scan.py \
            scripts/acquisition/mois_full93m_warm_chunk_batch.py \
            scripts/acquisition/mois_full93m_4096_chunk_warm_job_plan.py \
            scripts/acquisition/mois_93m_persistent_worker.py \
            scripts/acquisition/mois_93m_prepare_persistent_source.py \
            scripts/acquisition/mois_flower_box_lab_colour.py
          python -m unittest discover -s tests \
            -p test_mois_full93m_medium_pixel_scan.py -v
          python -m unittest discover -s tests -p test_mois_medium_stage1_to_stage2_shadow.py -v
          python -m unittest discover -s tests -p test_mois_full93m_source_part_chunks.py -v
          python -m unittest discover -s tests -p test_mois_full93m_signed_chunk_pixel_scan.py -v
          python -m unittest discover -s tests -p test_mois_full93m_warm_chunk_batch.py -v
          python -m unittest discover -s tests -p test_mois_full93m_4096_chunk_warm_job_plan.py -v
          python -m unittest discover -s tests -p test_mois_93m_persistent_worker.py -v
          python -m unittest discover -s tests -p test_mois_93m_prepare_persistent_source.py -v
          python -m unittest discover -s tests -p test_mois_flower_box_lab_colour.py -v
          python -m unittest discover -s tests -p test_mois_full93m_floral_lab_v2.py -v
          echo 'MOIS_ALL_93M_SOURCE_PHOTO_STAGE1_OFFLINE_TESTS_PASS'
  actual-K1-medium-256-calibration:
    if: github.event_name == 'push' && github.repository == 'zuizui0223/mois' && github.ref == 'refs/heads/feat/full93m-medium-pixel-firstpass' && contains(github.event.head_commit.message, '[pilot256]')
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only CPU image/decode and parquet dependencies
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 Pillow==11.3.0 pandas==2.2.3 pyarrow==19.0.1
          python -m py_compile \
            scripts/acquisition/mois_full93m_medium_pixel_scan.py \
            scripts/acquisition/mois_k1_medium_pixel_256_benchmark.py
      - name: Restore signed 76,753 actual K1 photo-ID and ROI outcome evidence (not raw images)
        run: |
          set -euo pipefail
          mkdir -p K1
          gh release download mois-full93m-tier06-balanced-onephoto-K1-new-original-warm8-RGB-v1 \
            --repo zuizui0223/mois --dir K1 \
            --pattern measured_photos.parquet --pattern receipt.json
          printf '%s\n' \
            '0d3de3374a06b1e7b9ad0281e2ab7844632ed139db871488524061191c8f34c1  K1/measured_photos.parquet' \
            'e86463bc61f9eebd8cbdbe01269f767c140bf243f9e374027008e9f095eb9044  K1/receipt.json' \
            | sha256sum -c -
      - name: Actually attempt at most 256 S3 medium pixels at 2 photo requests/sec
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_k1_medium_pixel_256_benchmark \
            --k1-parquet K1/measured_photos.parquet --k1-receipt K1/receipt.json \
            --source-output pilot_source --pixel-output pilot_pixels \
            --workers 8 --requests-per-second 2 --execute
      - name: Verify no forged full93m scan, image bytes or retrospective hue relabelling
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('pilot_source/calibration_source_receipt.json').read_text())
          s=json.loads(Path('pilot_pixels/K1_medium_pixel_benchmark_summary.json').read_text())
          assert a['selected_original_photo_ids']==256
          assert a['signed_K1_ROI_flip_gate_unknown_calibration']==128
          assert a['signed_K1_four_hue_success_calibration']==128
          assert s['pilot_images_attempted']==256
          assert s['actual_flower_detection_model_used'] is False
          assert s['flower_detection_recall_established'] is False
          assert s['no_raw_photo_bytes_published'] is True
          assert s['medium_decoded'] + s['medium_access_or_decode_unknown']==256
          assert s['stage1_wall_seconds']>0
          assert not Path('pilot_pixels/complete_receipt.json').exists()
          print('MOIS_256_REAL_MEDIUM_PIXEL_THROUGHPUT_CALIBRATION_SUCCESS',json.dumps(s,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-K1-256-actual-medium-pixel-transfer-benchmark
          path: |
            pilot_source/
            pilot_pixels/
          if-no-files-found: warn
          retention-days: 90
  source-93m-exact-1792-scan-jobs:
    if: github.event_name == 'push' && github.repository == 'zuizui0223/mois' && github.ref == 'refs/heads/feat/full93m-medium-pixel-firstpass' && contains(github.event.head_commit.message, '[plan1792]')
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      TAG: mois-complete-93209351-original-photo-target-tiers-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download ONLY signed 93m source receipt and 16 group receipts, NOT image data
        run: |
          set -euo pipefail
          mkdir -p source_receipts
          gh release download "$TAG" --repo "$REPO" --dir source_receipts \
            --pattern mois_all_original_photo_target_tiers_receipt.json \
            --pattern 'group-??-receipt.json'
          python - <<'PY'
          from pathlib import Path
          root=Path('source_receipts')
          group=sorted(root.glob('group-??-receipt.json'))
          assert len(group)==16, (len(group),group)
          assert (root/'mois_all_original_photo_target_tiers_receipt.json').exists()
          print('MOIS_AUTHENTIC_93M_16_GROUPS_RESTORED_WITHOUT_ORIGINAL_PIXELS',len(group))
          PY
      - name: Execute exact complete-source job manifest (128 signed parts x 14 hash tiers)
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_full93m_every_photo_scan_manifest \
            --registry source_receipts/mois_all_original_photo_target_tiers_receipt.json \
            --group-receipt source_receipts/group-??-receipt.json \
            --output full93m_plan
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('full93m_plan')
          receipt=json.loads((p/'plan_receipt.json').read_text())
          with (p/'all_original_photos_stage1_jobs.csv').open() as f:
            job=list(csv.DictReader(f))
          assert receipt['source_original_photo_ID_count']==93209351
          assert receipt['source_original_partitions']==128
          assert receipt['source_disjoint_tiers']==14
          assert receipt['all_disjoint_scan_jobs_including_empty']==1792
          assert len(job)==1792
          assert sum(int(x['expected_photo_rows']) for x in job)==93209351
          assert all(x['photo_level_sampling_probability']=='1' for x in job)
          assert receipt['actual_images_downloaded_or_scanned']==0
          assert receipt['scan_complete'] is False
          print('MOIS_GENUINE_COMPLETE_ALL93M_STAGE1_SOURCE_JOB_MANIFEST_VERIFIED',
                json.dumps({k:receipt[k] for k in
                  ('source_original_photo_ID_count','all_disjoint_scan_jobs_including_empty',
                   'actual_images_downloaded_or_scanned','manifest_sha256')},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-all-93209351-source-photo-stage1-1792-signed-jobs-v1
          path: full93m_plan/
          retention-days: 90
          if-no-files-found: error
  K1-real-500px-warm-flower-box-256-calibration:
    if: github.event_name == 'push' && github.repository == 'zuizui0223/mois' && github.ref == 'refs/heads/feat/full93m-medium-pixel-firstpass' && contains(github.event.head_commit.message, '[detector256]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      ULTRALYTICS_OFFLINE: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install warm detector inference, not EfficientSAM or fresh weights
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 Pillow==11.3.0 pandas==2.2.3 \
            pyarrow==19.0.1 ultralytics==8.4.112
          python -m py_compile \
            scripts/acquisition/mois_k1_medium_pixel_256_benchmark.py \
            scripts/acquisition/mois_full93m_medium_pixel_scan.py
      - name: Restore official SHA-locked K1 photo-ID ROI outcomes and frozen FCP YOLO detector only
        run: |
          set -euo pipefail
          mkdir -p K1 weights
          gh release download mois-full93m-tier06-balanced-onephoto-K1-new-original-warm8-RGB-v1 \
            --repo zuizui0223/mois --dir K1 \
            --pattern measured_photos.parquet --pattern receipt.json
          printf '%s\n' \
            '0d3de3374a06b1e7b9ad0281e2ab7844632ed139db871488524061191c8f34c1  K1/measured_photos.parquet' \
            'e86463bc61f9eebd8cbdbe01269f767c140bf243f9e374027008e9f095eb9044  K1/receipt.json' \
            | sha256sum -c -
          git init -q "$RUNNER_TEMP/fcp-model"
          git -C "$RUNNER_TEMP/fcp-model" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp-model" fetch --no-tags --depth=1 origin 9fae6ccdf684a46026f72ba12e98de2c5c54bf2a
          git -C "$RUNNER_TEMP/fcp-model" show FETCH_HEAD:data/atlas/qualification/roi_v4_training/jrc_yolo11n_last_v4.pt > weights/jrc_yolo11n_last_v4.pt
          echo 'f1aaeec4664fe2c178e5cf2bc1f508977bef3e4aa7b40613026cb8ae3de789d5  weights/jrc_yolo11n_last_v4.pt' | sha256sum -c -
          python - <<'PY'
          from ultralytics import YOLO
          y=YOLO('weights/jrc_yolo11n_last_v4.pt')
          print('MOIS_FROZEN_FLOWER_DETECTOR_CLASS_NAMES',y.names,flush=True)
          assert y.names.get(0)=='item', 'Wrong class 0; do not invent a flower detector.'
          PY
      - name: Actually fetch original K1 medium images and run warm frozen YOLO11 without EfficientSAM
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_k1_medium_pixel_256_benchmark \
            --k1-parquet K1/measured_photos.parquet --k1-receipt K1/receipt.json \
            --source-output K1_calibration --pixel-output YOLO500_results \
            --weights weights/jrc_yolo11n_last_v4.pt \
            --weights-sha256 f1aaeec4664fe2c178e5cf2bc1f508977bef3e4aa7b40613026cb8ae3de789d5 \
            --flower-class-id 0 --flower-class-name item \
            --device cpu --detector-conf 0.02 \
            --workers 8 --requests-per-second 2 --execute
      - name: Verify actual flower-box model evidence and preserve unknown labels
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('YOLO500_results/K1_medium_pixel_benchmark_summary.json').read_text())
          assert s['actual_flower_detection_model_used'] is True
          assert s['flower_box_model_original_weight_sha256']=='f1aaeec4664fe2c178e5cf2bc1f508977bef3e4aa7b40613026cb8ae3de789d5'
          assert s['pilot_images_attempted']==256
          assert s['medium_decoded']+s['medium_access_or_decode_unknown']==256
          assert s['flower_detection_recall_established'] is False
          assert not Path('YOLO500_results/complete_receipt.json').exists()
          print('MOIS_256_REAL_MEDIUM_PIXEL_FROZEN_YOLO_FLOWER_BOX_RESULT',
                json.dumps(s,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-K1-256-500px-original-YOLO-box-detection-and-timing
          path: |
            K1_calibration/
            YOLO500_results/
          retention-days: 90
          if-no-files-found: warn
  first-true-93m-source-tier00-part000-136-real-medium-pixels:
    if: github.event_name == 'push' && github.repository == 'zuizui0223/mois' && github.ref == 'refs/heads/feat/full93m-medium-pixel-firstpass' && contains(github.event.head_commit.message, '[first93m136]')
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      ULTRALYTICS_OFFLINE: 'True'
      PHOTO_SHA: f4fb52383147cb720367b474d8a755ef1f8181deaee57d86960d802323d82d7e
      WEIGHT_SHA: f1aaeec4664fe2c178e5cf2bc1f508977bef3e4aa7b40613026cb8ae3de789d5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install medium-pixel warm model without full-resolution EfficientSAM
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 Pillow==11.3.0 \
            ultralytics==8.4.112
      - name: Extract only one exact signed full93m source photo part from published 14-tier register
        run: |
          set -euo pipefail
          mkdir -p source weights
          gh release download mois-complete-93209351-original-photo-target-tiers-v1 \
            --repo zuizui0223/mois --dir source \
            --pattern tier-00-group-00.tar \
            --pattern mois_all_original_photo_target_tiers_receipt.json
          python - <<'PY'
          import hashlib,json,tarfile
          from pathlib import Path
          reg=json.loads(Path('source/mois_all_original_photo_target_tiers_receipt.json').read_text())
          assert reg['exact_original_photo_IDs_in_all_disjoint_tiers']==93209351
          tar=Path('source/tier-00-group-00.tar')
          digest=hashlib.sha256(tar.read_bytes()).hexdigest()
          assert digest==reg['published_tier_archive_SHA256'][tar.name]
          expected='tier-00/part-000.csv.gz'
          with tarfile.open(tar) as t:
            members={x.name for x in t.getmembers() if x.isfile()}
            assert expected in members
            photo_bytes=t.extractfile(expected).read()
          import os
          target=Path('source')/expected
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(photo_bytes)
          assert hashlib.sha256(photo_bytes).hexdigest()==os.environ['PHOTO_SHA']
          print('MOIS_93M_REAL_SIGNED_ORIGINAL_SOURCE_PART_READY',expected,len(photo_bytes))
          PY
      - name: Restore the exact historical FCP YOLO11 flower instance detector without SAM weights
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp-model"
          git -C "$RUNNER_TEMP/fcp-model" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp-model" fetch --no-tags --depth=1 origin 9fae6ccdf684a46026f72ba12e98de2c5c54bf2a
          git -C "$RUNNER_TEMP/fcp-model" show FETCH_HEAD:data/atlas/qualification/roi_v4_training/jrc_yolo11n_last_v4.pt > weights/jrc_yolo11n_last_v4.pt
          echo "$WEIGHT_SHA  weights/jrc_yolo11n_last_v4.pt" | sha256sum -c -
          python - <<'PY'
          from ultralytics import YOLO
          assert YOLO('weights/jrc_yolo11n_last_v4.pt').names.get(0)=='item'
          print('MOIS_TRUE_FCP_YOLO_CLASS_ITEM_WEIGHT_ATTESTED')
          PY
      - name: Actually finish signed 136-photo Tier0 Part0 through medium pixels and real frozen YOLO
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_full93m_medium_pixel_scan \
            --source source/tier-00/part-000.csv.gz \
            --source-sha256 "$PHOTO_SHA" --expected-count 136 \
            --part 0 --tier 0 \
            --weights weights/jrc_yolo11n_last_v4.pt \
            --weights-sha256 "$WEIGHT_SHA" \
            --flower-class-id 0 --flower-class-name item \
            --device cpu --model-conf 0.02 \
            --workers 8 --batch-size 256 --requests-per-second 2 \
            --output true93m_part000
      - name: Verify actual complete-original-photo-id shard and no constructed flower colours
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,gzip,hashlib,json,os
          from pathlib import Path
          root=Path('true93m_part000')
          full=json.loads((root/'complete_receipt.json').read_text())
          assert full['source_role']=='full93m'
          assert full['source_gzip_sha256']==os.environ['PHOTO_SHA']
          assert full['all_original_input_photos_attempted'] is True
          assert full['expected_photo_ids']==136
          assert full['actual_unique_source_photo_ids_attempted']==136
          assert full['medium_image_pixels_decoded']+full['medium_image_pixels_unavailable']==136
          assert full['detector_identity'].startswith('yolo11:'+os.environ['WEIGHT_SHA'])
          assert full['screening_only_not_verified_flower_colour'] is True
          with gzip.open(root/'packet-0000000.csv.gz','rt') as handle:
            rows=list(csv.DictReader(handle))
          assert len(rows)==136 and len(set(x['photo_id'] for x in rows))==136
          assert all(x['source_arm']=='full93m_observation_and_photo_complete_source' for x in rows)
          assert all(x['source_photo_inclusion_probability']=='1' for x in rows)
          print('MOIS_REAL_93M_STAGE1_PART000_136_PICTURE_PIXELS_COMPLETE',json.dumps(full,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-93m-genuine-p000-tier00-medium-yolo-136-photo-completed
          path: true93m_part000/
          retention-days: 90
          if-no-files-found: warn
  actual-136-full93m-pixels-to-stage2-shadow:
    if: github.event_name == 'push' && github.repository == 'zuizui0223/mois' && github.ref == 'refs/heads/feat/full93m-medium-pixel-firstpass' && contains(github.event.head_commit.message, '[bridge136]')
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover already-scanned REAL 136 original 500px photo outcomes; no images
        run: |
          set -euo pipefail
          gh run download 40163902072 --repo zuizui0223/mois \
            --name mois-93m-genuine-p000-tier00-medium-yolo-136-photo-completed \
            --dir signed_medium_136
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('signed_medium_136/complete_receipt.json').read_text())
          assert x['actual_unique_source_photo_ids_attempted']==136
          assert x['all_original_input_photos_attempted']
          assert x['screen_counts']=={'candidate':130,'negative':6}
          assert x['source_role']=='full93m'
          print('MOIS_REAL_FIRST_136_PIXELS_RESTORED_BY_SIGNED_SOURCE')
          PY
      - name: Preserve all 136 photo IDs through Stage2 SHADOW probability queue
        run: |
          set -euo pipefail
