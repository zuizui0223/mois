name: MOIS epoch6 offset1792 one new clear original9 COL XR exact accepted check
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-20261117-epoch6-offset1792-new1-official-COLXR.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-epoch6-offset1792-one-clear-COLXR-only-once
  cancel-in-progress: false
jobs:
  official-COLXR-one-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight exact signed pixel source, audit, atlas and prior accepted identity
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          test "$(gh api repos/$REPO/actions/runs/44044547320 --jq .conclusion)" = success
          test "$(gh api repos/$REPO/actions/runs/43703313170 --jq .conclusion)" = success
          test "$(gh run list --repo "$REPO" --workflow mois-20261117-epoch6-offset1792-new1-official-COLXR.yml --limit 100 --json databaseId --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID)] | length")" = 0
          python - <<'PY'
          import json,subprocess
          repo="zuizui0223/mois"
          get=lambda u:json.loads(subprocess.check_output(["gh","api",u]))
          jobs={x["name"]:x["conclusion"] for x in get(f"repos/{repo}/actions/runs/44044547320/jobs?per_page=100")["jobs"]}
          assert all(jobs[x]=="success" for x in ("source-only-first128","pixel-worker-only-if-novel-original","independent-strict9-audit","formal-append-after-audit","independent-final-byte-audit"))
          actual={x["name"]:x["digest"] for x in get(f"repos/{repo}/actions/runs/44044547320/artifacts?per_page=100")["artifacts"]}
          expect={
            "mois-20261117-epoch6-offset1792-signed-1231350-ID-source":"de31532971c4baf601cd106b0450978b3dacedec40c21a0e26ee218e431df065",
            "mois-20261117-epoch6-offset1792-genuine-FCP-ROI9-terminal":"b1b3dcdb32cf18e6427ccbf13b512cadccdf3c996ded62655478e1dfccfbe6ac",
            "mois-20261117-epoch6-offset1792-independent-strict9-audit":"4db00bf73f84b259029b5e00ad54a66858f3df17422f059895e0bd9f982cb7e3",
            "mois-20261117-epoch6-offset1792-genuine-original-42111-taxonomy-append":"b23758590abf418f76ad94b3acd4720720c5ed2abdfcdd2c8780b021d76af65c"
          }
          assert actual=={k:"sha256:"+v for k,v in expect.items()},actual
          prior={x["id"]:x["digest"] for x in get(f"repos/{repo}/actions/runs/43703313170/artifacts?per_page=100")["artifacts"]}
          assert prior[14157705123]=="sha256:abcd3aee766c85a92b86a8f93f8ed696bbe49d0f6cf2f64e5f75b457abf78e6a"
          print("SOURCE_WORKER_AUDIT_FORMAL_AND_PRIOR_GBIF_ARTIFACT_DIGEST_PREFLIGHT_SUCCESS")
          PY
          mkdir -p source worker audit formal prior
          gh run download 44044547320 --repo "$REPO" --name mois-20261117-epoch6-offset1792-signed-1231350-ID-source --dir source
          gh run download 44044547320 --repo "$REPO" --name mois-20261117-epoch6-offset1792-genuine-FCP-ROI9-terminal --dir worker
          gh run download 44044547320 --repo "$REPO" --name mois-20261117-epoch6-offset1792-independent-strict9-audit --dir audit
          gh run download 44044547320 --repo "$REPO" --name mois-20261117-epoch6-offset1792-genuine-original-42111-taxonomy-append --dir formal
          gh run download 43703313170 --repo "$REPO" --name mois-epoch3-offset1792-one-new-official-COLXR-accepted --dir prior
      - name: Match Mabea piriri only on real new photo after 42111-row atlas byte audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          import numpy as np,pandas as pd
          from scripts.analysis.mois_gbif_colxr_new_hue_incremental import classify_new_rows,combine_names
          from scripts.analysis.mois_gbif_colxr_nine_palette_name_pilot import PALETTE,NAME_RULE,COL_XR
          from scripts.analysis.mois_gbif_colxr_nine_colour_traits_bridge import build_traits
          from scripts.analysis.mois_gbif_colxr_batch_match import source_sha
          h=lambda f:hashlib.sha256(Path(f).read_bytes()).hexdigest()
          s=json.loads(Path("source/receipt.json").read_text())
          w=json.loads(Path("worker/shard_000/receipt.json").read_text())
          a=json.loads(Path("audit/receipt.json").read_text())
          f=json.loads(Path("formal/receipt.json").read_text())
          prior_receipt=json.loads(Path("prior/receipt.json").read_text())
          assert s["hash_disjoint_taxon_offset"]==1792 and s["new_independent_original_photo_candidates"]==1 and s["source_API_error_count"]==0 and s["old_original_photo_obs_ID_overlap"]==0
          assert h("source/receipt.json")=="c2a83f613541ea8a168e9d44cecc57a834c2a9a1886615d8203f8a994792458d"
          for name,key in (("manifest.json","source_manifest_SHA256"),("shards/shard-000.csv","source_shard_SHA256"),("source_candidates.csv","source_candidates_SHA256"),("source_taxon_status.csv","source_status_SHA256")):
            assert h("source/"+name)==s[key]
          assert w["attempted"]==w["downloaded"]==w["classifiable"]==1 and w["unclassifiable_acquired"]==0 and w["acquisition_failed"]==0
          assert h("worker/shard_000/receipt.json")==a["source_and_worker_sha256"]["worker_receipt_sha256"]=="bb7e072ca93a7cd0d8450e08db880597da9c3892962b1823407cf27fdd14e829"
          assert h("worker/shard_000/photos.csv")==a["source_and_worker_sha256"]["worker_terminal_sha256"]=="05aecbc588bbd75a00089aececbfc6f2a420d30d116e1e3d146e833a71fd36bf"
          assert h("audit/receipt.json")==f["audit_receipt_sha256"]=="a1bcdfc5d7358b595f9634fabbf7d4b2dad02fa6bddd779f013be3b1cb4ef104"
          assert h("audit/new_real_original_nine_photo9_delta.parquet")==a["verified_delta_sha256"]=="dd3f86884ec5c3890371f0d53b0f52eb83bc6bd8d23c5d341c2aad6452e58453"
          assert [a[k] for k in ("new_authentic_original_attempts","new_strict9_numeric_photos","new_numeric_first_taxa","new_clear_dominant_hue_taxa","new_technical_unknowns")]==[1,1,1,1,0]
          assert [f[k] for k in ("cumulative_photo_attempts","cumulative_genuine_numeric_photos","cumulative_numeric_taxa","cumulative_clear_sampled_photo_taxa","zero_numeric_remaining")]==[1231351,467568,39914,39174,2197]
          photo=pd.read_csv("worker/shard_000/photos.csv",dtype=str,keep_default_na=False)
          assert len(photo)==1 and photo.photo_id.iloc[0]=="764438797" and photo.observation_id.iloc[0]=="949fcd16-9591-4f94-b0d0-291cab53125c" and photo.image_sha256.iloc[0]=="b06119dcc68a0231a63c9fd18120af2394914e42f096c964c48e112f783965db"
          v=photo[["flower_fraction_"+k for k in PALETTE]].astype(float).to_numpy()
          assert np.isfinite(v).all() and (v>=0).all() and (abs(v.sum(axis=1)-1)<=0.001).all()
          path=Path("formal/mois_42111_post20261114_new_independent_original_photo9.csv.gz")
          assert source_sha(path)==f["derived_atlas_sha256"]=="6aa39e76a039e0c3161a5d115f5dd27fd0e91e438ae947df7f284fbeccf2796f"
          atlas=pd.read_csv(path,dtype={"inat_taxon_id":str})
          assert len(atlas)==42111 and atlas.inat_taxon_id.is_unique
          num=atlas.after_strict9.gt(0)
          vals=atlas.loc[num,["observed_mean_"+k for k in PALETTE]].to_numpy(float)
          assert num.sum()==39914 and np.isfinite(vals).all() and (vals>=0).all() and (abs(vals.sum(axis=1)-1)<=0.001).all()
          assert atlas.loc[~num,["observed_mean_"+k for k in PALETTE]].isna().all().all()
          one=atlas.loc[atlas.inat_taxon_id.eq("560402")]
          assert len(one)==1 and one.species.iloc[0]=="Mabea piriri" and one.dominant_hue9.iloc[0]=="white" and one.after_strict9.iloc[0]==1
          assert prior_receipt["cumulative_exact_accepted_COLXR_species"]==37104 and h("prior/receipt.json")=="e675b77d108c97fa6576005293a5b3e20817b416b8be3cb8aed8d7d97a9c8b5b"
          prior_path=Path("prior/current_all_photo9_COLXR_names.csv.gz")
          assert source_sha(prior_path)==prior_receipt["outputs_byte_SHA256"][prior_path.name]=="d59f5b4866ca087c37105f9772bcdc3c09ed1f15b5db50a82b05994ad245488f"
          old=pd.read_csv(prior_path,dtype=str,keep_default_na=False)
          assert len(old)==39169 and old.inat_taxon_id.is_unique and old.COL_XR_checklistKey.eq(COL_XR).all()
          assert old.status.eq("colxr_exact_accepted_species").sum()==37104
          assert old.loc[old.status.eq("colxr_exact_accepted_species"),"key"].is_unique
          assert old.loc[old.status.eq("colxr_exact_accepted_species"),"key"].ne("").all()
          for ac,oc in [("species","species"),("dominant_hue9","source_hue9"),("hue_status","hue_status")]:
            assert (atlas.set_index("inat_taxon_id").reindex(old.inat_taxon_id)[ac].fillna("").astype(str).to_numpy()==old[oc].to_numpy()).all(),ac
          new=atlas.loc[atlas.dominant_hue9.isin(PALETTE)&atlas.species.str.match(NAME_RULE)&~atlas.inat_taxon_id.isin(old.inat_taxon_id)]
          assert len(new)==1 and new.inat_taxon_id.iloc[0]=="560402" and new.species.iloc[0]=="Mabea piriri"
          matched=classify_new_rows(new,batch_size=1,pause=1.0)
          assert len(matched)==1 and matched.status.iloc[0]!="api_error_review","GBIF official API unavailable; do not count this as negative taxonomy"
          full,accepted=combine_names(old,matched)
          traits=build_traits(atlas,accepted,verify_counts=False)
          assert len(traits)==len(accepted) and accepted.key.is_unique
          out=Path("gbif_one");out.mkdir()
          sha={}
          for name,df in [("new_one_COLXR_name_match.csv.gz",matched),("current_all_photo9_COLXR_names.csv.gz",full),("current_exact_accepted_COLXR_species.csv.gz",accepted),("current_exact_accepted_COLXR_numeric9_traits.csv.gz",traits)]:
            p=out/name;df.to_csv(p,index=False,compression="gzip",float_format="%.7f");sha[name]=source_sha(p)
          receipt={"schema":"mois_epoch6_offset1792_new_clear1_COLXR_official_v1","new_photo_ID":"764438797","new_observation_UUID":"949fcd16-9591-4f94-b0d0-291cab53125c","new_raw_image_sha256":"b06119dcc68a0231a63c9fd18120af2394914e42f096c964c48e112f783965db","new_taxon_ID":"560402","new_taxon_name":"Mabea piriri","new_photo_dominant_hue9":"white","new_name_status":str(matched.status.iloc[0]),"new_taxon_accepted_key":str(matched.key.iloc[0]),"new_exact_accepted_COLXR_species":int(matched.status.eq("colxr_exact_accepted_species").sum()),"prior_exact_accepted_COLXR_species":37104,"cumulative_exact_accepted_COLXR_species":len(accepted),"new_name_eligible_taxa":1,"official_GBIF_occurrence_download_submitted":False,"GBIF_occurrence_records_downloaded":0,"previous_149_SQL_prepared_unsubmitted":True,"full_history_raw_SHA_census_completed":False,"formal_atlas_byte_SHA256":source_sha(path),"prior_COLXR_name_ledger_byte_SHA256":source_sha(prior_path),"signed_outputs_SHA256":sha}
          (out/"receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          assert receipt["cumulative_exact_accepted_COLXR_species"]==37104+receipt["new_exact_accepted_COLXR_species"]
          print("MOIS_EPOCH6_OFFSET1792_OFFICIAL_COLXR_SINGLE_NAME_RESULT",json.dumps(receipt,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-20261117-epoch6-offset1792-one-new-clear-COLXR-result
          path: gbif_one/
          retention-days: 90
          if-no-files-found: warn
