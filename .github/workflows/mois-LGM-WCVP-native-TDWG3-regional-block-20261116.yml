name: MOIS LGM WCVP native-at-TDWG3 versus introduced 500km block
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-LGM-WCVP-native-TDWG3-regional-block-20261116.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read

concurrency:
  group: mois-real-LGM3GCM-WCVP-native-TDWG3-20261116
  cancel-in-progress: false

jobs:
  verify-regional-native-climate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pins and validate conservative source matching
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 \
            statsmodels==0.14.4 scipy==1.15.2 rasterio==1.4.3 pyproj==3.7.1 \
            shapely==2.0.7 geopandas==1.0.1
          echo 'MOIS_NATIVE_LGM_TESTS_VERSION_2'
          python -m py_compile scripts/analysis/mois_lgm_wcvp_native_regional_block_20261116.py
          python -m unittest discover -s tests -p test_mois_lgm_wcvp_native_regional_block_20261116.py -v

      - name: Download SHA-pinned original true GBIF, LGM, AGB/NDVI and current climate
        run: |
          set -euo pipefail
          mkdir -p sources/WCVP
          for row in \
            '14166701658 GBIF 422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2' \
            '14219399376 ENV d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc' \
            '14225733755 LGM db3b5b4fa2133194963be9233411bb6bb50bc86393d1dc50d996cc4cc78b25ab'; do
            set -- $row
            curl --fail --location --silent --show-error --retry 3 --retry-delay 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/$1/zip" \
              --output "sources/$2.zip"
            echo "$3  sources/$2.zip" | sha256sum -c -
          done
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
            "https://geodata.ucdavis.edu/climate/worldclim/1_4/grid/cur/bio_10m_bil.zip" \
            --output sources/WC14.zip
          echo 'f289ff21c6c4bd24f0b7635dee9a57b0c93193d7194ae9e86b6ba8bcb442e6f1  sources/WC14.zip' | sha256sum -c -

      - name: Download source-verified Kew WCVP accepted taxa and actual native botanical country range
        run: |
          set -euo pipefail
          tag='mois-real350399-kew-wcvp-native-tdwg3-source-v1'
          for f in \
            'mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz' \
            'mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz' \
            'mois350399_wcvp_TDWG3_source_only_taxon_native_receipt.json'; do
            curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://github.com/zuizui0223/mois/releases/download/$tag/$f" \
              --output "sources/WCVP/$f"
          done
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
            'https://raw.githubusercontent.com/tdwg/wgsrpd/52da7828aba9d461dd133c27b3bd7a4407161f54/geojson/level3.geojson' \
            --output sources/TDWG3_source.geojson
          echo 'c172bcf6aba20e19477adc60aebf0023068f0175dca8480f0760b090dcf64840  sources/TDWG3_source.geojson' | sha256sum -c -
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.loads(Path("sources/WCVP/mois350399_wcvp_TDWG3_source_only_taxon_native_receipt.json").read_text())
          assert r['source_photo_attempts']==350399
          assert r['taxa_with_any_source_photos']==74821
          for fn,expected in r['data_files_sha256'].items():
              fp=Path("sources/WCVP")/fn
              if fp.exists(): assert hashlib.sha256(fp.read_bytes()).hexdigest()==expected, fn
          print("MOIS_NATIVE_SOURCE_WCVP_Kew_REGION_ONLY_SHA_VERIFIED",r['wcvp_distributions_resolution'],flush=True)
          PY

      - name: Spatial 500km block models after conservative native TDWG3 coverage
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_lgm_wcvp_native_regional_block_20261116 \
            --gbif sources/GBIF.zip \
            --env sources/ENV.zip \
            --lgm sources/LGM.zip \
            --current sources/WC14.zip \
            --wcvp-dir sources/WCVP \
            --tdwg sources/TDWG3_source.geojson \
            --output MOIS_LGM_WCVP_native
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("MOIS_LGM_WCVP_native/receipt.json").read_text())
          assert r['source_taxa']==37104 and r['source_GBIF_species_cells']==5493931
          assert r['island_native_inferred'] is False
          assert r['individual_is_wild_native_inferred'] is False
          assert r['LGM_refugium_inferred'] is False
          for mode in ('strict','moderate'):
              t=r['results'][mode]['region_and_match_audit']
              assert t['native_at_TDWG3_species_cell_pairs']>0
              assert t['uncertain_pairs']>=0
          print('MOIS_WCVP_NATIVE_LGM_SPATIAL_TEST_FINISHED',json.dumps(
              r['results'],sort_keys=True),flush=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-LGM-WCVP-broad-regional-native-TDWG3-100km-500km-block
          path: MOIS_LGM_WCVP_native/
          retention-days: 90
          if-no-files-found: warn
