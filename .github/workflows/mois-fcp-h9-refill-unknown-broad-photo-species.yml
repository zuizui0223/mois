name: MOIS FCP H9 one random flowering page for previously failed global species
on:
  pull_request:
    paths:
      - scripts/acquisition/mois_fcp_h9_flowering_refill_first256.py
      - tests/test_mois_fcp_h9_flowering_refill_first256.py
      - docs/MOIS_FCP_H9_ANNOTATED_FLOWERING_REFILL_20261018.md
      - .github/workflows/mois-fcp-h9-refill-unknown-broad-photo-species.yml
  push:
    branches: [main]
    paths:
      - scripts/acquisition/mois_fcp_h9_flowering_refill_first256.py
      - tests/test_mois_fcp_h9_flowering_refill_first256.py
      - docs/MOIS_FCP_H9_ANNOTATED_FLOWERING_REFILL_20261018.md
      - .github/workflows/mois-fcp-h9-refill-unknown-broad-photo-species.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-fcp-H9-original-flowering-observation-photo-refill
  cancel-in-progress: false
jobs:
  test-FCP-H9-source-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source-phenology license and no-hue-leakage tests
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 rasterio==1.4.3 requests==2.32.3 pytest==8.4.2
          python -m pytest -q tests/test_mois_fcp_h9_flowering_refill_first256.py
  FCP-H9-flowering-fallback-metadata:
    if: github.event_name != 'pull_request'
    needs: test-FCP-H9-source-selection
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Original source FCP H9 client rather than new unthrottled scraper
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 rasterio==1.4.3 requests==2.32.3
          git init -q "$RUNNER_TEMP/fcp_h9"
          git -C "$RUNNER_TEMP/fcp_h9" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp_h9" fetch -q --no-tags --depth=1 origin 9fae6ccdf684a46026f72ba12e98de2c5c54bf2a
          git -C "$RUNNER_TEMP/fcp_h9" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/fcp_h9" hash-object fcp_pipeline/random_photo_pool.py)" = a46341c98aa7ada422ed0e2799ccb863f01a3626
      - name: Restore immutable original 313535 photo IDs, pilot 69 labels and reserved broad/season sources
        run: |
          set -euo pipefail
          mkdir -p original broad pilot fifth season
          gh release download mois-primary-313535-fullfourth4096-featurelake-v2 \
            --repo zuizui0223/mois --dir original \
            --pattern 'primary313535_fullfourth4096_original_photo_hues.parquet' \
            --pattern 'primary313535_fullfourth4096_featurelake_manifest.json'
          gh release download mois-angiosperm-broad-species-first-source-cache-v1-20261018 \
            --repo zuizui0223/mois --dir broad \
            --pattern 'mois_broad_first4096_original_open_flower_photo_ID_source.csv' \
            --pattern 'mois_global_angiosperms_broad_open_source_photo_ID_pool.csv' \
            --pattern 'mois_broad_angiosperm_new_taxa_32768_pool_first4096_receipt.json'
          gh release download mois-broad-first256-actual-RGB-newtaxa-verified-v1-20261018 \
            --repo zuizui0223/mois --dir pilot \
            --pattern 'mois_broad_first256_real_photo_ROI_hue_taxon_quality.csv' \
            --pattern 'mois_broad_first256_photo_RBG_novel_taxa_genera_QC_receipt.json'
          gh run download 39091745230 --repo zuizui0223/mois \
            --name mois-fifth4096-original-photo-ID-only-frozen-reservation --dir fifth
          gh run download 39033985014 --repo zuizui0223/mois \
            --name mois-targeted4096-photo-ID-original-pixel-source-plan-only --dir season
      - name: One original FCP H9 annotated-flowering random page for only the 187 failed source taxa
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp_h9"
          python -m scripts.acquisition.mois_fcp_h9_flowering_refill_first256 \
            --original313535-photo-release original \
            --original256-hue-result-release pilot \
            --broad4096-source-release broad \
            --fifth4096-photo-reservation fifth \
            --season4096-photo-reservation season \
            --output flowering_rescue
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          p=Path('flowering_rescue')
          d=json.loads((p/'mois_fcp_H9_flowering_refills_photo_source_provenance.json').read_text())
          assert d['rescued_species_API_attempts']==187
          assert d['original_256_pilot_completed_RGB_classifications']==69
          assert d['source_original_256_successful_taxa_not_requeried']
          assert not d['new_photo_pixels_actually_measured']
          f=pd.read_csv(p/'mois_fcp_H9_original_flowering_photo_refills_first256_unknown.csv',dtype=str)
          assert len(f)==d['rescued_flowering_annotated_new_photo_SOURCE_ONLY_IDs']
          assert f.photo_id.is_unique and f.inat_taxon_id.is_unique
          assert 'morph' not in f.columns
          print('MOIS_FCP_H9_ANNOTATED_OPEN_FLOWERS_RESCUE_SOURCE_ONLY',len(f))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-fcp-h9-one-page-flowering-photo-source-only
          path: flowering_rescue/
          retention-days: 90
          if-no-files-found: error
  publish-source-only:
    if: github.event_name != 'pull_request'
    needs: FCP-H9-flowering-fallback-metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-fcp-h9-one-page-flowering-photo-source-only
          path: records
      - name: Preserve H9 source provenance but no pretend floral ROI colours
        run: |
          set -euo pipefail
          tag=mois-fcp-H9-flowering-alternate-original-photo-source-v1
          if gh release view "$tag" --repo zuizui0223/mois >/dev/null 2>&1; then
            echo "Original source receipt preserved"
          else
            gh release create "$tag" records/*.csv records/*.json \
              --repo zuizui0223/mois --target "$GITHUB_SHA" \
              --title 'MOIS FCP H9 annotated flower photo alternatives for ROI-unknown new angiosperm taxa' \
              --notes 'Metadata source ONLY; FCP pinned one random API page per failed photo source species; flowering term 12:13; no FCP within-species 100-photo target, genuine RGB not yet measured, annotation does not certify photo petals. Separate source arm and original 313535+32768 photo ID exclusions.'
          fi
