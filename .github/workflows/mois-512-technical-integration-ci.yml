name: MOIS old 512 ROI9 failed photo technical diagnostic data-only verification
on:
  push:
    branches: [analysis/mois-512-existing-ROI9-failures-diagnose-20261027]
    paths:
      - scripts/analysis/mois_512_prior_roi9_unknown_technical_screen_integrate.py
      - tests/test_mois_512_prior_roi9_unknown_technical_screen_integrate.py
      - .github/workflows/mois-512-technical-integration-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-only-photo-id-join-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile 170 cached and 342 authentic older image IDs without contacting S3
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 Pillow==11.3.0
          python -m py_compile scripts/analysis/mois_512_prior_roi9_unknown_technical_screen_integrate.py
          python -m unittest discover -s tests \
            -p test_mois_512_prior_roi9_unknown_technical_screen_integrate.py -v
          echo MOIS_512_OLD_ROI9_UNKNOWN_EXISTING_PHOTO_ID_QC_JOIN_PASSED
