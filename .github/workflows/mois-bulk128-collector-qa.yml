name: MOIS bulk128 source and collector tests without original image inference
on:
  push:
    branches: [feat/mois-bulk128-131072-20261026]
    paths:
      - scripts/analysis/mois_bulk128_collect_original_roi9.py
      - tests/test_mois_bulk128_collect_original_roi9.py
      - scripts/acquisition/mois_bulk128_pack_groups.py
      - .github/workflows/mois-bulk128-collector-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-original-photo-and-unknown-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 128-shard original-photo source and technical unknown colour invariants
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          python -m py_compile scripts/analysis/mois_bulk128_collect_original_roi9.py
          python -m py_compile scripts/acquisition/mois_bulk128_pack_groups.py
          python -m unittest discover -s tests -p test_mois_bulk128_collect_original_roi9.py -v
          echo "MOIS_BULK128_DATA_ONLY_ROI9_CONTRACT_TESTS_PASS"
