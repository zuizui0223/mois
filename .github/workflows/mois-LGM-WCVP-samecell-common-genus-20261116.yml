name: MOIS LGM GBIF same-cell WCVP native introduced common-genus control
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-LGM-WCVP-samecell-common-genus-20261116.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-native-introduced-common-genus-20261116
  cancel-in-progress: false

jobs:
  verify-within-genus-assemblages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned packages and run tests before expensive downloads
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 \
            statsmodels==0.14.4 scipy==1.15.2 rasterio==1.4.3 pyproj==3.7.1 \
            shapely==2.0.7 geopandas==1.0.1
          python -m py_compile scripts/analysis/mois_lgm_native_intro_common_genus_20261116.py
          python -m unittest discover -s tests -p test_mois_lgm_native_intro_common_genus_20261116.py -v

      - name: Fetch and SHA-verify signed GBIF cells, species hue, LGM, matched native and spatial models
        run: |
          set -euo pipefail
          mkdir -p sources/WCVP
          for record in \
            '14166701658 GBIF 422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2' \
            '14219399376 ENV d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc' \
            '14225733755 LGM db3b5b4fa2133194963be9233411bb6bb50bc86393d1dc50d996cc4cc78b25ab' \
            '14228652073 NATIVE b72b7358ed5382d625583ad61b90952e4e77377296fe90ae677bf9481aa80a7f' \
            '14227246751 SPATIAL e209257adbc185b4855f3b8d76aeaa50d2e2afe8a1feeb0f76013366e57c4d16'; do
            set -- $record
            curl --fail --location --silent --show-error --retry 3 --retry-delay 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/$1/zip" \
              --output "sources/$2.zip"
            echo "$3  sources/$2.zip" | sha256sum -c -
          done

      - name: Fetch original Kew WCVP regional-native tables and official historical TDWG3 polygons
        run: |
          set -euo pipefail
          tag='mois-real350399-kew-wcvp-native-tdwg3-source-v1'
          for filename in \
            'mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz' \
            'mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz' \
            'mois350399_wcvp_TDWG3_source_only_taxon_native_receipt.json'; do
            curl --fail --location --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://github.com/zuizui0223/mois/releases/download/$tag/$filename" \
              --output "sources/WCVP/$filename"
          done
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/tdwg/wgsrpd/52da7828aba9d461dd133c27b3bd7a4407161f54/geojson/level3.geojson" \
            --output sources/TDWG3.geojson
          echo 'c172bcf6aba20e19477adc60aebf0023068f0175dca8480f0760b090dcf64840  sources/TDWG3.geojson' | sha256sum -c -

      - name: Compare original native-introduced association versus common-genus only on EXACT GBIF cells
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_lgm_native_intro_common_genus_20261116 \
            --gbif sources/GBIF.zip \
            --env sources/ENV.zip \
            --lgm sources/LGM.zip \
            --native sources/NATIVE.zip \
            --spatial sources/SPATIAL.zip \
            --wcvp-dir sources/WCVP \
            --tdwg sources/TDWG3.geojson \
            --output MOIS_LGM_common_genus
          python - <<'PY'
          import json
          r=json.load(open('MOIS_LGM_common_genus/receipt.json'))
          x=r['results']
          assert x['source_GBIF_distinct_species']==37104
          assert x['source_GBIF_species_cell_pairs']==5493931
          assert x['colour_is_source_photo_species_modal_not_GBIF_local_petal']
          for mode in ('strict','moderate'):
              a=x['native_introduced_groups'][mode]
              assert a['audit']['exact_species_native_introduced_colour_counts_verified']
              assert a['all_matched_cells_before_genus_filter']>=3000
              assert a['n_cell_has_shared_genus']>300
          print('MOIS_LGM_SHARED_GENUS_REAL_SUCCESS',json.dumps({
              mode:x['native_introduced_groups'][mode]['analyses']
              for mode in ('strict','moderate')},sort_keys=True),flush=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-LGM-GBIF-WCVP-exact-same-cell-common-genus-composition-control
          path: MOIS_LGM_common_genus/
          retention-days: 90
          if-no-files-found: warn
