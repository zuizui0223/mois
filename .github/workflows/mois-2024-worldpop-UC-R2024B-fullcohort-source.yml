name: MOIS 2024 global official unconstrained WorldPop R2024B separate source
on:
  push:
    branches: [analysis/mois-viirs-popmatch-20261105]
    paths:
      - .github/workflows/mois-2024-worldpop-UC-R2024B-fullcohort-source.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-2024-global-WP-R2024B-unconstrained-original-all-66456-v1
  cancel-in-progress: false
jobs:
  official-unconstrained-population:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check 2024 source-year, all-island coverage and no true-zero imputation
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 rasterio==1.4.3 pyproj==3.7.2
          python -m unittest discover -s tests -p test_mois_2024_UC_R2024B_fullcohort_population.py -v
          python -m py_compile scripts/analysis/mois_2024_UC_R2024B_fullcohort_population.py
      - name: Restore same-year SHA-locked source table, NOT any original image files
        run: |
          set -euo pipefail
          mkdir -p original
          gh run download 42328567038 --repo zuizui0223/mois \
            --name mois-global2024-rest62360-original-VIIRS-G2-all66456-source --dir original
          echo '6e0a077d496e90848d05d043bffae57e4772519f4572a457221c5ef4da0fb813  original/result_rest2024/all2024_known_land_combined_values.csv' | sha256sum -c -
      - uses: actions/cache/restore@v4
        with:
          path: original_WorldPop_UC_2024/
          key: mois-worldpop-original-2024-unconstrained-R2024B-v1-868021365
      - name: Fetch single 2024 official UC raster; never relabel 2020 or constrained R2025A population
        timeout-minutes: 19
        run: |
          set -euo pipefail
          mkdir -p original_WorldPop_UC_2024
          if [ ! -f original_WorldPop_UC_2024/global_pop_2024_UC_1km_R2024B_v1.tif ]; then
            curl --fail --location --retry 2 --connect-timeout 25 \
              --speed-time 90 --speed-limit 1024 --max-time 990 \
              'https://worldpop-public-data.soton.ac.uk/GIS/Population/Global_2015_2030/R2024B/2024/0_Mosaicked/v1/1km/unconstrained/global_pop_2024_UC_1km_R2024B_v1.tif' \
              -o original_WorldPop_UC_2024/global_pop_2024_UC_1km_R2024B_v1.tif
          fi
          test "$(stat -c%s original_WorldPop_UC_2024/global_pop_2024_UC_1km_R2024B_v1.tif)" -eq 868021365
          sha256sum original_WorldPop_UC_2024/global_pop_2024_UC_1km_R2024B_v1.tif
      - name: Extract independent UC population estimates for SAME original 2024 66456 sites
        timeout-minutes: 7
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_2024_UC_R2024B_fullcohort_population \
            --source original/result_rest2024/all2024_known_land_combined_values.csv \
            --uc-raster original_WorldPop_UC_2024/global_pop_2024_UC_1km_R2024B_v1.tif \
            --output R2024B_UC_original
          python - <<'PY'
          import hashlib,json,pandas as pd
          from pathlib import Path
          p=Path('R2024B_UC_original')
          r=json.loads((p/'UC_R2024B_source_receipt.json').read_text())
          d=pd.read_csv(p/'2024_66k_UC_R2024B_fullcohort_values.csv',dtype={'target_id':str})
          assert r['source_cohort']==len(d)==66456 and d.target_id.is_unique
          assert r['previous_CN_complete']==43595
          assert r['2024_viirs3plus']==64646
          assert r['source_releases_NOT_mixed_in_one_covariate'] is True
          assert r['no_missing_population_imputed_to_zero'] is True
          assert r['no_original_photo_downloads_or_ROI_reinference'] is True
          assert r['new_official_population_source_url'].endswith('global_pop_2024_UC_1km_R2024B_v1.tif')
          assert r['UC_pop2024_valid']==d.population_UC_R2024B_status.eq('OK').sum()
          assert r['UC_complete']==d.UC_source_complete.sum()
          assert d.target_id.str.startswith('2024|').all()
          assert (d.UC_source_complete==(d.viirs_valid_months.ge(3)&d.population_UC_R2024B_status.eq('OK'))).all()
          assert d.loc[d.population_UC_R2024B_status.ne('OK'),'population_UC_R2024B_density_per_km2'].isna().all()
          assert not d.loc[d.population_UC_R2024B_status.eq('OK'),'population_UC_R2024B_density_per_km2'].isna().any()
          for name,expected in r['output_SHA256'].items():
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==expected,name
          print('MOIS_2024_UC_FULL_COHORT_OFFICIAL_RASTER_SHA_AND_NO_IMPUTATION_PASS',
             json.dumps({k:r[k] for k in ('source_cohort','previous_CN_complete','UC_pop2024_valid',
             'UC_complete','UC_added_over_CN_missing','UC_lost_where_CN_was_complete')},sort_keys=True),flush=True)
          PY
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: original_WorldPop_UC_2024/
          key: mois-worldpop-original-2024-unconstrained-R2024B-v1-868021365
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-2024-WorldPop-UC-R2024B-full-original-66456-population-source
          path: R2024B_UC_original/
          retention-days: 90
          if-no-files-found: warn
