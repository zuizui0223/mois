          arts={a["id"]:a for a in get(f"repos/{repo}/actions/runs/43814075592/artifacts?per_page=100")["artifacts"]}
          assert set(arts)=={a for a,_,_ in expected}
          for aid,name,digest in expected:
            a=arts[aid]
            assert a["name"]==name and a["digest"]=="sha256:"+digest and not a["expired"]
          now=get(f"repos/{repo}/actions/workflows/mois-20261116-epoch5-offset1152-new-created-window-and-conditional-original-photo9.yml/runs?per_page=100")
          assert not any(r["id"]!=int(__import__("os").environ["GITHUB_RUN_ID"]) and r["conclusion"]=="success" for r in now["workflow_runs"])
          with open("/tmp/mois_expected_896.txt","w") as f:
            for aid,_,digest in expected:f.write(f"{aid} {digest}\n")
          print("PREVIOUS_896_FOUR_OF_FOUR_TERMINAL_AND_SIGNED_META_SUCCESS")
