      - uses: actions/download-artifact@v4
        with:
          name: mois-20261116-epoch5-offset1152-signed-1231346-ID-source
          path: signed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned genuine FCP YOLO11/EfficientSAM RGB ROI-v4
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
