          assert np.isfinite(vals).all() and (vals>=0).all() and np.all(np.abs(vals.sum(axis=1)-1)<=.001)
          assert missing.isna().all().all()
          nxt=c.select_taxa_1152(a)
          assert len(nxt)==len(set(nxt))==128
          assert len(hist)==1231346 and len(raw)==102
          print("GATE_1231346_PHOTO_UUID_102_RECENT_IMAGE_SHA_42111_9COLOUR_MISSING_SUCCESS")
          PY
      - name: Search fresh iNat observation window; freeze source candidates without calling them measured
        id: freeze
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_epoch5_postlast23_created_photo9_offset1152 source --atlas latest/atlas.csv.gz --output newest --offset 1024
