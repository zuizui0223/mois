            echo "$sha  /tmp/mois_$id.zip" | sha256sum -c -
          done < /tmp/mois_expected_896.txt
          python - <<'PY'
          import zipfile,hashlib,json
          h=lambda b:hashlib.sha256(b).hexdigest()
          def unpack(art):
            with zipfile.ZipFile("/tmp/mois_"+str(art)+".zip") as z:
              names=z.namelist(); return {n:z.read(n) for n in names}
          s=unpack(14201821924);w=unpack(14201687920);a=unpack(14202216277);f=unpack(14201962201)
          sr=json.loads(s["receipt.json"])
          wr=json.loads(w["shard_000/receipt.json"])
          ar=json.loads(a["receipt.json"])
          fr=json.loads(f["receipt.json"])
          assert h(s["receipt.json"])=="fd1c03b057b013faf12bec8e53a76b338f816384260e20bead523456d326389a"
          assert h(s["manifest.json"])==sr["source_manifest_SHA256"]=="de5a34fadfad6e1167ec0007f809a581eb0d7d8265d6194b4b600aa4735a5a26"
          assert h(s["shards/shard-000.csv"])==sr["source_shard_SHA256"]=="44d4210bab66e8c2c9f584b4f47c150d0fcd0a4c005c99f82690b7e6e0934704"
          assert h(s["source_taxon_status.csv"])==sr["source_status_SHA256"]=="a68af2f35323ffe1bf558a0311d858a5ce424a3b0de5fb4ae8afc7c19f7880ac"
          assert h(s["source_candidates.csv"])==sr["source_candidates_SHA256"]=="d72ec64d77d60a8ef81f68e280e88737f8a5d0f929684385a2cc3b940e0dd129"
          assert h(w["shard_000/receipt.json"])==ar["source_and_worker_sha256"]["worker_receipt_sha256"]=="ee054f4d21fe26e85481a6fde9f0040f9f77b9bda4e454e6398e91ad47badf47"
          assert h(w["shard_000/photos.csv"])==wr["photos_sha256"]=="1e4d7e5dffd4c2e69bd9b87fe09a5a55232513b695b18b4704ec89f5c4a4cae4"
          assert h(a["receipt.json"])==fr["audit_receipt_sha256"]=="37e16cb44e07477b0af7597986f5e1140c79d71d55118711117d2018769c0d7f"
          assert h(a["new_real_original_nine_photo9_delta.parquet"])==ar["verified_delta_sha256"]=="545d034d3a396db769a9ca26640405bfd9d9b0349074306259cfb906f0a52b11"
          assert h(f["mois_42111_post20261114_new_independent_original_photo9.csv.gz"])==fr["derived_atlas_sha256"]=="c8c9084ff6ba6d587c41ffd168b942fa21a2fc9932520092598b420dc89bf2b1"
          assert (fr["cumulative_photo_attempts"],fr["cumulative_genuine_numeric_photos"],fr["cumulative_numeric_taxa"],fr["cumulative_clear_sampled_photo_taxa"],fr["zero_numeric_remaining"])==(1231346,467566,39912,39173,2199)
          assert (ar["new_authentic_original_attempts"],ar["new_strict9_numeric_photos"],ar["new_technical_unknowns"])==(1,0,1)
          assert ar["technical_unknown_nine_fractions_all_missing"] is True and fr["old1231244_raw_SHA_fully_compared"] is False
          print("PREVIOUS_896_REAL_BYTE_SHA_RECEIPT_WORKER_AUDIT_ATLAS_CHAIN_VERIFIED",flush=True)
          PY
      - name: Independently inspect 1,152 source taxa across nine signed hash-disjoint cohorts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          repo="zuizui0223/mois"
          expected=[[43772102468,14184518712,"4ae4073f17810f9f78af720e7241ea1bfbced4745c2d8266e677659d242cd510",0],[43779275858,14186834831,"bb1b79e73a2ec098136b0e53f12224b20760b2461d0aaad50826ea856e3fc887",128],[43783789589,14189582536,"edb167851c5e8dee40a2ae19bad8c2ed320189ee8360ec0dd9d11ad2bc02c882",256],[43792595984,14193430488,"d32b4d7254aad1f5991ac656f7085d7571cca13392f72155df362d8767f90f3e",384],[43795340655,14193744661,"56a553d64163ad47825e4cc746f54f72af6c2ef7e7b744b00250e142c23bba5a",512],[43806328311,14197993517,"4089f8e81fc9e1ed949290a04a226ce13522ab6862ff6ca85c91b73968e386d0",640],[43809194943,14200066748,"193a1eabd8c2e617fff787975ed754d1fe1eb57b0195bddd1bccc2ecb0a90e77",768],[43814075592,14201821924,"4582bcca137a59291a724af5be26848542d6fe5753a6f9587481aeffc98aad1c",896],[43829247738,14208306405,"9d7784101761730ee47bf6539203a0cabaf2184172f85ac10d261e67f77ae617",1024]]
          get=lambda p:json.loads(subprocess.check_output(["gh","api",p]))
          for rid,aid,sha,off in expected:
            r=get(f"repos/{repo}/actions/runs/{rid}")
            assert (r["status"],r["conclusion"])==("completed","success")
            arts={a["id"]:a for a in get(f"repos/{repo}/actions/runs/{rid}/artifacts?per_page=100")["artifacts"]}
            assert aid in arts and arts[aid]["digest"]=="sha256:"+sha and not arts[aid]["expired"]
             if off==1024:
               jobs={j["name"]:j["conclusion"] for j in get(f"repos/{repo}/actions/runs/{rid}/jobs?per_page=100")["jobs"]}
               assert jobs=={"source-only-first128":"success","pixel-worker-only-if-novel-original":"skipped","independent-strict9-audit":"skipped","formal-append-after-audit":"skipped"},jobs
          with open("/tmp/mois_previous_source.txt","w") as f:
            for rid,aid,sha,off in expected:f.write(f"{aid} {sha} {off}\n")
          PY
          while read -r id sha off; do
            if [ "$off" = 896 ]; then cp /tmp/mois_14201821924.zip "/tmp/mois_prev_$off.zip"; else
              curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" -o "/tmp/mois_prev_$off.zip"
            fi
