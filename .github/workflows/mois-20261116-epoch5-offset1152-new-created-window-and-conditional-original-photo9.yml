              assert h(z.read("source_candidates.csv"))==r["source_candidates_SHA256"]
               if off==1024:
                 assert h(z.read("receipt.json"))=="019412097f791fc1a106ab544fa7c7bc5548ec33126d8be29b13ab11294a013a"
                 assert h(z.read("source_taxon_status.csv"))=="b9917e52cad029e08b952b82294e3ade84b123e163aad1457b92a31a86a53389"
                 assert h(z.read("source_candidates.csv"))=="01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b"
                 assert r["new_independent_original_photo_candidates"]==0
              assert (r["hash_disjoint_taxon_offset"],r["searched_zero_numeric_taxa"],r["source_API_error_count"])==(off,128,0)
              assert r["new_independent_original_photo_candidates"]==(1 if off==896 else 0)
              assert r["old_original_photo_attempt_ID_count"]==(1231346 if off==1024 else 1231345)
              ids=[x["inat_taxon_id"] for x in statuses]
              assert len(ids)==len(set(ids))==128 and not seen.intersection(ids)
              assert all(x["status"]=="source_queried" for x in statuses)
              seen.update(ids)
          assert len(seen)==1152
          print("EPOCH5_ALL_PREVIOUS_1152_DISTINCT_TAXA_BYTE_SIGNED_AND_ZERO_API_ERRORS")
          PY
      - name: Load previous formal atlas and full 1,231,346 historical identity ledger
