name: "MOIS QA180: resolve all 223 jpg-404 photos using provider JPEG"
on:
  push:
    branches:
      - analysis/mois-qa180-original-photo-audit-20261117
    paths:
      - .github/workflows/mois-QA180-provider-jpeg-404-recovery.yml
permissions:
  actions: read
  contents: read
jobs:
  provider-extension-head:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "pandas>=2.1,<3" "requests>=2.31,<3"
      - name: Download SHA verified previous 538 HEAD result (no image bytes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p photo_qc_results
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14330763419/zip" \
            -o photo_qc_results/original_538_HEAD_archive.zip
          echo "6d04fc7ad66d0a7daf74456fa353286a01f9f6d42160a361fa9474885cd584ec  photo_qc_results/original_538_HEAD_archive.zip" | sha256sum -c
      - name: HEAD all 223 missing exact photo IDs with .jpeg and safe .png fallback
        run: |
          python - <<'PY'
          import io,zipfile,hashlib,json,time,threading
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import pandas as pd
          import requests
          d=Path("photo_qc_results")
          archive=d/"original_538_HEAD_archive.zip"
          with zipfile.ZipFile(archive) as z:
              t=pd.read_csv(io.BytesIO(z.read(".qa_results_full/original_photo_url_HEAD_only.csv")),dtype=str)
              rec=json.loads(z.read(".qa_results_full/receipt.json"))
          assert rec["source"]["source_photo_ids"]==538 and len(t)==538
          original=t.provider_medium_http.astype(str)
          assert (original=="200").sum()==315 and (original=="404").sum()==223
          targets=t.loc[original=="404",["blind_photo_review_id","photo_id"]].copy()
          assert targets.photo_id.is_unique and len(targets)==223
          print("MOIS_QA_JPEG_RECOVERY_NOMINAL_TARGET",len(targets),flush=True)
          lock=threading.Lock()
          last=[0.]
          def limit():
              with lock:
                  now=time.monotonic()
                  wait=max(0,last[0]-now)
                  last[0]=max(last[0],now)+.23
              if wait:time.sleep(wait)
          def check(rec):
              q=dict(rec)
              pid=str(q["photo_id"])
              for ext in ("jpeg","png"):
                  limit()
                  try:
                      with requests.Session() as s:
                          z=s.head("https://inaturalist-open-data.s3.amazonaws.com/photos/"+pid+"/medium."+ext,
                                   timeout=(5,15),headers={"User-Agent":"MOIS-blind-QA180-photo-path-HEAD/1.0"})
                      q[ext+"_http"]=z.status_code
                      q[ext+"_mime"]=z.headers.get("Content-Type","")
                  except requests.RequestException as e:
                      q[ext+"_http"]=None;q[ext+"_error"]=type(e).__name__
                  if q.get(ext+"_http")==200 and q.get(ext+"_mime","").startswith("image/"):
                      q["provider_medium_confirmed_extension"]=ext
                      break
              q.setdefault("provider_medium_confirmed_extension","")
              return q
          with ThreadPoolExecutor(max_workers=4) as pool:
              out=list(pool.map(check,targets.to_dict("records")))
          a=pd.DataFrame(out)
          a.to_csv(d/"original223_404_jpeg_png_HEAD_resolution.csv",index=False)
          merged=t.merge(a[["photo_id","provider_medium_confirmed_extension"]],on="photo_id",how="left",validate="one_to_one")
          merged["provider_medium_confirmed_extension"]=merged["provider_medium_confirmed_extension"].fillna("")
          merged.loc[original=="200","provider_medium_confirmed_extension"]="jpg"
          merged["available_by_exact_photo_id"]=merged.provider_medium_confirmed_extension.ne("")
          assert len(merged)==538 and merged.photo_id.is_unique
          merged[["blind_photo_review_id","photo_id","provider_medium_http","provider_medium_confirmed_extension","available_by_exact_photo_id"]].to_csv(
              d/"all538_provider_photo_HEAD_status.csv",index=False)
          counts=merged.provider_medium_confirmed_extension.value_counts(dropna=False).to_dict()
          summary={"original_jpg200":315,"original_jpg404":223,"jpeg_recovered":int(a.provider_medium_confirmed_extension.eq("jpeg").sum()),
                   "png_recovered":int(a.provider_medium_confirmed_extension.eq("png").sum()),
                   "still_unconfirmed":int((~merged.available_by_exact_photo_id).sum()),
                   "all538_provider_medium_reachable":int(merged.available_by_exact_photo_id.sum()),
                   "source_head_zip_sha256":"6d04fc7ad66d0a7daf74456fa353286a01f9f6d42160a361fa9474885cd584ec",
                   "no_image_bytes_downloaded":True,
                   "does_not_establish_flowering_organ_or_petal_colour":True}
          summary["output_sha256"]={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in d.glob("*.csv")}
          (d/"jpeg_recovery_receipt.json").write_text(json.dumps(summary,indent=2)+"\n")
          (d/"original_538_HEAD_archive.zip").unlink()
          print("MOIS_QA180_FULL_MEDIA_EXTENSION_AUDIT",json.dumps(summary),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-QA180-538-photo-source-jpg-jpeg-resolved
          path: photo_qc_results/
          if-no-files-found: error
          retention-days: 21
