name: MOIS GEB real313535 photo-classifier MNAR tipping sensitivity source-only
on:
  push:
    branches: [analysis/mois-geb-mnar-tipping-real313535-20261027]
    paths:
      - scripts/analysis/mois_geb_real313535_mnar_white_tipping.py
      - tests/test_mois_geb_real313535_mnar_white_tipping.py
      - .github/workflows/mois-geb-real313535-mnar-tipping-bias-only.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mois-signed313535-white-solar-rain-MNAR-source-only
  cancel-in-progress: false
jobs:
  source-nine-cell-nonresponse-tipping:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      INPUT_TAG: mois-original313535-four-hues-water-solar-genus-20261018-v1
      OUTPUT_TAG: mois-real313535-white-solar-wetdry-MNAR-tipping-source-20261027-v1
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-population and possible-not-observed missing-white assumptions
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m py_compile scripts/analysis/mois_geb_real313535_mnar_white_tipping.py
          python -m unittest discover -s tests -p test_mois_geb_real313535_mnar_white_tipping.py -v
      - name: Download ONLY original already aggregated 9 source rain-by-solar cells; no images
        run: |
          set -euo pipefail
          mkdir -p signed
          gh release download "$INPUT_TAG" --repo "$REPO" --dir signed \
            --pattern mois_313535_four_visible_hues_water_solar_tertile_composition.csv
          echo '04728fc4426b160a73cb2cff56094f373beac1b5825c861675016712425daafb  signed/mois_313535_four_visible_hues_water_solar_tertile_composition.csv' | sha256sum -c -
      - name: Compute actual source conditional white-label MNAR reversal thresholds
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_geb_real313535_mnar_white_tipping \
            --signed-source-cells signed/mois_313535_four_visible_hues_water_solar_tertile_composition.csv \
            --output source_MNAR
          python - <<'PY'
          import hashlib,json,math
          from pathlib import Path
          p=Path('source_MNAR')
          d=json.loads((p/'real313535_fourhue_missingness_MNAR_tipping_receipt.json').read_text())
          assert d['schema']=='mois_source_313535_photo_binary_white_ROI_MNAR_wetdry_solar3_tipping_v1'
          assert d['true_parent_original_photo_attempts']==313535
          assert d['three_by_three_original_photo_attempts_with_both_env_axes']==313204
          assert d['three_by_three_original_photo_hue_known']==151107
          assert d['three_by_three_original_photo_four_hue_unknown']==162097
          assert d['source_photos_excluded_from_3by3_because_climate_missing']==331
          assert abs(d['completecase_attempt_weighted_solar_stratified_wet_minus_dry_white_pp']-4.550412063034302)<1e-7
          assert abs(d['one_sided_assumed_white_fraction_depletion_of_wet_unmeasured_to_erase_contrast_pp']-8.25060612687695)<1e-7
          assert d['MNAR_scenario_results_do_not_correct_genus_adjusted_309439_worldclim_model']
          assert d['NO_unknown_original_photo_assigned_white_or_chromatic']
          assert d['new_RGB_photo_downloads']==0
          for filename,digest in d['output_SHA256'].items():
              assert hashlib.sha256((p/filename).read_bytes()).hexdigest()==digest
          print('MOIS_REAL313535_MNAR_TIPPING_ROBUSTNESS_QUANTIFIED_NO_NEW_PHOTOS',{
              'completecase_wetdry_photo_pp':round(d['completecase_attempt_weighted_solar_stratified_wet_minus_dry_white_pp'],4),
              'wet_unmeasured_white_depletion_tie_pp':round(d['one_sided_assumed_white_fraction_depletion_of_wet_unmeasured_to_erase_contrast_pp'],4),
              'strata':3},flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-real313535-MNAR-climate-solar-source-ninecell-bias-results
          path: source_MNAR/
          retention-days: 90
          if-no-files-found: error
      - name: Seal empirical missing-hue sensitivity as a SUPPLEMENT, not refitted main rainfall slope
        run: |
          set -euo pipefail
          if gh release view "$OUTPUT_TAG" --repo "$REPO" >/dev/null 2>&1; then
            mkdir -p old
            gh release download "$OUTPUT_TAG" --repo "$REPO" --dir old \
              --pattern real313535_fourhue_missingness_MNAR_tipping_receipt.json
            cmp old/real313535_fourhue_missingness_MNAR_tipping_receipt.json \
                source_MNAR/real313535_fourhue_missingness_MNAR_tipping_receipt.json
            echo MOIS_MNAR_SOURCE_RESULTS_ALREADY_FROZEN
          else
            gh release create "$OUTPUT_TAG" source_MNAR/* --repo "$REPO" --target "$GITHUB_SHA" \
              --title "MOIS actual313535 original photos: wet-white rain solar MNAR tipping sensitivity (not fitted effect)" \
              --notes 'Signed real 313535 attempted original photos, 313204 with source-complete original rain×solar 3x3, 151107 classified and 162097 unknown. Counterfactual what-if assumptions ONLY: how far 4-class hue distribution of unmeasured photos must diverge for wet-dry white photo contrast to reach zero within solar cells. NOT estimated latent colour, no actual floral/petal verification, no adjusted 309439-photo genus-maxT annual climate slope, no new images or model refit. Informs manuscript missing-not-at-random sensitivity and honest bound on global colour biogeography.'
            echo MOIS_REAL_PHOTO_MNAR_SOURCE_RECEIPT_PUBLISHED_NO_NEW_RGB
          fi
