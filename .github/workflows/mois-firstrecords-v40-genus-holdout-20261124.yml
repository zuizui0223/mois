name: "MOIS ecology: FirstRecords v4 genus holdout predictive audit"
on:
  push:
    branches: [analysis/mois-global-floral-colour-assembly-null-20261118]
    paths:
      - scripts/analysis/mois_firstrecords_v40_genus_holdout_predictive_audit_20261124.py
      - tests/test_mois_firstrecords_v40_genus_holdout_20261124.py
      - .github/workflows/mois-firstrecords-v40-genus-holdout-20261124.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-v4-genus-holdout-firstrecords-20261124
  cancel-in-progress: true
jobs:
  predictive-robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MOIS_V40_SOURCE_ZIP: source/mois_v4_prior_artifact.zip
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical and predictive libraries
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.1.3" "pandas==2.2.3" "scikit-learn==1.8.0" "pytest>=8,<10"
      - name: Fetch exact previously verified source artifact and gate whole ZIP SHA
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14757922016/zip" \
            -o "$MOIS_V40_SOURCE_ZIP"
          echo "afa9cbe259ca13d039692e4aa0a0e117045655a3f3fd6ee8e89ddd01b22f41e2  $MOIS_V40_SOURCE_ZIP" | sha256sum -c
      - name: Verify test contracts and rerun 5x5 genus-blocked predictive checks
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_mois_firstrecords_v40_genus_holdout_20261124.py
          python -m scripts.analysis.mois_firstrecords_v40_genus_holdout_predictive_audit_20261124 \
            --source "$MOIS_V40_SOURCE_ZIP" \
            --out results/mois_v40_genus_holdout_20261124
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-v40-firstrecords-genus-holdout-photo9-20261124
          path: results/mois_v40_genus_holdout_20261124/
          if-no-files-found: error
          retention-days: 60
