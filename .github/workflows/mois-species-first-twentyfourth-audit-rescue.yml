name: MOIS wave24 audit-only recovery of 387 immutable authentic original photos
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-species-first-twentyfourth-audit-rescue.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-wave24-immutable-original-receipt-audit-only
  cancel-in-progress: false
jobs:
  audit-existing-wave24-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      ORIGINAL_RUN: '43283299853'
      SOURCE_NAME: mois-twentythird4096-verified-append-twentyfourth-prioritized-original-source
      WORKER_NAME: mois-twentyfourth24-real-original-worker-0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen source and successful original photo worker before audit-only repair
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/actions/runs/$ORIGINAL_RUN" --jq .status)" = completed
          # The original run failed in its audit job; that is the reason for this audit-only rescue.
          test "$(gh api "repos/$REPO/actions/runs/$ORIGINAL_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name == "append-twentythird-and-source-twentyfourth" and .conclusion == "success")] | length')" = 1
          test "$(gh api "repos/$REPO/actions/runs/$ORIGINAL_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name == "twentyfourth-real-original-worker (0)" and .conclusion == "success")] | length')" = 1
          test "$(gh api "repos/$REPO/actions/runs/$ORIGINAL_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name == "twentyfourth-real-original-audit" and .conclusion == "failure")] | length')" = 1
          source_digest="$(gh api "repos/$REPO/actions/runs/$ORIGINAL_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.name == env.SOURCE_NAME) | .digest')"
          worker_digest="$(gh api "repos/$REPO/actions/runs/$ORIGINAL_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.name == env.WORKER_NAME) | .digest')"
          test "$source_digest" = 'sha256:0c214e1f072505d0eea246d942f35c7809dc975947f886016d863a650d2e8e02'
          test "$worker_digest" = 'sha256:fc03967c6a72ee3e7c34bdccea5b812d679ed5f4c5a91528faf20d5d781c47ec'
          python -m py_compile scripts/analysis/mois_species_first_twentyfourth_audit.py
          grep -q 'mois-twentyfourth24-real-original-worker-' scripts/analysis/mois_species_first_twentyfourth_audit.py
          echo 'MOIS_WAVE24_UNMODIFIED_WORKER_AND_SOURCE_VERIFIED'
      - name: Download only signed previously measured source and original worker artifacts
        run: |
          set -euo pipefail
          mkdir -p frozen workers/"$WORKER_NAME"
          gh run download "$ORIGINAL_RUN" --repo "$REPO" --name "$SOURCE_NAME" --dir frozen
          gh run download "$ORIGINAL_RUN" --repo "$REPO" --name "$WORKER_NAME" --dir workers/"$WORKER_NAME"
      - name: Recompute all shard receipts and strict9 numeric/ID/unknown integrity
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m scripts.analysis.mois_species_first_twentyfourth_audit --source frozen/source --workers workers --output audited
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.analysis.mois_species_first_palette9 import sha256
          r=json.loads(Path('audited/receipt.json').read_text())
          m=json.loads(Path('frozen/source/manifest.json').read_text())
          assert r['schema']=='mois_species_first_twentyfourth_authentic_originalROI9_audit_v1'
          assert r['actual_independent_original_photo_attempts']==387
          assert r['actual_genuine_strict9_numeric_success']+r['actual_technical_unknowns']==387
          assert r['source_shard_count']==m['work_units']==2
          assert len(r['original_photo_worker_receipt_sha256'])==2
          assert r['photo_observation_source_taxon_ID_collisions']==0
          assert m['source_previous_attempts']==1228770
          assert r['frozen_original_manifest_sha256']==sha256('frozen/source/manifest.json')
          assert r['audited_derivative_sha256']==sha256('audited/mois_twentyfourth_actual_original_nine_roi.csv.gz')
          assert r['GBIF_occurrences_downloaded']==0 and not r['species_wide_flower_colour_fixed_proven']
          print('MOIS_WAVE24_AUDIT_RESCUE_SIGNED_TERMINAL',json.dumps(r,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-twentyfourth24-real-original-photo-nineROI-audit-recovery
          path: audited/
          retention-days: 90
          if-no-files-found: error
