name: MOIS 128 optical contrast v2 minimum-metadata reviewer packet
on:
  push:
    branches: [analysis/mois-composition-environment-20261030]
    paths:
      - .github/workflows/mois-128-petal-background-blind-v2.yml
      - scripts/analysis/mois_petal_background_blind_gate_v2.py
      - tests/test_mois_petal_background_blind_gate_v2.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-128-v2-local-only-optical-review-packet
  cancel-in-progress: false
jobs:
  metadata-minimized-review-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check independent reviewers, no source metadata exposure, exact source identity and zero new botany
        run: |
          set -euo pipefail
          python -m pip install -q pytest==8.4.2
          python -m pytest -q tests/test_mois_petal_background_blind_gate_v2.py tests/test_mois_petal_background_contrast_review_v1.py
      - name: Fetch only immutable original 128 photo METADATA (NO image pixels)
        run: |
          set -euo pipefail
          mkdir -p frozen
          gh release download mois-real128-existingROI9-failure-botanical-review-browser-20261027-v1 \
            --repo zuizui0223/mois --dir frozen \
            --pattern manual128_existing_original_photoID_review_roster.csv \
            --pattern manual128_botanical_annotation_BLANK_not_yet_reviewed.csv
          echo '5fef860e4d2d0ff4b2dfec850253e4a08c8dc87878647d6712bc61e4b75dcb56  frozen/manual128_existing_original_photoID_review_roster.csv' | sha256sum -c -
          echo 'd75ec591d954d230b66e9b9b74765a5bbab123dc6d5ae39897e9aae263033234  frozen/manual128_botanical_annotation_BLANK_not_yet_reviewed.csv' | sha256sum -c -
      - name: Build strictly blinded HTML and pre-analysis source-support counts
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_petal_background_blind_gate_v2 build \
            --roster frozen/manual128_existing_original_photoID_review_roster.csv \
            --template tools/review/mois_petal_background_manual_template.html \
            --output prepared
          python - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          folder=Path('prepared')
          d=json.loads((folder/'blind128_pre_review_receipt.json').read_text())
          n=json.loads((folder/'blind128_source_support_counts.json').read_text())
          assert d['reviewer_photo_ids']==128 and d['botanical_verified_photos']==0
          assert n['photo_ids']==128 and n['original_strict9_increment']==0
          assert n['regional_counts']['N_arctic']==8
          assert n['source_design_counts']=={
              'historical_K1_FCP_source_heterogeneous':51,
              'p2_first_4096':32,
              'bulk128_131072':25,
              'bias_refill_2048':20,
          }
          for name,sha in d['outputs_sha256'].items():
              f=folder/name
              assert hashlib.sha256(f.read_bytes()).hexdigest()==sha
              content=f.read_text()
              for hidden in ('inat_taxon_id','latitude_zone','local_season',
                             'source_design','screen_status','technical_diagnostic_class'):
                  assert hidden not in content,hidden
              match=re.search(
                  r'<script type="application/json" id="MOIS_MANUAL_ROSTER_JSON">(.*?)</script>',
                  content,re.S)
              roster=json.loads(match.group(1))
              assert len(roster)==128 and all(set(row)=={'photo_id'} for row in roster)
              js=re.findall(r'<script>(.*?)</script>',content,re.S)
              assert len(js)==1
              (folder/(name+'.js')).write_text(js[0])
          print('MOIS128_V2_BLIND_METADATA_REMOVED_0_REAL_BOTANICAL_VERIFICATION')
          PY
          node --check prepared/mois_blind_contrast_reviewer_A.html.js
          node --check prepared/mois_blind_contrast_reviewer_B.html.js
      - uses: actions/upload-artifact@v4
        with:
          name: mois128-v2-minimum-metadata-private-reconciliation-ready
          path: |
            prepared/mois_blind_contrast_reviewer_A.html
            prepared/mois_blind_contrast_reviewer_B.html
            prepared/blind128_pre_review_receipt.json
            prepared/blind128_source_support_counts.json
          retention-days: 90
          if-no-files-found: error
