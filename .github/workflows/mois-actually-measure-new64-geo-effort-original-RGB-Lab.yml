name: MOIS genuine64 new original photos geo effort bias-aware colour pilot
on:
  push:
    branches: [feat/full93m-medium-pixel-firstpass]
    paths:
      - scripts/acquisition/mois_measure_actual64_geo_effort_bias_controlled.py
      - tests/test_mois_measure_actual64_geo_effort_bias_controlled.py
      - .github/workflows/mois-actually-measure-new64-geo-effort-original-RGB-Lab.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mois-genuine-new-original64-previously-uncaptured-taxa-first-actual-500px-photos
  cancel-in-progress: false
jobs:
  original-taxa-independent-observations-and-actual-RGB:
    if: github.repository == 'zuizui0223/mois'
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      MODEL_SHA: f1aaeec4664fe2c178e5cf2bc1f508977bef3e4aa7b40613026cb8ae3de789d5
      RELEASE_TAG: mois-20261026-genuine-new64-geo-effort-bias-500px-floral-box-Lab-v1
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      ULTRALYTICS_OFFLINE: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline synthetic D65 green/brown/white, photo-ID, non-census, and immutable packet regression
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 \
            Pillow==11.3.0 ultralytics==8.4.112
          python -m py_compile scripts/acquisition/mois_measure_actual64_geo_effort_bias_controlled.py
          python -m unittest discover -s tests -p test_mois_flower_box_lab_colour.py -v
          python -m unittest discover -s tests -p test_mois_full93m_floral_lab_v2.py -v
          python -m unittest discover -s tests -p test_mois_measure_actual64_geo_effort_bias_controlled.py -v
      - name: Restore immutable 64 taxon/observation/image source selected before viewing colour
        run: |
          set -euo pipefail
          mkdir -p source weights
          gh release download mois-20261026-minimal64-new-taxa-100plus-tier07-bias-strata-source-v1 \
            --repo "$REPO" --dir source \
            --pattern mois_bounded_bias_aware_newphoto_precolour_source_receipt.json \
            --pattern mois_bounded_bias_aware_tier07_new64_original_source.csv.gz \
            --pattern mois_bounded_new_taxon_original_photo_sampling_provenance.csv
          printf '%s\n' \
            '3debdd9353e423cf21b5f768f8aead9bb7587fcdc5f761ac7e381746d4099b0b  source/mois_bounded_bias_aware_tier07_new64_original_source.csv.gz' \
            'c8b9be91bb27edbe66b52725e34fba0eab8dd5ec5617bca1b99bdaf893ab36ed  source/mois_bounded_new_taxon_original_photo_sampling_provenance.csv' \
            | sha256sum -c -
      - name: Reuse byte-locked original FCP YOLO11 flower detector, no heavy petal organ classifier
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 9fae6ccdf684a46026f72ba12e98de2c5c54bf2a
          git -C "$RUNNER_TEMP/fcp" show FETCH_HEAD:data/atlas/qualification/roi_v4_training/jrc_yolo11n_last_v4.pt > weights/jrc_yolo11n_last_v4.pt
          echo "$MODEL_SHA  weights/jrc_yolo11n_last_v4.pt" | sha256sum -c -
          python - <<'PY'
          from ultralytics import YOLO
          assert YOLO('weights/jrc_yolo11n_last_v4.pt').names.get(0)=='item'
          print('MOIS_TRUE64_ORIGINAL_NEW_TAXA_SAME_FROZEN_YOLO_FLOWER_BOX')
          PY
      - name: Actually fetch only those 64 genuine medium images at maximum 2 RPS and compute CIELAB for every flower candidate
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_measure_actual64_geo_effort_bias_controlled \
            --source source/mois_bounded_bias_aware_tier07_new64_original_source.csv.gz \
            --receipt source/mois_bounded_bias_aware_newphoto_precolour_source_receipt.json \
            --provenance source/mois_bounded_new_taxon_original_photo_sampling_provenance.csv \
            --weights weights/jrc_yolo11n_last_v4.pt \
            --output measured64 --rps 2 --workers 8
          python - <<'PY'
          import csv,gzip,json
          from pathlib import Path
          d=Path('measured64')
          report=json.loads((d/'mois_actual64_original_photo_pixel_bias_aware_receipt.json').read_text())
          assert report['schema']=='mois_20261026_genuine_new64_source_tier07_bias_controlled_photo_srgbLab_v1'
          assert report['new_original_source_photo_attempts']==64
          assert report['new_original_source_observations']==64
          assert report['new_original_source_nominal_taxa']==64
          assert report['source_photo_IDs_ever_measured_before']==0
          assert report['source_observation_IDs_ever_measured_before']==0
          assert report['old_400710_real_roi9_colours_all_preserved']
          assert report['genuine_original_nine_fraction_full_roi_reinferred']==0
          assert sum(report['screen_status_original_64_photos'].values())==64
          assert report['genuine_500px_medium_RGB_decoded']<=64
          assert report['real_flower_box_source_RGB_Lab_photo_count']<=64
          assert report['ROI_quality_sampling_not_global_flora_probability_sample']
          assert len(report['descriptive_strata_all_candidate_and_unknown_in_denominator'])==13
          assert (d/'mois_actual64_photoID_original_RGB_Lab_and_sampling.csv.gz').exists()
          with gzip.open(d/'mois_actual64_photoID_original_RGB_Lab_and_sampling.csv.gz','rt') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==len({x['photo_id'] for x in rows})==64
          assert len({x['observation_id'] for x in rows})==64
          assert len({x['taxon_id'] for x in rows})==64
          assert all(x['source_photo_inclusion_probability']=='' for x in rows)
          assert {x['screen_status'] for x in rows}<={'candidate','negative','uncertain','error'}
          print('MOIS_NEW64_TRULY_FETCHED_ALL_SOURCE_PHOTO_IDS_STRATIFIED_BIASES_PRESERVED',
                json.dumps({k:v for k,v in report.items() if k not in (
                    'descriptive_strata_all_candidate_and_unknown_in_denominator',
                    'source_support_N_within_each_geo_previous_effort_stratum')},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-real64-unique-new-original-source-photo-observation-taxon-bias-aware-Lab
          path: measured64/
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve real new original-photo measurement receipt and every unsuccessful pixel attempt in permanent release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            mkdir -p old
            gh release download "$RELEASE_TAG" --repo "$REPO" --dir old \
              --pattern mois_actual64_original_photo_pixel_bias_aware_receipt.json
            cmp old/mois_actual64_original_photo_pixel_bias_aware_receipt.json \
                measured64/mois_actual64_original_photo_pixel_bias_aware_receipt.json
            echo 'Existing real photo SHA-frozen result exactly matches.'
          else
            gh release create "$RELEASE_TAG" \
              measured64/mois_actual64_original_photo_pixel_bias_aware_receipt.json \
              measured64/mois_actual64_photoID_original_RGB_Lab_and_sampling.csv.gz \
              measured64/mois_actual64_photo_colour_by_bias_stratum.csv \
              measured64/true_500px_photo_pixels/packet-0000000.receipt.json \
              measured64/true_500px_photo_pixels/packet-0000000.csv.gz \
              --repo "$REPO" --target "$GITHUB_SHA" \
              --title 'MOIS 64 newly accessed authentic original photos: geo-balanced independent observations and device Lab floral-region pixels' \
              --notes 'Genuine NEW 64 photo IDs, distinct observations and taxa, from SHA-verified 93,209,351 source, all >=100 photographed taxa previously with zero strict9 ROI after 1–4 trials; four latitude/geographical x two prior-effort cells frozen at 8 each before photo decoding. 500px original medium S3 downloaded at <=2 requests/sec; direct RGB->D65 CIELAB dominant flower YOLO-BOX color, hue/chroma, white-/green-/brown-like fractions. All 64 photo IDs with screen-negative and errors retained; actual results in receipt. NO new verified petal mask or full nine original EfficientSAM ROI measurements. Sampling conditional on previous colour failure is NOT representative of the 93m photo/flora frame; selection phase probabilities are in the pre-colour provenance ledger. Original 1,043,930-photo atlas and 400,710 strict nine ROI colours unchanged; no raw copyrighted photo bytes archived.'
          fi
