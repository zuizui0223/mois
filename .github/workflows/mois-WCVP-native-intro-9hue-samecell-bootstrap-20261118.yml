name: "MOIS Ecology: same-cell WCVP native introduced 9hue geographic bootstrap"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - scripts/analysis/mois_WCVP_native_intro_samecell_hue9_spatial_bootstrap_20261118.py
      - .github/workflows/mois-WCVP-native-intro-9hue-samecell-bootstrap-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-WCVP-native-introduced-samecell-9hue-20261118
  cancel-in-progress: false
jobs:
  real-GSHHG-native-intro-photo-colour-samecell:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install spatial bootstrap data tools
        run: |
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "pandas>=2.1,<3"
          python -m py_compile scripts/analysis/mois_WCVP_native_intro_samecell_hue9_spatial_bootstrap_20261118.py
      - name: Restore exact verified WCVP native intro photo9 assembly outcome
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14400177816/zip" \
            --output source/WCVP_native_9hue_GSHHG_altitude.zip
          echo "cbe1eef381e3e1a0062dbf5134b047f947338b7c499d2ecc0cd22ee8855909fd  source/WCVP_native_9hue_GSHHG_altitude.zip" | sha256sum -c
      - name: 20000 500km block bootstrap paired native introduced Shannon and white fraction in same 100km cells
        run: |
          python -m scripts.analysis.mois_WCVP_native_intro_samecell_hue9_spatial_bootstrap_20261118 \
            --source source/WCVP_native_9hue_GSHHG_altitude.zip \
            --out results/mois_WCVP_native_intro_samecell_geo_boot_20261118
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-WCVP-native-intro-samecell-9colour-geographic-blockbootstrap-20261118
          path: results/mois_WCVP_native_intro_samecell_geo_boot_20261118/
          retention-days: 30
          if-no-files-found: error
