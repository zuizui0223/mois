name: MOIS real 3430502 original-photo full-census unmeasured-source reservation

on:
  pull_request:
    paths:
      - scripts/analysis/mois_full3430502_source_second4096.py
      - tests/test_mois_full3430502_original_photo_reserve.py
      - .github/workflows/mois-full-3430502-new-photo-ID-reserve.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-full-original-3430502-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression guard for source IDs versus photographic flower colours
        run: |
          python -m pip install -q pytest==8.4.2
          python -m pytest -q tests/test_mois_full3430502_original_photo_reserve.py
      - name: Download 3430502 authentic original iNaturalist photo IDs and previous 248312 measured IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original_fcp original_mois
          gh run download 38884223530 --repo zuizui0223/fcp \
            --name fcp-rgfca-1000-EXACT-20260927-original-photo-ID-128-worker-source-NO-PIXELS \
            --dir original_fcp
          gh run download 38990701473 --repo zuizui0223/mois \
            --name mois-248312-original-photographs-120807-classified-FCP_ROI_reused \
            --dir original_mois
      - name: Scan all original 3430502 physical source-photo identifiers and reserve a second observer-independent 4096 photo-ID wave
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_full3430502_source_second4096 \
            --original-full3430502 original_fcp/rgfca_1000_exact_source_photo_IDs/rgfca_1000_complete_original_source_photo_IDs.csv \
            --original-first106376 original_fcp/rgfca_1000_photo_colour_blind_selection/photo_screen_original_metadata_selected.csv \
            --already-measured-248312 original_mois/mois_original_photo_hues_248312_after_FCP_ROI_additions.csv.gz \
            --already-measured-receipt original_mois/mois_248312_frozen_measured_photo_addition_receipt.json \
            --output original_wave2
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('original_wave2/mois_first4096_original_source_only_freeze.json').read_text())
          assert r['original_complete_source_photo_ids']==3430502
          assert r['new_original_unmeasured_source_photo_ids']==3420814
          assert r['new_unmeasured_source_photo_ids_outside_first_screen']==3315910
          assert r['first_wave_original_source_photo_ids']==4096
          assert r['first_wave_taxa']==1000
          assert r['first_wave_distinct_source_observers']==4096
          assert r['no_photo_colour_or_fitness_or_bloom_label_used']
          assert not r['all_3420814_unmeasured_photos_ALREADY_classified']
          print('MOIS_3420814_UNMEASURED_FULL_ORIGINAL_PHOTOS_AND_SECOND_4096_RESERVED_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-full3430502-original-3420814-unmeasured-second-4096-photo-source-WAVE2
          path: original_wave2/
          if-no-files-found: error
          retention-days: 90
