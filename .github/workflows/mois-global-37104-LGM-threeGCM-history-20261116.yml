name: MOIS 37104 species three LGM GCMs versus present climate
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-global-37104-LGM-threeGCM-history-20261116.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-real-37104-LGM-3GCM-worldclim14-20261116
  cancel-in-progress: false

jobs:
  true-GBIF-species-LGM:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned analysis stack and validate synthetic paired history tests
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 \
            rasterio==1.4.3 pyproj==3.7.1 statsmodels==0.14.4 scipy==1.15.2
          python -m py_compile scripts/analysis/mois_lgm_climate_history_species_20261116.py tests/test_mois_lgm_climate_history_species_20261116.py
          python -m unittest discover -s tests -p test_mois_lgm_climate_history_species_20261116.py -v

      - name: Download SHA-signed real global 37104 species GBIF pairs and AGB-NDVI climate features
        run: |
          set -euo pipefail
          mkdir -p sources
          for record in \
            '14166701658 GBIF 422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2' \
            '14219399376 ENV d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc'; do
            set -- $record
            curl --fail --location --silent --show-error --retry 3 --retry-delay 4 \
              --max-time 800 -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/$1/zip" \
              --output "sources/$2.zip"
            echo "$3  sources/$2.zip" | sha256sum -c -
          done

      - name: Download matched WorldClim v1.4 current BIO and 3 LGM model archives
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
            --max-time 800 \
            'https://geodata.ucdavis.edu/climate/worldclim/1_4/grid/cur/bio_10m_bil.zip' \
            --output sources/WC14_CURRENT.zip
          for entry in \
              'CCSM4 cclgmbi_10m.zip' \
              'MIROC mrlgmbi_10m.zip' \
              'MPI melgmbi_10m.zip'; do
            set -- $entry
            curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
              --max-time 800 \
              "https://geodata.ucdavis.edu/climate/cmip5/lgm/$2" \
              --output "sources/WC14_LGM_$1.zip"
          done
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib
          for file in sorted(Path("sources").glob("WC14_*.zip")):
              assert file.stat().st_size > 100000, f"{file}: suspicious download"
              with zipfile.ZipFile(file) as z:
                  names=z.namelist()
                  assert len(names) >= 4, f"{file}: empty archive"
                  assert z.testzip() is None, f"{file}: corrupt archive"
                  print("MOIS_LGM_RAW_ARCHIVE",file.name,file.stat().st_size,
                        hashlib.sha256(file.read_bytes()).hexdigest(),
                        "examples:",names[:8],flush=True)
          PY

      - name: Extract paired climate deltas to all 18577 GBIF cells and test 37104 species
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_lgm_climate_history_species_20261116 \
            --gbif sources/GBIF.zip --env sources/ENV.zip \
            --current sources/WC14_CURRENT.zip \
            --ccsm4 sources/WC14_LGM_CCSM4.zip \
            --miroc sources/WC14_LGM_MIROC.zip \
            --mpi sources/WC14_LGM_MPI.zip \
            --output MOIS_LGM_real
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          s=json.loads(Path('MOIS_LGM_real/receipt.json').read_text())
          assert s['gbif_accepted_species']==37104
          assert s['species_x_grid_pairs']==5493931
          assert s['source_valid_GBIF_occurrences']==396142825
          assert s['n_current_occupied_global_cells']==18577
          assert s['results']['n_species_used']>10000
          assert len(s['worldclim']['models'])==3
          assert s['current_occupancy_is_not_refugium']
          assert s['photo9_is_not_verified_true_petal_colour']
          print("MOIS_LGM_TRUE_DATA_COMPLETION",
                json.dumps({'species':s['gbif_accepted_species'],
                            'n_modelled':s['results']['n_species_used'],
                            'joint_genus_equal_q_BH':{
                              k:v['genus_equal']['q_BH_four_historic_models']
                              for k,v in s['results']['models'].items()}
                           },sort_keys=True),flush=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MOIS-real-37104-photo9-WorldClim14-LGM-3GCM-paired-history
          path: MOIS_LGM_real/
          retention-days: 90
          if-no-files-found: warn
