name: MOIS GBIF photo-colour fourth-corner JSDM native region data-readiness pilot
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-JSDM-GBIF-fourthcorner-native-region-preflight-20261117.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-JSDM-source-native-region-preflight-v1
  cancel-in-progress: false

jobs:
  regional-fourth-corner-source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original pin and test immutable geography/trait-neutral selection
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 \
            pyarrow==19.0.1 scipy==1.15.2 statsmodels==0.14.4 \
            shapely==2.0.7 geopandas==1.0.1 pyproj==3.7.1 rasterio==1.4.3
          python -m py_compile scripts/analysis/mois_jsdm_fourthcorner_gbif_native_pilot_20261117.py
          python -m unittest discover -s tests \
            -p 'test_mois_jsdm_fourthcorner_gbif_native_pilot_20261117.py' -v
      - name: Load EXACT signed global GBIF species x 100km and NPP LGM source archives
        run: |
          set -euo pipefail
          mkdir -p sources/WCVP
          for row in \
            '14166701658 GBIF 422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2' \
            '14219399376 ENV d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc' \
            '14225733755 LGM db3b5b4fa2133194963be9233411bb6bb50bc86393d1dc50d996cc4cc78b25ab' \
            '14235983742 NPP 68b2cfa1aeac9dc5d02cd310c9b2f45553a5be4db3319a1e40897612ad9b1bef' \
            '14227246751 SPATIAL e209257adbc185b4855f3b8d76aeaa50d2e2afe8a1feeb0f76013366e57c4d16' \
            '14219565387 NDVI e08e81d1c2afd1a2ee5312f3ebc4aeb5ab7678988c2453a2a9c63d28c82eb17a'; do
            set -- $row
            curl --fail --location --silent --show-error --retry 3 --retry-delay 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/$1/zip" \
              --output "sources/$2.zip"
            echo "$3  sources/$2.zip" | sha256sum -c -
          done
      - name: Restore pinned Kew WCVP native botanical countries and regional polygons
        run: |
          set -euo pipefail
          tag='mois-real350399-kew-wcvp-native-tdwg3-source-v1'
          for f in \
            'mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz' \
            'mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz' \
            'mois350399_wcvp_TDWG3_source_only_taxon_native_receipt.json'; do
            curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://github.com/zuizui0223/mois/releases/download/$tag/$f" \
              -o "sources/WCVP/$f"
          done
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/tdwg/wgsrpd/52da7828aba9d461dd133c27b3bd7a4407161f54/geojson/level3.geojson" \
            -o sources/TDWG3.geojson
          echo 'c172bcf6aba20e19477adc60aebf0023068f0175dca8480f0760b090dcf64840  sources/TDWG3.geojson' | sha256sum -c -
      - name: Compile 3 region-gated actual GBIF recording and native-range pseudoabsence matrices
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_jsdm_fourthcorner_gbif_native_pilot_20261117 \
            --gbif sources/GBIF.zip --env sources/ENV.zip \
            --lgm sources/LGM.zip --spatial sources/SPATIAL.zip \
            --ndvi sources/NDVI.zip --npp sources/NPP.zip \
            --wcvp sources/WCVP --tdwg sources/TDWG3.geojson \
            --out MOIS_JSDM_fourthcorner_native_pilot
          python - <<'PY'
          import json
          p='MOIS_JSDM_fourthcorner_native_pilot/receipt.json'
          m=json.load(open(p))
          assert m['source_accepted_species']==37104
          assert m['source_GBIF_species_100km_pairs']==5493931
          assert m['no_genus_effect_or_genus_selection']
          assert m['GBIF_reporting_effort_proxy_in_X']
          assert not m['GBIF_reporting_effort_proxy_is_not_survey_effort'] is False
          assert m['response_is_apparent_recorded_species_not_true_occupancy']
          assert m['not_fitted_JSDM_yet']
          panels=m['panels']
          assert len(panels)==3
          successful=[x for x in panels.values()
                if x['status'].startswith('source_authenticated')]
          assert len(successful)>=1
          assert all(x['unrecorded_does_NOT_establish_true_absence']
                for x in successful)
          print('MOIS_TRUE_GBIF_NATIVE_JSDM_FOURTHCORNER_READY',json.dumps({
            x:{'sites':v['n_sites'],'species':v['n_species'],
               'recorded':v['n_observed_native_species_sites'],
               'eligible_not_recorded':v['n_unrecorded_but_WCVP_eligible_species_sites']}
            for x,v in panels.items()
              if v['status'].startswith('source_authenticated')},
            sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-source-verified-GBIF-native-JSDM-fourthcorner-three-regions-Y-X-TR
          path: MOIS_JSDM_fourthcorner_native_pilot/
          retention-days: 90
          if-no-files-found: warn
