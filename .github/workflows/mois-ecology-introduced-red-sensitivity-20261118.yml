name: "MOIS Ecology: robustness of red hue and WCVP introduction propensity"
on:
  push:
    branches:
      - analysis/mois-ecology-moisture-temperature-interactions-20261118
    paths:
      - scripts/analysis/mois_intro_red_hue_sensitivity_20261118.py
      - .github/workflows/mois-ecology-introduced-red-sensitivity-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-ecology-introduced-red-sensitivity-20261118
  cancel-in-progress: false
jobs:
  genuine-WCVP-red-hue:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install stable numerical and regression dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "pyarrow>=17,<25" \
            "scikit-learn>=1.5,<1.9" "scipy>=1.11,<2" "statsmodels>=0.14,<1"
      - name: Restore exact signed source traits and original Kew WCVP regional records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source/WCVP
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14219399376/zip" \
            --output source/ENV.zip
          echo "d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc  source/ENV.zip" | sha256sum -c
          tag="mois-real350399-kew-wcvp-native-tdwg3-source-v1"
          for f in \
             mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz \
             mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz \
             mois350399_wcvp_TDWG3_source_only_taxon_native_receipt.json; do
             curl -fsSL --retry 3 \
               -H "Authorization: Bearer $GH_TOKEN" \
               "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$f" \
               --output "source/WCVP/$f"
          done
      - name: Run actual red-vs-white and red-vs-other 8 hues with all ecological checks
        run: |
          python scripts/analysis/mois_intro_red_hue_sensitivity_20261118.py \
            --env source/ENV.zip \
            --wcvp source/WCVP \
            --out results/mois_intro_red_ecological_sensitivity_20261118
      - name: Upload signed model effects, source receipts and OOF genus holdout
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-WCVP-introduced-red-photo-hue-sensitivity-20261118
          path: results/mois_intro_red_ecological_sensitivity_20261118/
          if-no-files-found: error
          retention-days: 30
