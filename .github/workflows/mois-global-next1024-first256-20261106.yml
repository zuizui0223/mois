name: MOIS next1024 first256 global environmental values (no area cutoff)
on:
  push:
    branches: [analysis/mois-viirs-popmatch-20261105]
    paths: [.github/workflows/mois-global-next1024-first256-20261106.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-global-noarea-2020-256-source-data
  cancel-in-progress: false
jobs:
  original-environment-increment:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original collector and fail-closed missingness contracts
        run: |
          set -euo pipefail
          python -m pip install -q requests==2.32.5
          python -m unittest discover -s tests -p test_mois_global_cached_environment_20261106.py -v
      - name: Reconstruct frozen manifest and exclude every previous request identity
        run: |
          set -euo pipefail
          mkdir -p previous input
          gh run download 42192184774 --repo zuizui0223/mois --name mois-global-noarea-2020-256-real-values-and-response-SHAs --dir previous
          echo '303424afe40b41e7bda2ec0ae456dd27820a50e17f7ca23204c81036adf21466  previous/global_output/values.csv' | sha256sum -c -
          python - <<'PY'
          import base64,gzip,csv,io,json,hashlib
          from pathlib import Path
          from scripts.analysis.mois_global_cached_environment_20261106 import spec,key,MONTHS
          shas=['79775741c9c78c911a29c0e5501b8d33109ea2767c66e0e2038a88bf6c1ad772','7a5852b739564e2f664a20b0b67856b2c12701d0157d99bb28304348836bce10','9050dc56115b24e7cda5ae57d539313c21b4ae94e31d7da60ea0da0908474bcb','9b0961bcba509f185a0a5c79119f0b2a01f60871eb1a012124d184954c308676']
          rows=[]
          for i,digest in enumerate(shas):
              encoded=Path(f'config/mois_next1024_20261106/part_{i:02d}.csv.gz.b64').read_text()
              raw=gzip.decompress(base64.b64decode(encoded))
              assert hashlib.sha256(raw).hexdigest()==digest, 'Transport corruption: stop before provider request'
              part=list(csv.DictReader(io.StringIO(raw.decode())))
              assert len(part)==64
              rows.extend(part)
          buf=io.StringIO(newline='')
          w=csv.DictWriter(buf,fieldnames=list(rows[0]),lineterminator='\n');w.writeheader();w.writerows(rows)
          raw=buf.getvalue().encode()
          expected='01da6df6c7b2a5b21c70b4a2a65364f0eb6c9c4cbb16ac0b0f7c6ff5fdd04d34'
          assert hashlib.sha256(raw).hexdigest()==expected
          Path('input/targets.csv').write_bytes(raw)
          old=list(csv.DictReader(Path('previous/global_output/values.csv').open()))
          assert len(rows)==256 and len({r['target_id'] for r in rows})==256
          assert not {r['target_id'] for r in rows}&{r['target_id'] for r in old}
          assert all(r['target_id'].startswith('2020|') for r in rows)
          def keys(items):
              return {key(spec(p,2020,m,r['query_longitude'],r['query_latitude'])) for r in items for p,m in [('viirs',m) for m in MONTHS]+[('population_global1',0)]}
          assert len(keys(rows))==1280 and not keys(rows)&keys(old)
          assert sum(r['land_class']=='mainland' for r in rows)==226
          assert sum(r['land_class']=='island' for r in rows)==30
          assert sum(abs(float(r['query_latitude']))>60 for r in rows)==5
          record={'prepared_1024_manifest_sha256':'94a9685b0051d573cd0a7ec2c06579e2c7382944bd1146ac38d5b85d86316472','block_index':0,'planned_here':256,'prepared_not_launched_remaining':768,'block_manifest_sha256':expected,'source_queue_sha256':'4f7b681a8789af565d149fd78d9c1f573b0f28952ecbbbec35302bc29b6f9ca5','selection':'first256 of the already fixed next1024 SHA256-ranked pending 2020 known-land targets','no_area_or_latitude_exclusion':True,'previous256_target_overlap':0,'previous256_request_overlap':0,'new_photo_downloads_or_inferences':0}
          Path('input/selection_receipt.json').write_text(json.dumps(record,indent=2,sort_keys=True)+'\n')
          print('MOIS_NEXT1024_BLOCK0_EXACT_SOURCE_AND_DUPLICATE_EXCLUSION_VERIFIED',json.dumps(record),flush=True)
          PY
      - uses: actions/cache/restore@v4
        with:
          path: output
          key: mois-next1024-block0-01da6df6-raw-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mois-next1024-block0-01da6df6-raw-v1-
      - name: Retrieve actual environmental response bytes; at most four concurrent requests
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_global_cached_environment_20261106 --targets input/targets.csv --out output --workers 4
      - name: Independently reparse every raw response offline without further acquisition
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_global_cached_environment_20261106 --targets input/targets.csv --out output --workers 4 --offline
          python - <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          p=Path('output')
          r=json.loads((p/'receipt.json').read_text());q=json.loads((p/'replay_receipt.json').read_text())
          assert r['targets_planned']==256 and r['targets_attempted']==256
          assert q['requests_new']==0 and q['requests_reused']==1280
          assert (p/'values.csv').read_bytes()==(p/'replay_values.csv').read_bytes()
          assert r['values_sha256']==q['values_sha256']==hashlib.sha256((p/'values.csv').read_bytes()).hexdigest()
          assert r['targets_complete']==q['targets_complete']
          assert r['area_filter'] is None and r['latitude_filter'] is None
          assert r['new_photo_requests']==0 and r['ROI_reinference']==0
          print('MOIS_NEXT1024_FIRST256_ACQUIRED_AND_REPLAYED',json.dumps(r,sort_keys=True),flush=True)
          PY
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: output
          key: mois-next1024-block0-01da6df6-raw-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-global-next1024-block0-256-real-environment-raw-SHAs
          path: |
            output/
            input/
          retention-days: 90
          if-no-files-found: error
