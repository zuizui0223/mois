name: MOIS epoch4 offset2048 frozen new zero-ROI taxa conditional true-pixel ROI9
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-20261116-epoch4-offset2048-source-and-conditional-original-photo9.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-epoch4-offset2048-one-signed-source-sha
  cancel-in-progress: false

jobs:
  source-only-frozen-taxonomy-next-distinct-128:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      PYTHONUNBUFFERED: '1'
    outputs:
      has_new: ${{ steps.freeze.outputs.has_new }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require prior 1792 four completed SUCCESS jobs and exact four frozen ZIP signatures
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          repo="zuizui0223/mois";rid=43748476569
          get=lambda p:json.loads(subprocess.check_output(["gh","api",p]))
          r=get(f"repos/{repo}/actions/runs/{rid}")
          assert r["status"]=="completed" and r["conclusion"]=="success",r
          jobs={x["name"]:x["conclusion"] for x in get(f"repos/{repo}/actions/runs/{rid}/jobs?per_page=100")["jobs"]}
          assert jobs=={
              "source-only-frozen-taxonomy-next-distinct-128":"success",
              "pixel-worker-only-if-novel-original":"success",
              "independent-byte-identity-and-strict9-audit":"success",
              "formal-append-only-after-independent-audit":"success"},jobs
          expected={
              "mois-20261116-epoch4-offset1792-signed-1231343-ID-disjoint-source":("14175237612","f965e0fe328fe525cf2e049492438350ee6489e3ae03d53ddb27c27a3a36419b"),
              "mois-20261116-epoch4-offset1792-genuine-FCP-ROI9-pixel-terminal":("14175850215","f8cbc8a0da92999c5baa8fe53412ce429f756600cb78972f4117fa342f2697de"),
              "mois-20261116-epoch4-offset1792-independent-strict9-audit":("14175407514","5797db14825a0ed7d864011584b192287a550e9b462f8e29be30105c4b0e52ed"),
              "mois-20261116-epoch4-offset1792-genuine-original-42111-taxonomy-append":("14175243371","5740d24db7b7c3e9bcbfdf05415e732a4376c98fc20d63ffcc927014686a9667")}
          arts=get(f"repos/{repo}/actions/runs/{rid}/artifacts?per_page=100")["artifacts"]
          assert len(arts)==4,arts
          for name,(id,sha) in expected.items():
              xs=[a for a in arts if a["name"]==name and str(a["id"])==id and
                  a["digest"]=="sha256:"+sha and not a["expired"]]
              assert len(xs)==1,(name,arts)
          PY
          test "$(gh run list --repo "$REPO" --workflow mois-20261116-epoch4-offset2048-source-and-conditional-original-photo9.yml --limit 100 --json databaseId --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID)] | length")" = 0

      - name: Require terminal offset1920 SUCCESS and exact signed source (no candidate pixels)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          repo="zuizui0223/mois";rid=43754893198
          get=lambda p:json.loads(subprocess.check_output(["gh","api",p]))
          r=get(f"repos/{repo}/actions/runs/{rid}")
          assert r["status"]=="completed" and r["conclusion"]=="success",r
          jobs={j["name"]:j["conclusion"] for j in get(f"repos/{repo}/actions/runs/{rid}/jobs?per_page=100")["jobs"]}
          assert jobs=={"source-only-frozen-taxonomy-next-distinct-128":"success",
              "pixel-worker-only-if-novel-original":"skipped",
              "independent-byte-identity-and-strict9-audit":"skipped",
              "formal-append-only-after-independent-audit":"skipped"},jobs
          a=get(f"repos/{repo}/actions/runs/{rid}/artifacts?per_page=100")["artifacts"]
          assert len(a)==1 and a[0]["id"]==14177882344 and
              a[0]["name"]=="mois-20261116-epoch4-offset1920-signed-1231344-ID-disjoint-source" and
              a[0]["digest"]=="sha256:9347236b94e03e91d423a7b3b67f0ba0515c86f82d59e1083f793754112f73a6" and
              not a[0]["expired"],a
          PY
      - name: Load certified new 1231344-attempt atlas, signed 1792 stage and full historical ID/UUID deltas
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p latest sealed_source sealed_worker sealed_audit old/history old/new11 old/new64 old/new18 old/offset1152 old/offset1536 old/offset1792 old/offset2048 old/epoch3_offset1792 old/epoch4_offset896 old/epoch4_offset1792
          gh run download 43748476569 --repo "$REPO" --name mois-20261116-epoch4-offset1792-genuine-original-42111-taxonomy-append --dir latest
          gh run download 43748476569 --repo "$REPO" --name mois-20261116-epoch4-offset1792-signed-1231343-ID-disjoint-source --dir sealed_source
          gh run download 43748476569 --repo "$REPO" --name mois-20261116-epoch4-offset1792-genuine-FCP-ROI9-pixel-terminal --dir sealed_worker
          gh run download 43748476569 --repo "$REPO" --name mois-20261116-epoch4-offset1792-independent-strict9-audit --dir sealed_audit
          gh run download 43546479575 --repo "$REPO" --name mois-postsnapshot-two-CC-photos-full-1231244-ID-source --dir old/history
          gh run download 43561529394 --repo "$REPO" --name mois-five-postsnapshot11-real-original-iNat-photo9-42111-taxa-append --dir old/new11
          gh run download 43562522326 --repo "$REPO" --name mois-new1909-fresh-original-real-ROI9-42111-taxonomy-appended --dir old/new64
          gh run download 43566369683 --repo "$REPO" --name mois-postsnap-remaining18-genuine-ROI9-cumulative-atlas --dir old/new18
          gh run download 43599310470 --repo "$REPO" --name mois-20261114-offset1152-independent-strict9-audit --dir old/offset1152
          gh run download 43608952945 --repo "$REPO" --name mois-20261114-offset1536-independent-strict9-audit --dir old/offset1536
          gh run download 43612554673 --repo "$REPO" --name mois-20261114-offset1792-independent-strict9-audit --dir old/offset1792
          gh run download 43669250173 --repo "$REPO" --name mois-20261115-epoch2-offset2048-independent-strict9-audit --dir old/offset2048
          gh run download 43702087793 --repo "$REPO" --name mois-20261115-epoch3-offset1792-independent-strict9-audit --dir old/epoch3_offset1792
          gh run download 43731496142 --repo "$REPO" --name mois-20261116-epoch4-offset896-independent-strict9-audit --dir old/epoch4_offset896
          cp sealed_audit/new_real_original_nine_photo9_delta.parquet old/epoch4_offset1792/new_real_original_nine_photo9_delta.parquet
          cp latest/mois_42111_post20261114_new_independent_original_photo9.csv.gz latest/atlas.csv.gz

      - name: Byte-verify source manifest, worker and independent audit, complete photo/UUID history, atlas
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,hashlib,json,numpy as np
          from pathlib import Path
          from scripts.acquisition import mois_epoch4_post1792_rebased_photo9 as c
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          s=json.loads(Path("sealed_source/receipt.json").read_bytes())
          w=json.loads(Path("sealed_worker/shard_000/receipt.json").read_bytes())
          a=json.loads(Path("sealed_audit/receipt.json").read_bytes())
          f=json.loads(Path("latest/receipt.json").read_bytes())
          assert h("sealed_source/source_candidates.csv")==s["source_candidates_SHA256"]=="883dbb3716bcef734f7c5d4802d2f64e2f799cc1c5c4c93851a03075154fa04b"
          assert h("sealed_source/manifest.json")==s["source_manifest_SHA256"]=="055ad46f4aa6ad8bcf5d544711833735b0e305c0528ad6c12e37e69da5a063e6"
          assert h("sealed_source/shards/shard-000.csv")==s["source_shard_SHA256"]=="84460ffd40800f5d6df1a149131611d067dfc4480c50a0ad5b030539ce895b19"
          assert h("sealed_audit/receipt.json")=="33d44ba9778774df540183972a2bbbe24ca60bd76452a4c73c312d260873233b"
          assert h("sealed_worker/shard_000/receipt.json")==a["source_and_worker_sha256"]["worker_receipt_sha256"]=="4fa4bd71a45bfa765465dc34cd8a0a78fafd4d1ab19166593c4ebdbe71474749"
          assert h("sealed_audit/new_real_original_nine_photo9_delta.parquet")==a["verified_delta_sha256"]==c.NEW_DELTA_SHA
          assert h("latest/atlas.csv.gz")==f["derived_atlas_sha256"]==c.NEW_ATLAS_SHA
          assert (s["hash_disjoint_taxon_offset"],s["searched_zero_numeric_taxa"],s["source_API_error_count"],s["new_independent_original_photo_candidates"])==(1792,128,0,1)
          assert (a["new_authentic_original_attempts"],a["new_strict9_numeric_photos"],a["new_technical_unknowns"])==(1,0,1)
          assert a["technical_unknown_nine_fractions_all_missing"] is True
          assert (f["cumulative_photo_attempts"],f["cumulative_genuine_numeric_photos"],f["cumulative_numeric_taxa"],f["cumulative_clear_sampled_photo_taxa"],f["zero_numeric_remaining"])==(1231344,467566,39912,39173,2199)
          ids,uuids,raw=c.history()
          assert len(ids)==1231344 and len(raw)==100
          atlas=c.m.read_atlas("latest/atlas.csv.gz")
          assert len(atlas)==42111 and atlas.inat_taxon_id.is_unique
          numeric=atlas.after_strict9.gt(0)
          cols=["observed_mean_"+x for x in ("white","yellow","orange","red","pink","magenta","purple","blue","bronze")]
          v=atlas.loc[numeric,cols].to_numpy(float)
          assert int(numeric.sum())==39912 and int((~numeric).sum())==2199
          assert np.isfinite(v).all() and (v>=0).all() and np.all(abs(v.sum(axis=1)-1)<=0.001)
          assert atlas.loc[~numeric,cols].isna().all().all()
          q=atlas.loc[atlas.inat_taxon_id.eq("790813")].iloc[0]
          assert q.after_strict9==0
          # Frozen hash disjointness: 1920 excludes all earlier 15 cohorts.
          prior=set()
          for off in range(0,2048,128):
              cohort=set(c.prev.prev.select_epoch4_taxa(atlas,128,off))
              assert len(cohort)==128 and not prior.intersection(cohort)
              prior.update(cohort)
          nxt=set(c.prev.prev.select_epoch4_taxa(atlas,128,2048))
          assert len(prior)==2048 and len(nxt)==128 and not prior.intersection(nxt)
          print("MOIS_1231344_100_SHA_42111_9VECTOR_2048_HASH_DISJOINT_GATE_SUCCESS",flush=True)
          PY
      - name: Search next 128 zero-ROI taxon sources, never count candidates as pixel ROI
        id: freeze
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_epoch4_post1792_rebased_photo9 source --atlas latest/atlas.csv.gz --output newest --offset 2048
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          r=json.load(open("newest/receipt.json"))
          assert r["schema"]=="mois_incremental_20261116_epoch4_rebased_after_offset1792_original_photo9_v3"
          assert (r["hash_disjoint_taxon_offset"],r["searched_zero_numeric_taxa"],r["source_API_error_count"],r["old_original_photo_attempt_ID_count"],r["old_original_photo_obs_ID_overlap"])==(2048,128,0,1231344,0)
          assert r["old_all_image_raw_SHA_disjointness_proven"] is False
          assert r["strict9_numeric_photos"]==0 and r["original_pixels_fetched"]==0
          rows=list(csv.DictReader(open("newest/source_taxon_status.csv")))
          assert len(rows)==len({x["inat_taxon_id"] for x in rows})==128
          assert all(x["status"]=="source_queried" for x in rows)
          print("has_new="+str(r["new_independent_original_photo_candidates"]>0).lower())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-20261116-epoch4-offset2048-signed-1231344-ID-disjoint-source
          path: newest/
          retention-days: 90
          if-no-files-found: error

  pixel-worker-only-if-novel-original:
    needs: source-only-frozen-taxonomy-next-distinct-128
    if: needs.source-only-frozen-taxonomy-next-distinct-128.outputs.has_new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-20261116-epoch4-offset2048-signed-1231344-ID-disjoint-source
          path: signed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Immutable FCP YOLO11 EfficientSAM ROI-v4 from actual provider RGB
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Acquire genuinely new provider original RGB, measure strict9 ROI
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-epoch4-offset2048-original-only"
          python -m scripts.acquisition.mois_full_index_real_original_photo_measure work --source signed --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" --group 0 --output pixel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-20261116-epoch4-offset2048-genuine-FCP-ROI9-pixel-terminal
          path: pixel/
          retention-days: 90
          if-no-files-found: warn

  independent-byte-identity-and-strict9-audit:
    needs: [source-only-frozen-taxonomy-next-distinct-128, pixel-worker-only-if-novel-original]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load prior ID/UUID and signed independent deltas
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p signed pixel old/history old/new11 old/new64 old/new18 old/offset1152 old/offset1536 old/offset1792 old/offset2048 old/epoch3_offset1792 old/epoch4_offset896 old/epoch4_offset1792
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch4-offset2048-signed-1231344-ID-disjoint-source --dir signed
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch4-offset2048-genuine-FCP-ROI9-pixel-terminal --dir pixel
          gh run download 43546479575 --repo "$REPO" --name mois-postsnapshot-two-CC-photos-full-1231244-ID-source --dir old/history
          gh run download 43561529394 --repo "$REPO" --name mois-five-postsnapshot11-real-original-iNat-photo9-42111-taxa-append --dir old/new11
          gh run download 43562522326 --repo "$REPO" --name mois-new1909-fresh-original-real-ROI9-42111-taxonomy-appended --dir old/new64
          gh run download 43566369683 --repo "$REPO" --name mois-postsnap-remaining18-genuine-ROI9-cumulative-atlas --dir old/new18
          gh run download 43599310470 --repo "$REPO" --name mois-20261114-offset1152-independent-strict9-audit --dir old/offset1152
          gh run download 43608952945 --repo "$REPO" --name mois-20261114-offset1536-independent-strict9-audit --dir old/offset1536
          gh run download 43612554673 --repo "$REPO" --name mois-20261114-offset1792-independent-strict9-audit --dir old/offset1792
          gh run download 43669250173 --repo "$REPO" --name mois-20261115-epoch2-offset2048-independent-strict9-audit --dir old/offset2048
          gh run download 43702087793 --repo "$REPO" --name mois-20261115-epoch3-offset1792-independent-strict9-audit --dir old/epoch3_offset1792
          gh run download 43731496142 --repo "$REPO" --name mois-20261116-epoch4-offset896-independent-strict9-audit --dir old/epoch4_offset896
          gh run download 43748476569 --repo "$REPO" --name mois-20261116-epoch4-offset1792-independent-strict9-audit --dir old/epoch4_offset1792
      - name: Independent bytes and IDs, finite nonnegative sum-to-one nine or all-missing unknown
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_epoch4_post1792_rebased_photo9 audit --source signed --worker pixel --output audited
      - uses: actions/upload-artifact@v4
        with:
          name: mois-20261116-epoch4-offset2048-independent-strict9-audit
          path: audited/
          retention-days: 90
          if-no-files-found: error

  formal-append-only-after-independent-audit:
    needs: [source-only-frozen-taxonomy-next-distinct-128, independent-byte-identity-and-strict9-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load latest sealed atlas and independently accepted numerical delta
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p latest signed pixel audited
          gh run download 43748476569 --repo "$REPO" --name mois-20261116-epoch4-offset1792-genuine-original-42111-taxonomy-append --dir latest
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch4-offset2048-signed-1231344-ID-disjoint-source --dir signed
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch4-offset2048-genuine-FCP-ROI9-pixel-terminal --dir pixel
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch4-offset2048-independent-strict9-audit --dir audited
      - name: Formal append only audited genuine RGB-nine data; unknown stays missing
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_epoch4_post1792_rebased_photo9 append --atlas latest/mois_42111_post20261114_new_independent_original_photo9.csv.gz --source signed --worker pixel --audit audited --output appended
      - uses: actions/upload-artifact@v4
        with:
          name: mois-20261116-epoch4-offset2048-genuine-original-42111-taxonomy-append
          path: appended/
          retention-days: 90
          if-no-files-found: error
