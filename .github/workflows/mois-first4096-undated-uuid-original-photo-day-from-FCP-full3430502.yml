name: MOIS restore real first4096 UUID-only photo observed days from signed original 3430502 provider metadata

on:
  pull_request:
    paths:
      - "scripts/acquisition/mois_first4096_undated_uuid_photo_days_from_original3430502.py"
      - "tests/test_mois_first4096_uuid_day_from_full3430502.py"
      - ".github/workflows/mois-first4096-undated-uuid-original-photo-day-from-FCP-full3430502.yml"
      - "docs/MOIS_RECOVER_FIRST4096_UUID_PHOTOS_OBSERVED_ON_FROM_SOURCE3430502_20261017.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-original-4096-UUID-source-photo-days-from-full3430502-20260927
  cancel-in-progress: false

jobs:
  actual-original4096-UUID-photo-ID-date-lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source original 4096 UUID-photo metadata join, complete-byte SHA, unknown dates
        run: |
          python -m pip install -q 'pandas==2.2.3' 'numpy==2.1.3' 'pytest==8.4.2'
          python -m pytest -q tests/test_mois_first4096_uuid_day_from_full3430502.py
      - name: Restore authoritative 3430502 original photo-day and already measured real 295017 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authoritative_fcp_metadata signed_real295017
          gh run download 38884223530 --repo zuizui0223/fcp \
            --name fcp-rgfca-1000-EXACT-20260927-original-photo-ID-128-worker-source-NO-PIXELS \
            --dir authoritative_fcp_metadata
          gh run download 39015660689 --repo zuizui0223/mois \
            --name mois-295017-original-photo-142538-genuine-hues-140247-verified-observation-dates \
            --dir signed_real295017
          test -s authoritative_fcp_metadata/rgfca_1000_exact_source_photo_IDs/rgfca_1000_complete_original_source_photo_IDs.csv
          test -s signed_real295017/mois_real295017_original_photo_hues_plus_verified_observed_dates.csv.gz
          zip -j -q signed_real295017_source.zip signed_real295017/*
      - name: Stream SHA-frozen full 3430502 iNaturalist source photo metadata to find first4096 photo observation days
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_first4096_undated_uuid_photo_days_from_original3430502 \
            --original295017-source-photo-zip signed_real295017_source.zip \
            --authoritative-original-full3430502-photo-metadata-csv authoritative_fcp_metadata/rgfca_1000_exact_source_photo_IDs/rgfca_1000_complete_original_source_photo_IDs.csv \
            --output real_source_first4096_UUID_observed_on
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('real_source_first4096_UUID_observed_on/mois_first4096_uuid_observation_photo_day_original_source_QC_receipt.json').read_text())
          assert d['original_firstwave_measured_photo_IDs_without_date']==4096
          assert d['original_firstwave_classifiable_four_hue_photo_IDs_without_date']==1576
          assert d['FCP_source_rows_fully_scanned']==3430502
          assert d['FCP_authoritative_3430502_metadata_SHA256']=='58e037a210e23d3ff5d6f04d392665ada5ee9ac5149d0676672c239cf092df01'
          assert 0<=d['new_source_dated_original_four_hue_classifiable_photo_IDs']<=1576
          assert 0<=d['original_photo_IDs_with_authenticated_full_source_calendar_day']<=4096
          assert d['source_all_4096_original_photo_date_result_SHA256']
          assert d['original_four_hue_photo_ROIs_not_reclassified']
          assert d['actual_observation_year_month_weather_exposure_NOT_derived']
          print('MOIS_REAL_UUID4096_PHOTO_ID_METADATA_SNAPSHOT_DATE_QC_COMPLETED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-real-first4096-UUID-original-photo-to-3430502-source-observed-day
          path: real_source_first4096_UUID_observed_on/
          retention-days: 90
          if-no-files-found: warn
