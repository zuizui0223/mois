name: MOIS new1909 source and immediate genuine original FCP ROI9 append to 42111 species
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - scripts/acquisition/mois_postsnap1909_remaining_true_original_ROI9.py
      - tests/test_mois_postsnap1909_remaining_true_original_ROI9.py
      - .github/workflows/mois-postsnap-new1909-genuine-ROI9-to-atlas.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-postsnap-other1909-genuine-ROI9-first64-source-and-pixels-once
  cancel-in-progress: false
jobs:
  verify-1909-taxonomy-and-freeze-real-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    outputs:
      has_new: ${{ steps.freeze.outputs.has_new }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      SOURCE_RUN: '43561169876'
      ATLAS_RUN: '43561529394'
      FULL_HIST_RUN: '43546479575'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Genuine new original source, finite nine-fraction and uncertainty offline tests
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          python -m unittest discover -s tests -p test_mois_postsnap1909_remaining_true_original_ROI9.py -v
      - name: Require completed 15 stratum real iNaturalist API source, no new photo re-query
        run: |
          set -euo pipefail
          finished=false
          for attempt in $(seq 1 150); do
            status="$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq .status)"
            if [ "$status" = completed ]; then
              conclusion="$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq .conclusion)"
              test "$conclusion" = success
              finished=true
              break
            fi
            sleep 20
          done
          test "$finished" = true
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" \
            --jq '[.jobs[] | select((.name | startswith("fifteen-disjoint-real-api-strata")) and .conclusion=="success")] | length')" = 15
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name=="global-15-strata-source-only-union" and .conclusion=="success")] | length')" = 1
          echo "MOIS_AUTHENTIC_1909_ORIGINAL_PUBLIC_API_SOURCE_15_GROUPS_SUCCESS"
      - name: Restore immutable 1231255-photo original history and after11 42111-taxon colour atlas
        run: |
          set -euo pipefail
          mkdir -p current old source_api
          test "$(gh api "repos/$REPO/actions/runs/$ATLAS_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/$ATLAS_RUN/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name=="mois-five-postsnapshot11-real-original-iNat-photo9-42111-taxa-append") | .digest')" = 'sha256:d9a3ae579b0203eb32a16c8c215da5da6c1f01559a9f14c455928a93ab9a58dd'
          gh run download "$ATLAS_RUN" --repo "$REPO" \
            --name mois-five-postsnapshot11-real-original-iNat-photo9-42111-taxa-append \
            --dir current
          gh run download "$FULL_HIST_RUN" --repo "$REPO" \
            --name mois-postsnapshot-two-CC-photos-full-1231244-ID-source --dir old
          gh run download "$SOURCE_RUN" --repo "$REPO" \
            --name mois-postsnapshot-new1909-unmeasured-original-photo-opportunities-signed \
            --dir source_api
          python - <<'PY'
          from pathlib import Path
          import json
          from scripts.analysis.mois_species_first_palette9 import sha256
          atlas=Path('current/mois_42111_taxa_after_post_snapshot_5_signed_waves.csv.gz')
          prior=json.loads(Path('current/receipt.json').read_text())
          assert prior['schema']=='mois_post20261028_five_true_new_original_photo_ROI9_42111_append_v1'
          assert prior['cumulative_iNaturalist_original_photo_attempts']==1231255
          assert prior['cumulative_nominal_taxa_with_numeric_nineROI']==39885
          assert sha256(atlas)==prior['outputs_SHA256']['updated_atlas']
          assert sha256(atlas)=='8d9a683fffd73c3a67fe63552e1490d4f629b688bb1eba0d1b4b1bafd143c22f'
          src=json.loads(Path('source_api/receipt.json').read_text())
          assert src['schema']=='mois_post20261028_new_inat_other1909_zero_numeric_taxa_source_union_v1'
          assert src['new_source_taxa_API_queried']==1909
          assert src['actual_new_photo_pixels_downloaded']==0
          assert src['new_strict9_numerical_ROI']==0
          print('MOIS_SOURCE1909_TAXA_REAL_API_METADATA_CANDIDATES',
                src['new_photo_IDs_before_historical_source_overlap'],flush=True)
          PY
      - name: Confirm exact 1231255 prior photo IDs/observations and frozen new licensed original source
        id: freeze
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_postsnap1909_remaining_true_original_ROI9 source \
            --candidates source_api \
            --atlas current/mois_42111_taxa_after_post_snapshot_5_signed_waves.csv.gz \
            --historical old/historical_1231244_original_photo_observation_taxon_ID_registry.csv.gz \
            --new11 current/mois_new11_iNat_original_photo9_audited_delta.parquet \
            --quota 64 --output frozen
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m=json.load(open('frozen/receipt.json'))
          print('has_new='+str(int(m.get('independent_new_eligible_photos',0))>0).lower())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-fresh1909-64taxa-original-source-complete1231255-ID-history-safe
          path: frozen/
          retention-days: 90
          if-no-files-found: error
  genuinely-measure-frozen-new-originals:
    needs: verify-1909-taxonomy-and-freeze-real-source
    if: needs.verify-1909-taxonomy-and-freeze-real-source.outputs.has_new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-fresh1909-64taxa-original-source-complete1231255-ID-history-safe
          path: signed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap exact pinned FCP original YOLO11 EfficientSAM ROI-v4
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: ACTUALLY download only new 1-64 licensed iNat originals and infer all nine flower-region colour fractions
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-postsnap-new1909-provider"
          python -m scripts.acquisition.mois_full_index_real_original_photo_measure work \
            --source signed --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" \
            --group 0 --output genuine_photos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-fresh1909-original-RGB9-FCP-actual-new-pixels
          path: genuine_photos/
          retention-days: 90
          if-no-files-found: warn
  independent-new-1909-photo-audit:
    needs: [verify-1909-taxonomy-and-freeze-real-source,genuinely-measure-frozen-new-originals]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-fresh1909-64taxa-original-source-complete1231255-ID-history-safe
          path: signed
      - uses: actions/download-artifact@v4
        with:
          name: mois-fresh1909-original-RGB9-FCP-actual-new-pixels
          path: worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original photo, source UUID and true nine numerical composition independent signature audit
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3
          python -m scripts.acquisition.mois_postsnap1909_remaining_true_original_ROI9 audit \
            --source signed --workers worker --output audited
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('audited/receipt.json').read_text())
          assert d['stage']=='actual_new_independent_FCP_nineROI_audited'
          assert 1<=d['new_authentic_original_photo_attempts']<=64
          assert d['new_original_photo_numeric9_success']+d['new_technical_unknowns']==d['new_authentic_original_photo_attempts']
          assert d['new_clear_dominant_hue9']<=d['new_original_photo_numeric9_success']
          assert d['source_and_worker_photo_ID_UUID_collisions']==0
          assert not d['image_SHA_collisions_with_all_1231255_prior_originals_certified']
          print('MOIS_REAL_NEW1909_SOURCE_ORIGINAL9_INDEPENDENT_AUDIT_COUNTS',
             {k:d[k] for k in ('new_authentic_original_photo_attempts',
                  'new_original_photo_numeric9_success','new_clear_dominant_hue9',
                  'new_technical_unknowns')},flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-fresh1909-genuine-new-original-photo9-independent-audit
          path: audited/
          retention-days: 90
          if-no-files-found: error
  append-new-originals-to-nominal-taxonomy:
    needs: [verify-1909-taxonomy-and-freeze-real-source,independent-new-1909-photo-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      PREVIOUS_11_RUN: '43561529394'
      PREVIOUS_HISTORY_RUN: '43546479575'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact source and original photo9 numerical dependencies
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 pyarrow==19.0.1
      - uses: actions/download-artifact@v4
        with:
          name: mois-fresh1909-64taxa-original-source-complete1231255-ID-history-safe
          path: signed
      - uses: actions/download-artifact@v4
        with:
          name: mois-fresh1909-original-RGB9-FCP-actual-new-pixels
          path: worker
      - uses: actions/download-artifact@v4
        with:
          name: mois-fresh1909-genuine-new-original-photo9-independent-audit
          path: audit
      - name: Recover signed 42111 original taxon atlas and immutable 1231255 previous original photo IDs
        run: |
          set -euo pipefail
          mkdir -p old
          gh run download "$PREVIOUS_11_RUN" --repo "$REPO" \
            --name mois-five-postsnapshot11-real-original-iNat-photo9-42111-taxa-append --dir old
          gh run download "$PREVIOUS_HISTORY_RUN" --repo "$REPO" \
            --name mois-postsnapshot-two-CC-photos-full-1231244-ID-source --dir old
      - name: Append ONLY signed photo9 success; preserve original technical unknowns
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_postsnap1909_remaining_true_original_ROI9 append \
            --atlas old/mois_42111_taxa_after_post_snapshot_5_signed_waves.csv.gz \
            --historical old/historical_1231244_original_photo_observation_taxon_ID_registry.csv.gz \
            --new11 old/mois_new11_iNat_original_photo9_audited_delta.parquet \
            --source signed --workers worker --audit audit \
            --output appended
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('appended/receipt.json').read_text())
          assert d['stage']=='full_42111_taxon_atlas_new1909_true_photo9_appended'
          assert d['cumulative_original_photo_attempts']>1231255
          assert d['nominal_taxa_with_genuine_nineROI']>=39885
          assert d['nominal_taxa_with_clear_sampled_photo_hue']>=39147
          assert d['new_strict9_numeric_original_photos']<=d['new_original_photo_attempts']
          assert d['prior_original_photo_and_observation_UUID_collisions']==0
          assert d['full_historical_image_content_SHA_exclusion_proven'] is False
          print('MOIS_REAL_NEW1909_FROZEN_ORIGINAL9_ATLAS_INCREMENT',
             {k:d[k] for k in ('new_original_photo_attempts',
                 'new_strict9_numeric_original_photos','new_clear_photo_hue_taxa',
                 'nominal_taxa_with_genuine_nineROI',
                 'nominal_taxa_with_clear_sampled_photo_hue')},flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-new1909-fresh-original-real-ROI9-42111-taxonomy-appended
          path: appended/
          retention-days: 90
          if-no-files-found: error
