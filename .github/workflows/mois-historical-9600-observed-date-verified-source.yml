name: MOIS genuine historical 9600 original photo dates + source-stratified seasons

on:
  pull_request:
    paths:
      - "scripts/acquisition/mois_historical9600_source_date_expansion.py"
      - "tests/test_mois_historical9600_source_date_expansion.py"
      - ".github/workflows/mois-historical-9600-observed-date-verified-source.yml"
      - "docs/MOIS_REAL_9600_HISTORIC_ORIGINAL_PHOTO_DATE_SOURCE_EXPANSION_20261017.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-historical9600-original-public-observed-on-photo-id-frozen
  cancel-in-progress: false

jobs:
  original-date-verified-classified-hue-rejoin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test immutable original photo identifiers, date limits and missing hue handling
        run: |
          python -m pip install -q 'pandas==2.2.3' 'numpy==2.1.3' 'requests==2.32.3' 'pytest==8.4.2'
          python -m pytest -q tests/test_mois_historical9600_source_date_expansion.py tests/test_mois_historical_original_observed_on_inat_pilot_20261017.py
      - name: Load actual SHA-pinned original ROI photo union and successfully verified old 200 dates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original267k prior200
          gh run download 39002957961 --repo zuizui0223/mois \
            --name mois-actually-measured-FCP-wave4-completed-photo-partitions-snapshot \
            --dir original267k
          gh run download 39007591041 --repo zuizui0223/mois \
            --name mois-original100543-blind200-photo-exact-observed-on-public-iNat-source-QC \
            --dir prior200
          test -s original267k/mois_fcp_wave4_PARTIAL_completed_pixel_original_photo_union.csv.gz
          test -s prior200/mois_historical_original_photo_observation_date_blind200_current_iNat.csv
          zip -j -q 267k_original_source.zip original267k/*
          zip -j -q prior200_original_date_source.zip prior200/*
      - name: Query no more than 9400 additional historic original observation/photo IDs (188 bounded batches)
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_historical9600_source_date_expansion \
            --source-photo-archive 267k_original_source.zip \
            --prior200-archive prior200_original_date_source.zip \
            --output real_historical9600_photo_dates
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('real_historical9600_photo_dates/mois_historical_9600_original_photo_dates_and_photo_seasons_receipt.json').read_text())
          assert r['original_full_source_photo_sha256']=='fbb54b58dc91e40e2e166081212588acc18adb19af4bdbcd1c7fe1778bee28d9'
          assert r['total_historical_source_original_photo_ids']==100543
          assert r['total_previous_genuinely_measured_original_photo_ids']==267425
          assert r['total_previous_classified_photo_hues']==129795
          assert r['blind_photo_source_selected_ids']==9600
          assert r['new_public_iNaturalist_API_requests']==188
          assert r['additional_current_public_iNaturalist_observations_queried']==9400
          assert r['first200_unchanged_original_signed_pilot_reused']
          assert 200 <= r['exact_original_photo_observation_and_current_date_matches'] <= 9600
          assert r['new_original_photo_date_CSV_sha256']
          assert r['original_photo_month_season_denominators_sha256']
          assert r['historical_source_colour_and_taxonomy_unchanged']
          assert r['no_untested_dates_or_open_flower_states_imputed']
          print('MOIS_ORIGINAL_9600_SOURCE_DATE_EXACT_MATCH_AND_SEASON_COUNTS_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-original9600-real-public-iNat-photo-date-recovery-and-season-aggregation
          path: real_historical9600_photo_dates/
          if-no-files-found: warn
          retention-days: 90
