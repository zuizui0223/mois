name: MOIS 248312 original photo WorldClim climate terrain and monthly normals

on:
  pull_request:
    paths:
      - "scripts/analysis/mois_sample_248312_worldclim_static_and_monthnormals.py"
      - "tests/test_mois_worldclim_static_month_terrain.py"
      - ".github/workflows/mois-original-248k-worldclim-site-time.yml"
      - "docs/MOIS_248K_ENVIRONMENT_STATIC_MONTHLY_NORMALS_20261017.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-original248k-all-site-worldclim-v2p1-source-frozen-bio-srad
  cancel-in-progress: false

jobs:
  original-mois-248k-worldclim-abiotic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster point-extraction tools and test georeferencing
        run: |
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 rasterio==1.4.3 pytest==8.4.2
          python -m pytest -q tests/test_mois_worldclim_static_month_terrain.py
      - name: Recover real original 248312 photographed hue observations, no ROI rerun
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original_mois_hues
          gh run download 38990701473 --repo zuizui0223/mois \
            --name mois-248312-original-photographs-120807-classified-FCP_ROI_reused \
            --dir original_mois_hues
          test -s original_mois_hues/mois_original_photo_hues_248312_after_FCP_ROI_additions.csv.gz
      - name: Retrieve real frozen WorldClim bio+srad and official 10m monthly temp/rain and 2.5m DEM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worldclim/{bio,srad,tavg,prec,elev}
          url_root=https://geodata.ucdavis.edu/climate/worldclim/2_1/base
          fetch() {
            local target="$1" url="$2"
            curl --fail --location --show-error --silent --retry 3 --retry-delay 4 \
              --connect-timeout 20 --max-time 420 "$url" -o "$target"
            test -s "$target"
          }
          # The 10m BIO/SRAD source bytes were already published in an
          # original FCP release and independently SHA-locked in 2026-09.
          fetch worldclim/bio/wc2.1_10m_bio.zip \
            https://github.com/zuizui0223/fcp/releases/download/fcp-worldclim-2.1-10m-20260925/wc2.1_10m_bio.zip
          fetch worldclim/srad/wc2.1_10m_srad.zip \
            https://github.com/zuizui0223/fcp/releases/download/fcp-worldclim-2.1-10m-20260925/wc2.1_10m_srad.zip
          echo '00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf  worldclim/bio/wc2.1_10m_bio.zip' | sha256sum -c -
          echo 'c72ee7f4f9a0eb4b5f6cd7a003eddc05bda22a2e5666d968ed4e817fd36b9026  worldclim/srad/wc2.1_10m_srad.zip' | sha256sum -c -
          fetch worldclim/prec/wc2.1_10m_prec.zip "$url_root/wc2.1_10m_prec.zip"
          fetch worldclim/tavg/wc2.1_10m_tavg.zip "$url_root/wc2.1_10m_tavg.zip"
          fetch worldclim/elev/wc2.1_2.5m_elev.zip "$url_root/wc2.1_2.5m_elev.zip"
          for name in bio srad prec tavg elev; do
            unzip -q "worldclim/$name/"*.zip -d "worldclim/$name/"
          done
          sha256sum worldclim/{bio,srad,prec,tavg,elev}/*.zip > worldclim_verified_source_sha256.txt
          cat worldclim_verified_source_sha256.txt
      - name: Rebuild all 248312 source photo-site coordinates with static, monthly-normal and coarse terrain fields
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_sample_248312_worldclim_static_and_monthnormals \
            --photo-gzip original_mois_hues/mois_original_photo_hues_248312_after_FCP_ROI_additions.csv.gz \
            --photo-source-receipt original_mois_hues/mois_248312_frozen_measured_photo_addition_receipt.json \
            --raster-dir worldclim \
            --output real_248k_worldclim
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('real_248k_worldclim/mois_248312_worldclim_static_month_normal_receipt.json').read_text())
          assert p['n_original_photo_ids']==248312
          assert p['n_four_hue_classified']==120807
          assert p['coverage']['wc2_bio12_10m']>220000
          assert p['coverage']['wc2_elev_2p5m']>220000
          assert p['monthly_normals_not_same_year_actual_weather']
          assert not p['FCP_within_species_polymorphism_statistics_imported']
          assert p['soil_not_newly_mapped_in_this_execution'] is True
          print('MOIS_248312_REAL_SITE_WORLDCLIM_STATIC_AND_DATE_CONDITIONAL_MONTHLY_NORMALS_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-248312-REAL-site-worldclim19-bio-elev2p5m-terrain-monthnormal
          path: real_248k_worldclim/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mois-worldclim-source-diagnostics-not-an-admitted-sampling
          path: worldclim_verified_source_sha256.txt
          if-no-files-found: warn
          retention-days: 14
