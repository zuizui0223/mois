name: "MOIS: RF train-fold colour-prior independent sensitivity"
on:
  push:
    branches:
      - analysis/mois-global-rf-ecology-npp-lgm-20261117
    paths:
      - scripts/analysis/mois_rf_train_prior_sensitivity_20261117.py
      - .github/workflows/mois-RF-prior-sensitivity-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-prior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "pandas>=2.1,<3" "scikit-learn>=1.5,<1.9"
      - name: Download and verify original signed RF predictions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14327033140/zip" \
            -o original_OOF.zip
          echo "8fc8d980aff1e80e36c5633f71c31d9e1d7405c1cfbb06b0e051e1b6591472b0  original_OOF.zip" | sha256sum -c
      - name: Independently audit and bootstrap same species
        run: |
          python scripts/analysis/mois_rf_train_prior_sensitivity_20261117.py \
            --artifact original_OOF.zip --output prior_audit
      - name: Upload numerical sensitivity and receipt
        uses: actions/upload-artifact@v4
        with:
          name: mois-RF-prior-colour-genus-bootstrap-20261117
          path: prior_audit/
          retention-days: 30
          if-no-files-found: error
