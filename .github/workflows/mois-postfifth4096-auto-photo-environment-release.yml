name: MOIS append verified next4096 original photo pixels to annual/all19 climate and permanent Parquet release
on:
  pull_request:
    paths:
      - scripts/analysis/mois_postwave_real317631_incremental_feature_lake.py
      - tests/test_mois_postwave_real317631_incremental_feature_lake.py
      - docs/MOIS_POSTFIFTH4096_AUTOMATIC_INCREMENTAL_ABIOTIC_CACHE_20261018.md
      - .github/workflows/mois-postfifth4096-auto-photo-environment-release.yml
  workflow_run:
    workflows:
      - "MOIS fifth genuine 4096 RGB pixel measurements beyond 313535"
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        type: string
        description: "Completed original fifth 4096 photo ROI run ID"
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-after-full-fifth4096-original-pixel-climate-archive
  cancel-in-progress: false
jobs:
  test-incremental-pixel-abiotic-append-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source-pixel and incremental-original-site raster contracts
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 statsmodels==0.14.4 \
            rasterio==1.4.3 pyarrow==19.0.1 pytest==8.4.2
          python -m pytest -q tests/test_mois_postwave_real317631_incremental_feature_lake.py
  source-verified-incremental-photo-climate-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == 'zuizui0223/mois' &&
       github.event.workflow_run.head_branch == 'analysis/mois-next4096-pixel-wave-after313535-20261018')
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test original photo-ID immutable joins and true new-site raster extraction
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 \
            statsmodels==0.14.4 pyarrow==19.0.1 rasterio==1.4.3 pytest==8.4.2
          python -m pytest -q tests/test_mois_postwave_real317631_incremental_feature_lake.py
      - name: Restore ONLY source-verified complete actual 16-photo-worker reconciliation
        run: |
          set -euo pipefail
          source_run=${{ github.event.workflow_run.id || inputs.source_run_id }}
          test -n "$source_run"
          mkdir -p completed_new317631 old313535 previous_photo_lake previous_full19
          gh run download "$source_run" --repo zuizui0223/mois \
            --name mois-real317631-actual-original-photo-RGB-hue-and-original-date \
            --dir completed_new317631
          gh run download 39032258023 --repo zuizui0223/mois \
            --name mois-fourth4096-real309439-plus4096-original-photo-pixels-and-dated-four-hue-ecology \
            --dir old313535
          gh release download mois-primary-313535-fullfourth4096-featurelake-v2 \
            --repo zuizui0223/mois --dir previous_photo_lake \
            --pattern 'primary313535_*parquet' \
            --pattern 'primary313535_fullfourth4096_featurelake_manifest.json'
          gh release download mois-313535-all19-BIO-vapr-PCA-ablation-v1 \
            --repo zuizui0223/mois --dir previous_full19 \
            --pattern 'mois_313535_all19_bio_vapr_solar_terrain_photoids.parquet' \
            --pattern 'mois_313535_all19_bio_vapr_fullterrain_source_manifest.json'
          test -s completed_new317631/mois_full317631_actual_original_photo_RGB_hues_and_dates.csv.gz
          test -s completed_new317631/mois_fifth4096_real_original_photo_source_reconciled_receipt.json
      - name: Download original source-pinned WorldClim BIO19, monthly solar and vapour, and DEM raster
        run: |
          set -euo pipefail
          mkdir -p worldclim/{bio,srad,vapr,elev}
          curl --fail --location --silent --show-error --retry 3 --max-time 600 \
            https://github.com/zuizui0223/fcp/releases/download/fcp-worldclim-2.1-10m-20260925/wc2.1_10m_bio.zip \
            -o worldclim/bio/wc2.1_10m_bio.zip
          curl --fail --location --silent --show-error --retry 3 --max-time 600 \
            https://github.com/zuizui0223/fcp/releases/download/fcp-worldclim-2.1-10m-20260925/wc2.1_10m_srad.zip \
            -o worldclim/srad/wc2.1_10m_srad.zip
          curl --fail --location --silent --show-error --retry 3 --max-time 600 \
            https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_vapr.zip \
            -o worldclim/vapr/wc2.1_10m_vapr.zip
          curl --fail --location --silent --show-error --retry 3 --max-time 600 \
            https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_2.5m_elev.zip \
            -o worldclim/elev/wc2.1_2.5m_elev.zip
          echo '00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf  worldclim/bio/wc2.1_10m_bio.zip' | sha256sum -c -
          echo 'c72ee7f4f9a0eb4b5f6cd7a003eddc05bda22a2e5666d968ed4e817fd36b9026  worldclim/srad/wc2.1_10m_srad.zip' | sha256sum -c -
          for k in bio srad vapr elev; do unzip -q "worldclim/$k/"*.zip -d "worldclim/$k"; done
      - name: Append ONLY new 4096 actual-original-photo coordinates to all annual/DEM features without filling soil
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_postwave_real317631_incremental_feature_lake \
            --new317631-original-photo-ROI completed_new317631/mois_full317631_actual_original_photo_RGB_hues_and_dates.csv.gz \
            --new317631-source-receipt completed_new317631/mois_fifth4096_real_original_photo_source_reconciled_receipt.json \
            --original313535-RGB-source old313535/mois_full313535_original_pixel_ROIs_and_observation_dates.csv.gz \
            --original313535-source-receipt old313535/mois_fourth_4096_actual_original_ROI_pixels_and_source_dates_decision.json \
            --original313535-feature-release previous_photo_lake \
            --original313535-full19-release previous_full19 \
            --real-WorldClim-raster-root worldclim \
            --output verified_incremental317631
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('verified_incremental317631/mois_317631_new4096_incremental_climate_feature_lake_receipt.json')
          d=json.loads(p.read_text())
          assert d['all_original_photo_attempts']==317631
          assert d['new_processed_original_RGB_photo_attempts']==4096
          assert d['all_classified_four_hue_photo_ROIs']>151239
          assert d['only_new_4096_photo_sites_extracted_this_execution']
          assert d['new_photo_soil_not_imputed']
          assert d['source_supplementary_season_targeted_photo_ids_excluded']
          print('MOIS_REAL317631_ORIGINAL_PHOTO_INCREMENTAL_CLIMATE_PERSISTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-real317631-original-RGB-colour-and-incremental-all19-parquet
          path: verified_incremental317631/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve successful signed data lake indefinitely in versioned GitHub Release
        run: |
          set -euo pipefail
          tag=mois-primary-real317631-next4096-incremental-all19-featurelake-v3
          if gh release view "$tag" --repo zuizui0223/mois >/dev/null 2>&1; then
            echo "Source-signed original release already exists; never silently replace it"
          else
            gh release create "$tag" verified_incremental317631/*.parquet \
              verified_incremental317631/*.json \
              --repo zuizui0223/mois --target "$GITHUB_SHA" \
              --title 'MOIS genuine next 4096 original photo RGB ROIs and incremental 19 BIO/VAPR/solar/terrain cache' \
              --notes 'Completed original photo ROI-v4 only, previous 313535 photo source unchanged, added actual 4096 RGB original pixels and source dates, measured hues with technical unknowns retained, newly extracted annual climate and DEM only at new sites, source soil missing retained. No botanical anthesis or pigment fitness inference.'
          fi
