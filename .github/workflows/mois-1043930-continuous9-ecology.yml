name: MOIS continuous 9-colour macroecology on 1043930 genuine original photos
on:
  push:
    branches: [feat/latest1043930-four-axes-20261025]
    paths:
      - scripts/analysis/mois_real1043930_continuous9_macroecology.py
      - .github/workflows/mois-1043930-continuous9-ecology.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-1043930-continuous9-physical-colour-composition-macroeco-v1
  cancel-in-progress: false
jobs:
  real-nine-colour-moisture-elevation-island-season:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install data-only ecological analysis, no image fetch or ROI model
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 \
            scipy==1.15.2 statsmodels==0.14.5
          python -m py_compile scripts/analysis/mois_real1043930_continuous9_macroecology.py
      - name: Restore exact original pixel ROI continuous9 from historical and FCP 447500, SHA-aligned climate and GSHHG
        run: |
          set -euo pipefail
          mkdir -p trait climate geo
          gh run download 40193903770 --repo zuizui0223/mois \
            --name mois-1043930-original-photo-continuous9-restored-from-fcp447500 \
            --dir trait
          gh run download 40188040027 --repo zuizui0223/mois \
            --name mois-real-latest1043930-photoid-original-worldclim-humidity-elevation \
            --dir climate
          gh run download 40188478245 --repo zuizui0223/mois \
            --name mois-real-latest1043930-island-mainland-elevation-gshhg \
            --dir geo
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('trait')
          r=json.loads((root/'mois1043930_FCP447500_nine_palette_restoration_receipt.json').read_text())
          f=root/'mois_real1043930_photo_continuous9_with_FCP_original_reuse.parquet'
          assert r['strict_original9_vectors_now']==390541
          assert r['ambiguous_original9_vectors_now']==36224
          assert hashlib.sha256(f.read_bytes()).hexdigest()==r['output_photo_lake_SHA256']
          assert r['new_original_RGB_images_downloaded']==0
          print('MOIS_TRUE1043930_PHOTO9_TRAITS_390541_SOURCE_SHA_VERIFIED',flush=True)
          PY
      - name: Refit continuous-white fraction and nine-palette entropy across all four ecological axes
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_real1043930_continuous9_macroecology \
            --trait trait/mois_real1043930_photo_continuous9_with_FCP_original_reuse.parquet \
            --proof trait/mois1043930_FCP447500_nine_palette_restoration_receipt.json \
            --climate climate/mois_latest1043930_original_photo_climate_six_columns.parquet \
            --geo geo/latest1043930_all_original_photo_GSHHG_landmass.parquet \
            --output continuous9_ecology
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('continuous9_ecology/mois1043930_continuous9_ecological_gradients.json').read_text())
          assert r['source_real_original_photo_attempts']==1043930
          assert r['strict_9palette_photo_vectors']==390541
          assert r['separate_ambiguous_9palette_photo_vectors_not_fitted']==36224
          assert r['no_unknown_roi_photo_was_assigned_a_colour']
          assert r['no_image_reinference_or_download']
          assert len(r['within_genus_geographic_source_cohort_slopes'])==12
          for axis in ('continuous9_white','continuous9_entropy'):
              assert axis in r['island_and_mainland_comparisons']
              assert 'north' in r['seasonal_photo_composition'][axis]
              assert 'south' in r['seasonal_photo_composition'][axis]
          print('MOIS_TRUE_NEW_390541_CONTINUOUS_PHOTO_COLOUR_FOUR_MACROECO_AXES_SUCCESS',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-real1043930-continuous9-white-entropy-geographic-macroecology
          path: continuous9_ecology/
          retention-days: 90
          if-no-files-found: warn
