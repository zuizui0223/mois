name: MOIS epoch4 offset1280 new created zero-ROI taxa signed unused original ROI9
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-20261116-epoch4-offset1280-source-and-conditional-original-photo9.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-epoch4-offset1280-one-signed-source-sha
  cancel-in-progress: false

jobs:
  source-only-frozen-taxonomy-next-distinct-128:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      has_new: ${{ steps.freeze.outputs.has_new }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require terminal offset1152 source, byte-signed empty candidates, and no SHA replay
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          repo="zuizui0223/mois";runid=43733162650
          q=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/runs/{runid}"]))
          assert q["status"]=="completed" and q["conclusion"]=="success"
          call=lambda endpoint:json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/actions/runs/{runid}/{endpoint}?per_page=100"]))
          jobs={j["name"]:j["conclusion"] for j in call("jobs")["jobs"]}
          assert jobs=={
            "source-only-frozen-taxonomy-next-distinct-128":"success",
            "pixel-worker-only-if-novel-original":"skipped",
            "independent-byte-identity-and-strict9-audit":"skipped",
            "formal-append-only-after-independent-audit":"skipped"},jobs
          arts=call("artifacts")["artifacts"]
          name="mois-20261116-epoch4-offset1152-signed-1231343-ID-disjoint-source"
          sha="4615223e205dafe41ee2ef8794f266141e37c14cf03768ce609f5693a4b148bd"
          assert sum(a["name"]==name and a["digest"]=="sha256:"+sha and not a["expired"] for a in arts)==1,arts
          PY
          test "$(gh run list --repo "$REPO" --workflow mois-20261116-epoch4-offset1280-source-and-conditional-original-photo9.yml --limit 100 --json databaseId --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID)] | length")" = 0

      - name: Reconstitute complete signed 1231343 attempts and 99 raw SHA history, latest atlas
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p latest signed1024 signed1152 old/history old/new11 old/new64 old/new18 old/offset1280 old/offset1536 old/offset1792 old/offset2048 old/epoch3_offset1792 old/epoch4_offset896 signed896 audited896
          gh run download 43731496142 --repo "$REPO" --name mois-20261116-epoch4-offset896-genuine-original-42111-taxonomy-append --dir latest
          gh run download 43731496142 --repo "$REPO" --name mois-20261116-epoch4-offset896-signed-1231342-ID-disjoint-source --dir signed896
          gh run download 43731496142 --repo "$REPO" --name mois-20261116-epoch4-offset896-independent-strict9-audit --dir audited896
          gh run download 43546479575 --repo "$REPO" --name mois-postsnapshot-two-CC-photos-full-1231244-ID-source --dir old/history
          gh run download 43561529394 --repo "$REPO" --name mois-five-postsnapshot11-real-original-iNat-photo9-42111-taxa-append --dir old/new11
          gh run download 43562522326 --repo "$REPO" --name mois-new1909-fresh-original-real-ROI9-42111-taxonomy-appended --dir old/new64
          gh run download 43566369683 --repo "$REPO" --name mois-postsnap-remaining18-genuine-ROI9-cumulative-atlas --dir old/new18
          gh run download 43599310470 --repo "$REPO" --name mois-20261114-offset1280-independent-strict9-audit --dir old/offset1280
          gh run download 43608952945 --repo "$REPO" --name mois-20261114-offset1536-independent-strict9-audit --dir old/offset1536
          gh run download 43612554673 --repo "$REPO" --name mois-20261114-offset1792-independent-strict9-audit --dir old/offset1792
          gh run download 43669250173 --repo "$REPO" --name mois-20261115-epoch2-offset2048-independent-strict9-audit --dir old/offset2048
          gh run download 43702087793 --repo "$REPO" --name mois-20261115-epoch3-offset1792-independent-strict9-audit --dir old/epoch3_offset1792
          gh run download 43731496142 --repo "$REPO" --name mois-20261116-epoch4-offset896-independent-strict9-audit --dir old/epoch4_offset896
          gh run download 43732465470 --repo "$REPO" --name mois-20261116-epoch4-offset1024-signed-1231343-ID-disjoint-source --dir signed1024
          gh run download 43733162650 --repo "$REPO" --name mois-20261116-epoch4-offset1152-signed-1231343-ID-disjoint-source --dir signed1152
          cp latest/mois_42111_post20261114_new_independent_original_photo9.csv.gz latest/atlas.csv.gz

      - name: Verify source/worker/audit/atlas inner SHA, technical unknown and nine-vector conservation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,csv,hashlib
          import numpy as np
          from pathlib import Path
          from scripts.acquisition import mois_epoch4_post896_rebased_photo9 as e5
          h=lambda path:hashlib.sha256(Path(path).read_bytes()).hexdigest()
          rs=json.loads(Path("signed896/receipt.json").read_bytes())
          ra=json.loads(Path("audited896/receipt.json").read_bytes())
          rf=json.loads(Path("latest/receipt.json").read_bytes())
          assert h("signed896/receipt.json")=="2c24fc40ebbab9814f66801a86c89183d028010a453d66f1d5fcf8cd63e3ec98"
          assert h("signed896/source_candidates.csv")==rs["source_candidates_SHA256"]=="4f6f1f6f08b5c982c06813c27887c49627ad7bfd18a8c7ed21b5bd9586efa320"
          assert h("signed896/source_taxon_status.csv")==rs["source_status_SHA256"]=="ed2fb8b54539fd39696206e69358440bf59c2865c3ea79bd9fd296aade29c079"
          assert h("signed896/shards/shard-000.csv")==rs["source_shard_SHA256"]=="2fd6a839949b5a964e07d4373d7705fcb20359c3d213648b6e351dabc7384fd3"
          assert h("signed896/manifest.json")==rs["source_manifest_SHA256"]=="baa12f62e3705c835e5cfd2045af715bc5f4679232b964b1e7fac62f3346fea7"
          assert h("audited896/receipt.json")=="34b568367d7309e4fa258c3df7f93c9a83dfd5de9ebfebdf4ff19e40ffa98f93"
          assert h("audited896/new_real_original_nine_photo9_delta.parquet")==ra["verified_delta_sha256"]=="1daa87b330c4664940293b11ca4e9d2a5bd9f7a3ee21e4aa44124206bc4a1cd8"
          assert h("latest/atlas.csv.gz")==rf["derived_atlas_sha256"]=="6c3aa46ba089649774b81d80a0fb8fbc49c33d71684a9058022eda5751d29309"
          assert (rs["hash_disjoint_taxon_offset"],rs["searched_zero_numeric_taxa"],rs["source_API_error_count"],rs["new_independent_original_photo_candidates"])==(896,128,0,1)
          assert (ra["new_authentic_original_attempts"],ra["new_strict9_numeric_photos"],ra["new_technical_unknowns"])==(1,0,1)
          assert ra["technical_unknown_nine_fractions_all_missing"] is True
          assert (rf["cumulative_photo_attempts"],rf["cumulative_genuine_numeric_photos"],rf["cumulative_numeric_taxa"],rf["cumulative_clear_sampled_photo_taxa"],rf["zero_numeric_remaining"])==(1231343,467566,39912,39173,2199)
          a=e5.m.read_atlas("latest/atlas.csv.gz")
          ids,obs,raw=e5.m.history()
          assert len(ids)==1231343 and len(raw)==99
          num=a.after_strict9.gt(0)
          cols=["observed_mean_"+x for x in ("white","yellow","orange","red","pink","magenta","purple","blue","bronze")]
          v=a.loc[num,cols].to_numpy(float)
          assert len(a)==42111 and num.sum()==39912 and (~num).sum()==2199
          assert np.isfinite(v).all() and (v>=0).all() and np.all(np.abs(v.sum(axis=1)-1)<=.001)
          assert a.loc[~num,cols].isna().all().all()
          q=a.loc[a.inat_taxon_id.eq("710641")].iloc[0]
          assert int(q.after_photo_attempts)==5 and int(q.after_strict9)==0
          r1024=json.loads(Path("signed1024/receipt.json").read_bytes())
          assert h("signed1024/receipt.json")=="d32e3b1a34c91cfa0aef6b66bcc9a579581828f2bb41e931e1e2853b3e5898e1"
          assert h("signed1024/source_taxon_status.csv")==r1024["source_status_SHA256"]=="9391c76207a2eda59ff5ccb456b9d223db4f5e8ce4a1e283e1de56670396b4e3"
          assert h("signed1024/source_candidates.csv")==r1024["source_candidates_SHA256"]=="01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b"
          assert (r1024["hash_disjoint_taxon_offset"],r1024["searched_zero_numeric_taxa"],r1024["source_API_error_count"],r1024["new_independent_original_photo_candidates"])==(1024,128,0,0)
          assert r1024["old_original_photo_attempt_ID_count"]==1231343 and r1024["old_original_photo_obs_ID_overlap"]==0
          q1024=list(csv.DictReader(Path("signed1024/source_taxon_status.csv").open()))
          assert len(q1024)==len({x["inat_taxon_id"] for x in q1024})==128
          assert {x["inat_taxon_id"] for x in q1024}==set(e5.prev.select_epoch4_taxa(a,128,1024))
          assert all(x["status"]=="source_queried" for x in q1024)
          r1152=json.loads(Path("signed1152/receipt.json").read_bytes())
          assert h("signed1152/receipt.json")=="034ff04e4622df31c9da016ad07220c79857800240ccf76f5148b5b783c5d9b9"
          assert h("signed1152/source_taxon_status.csv")==r1152["source_status_SHA256"]=="422016e00f37b320fbb101ea5075a783e861181983be114832f8664cd59a892d"
          assert h("signed1152/source_candidates.csv")==r1152["source_candidates_SHA256"]=="01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b"
          assert (r1152["hash_disjoint_taxon_offset"],r1152["searched_zero_numeric_taxa"],r1152["source_API_error_count"],r1152["new_independent_original_photo_candidates"])==(1152,128,0,0)
          assert r1152["old_original_photo_attempt_ID_count"]==1231343 and r1152["old_original_photo_obs_ID_overlap"]==0
          q1152=list(csv.DictReader(Path("signed1152/source_taxon_status.csv").open()))
          assert len(q1152)==len({x["inat_taxon_id"] for x in q1152})==128
          assert {x["inat_taxon_id"] for x in q1152}==set(e5.prev.select_epoch4_taxa(a,128,1152))
          assert all(x["status"]=="source_queried" for x in q1152)
          prior=set()
          for off in (0,128,256,384,512,640,768,896,1024,1152):
            cohort=set(e5.prev.select_epoch4_taxa(a,128,off))
            assert len(cohort)==128 and not cohort.intersection(prior)
            prior.update(cohort)
          upcoming=set(e5.prev.select_epoch4_taxa(a,128,1280))
          assert len(prior)==1280 and len(upcoming)==128 and not prior.intersection(upcoming)
          rows=list(csv.DictReader(Path("signed896/source_taxon_status.csv").open()))
          assert len(rows)==128 and all(r["status"]=="source_queried" for r in rows)
          assert {r["inat_taxon_id"] for r in rows}==set(e5.prev.select_epoch4_taxa(a,128,896))
          print("EPOCH4_REBASED_1231343_ATTEMPTS_99_RAW_SHA_NEW_1280_TAXON_DISJOINT_GATE_SUCCESS",flush=True)
          PY

      - name: Query epoch4 next 128 frozen zero-numeric taxa; never-used original IDs only
        id: freeze
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_epoch4_post896_rebased_photo9 source --atlas latest/atlas.csv.gz --output newest --offset 1280
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          r=json.load(open("newest/receipt.json"))
          assert r["schema"]=="mois_incremental_20261116_epoch4_rebased_after_offset896_original_photo9_v2"
          assert r["old_original_photo_attempt_ID_count"]==1231343 and r["hash_disjoint_taxon_offset"]==1280
          assert r["searched_zero_numeric_taxa"]==128 and r["source_API_error_count"]==0
          assert r["old_original_photo_obs_ID_overlap"]==0 and r["old_all_image_raw_SHA_disjointness_proven"] is False
          assert r["strict9_numeric_photos"]==0 and r["original_pixels_fetched"]==0
          rows=list(csv.DictReader(open("newest/source_taxon_status.csv")))
          assert len(rows)==len({x["inat_taxon_id"] for x in rows})==128
          assert all(x["status"]=="source_queried" for x in rows)
          print("has_new="+str(r["new_independent_original_photo_candidates"]>0).lower())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-20261116-epoch4-offset1280-signed-1231343-ID-disjoint-source
          path: newest/
          retention-days: 90
          if-no-files-found: error

  pixel-worker-only-if-novel-original:
    needs: source-only-frozen-taxonomy-next-distinct-128
    if: needs.source-only-frozen-taxonomy-next-distinct-128.outputs.has_new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-20261116-epoch4-offset1280-signed-1231343-ID-disjoint-source
          path: signed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen FCP YOLO11 EfficientSAM ROI-v4
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Acquire frozen new source original RGB and measure strict9 photo ROI
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-epoch4-offset1280-original-only"
          python -m scripts.acquisition.mois_full_index_real_original_photo_measure work --source signed --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" --group 0 --output pixel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-20261116-epoch4-offset1280-genuine-FCP-ROI9-pixel-terminal
          path: pixel/
          retention-days: 90
          if-no-files-found: warn

  independent-byte-identity-and-strict9-audit:
    needs: [source-only-frozen-taxonomy-next-distinct-128, pixel-worker-only-if-novel-original]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get frozen source worker and full previous ID and raw-SHA history
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p signed pixel old/history old/new11 old/new64 old/new18 old/offset1280 old/offset1536 old/offset1792 old/offset2048 old/epoch3_offset1792
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch4-offset1280-signed-1231343-ID-disjoint-source --dir signed
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch4-offset1280-genuine-FCP-ROI9-pixel-terminal --dir pixel
          gh run download 43546479575 --repo "$REPO" --name mois-postsnapshot-two-CC-photos-full-1231244-ID-source --dir old/history
          gh run download 43561529394 --repo "$REPO" --name mois-five-postsnapshot11-real-original-iNat-photo9-42111-taxa-append --dir old/new11
          gh run download 43562522326 --repo "$REPO" --name mois-new1909-fresh-original-real-ROI9-42111-taxonomy-appended --dir old/new64
          gh run download 43566369683 --repo "$REPO" --name mois-postsnap-remaining18-genuine-ROI9-cumulative-atlas --dir old/new18
          gh run download 43599310470 --repo "$REPO" --name mois-20261114-offset1280-independent-strict9-audit --dir old/offset1280
          gh run download 43608952945 --repo "$REPO" --name mois-20261114-offset1536-independent-strict9-audit --dir old/offset1536
          gh run download 43612554673 --repo "$REPO" --name mois-20261114-offset1792-independent-strict9-audit --dir old/offset1792
          gh run download 43669250173 --repo "$REPO" --name mois-20261115-epoch2-offset2048-independent-strict9-audit --dir old/offset2048
          gh run download 43702087793 --repo "$REPO" --name mois-20261115-epoch3-offset1792-independent-strict9-audit --dir old/epoch3_offset1792
          gh run download 43731496142 --repo "$REPO" --name mois-20261116-epoch4-offset896-independent-strict9-audit --dir old/epoch4_offset896
      - name: Check image raw SHA, photo/UUID identity, finite nine-vector, unknown all-NaN
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_epoch4_post896_rebased_photo9 audit --source signed --worker pixel --output audited
      - uses: actions/upload-artifact@v4
        with:
          name: mois-20261116-epoch4-offset1280-independent-strict9-audit
          path: audited/
          retention-days: 90
          if-no-files-found: error

  formal-append-only-after-independent-audit:
    needs: [source-only-frozen-taxonomy-next-distinct-128, independent-byte-identity-and-strict9-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download prior formal signed atlas and new audited original
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p latest signed pixel audited
          gh run download 43731496142 --repo "$REPO" --name mois-20261116-epoch4-offset896-genuine-original-42111-taxonomy-append --dir latest
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch4-offset1280-signed-1231343-ID-disjoint-source --dir signed
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch4-offset1280-genuine-FCP-ROI9-pixel-terminal --dir pixel
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch4-offset1280-independent-strict9-audit --dir audited
      - name: Append only terminal independent audit with nine-vector missingness controls
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_epoch4_post896_rebased_photo9 append --atlas latest/mois_42111_post20261114_new_independent_original_photo9.csv.gz --source signed --worker pixel --audit audited --output appended
      - uses: actions/upload-artifact@v4
        with:
          name: mois-20261116-epoch4-offset1280-genuine-original-42111-taxonomy-append
          path: appended/
          retention-days: 90
          if-no-files-found: error
