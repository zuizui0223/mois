name: MOIS global observation aliases and consensus robustness
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - scripts/analysis/mois_global_identity_consensus_audit.py
      - tests/test_mois_global_identity_consensus_audit.py
      - .github/workflows/mois-global-identity-consensus-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-global-identity-consensus-audit
  cancel-in-progress: false
jobs:
  original-numeric-source-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical readers and test identity guards
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 pyarrow==19.0.1
          python -m unittest discover -s tests -p test_mois_global_identity_consensus_audit.py -v
          python -m unittest discover -s tests -p test_mois_species_first_palette9.py -v
      - name: Restore four existing signed sources only
        run: |
          set -euo pipefail
          mkdir -p inputs
          for entry in '12705066198 photos' '13776829802 initial' '14110802184 current' '12092882545 snapshot'; do
            set -- $entry
            curl --fail --location --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/$1/zip" \
              --output "inputs/$2.zip"
          done
      - name: Reproduce baseline, reconcile known aliases and bound consensus independently
        run: python -m scripts.analysis.mois_global_identity_consensus_audit --inputs inputs --output output
      - uses: actions/upload-artifact@v4
        with:
          name: mois-global-identity-42111-catalogue-2876-consensus-audit-20261114
          path: output/
          retention-days: 90
          if-no-files-found: error
