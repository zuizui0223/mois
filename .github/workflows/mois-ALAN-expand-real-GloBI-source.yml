name: MOIS ALAN expand real GloBI floral moth and butterfly records + photo cohort support
on:
  push:
    branches: [analysis/mois-viirs-popmatch-20261105]
    paths:
      - .github/workflows/mois-ALAN-expand-real-GloBI-source.yml
      - scripts/analysis/mois_alan_expand_real_globi_and_photo_support.py
      - tests/test_mois_alan_expand_real_globi_and_photo_support.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-ALAN-bounded-GloBI-pages-2019-2024-support
  cancel-in-progress: false
jobs:
  real-GloBI-source-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test independent names and biological unknowns
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 requests==2.32.5
          python -m unittest discover -s tests -p test_mois_alan_expand_real_globi_and_photo_support.py -v
          python -m py_compile scripts/analysis/mois_alan_expand_real_globi_and_photo_support.py
      - name: Load ONLY previously signed source number tables and prior GloBI cache
        run: |
          set -euo pipefail
          mkdir -p prior
          gh run download 41960275560 --repo zuizui0223/mois \
            --name mois-ALAN-globi-moth-butterfly-species-source-coverage-NO-PHOTOS --dir prior
          gh run download 41007444495 --repo zuizui0223/mois \
            --name mois-nohuman-canonical-climate-joined-20261030 --dir prior
          gh run download 39225659840 --repo zuizui0223/mois \
            --name mois-real350399-Kew-WCVP-native-source-TDWG3-no-point-status --dir prior
          gh run download 34191508045 --repo zuizui0223/island \
            --name source-scale-batch-integration-34191508045 --dir prior
          gh run download 41946071715 --repo zuizui0223/mois \
            --name mois-2020-VIIRS4month-WorldPop2020-taxonequal-source-cells --dir prior
          echo '6116acab80f2277af7ec109715e5815bf6c4461767ae61580da8d842c9e230e4  prior/GloBI_bounded_interaction_source_cache.csv.gz' | sha256sum -c -
          echo '183d1a2da5a5bf159876e77441a292218ca2f9bab202e9f5feb68ee8e24b9eda  prior/source_query_status.csv' | sha256sum -c -
          echo 'f033661d76e07898a5c13199a55c5d0ce6e55353daa48b0058c456979e90644c  prior/canonical_observations_climate.csv.gz' | sha256sum -c -
          echo 'dc5bb0e3686fde0cfd327e4336245d0ceae3c7657b3bd12841bb814cc94d1eb2  prior/mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz' | sha256sum -c -
          echo '9cd6aa7ca29f00c64283bcc08dcb778e212b644b837e64070051339b11d8b7b3  prior/mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz' | sha256sum -c -
          echo '7e86170218814abe2845da9a0282aecfdc930819b9d0c439bae8df4a0679c577  prior/direct_species_trait_ledger.csv.gz' | sha256sum -c -
          echo '3562db1e5783e77d3bb408bd33817b4d7cccf31ad4d4ad42586469708fd407e3  prior/viirs_population_source_matched_cells_2020.csv' | sha256sum -c -
      - name: Fetch only missing paginated GloBI pages and recompute 2019 to 2024 exact species support
        timeout-minutes: 21
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_alan_expand_real_globi_and_photo_support \
            --prior prior/GloBI_bounded_interaction_source_cache.csv.gz \
            --status prior/source_query_status.csv \
            --canonical prior/canonical_observations_climate.csv.gz \
            --names prior/mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz \
            --accepted prior/mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz \
            --direct prior/direct_species_trait_ledger.csv.gz \
            --viirs2020 prior/viirs_population_source_matched_cells_2020.csv \
            --out extended --page-limit 1000 --extra-pages 12 --workers 6
          python - <<'PY'
          import json,hashlib,pandas as pd
          from pathlib import Path
          p=Path('extended')
          r=json.loads((p/'extended_source_receipt.json').read_text())
          assert r['schema']=='mois_ALAN_more_actual_GloBI_species_source_20261105_v1'
          assert r['original_GloBI_links']==13913
          assert r['new_distinct_source_records']>=0
          assert r['new_original_image_downloads'] if 'new_original_image_downloads' in r else True
          assert r['photo_pixels_downloaded_or_inferred']==0
          assert r['existing_strictROI9_success_unchanged']==401703
          assert r['no_MNAR_sensitivity_scenario']
          assert r['source_api_pages_attempted']>0
          for name,sha in r['outputs_SHA256'].items():
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==sha,name
          t=pd.read_csv(p/'original_photo_support_prior_vs_extended.csv')
          assert len(t)==15
          assert t.loc[t.period.eq('2019-2024') & t.grid_degrees.eq(.25),'cells_four_direct_colour_and_visit_groups_ge1_new'].notna().all()
          print('MOIS_ALAN_REAL_GLOBI_PAGES_SOURCE_SHA_VERIFIED',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-ALAN-expanded-GloBI-original-signed-source-multi-year-photo-support
          path: extended/
          if-no-files-found: warn
          retention-days: 90
