name: MOIS 247k global static vs dated monthly photographic colour support

on:
  pull_request:
    paths:
      - "scripts/analysis/mois_247k_static_month_support_analysis.py"
      - "tests/test_mois_247k_static_month_support.py"
      - ".github/workflows/mois-247k-static-month-block-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyse-real-photo-hue-environment-blocks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test environmental/time data boundary
        run: |
          python -m pip install -q 'pandas==2.2.3' 'numpy==2.1.3' 'pytest==8.4.2'
          python -m pytest -q tests/test_mois_247k_static_month_support.py
      - name: Recover original measured 247032-photo/120310-hue dataset (no new RGB processing)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original_hue_union
          gh run download 38989622443 --repo zuizui0223/mois \
            --name mois-original100543-plus-fcp149900-deduped-247032-ACTUAL-colour-photos \
            --dir original_hue_union
      - name: Actually calculate static site/climatology coverage and original date season contrasts
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_247k_static_month_support_analysis \
            --photo-hue-union original_hue_union/mois_fcp_combined_original_247032_photo_hues.csv.gz \
            --photo-hue-union-receipt original_hue_union/mois_fcp_measured_photo_union_receipt.json \
            --output actual_mois_static_time_blocks
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('actual_mois_static_time_blocks/mois_247k_static_vs_time_support_receipt.json').read_text())
          assert j['original_source_photo_ids']==247032
          assert j['original_classified_photo_ids']==120310
          assert j['calendar_observation_day_present']==146489
          assert j['actual_UTC_or_local_observed_time_PRESENT_and_timezone_verified'] is False
          assert j['all_photo_daypart_labels_UNKNOWN'] is True
          assert j['FCP_within_species_D_W_and_50km_local_depletion_not_analyzed'] is True
          assert j['no_missing_value_imputation'] is True
          print('MOIS_SITE_STATIC_LONGTERM_CLIMATE_SEPARATE_FROM_ACTUAL_MONTH_OBSERVATION_QC_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-247032-real-photo-hues-static-site-calendar-month-season-descriptives
          path: actual_mois_static_time_blocks/
          retention-days: 90
          if-no-files-found: error
