name: MOIS exact 302242 original photo IDs day recovery via 3430502 UUID source plus 1732 numeric dates

on:
  pull_request:
    paths:
      - "scripts/analysis/mois_full302242_uuid4096_numeric1732_exact_observed_on.py"
      - "tests/test_mois_full302242_uuid4096_numeric1732_original_observed_on.py"
      - ".github/workflows/mois-final302242-original4096-uuid-plus1732-numeric-day.yml"
      - "docs/MOIS_REAL302242_EXACT_ORIGINAL_PHOTO_UUID_NUMERIC_DAY_146052_20261017.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-original-photo-302242-full-3430502-uuid1732-numeric-observation-exact-day
  cancel-in-progress: false

jobs:
  original-3point43m-photo-UUID-and-numeric-verified-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test no original photo/date/taxon/hue rewrites and 3430502 full CSV source integrity
        run: |
          python -m pip install -q 'numpy==2.1.3' 'pandas==2.2.3' 'pytest==8.4.2'
          python -m pytest -q tests/test_mois_full302242_uuid4096_numeric1732_original_observed_on.py
      - name: Restore THREE already completed authentic photo/color and observed-on sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p base302242 old_numeric_date original_fcp_3430502
          gh run download 39018960100 --repo zuizui0223/mois \
            --name mois-next-actually-measured-original-photos-after-295017-fcp-new-pixel-date-union \
            --dir base302242
          gh run download 39019305535 --repo zuizui0223/mois \
            --name mois-actual-original295017-missing1751-numeric-photo-IDs-observed-dates-source \
            --dir old_numeric_date
          gh run download 38884223530 --repo zuizui0223/fcp \
            --name fcp-rgfca-1000-EXACT-20260927-original-photo-ID-128-worker-source-NO-PIXELS \
            --dir original_fcp_3430502
          test -s base302242/mois_next_finished_fcp_original_photo_date_hues_plus295017.csv.gz
          test -s old_numeric_date/mois_real295017_photo_source_plus_exact_remaining_numeric_API_dates.csv.gz
          test -s original_fcp_3430502/rgfca_1000_exact_source_photo_IDs/rgfca_1000_complete_original_source_photo_IDs.csv
          test -s original_fcp_3430502/rgfca_1000_exact_source_photo_IDs/rgfca_1000_targeted_monthly_photo_ID_receipt.json
          zip -j -q signed_real302242_photo_date_source.zip base302242/*
          zip -j -q signed_numeric1732_original_date_source.zip old_numeric_date/*
      - name: Actually stream all 3430502 original source photo IDs and rejoin 4096 exact UUID dates and 1732 numeric provider days
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_full302242_uuid4096_numeric1732_exact_observed_on \
            --signed302242-pixel-and-date-archive signed_real302242_photo_date_source.zip \
            --numeric1732-photo-date-archive signed_numeric1732_original_date_source.zip \
            --original-full3430502-photo-metadata-csv original_fcp_3430502/rgfca_1000_exact_source_photo_IDs/rgfca_1000_complete_original_source_photo_IDs.csv \
            --original-full3430502-source-receipt original_fcp_3430502/rgfca_1000_exact_source_photo_IDs/rgfca_1000_targeted_monthly_photo_ID_receipt.json \
            --output original_full_source_days
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('original_full_source_days/mois_original302242_146052_photo_hue_full_observed_on_provenance_receipt.json').read_text())
          assert r['original_302242_actual_measured_photo_pixels']==302242
          assert r['original_146061_automatically_classified_four_hue_ROIs']==146061
          assert r['previous_source_date_and_four_hue_ROIs']==143770
          assert r['newly_exact_original_numeric_observation_dates']==1732
          assert r['newly_numeric_date_and_classified_source_ROIs']==706
          assert r['newly_FCP_full_source_photo_to_UUID_to_original_day']==4096
          assert r['newly_UUID_source_date_and_original_four_hue_ROIs']==1576
          assert r['final_source_observation_dated_photo_attempts']==302223
          assert r['final_dated_and_original_four_hue_classifiable_ROIs']==146052
          assert r['remaining_original_photo_day_unknown']==19
          assert r['remaining_classifiable_hue_photos_without_original_day']==9
          assert r['authentic_original_full_FCP_photo_opportunity_source_scan']['original_provider_source_photo_records_streamed']==3430502
          assert r['authentic_original_full_FCP_photo_opportunity_source_scan']['original_3430502_source_full_CSV_SHA256']=='58e037a210e23d3ff5d6f04d392665ada5ee9ac5149d0676672c239cf092df01'
          assert r['all_302242_original_photo_taxon_ROI_pixel_coordinates_unchanged']
          assert r['no_photo_specific_open_flower_or_petal_qualification_done']
          print('MOIS_REAL_FULL302242_PHOTO_ID_UUID_SOURCE_OBSERVED_DAY_AND_HUE_146052_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-302242-original-pixels-146052-dated-four-hue-uuid-numeric-full3430502-source-provenance
          path: original_full_source_days/
          retention-days: 90
          if-no-files-found: warn
