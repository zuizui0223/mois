name: MOIS epoch5 new observation-created window offset0 true original ROI9
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-20261116-epoch5-offset0-new-created-window-and-conditional-original-photo9.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-epoch5-offset0-post-epoch4-window-once-only
  cancel-in-progress: false

jobs:
  source-only-first128:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      PYTHONUNBUFFERED: '1'
    outputs:
      has_new: ${{ steps.freeze.outputs.has_new }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offset2048 last numerical terminal 4/4 and signed ZIP bytes; no source replay
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          repo="zuizui0223/mois";rid=43755422537
          get=lambda uri:json.loads(subprocess.check_output(["gh","api",uri]))
          run=get(f"repos/{repo}/actions/runs/{rid}")
          assert run["status"]=="completed" and run["conclusion"]=="success"
          jobs={j["name"]:j["conclusion"] for j in get(f"repos/{repo}/actions/runs/{rid}/jobs?per_page=100")["jobs"]}
          assert jobs=={"source-only-frozen-taxonomy-next-distinct-128":"success",
            "pixel-worker-only-if-novel-original":"success",
            "independent-byte-identity-and-strict9-audit":"success",
            "formal-append-only-after-independent-audit":"success"},jobs
          expected={
            14178052465:("mois-20261116-epoch4-offset2048-signed-1231344-ID-disjoint-source","8b9125624c03b6c8408d89cea97c8f14130d0bcc417fe9497f37ce790e54fc9b"),
            14177234336:("mois-20261116-epoch4-offset2048-genuine-FCP-ROI9-pixel-terminal","2846ea572b263b9fd75ad11c2a9520b5ebabc2e805e5710e6dd819b9a54c4c48"),
            14177299318:("mois-20261116-epoch4-offset2048-independent-strict9-audit","b7a7123d91a9298d32e8dcb459bd84b108455eecbf0b2611697476e05a7970bf"),
            14178555680:("mois-20261116-epoch4-offset2048-genuine-original-42111-taxonomy-append","2649b15f782825267b19a1aa4be9edd687e045472571bfb1eef2d3bd5de9d792")}
          arts={a["id"]:a for a in get(f"repos/{repo}/actions/runs/{rid}/artifacts?per_page=100")["artifacts"]}
          assert set(arts)==set(expected)
          for i,(n,h) in expected.items():
            a=arts[i];assert a["name"]==n and a["digest"]=="sha256:"+h and not a["expired"]
          open("/tmp/mois_prev_zip_expected.txt","w").writelines(f"{i} {h}\n" for i,(_,h) in expected.items())
          print("PREVIOUS_2048_FOUR_SUCCESS_SIGNED_META_VERIFIED")
          PY
          while read -r artifact digest; do
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$artifact/zip" \
              -o "/tmp/mois_artifact_$artifact.zip"
            printf '%s  %s\n' "$digest" "/tmp/mois_artifact_$artifact.zip" | sha256sum -c -
          done < /tmp/mois_prev_zip_expected.txt
          count="$(gh run list --repo "$REPO" --workflow mois-20261116-epoch5-offset0-new-created-window-and-conditional-original-photo9.yml --limit 100 --json databaseId --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID)] | length")"
          # The first attempt #43771955500 failed before any API query, source ZIP,
          # worker, audit or append: importing patched source_last23 rejected quota=128.
          # Permit exactly this one audited pre-source failure, never a repeat.
          test "$count" = 1
          python - <<'PY'
          import json,subprocess
          repo="zuizui0223/mois";bad=43771955500
          get=lambda p:json.loads(subprocess.check_output(["gh","api",p]))
          r=get(f"repos/{repo}/actions/runs/{bad}")
          assert (r["status"],r["conclusion"])==("completed","failure")
          assert get(f"repos/{repo}/actions/runs/{bad}/artifacts?per_page=100")["artifacts"]==[]
          j={x["name"]:x["conclusion"] for x in get(f"repos/{repo}/actions/runs/{bad}/jobs?per_page=100")["jobs"]}
          assert j=={"source-only-first128":"failure","pixel-worker-only-if-novel-original":"skipped",
                      "independent-strict9-audit":"skipped","formal-append-after-audit":"skipped"}
          print("EPOCH5_ONE_PRE_SOURCE_FAILURE_ONLY_RETRY_ALLOWED")
          PY
      - name: Require final epoch4 2,199-taxon sweep fully terminal and byte-signed
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          repo="zuizui0223/mois";rid=43763583148
          get=lambda p:json.loads(subprocess.check_output(["gh","api",p]))
          r=get(f"repos/{repo}/actions/runs/{rid}")
          assert r["status"]=="completed" and r["conclusion"]=="success"
          jobs={j["name"]:j["conclusion"] for j in get(f"repos/{repo}/actions/runs/{rid}/jobs?per_page=100")["jobs"]}
          assert jobs=={"source-only-last23":"success","pixel-worker-only-if-novel-original":"skipped",
                       "independent-strict9-audit":"skipped","formal-append-after-audit":"skipped"},jobs
          artifacts=get(f"repos/{repo}/actions/runs/{rid}/artifacts?per_page=100")["artifacts"]
          assert len(artifacts)==1 and artifacts[0]["id"]==14181027973 and not artifacts[0]["expired"]
          assert artifacts[0]["digest"]=="sha256:0e5a7de73c69fab5e4bd5104178d95d4d5d8680680dc62818640585fbd08eac3"
          PY
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/artifacts/14181027973/zip" -o /tmp/mois_last23.zip
          echo "0e5a7de73c69fab5e4bd5104178d95d4d5d8680680dc62818640585fbd08eac3  /tmp/mois_last23.zip" | sha256sum -c -
          unzip -p /tmp/mois_last23.zip receipt.json | python -c 'import json,sys; r=json.load(sys.stdin); assert (r["searched_zero_numeric_taxa"],r["source_API_error_count"],r["new_independent_original_photo_candidates"],r["old_original_photo_attempt_ID_count"])==(23,0,0,1231345)'
      - name: Obtain audited previous atlas, source, worker, independent delta and historical ID/UUID ledgers
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p latest prev_source prev_worker prev_audit old/history old/new11 old/new64 old/new18 old/offset1152 old/offset1536 old/offset1792 old/offset2048 old/epoch3_offset1792 old/epoch4_offset896 old/epoch4_offset1792 old/epoch4_offset2048
          gh run download 43755422537 --repo "$REPO" --name mois-20261116-epoch4-offset2048-genuine-original-42111-taxonomy-append --dir latest
          gh run download 43755422537 --repo "$REPO" --name mois-20261116-epoch4-offset2048-signed-1231344-ID-disjoint-source --dir prev_source
          gh run download 43755422537 --repo "$REPO" --name mois-20261116-epoch4-offset2048-genuine-FCP-ROI9-pixel-terminal --dir prev_worker
          gh run download 43755422537 --repo "$REPO" --name mois-20261116-epoch4-offset2048-independent-strict9-audit --dir prev_audit
          cp prev_audit/new_real_original_nine_photo9_delta.parquet old/epoch4_offset2048/
          gh run download 43546479575 --repo "$REPO" --name mois-postsnapshot-two-CC-photos-full-1231244-ID-source --dir old/history
          gh run download 43561529394 --repo "$REPO" --name mois-five-postsnapshot11-real-original-iNat-photo9-42111-taxa-append --dir old/new11
          gh run download 43562522326 --repo "$REPO" --name mois-new1909-fresh-original-real-ROI9-42111-taxonomy-appended --dir old/new64
          gh run download 43566369683 --repo "$REPO" --name mois-postsnap-remaining18-genuine-ROI9-cumulative-atlas --dir old/new18
          gh run download 43599310470 --repo "$REPO" --name mois-20261114-offset1152-independent-strict9-audit --dir old/offset1152
          gh run download 43608952945 --repo "$REPO" --name mois-20261114-offset1536-independent-strict9-audit --dir old/offset1536
          gh run download 43612554673 --repo "$REPO" --name mois-20261114-offset1792-independent-strict9-audit --dir old/offset1792
          gh run download 43669250173 --repo "$REPO" --name mois-20261115-epoch2-offset2048-independent-strict9-audit --dir old/offset2048
          gh run download 43702087793 --repo "$REPO" --name mois-20261115-epoch3-offset1792-independent-strict9-audit --dir old/epoch3_offset1792
          gh run download 43731496142 --repo "$REPO" --name mois-20261116-epoch4-offset896-independent-strict9-audit --dir old/epoch4_offset896
          gh run download 43748476569 --repo "$REPO" --name mois-20261116-epoch4-offset1792-independent-strict9-audit --dir old/epoch4_offset1792
          cp latest/mois_42111_post20261114_new_independent_original_photo9.csv.gz latest/atlas.csv.gz
      - name: Require internal source-manifest/worker/audit/atlas byte SHA, photo ID UUID, strict nine and missingness
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,hashlib,json
          import numpy as np
          import pandas as pd
          from pathlib import Path
          from scripts.acquisition import mois_epoch5_postlast23_created_photo9 as c
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          s=json.loads(Path("prev_source/receipt.json").read_bytes())
          w=json.loads(Path("prev_worker/shard_000/receipt.json").read_bytes())
          a=json.loads(Path("prev_audit/receipt.json").read_bytes())
          f=json.loads(Path("latest/receipt.json").read_bytes())
          assert h("prev_source/receipt.json")=="7ae53cadd3f5c2161c6efa929dcd37ebf1625de679bead8ee8278889ecac19a6"
          assert h("prev_source/manifest.json")==s["source_manifest_SHA256"]=="57a3ef4226074f1128b339e509fcb0e215dc9f8470f9bcfd61b49a52c321deab"
          assert h("prev_source/shards/shard-000.csv")==s["source_shard_SHA256"]=="ba8503f0038b084e9cef241621e580dd23c6764edbe616b508d88f9f4549bb0c"
          assert h("prev_source/source_candidates.csv")==s["source_candidates_SHA256"]=="dbe0767a82fa1c95e3b9f54e5caa5b728b1d59251d2d34279303f42912658249"
          assert h("prev_source/source_taxon_status.csv")==s["source_status_SHA256"]=="323503e27402c76149535acfc590af216204df4fbf1c99067a3fbb6adcd4b052"
          assert h("prev_worker/shard_000/receipt.json")==a["source_and_worker_sha256"]["worker_receipt_sha256"]=="38c84a217bcfb14b52001acdfd18ee59a151edd3371632ba498ecd76644b3a85"
          assert h("prev_worker/shard_000/photos.csv")==w["photos_sha256"]=="4169332a933fe0822d88c96ead83063b78ae3218a3bd04ee4b14701d2de7f7db"
          assert h("prev_audit/receipt.json")==f["audit_receipt_sha256"]=="224d2a857aea6f623c2629d7adbd1532c58e5eb7556d5204f5ba4c1a5d459c60"
          assert h("prev_audit/new_real_original_nine_photo9_delta.parquet")==a["verified_delta_sha256"]==c.LAST_DELTA_SHA
          assert h("latest/atlas.csv.gz")==f["derived_atlas_sha256"]==c.LAST_ATLAS_SHA
          assert (s["hash_disjoint_taxon_offset"],s["searched_zero_numeric_taxa"],s["new_independent_original_photo_candidates"],s["source_API_error_count"])==(2048,128,1,0)
          assert (a["new_authentic_original_attempts"],a["new_strict9_numeric_photos"],a["new_technical_unknowns"])==(1,0,1)
          assert a["technical_unknown_nine_fractions_all_missing"] is True
          assert (f["cumulative_photo_attempts"],f["cumulative_genuine_numeric_photos"],f["cumulative_numeric_taxa"],f["cumulative_clear_sampled_photo_taxa"],f["zero_numeric_remaining"])==(1231345,467566,39912,39173,2199)
          hist,obs,raw=c.history_last23()
          assert len(hist)==1231345 and len(raw)==101
          q=pd.read_parquet("prev_audit/new_real_original_nine_photo9_delta.parquet")
          assert len(q)==1 and q.photo_id.astype(str).iloc[0]=="763811321"
          assert not q.strict9.iloc[0] and all(pd.isna(q["strict9_"+k].iloc[0]) for k in c.m.PALETTE)
          t=c.m.read_atlas("latest/atlas.csv.gz")
          present=t.after_strict9.gt(0)
          hues=("white","yellow","orange","red","pink","magenta","purple","blue","bronze")
          vals=t.loc[present,["observed_mean_"+v for v in hues]].to_numpy(float)
          assert len(t)==42111 and int(present.sum())==39912 and int((~present).sum())==2199
          assert np.isfinite(vals).all() and (vals>=0).all() and np.all(abs(vals.sum(axis=1)-1)<=0.001)
          assert t.loc[~present,["observed_mean_"+v for v in hues]].isna().all().all()
          last=c.select_epoch5_taxa(t,128,0)
          assert len(last)==128 and len(set(last))==128
          print("MOIS_EPOCH5_OFFSET0_FULL_1231345_ID_UUID_RECENT101_SHA_ATLAS9_GATE_SUCCESS",flush=True)
          PY
      - name: Query fresh window for 128 zero-numeric taxa; source-only until real RGB measured
        id: freeze
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_epoch5_postlast23_created_photo9 source --atlas latest/atlas.csv.gz --output newest --offset 0
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          r=json.load(open("newest/receipt.json"))
          assert (r["hash_disjoint_taxon_offset"],r["searched_zero_numeric_taxa"],r["source_API_error_count"],r["old_original_photo_attempt_ID_count"],r["old_original_photo_obs_ID_overlap"])==(0,128,0,1231345,0)
          assert r["original_pixels_fetched"]==r["strict9_numeric_photos"]==0
          assert r["old_all_image_raw_SHA_disjointness_proven"] is False
          rows=list(csv.DictReader(open("newest/source_taxon_status.csv")))
          assert len(rows)==len({x["inat_taxon_id"] for x in rows})==128
          assert all(x["status"]=="source_queried" for x in rows)
          print("has_new="+str(r["new_independent_original_photo_candidates"]>0).lower())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-20261116-epoch5-offset0-signed-1231345-ID-source
          path: newest/
          retention-days: 90
          if-no-files-found: error

  pixel-worker-only-if-novel-original:
    needs: source-only-first128
    if: needs.source-only-first128.outputs.has_new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-20261116-epoch5-offset0-signed-1231345-ID-source
          path: signed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned FCP YOLO11 EfficientSAM ROI-v4 for actual original RGB
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Fetch provider RGB originals once; numerical ROI only if strict nine passes
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-epoch4-last23-original-only"
          python -m scripts.acquisition.mois_full_index_real_original_photo_measure work --source signed --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" --group 0 --output pixel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-20261116-epoch5-offset0-genuine-FCP-ROI9-terminal
          path: pixel/
          retention-days: 90
          if-no-files-found: warn

  independent-strict9-audit:
    needs: [source-only-first128, pixel-worker-only-if-novel-original]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load immutable last23 source, worker, and every earlier ID/UUID delta
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p signed pixel old/history old/new11 old/new64 old/new18 old/offset1152 old/offset1536 old/offset1792 old/offset2048 old/epoch3_offset1792 old/epoch4_offset896 old/epoch4_offset1792 old/epoch4_offset2048
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch5-offset0-signed-1231345-ID-source --dir signed
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch5-offset0-genuine-FCP-ROI9-terminal --dir pixel
          gh run download 43546479575 --repo "$REPO" --name mois-postsnapshot-two-CC-photos-full-1231244-ID-source --dir old/history
          gh run download 43561529394 --repo "$REPO" --name mois-five-postsnapshot11-real-original-iNat-photo9-42111-taxa-append --dir old/new11
          gh run download 43562522326 --repo "$REPO" --name mois-new1909-fresh-original-real-ROI9-42111-taxonomy-appended --dir old/new64
          gh run download 43566369683 --repo "$REPO" --name mois-postsnap-remaining18-genuine-ROI9-cumulative-atlas --dir old/new18
          gh run download 43599310470 --repo "$REPO" --name mois-20261114-offset1152-independent-strict9-audit --dir old/offset1152
          gh run download 43608952945 --repo "$REPO" --name mois-20261114-offset1536-independent-strict9-audit --dir old/offset1536
          gh run download 43612554673 --repo "$REPO" --name mois-20261114-offset1792-independent-strict9-audit --dir old/offset1792
          gh run download 43669250173 --repo "$REPO" --name mois-20261115-epoch2-offset2048-independent-strict9-audit --dir old/offset2048
          gh run download 43702087793 --repo "$REPO" --name mois-20261115-epoch3-offset1792-independent-strict9-audit --dir old/epoch3_offset1792
          gh run download 43731496142 --repo "$REPO" --name mois-20261116-epoch4-offset896-independent-strict9-audit --dir old/epoch4_offset896
          gh run download 43748476569 --repo "$REPO" --name mois-20261116-epoch4-offset1792-independent-strict9-audit --dir old/epoch4_offset1792
          gh run download 43755422537 --repo "$REPO" --name mois-20261116-epoch4-offset2048-independent-strict9-audit --dir old/epoch4_offset2048
      - name: Independently certify source and worker bytes, photo/UUID, recent raw SHA, finite/unknown nine
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_epoch5_postlast23_created_photo9 audit --source signed --worker pixel --output audited
      - uses: actions/upload-artifact@v4
        with:
          name: mois-20261116-epoch5-offset0-independent-strict9-audit
          path: audited/
          retention-days: 90
          if-no-files-found: error

  formal-append-after-audit:
    needs: [source-only-first128, independent-strict9-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download certified previous atlas and new three mutually signed stages
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p latest signed pixel audited
          gh run download 43755422537 --repo "$REPO" --name mois-20261116-epoch4-offset2048-genuine-original-42111-taxonomy-append --dir latest
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch5-offset0-signed-1231345-ID-source --dir signed
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch5-offset0-genuine-FCP-ROI9-terminal --dir pixel
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261116-epoch5-offset0-independent-strict9-audit --dir audited
      - name: Append only accepted numerical colours, preserve all-nine missing technical unknown
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_epoch5_postlast23_created_photo9 append \
            --atlas latest/mois_42111_post20261114_new_independent_original_photo9.csv.gz \
            --source signed --worker pixel --audit audited --output appended
      - uses: actions/upload-artifact@v4
        with:
          name: mois-20261116-epoch5-offset0-genuine-original-42111-taxonomy-append
          path: appended/
          retention-days: 90
          if-no-files-found: error
