name: Mois real original FCP 96 ROI photo monthly climate technical proof

on:
  push:
    branches:
      - manuscript/geographic-conditional-moisture-research-20261014
    paths:
      - .github/workflows/mois-fcp96-real-climate-technical-proof-20261016.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-four-taxon-photo-and-original-climate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TIFF reader and verify 96-photo independent synthetic test before provider downloads
        run: |
          python -m pip install numpy==2.1.3 rasterio==1.4.3 pytest==8.4.2
          python -m py_compile scripts/analysis/mois_original96_monthly_climate_technical_pilot_20261016.py
          python -m pytest -q tests/test_mois_original96_monthly_climate_technical_pilot_20261016.py
      - name: Recover source-attested FCP original 96 photographed/pixel-measured ROI terminal from published artifact
        uses: actions/download-artifact@v4
        with:
          name: fcp-real-original-photo-96-case-extension-repair-20261015
          repository: zuizui0223/fcp
          run-id: 38673995478
          github-token: ${{ github.token }}
          path: .trusted/technical_pilot_source
      - name: Confirm 96 actual source photo ROI labels and freeze source case
        shell: bash
        run: |
          set -euo pipefail
          echo '911ec9edd10a7126bee28cfa67738cef0ff4d275b1f0ca1c06e3f26e7e290039  .trusted/technical_pilot_source/real_original_roi_v4_new_photo_pilot_repaired.csv' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          root=Path('.trusted/technical_pilot_source')
          names=['real_original_roi_v4_new_photo_pilot_repaired.csv',
                 'real_original_roi_v4_new_photo_pilot_repaired_receipt.json']
          d=json.loads((root/names[1]).read_text())
          assert d['status']=='REPAIRED_REAL_PHOTO_TECHNICAL_PILOT_NOT_42111_CENSUS'
          assert d['n_actual_original_image_measurements_total']==96
          assert d['n_classified_four_state_photo_rows']==20
          assert d['terminal_csv_sha256']=='911ec9edd10a7126bee28cfa67738cef0ff4d275b1f0ca1c06e3f26e7e290039'
          root.joinpath('..','original96_roi_pilot.zip').parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(root.parent/'original96_roi_pilot.zip','w') as z:
              for name in names:
                  z.write(root/name,name)
          print('MOIS_96_ACTUALLY_IMAGE_ROI_MEASURED_SOURCE_VERIFIED_NO_NEW_PHOTOS')
          PY
      - name: Retrieve pinned 48 actual WorldClim source monthly climate normal rasters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .trusted/climate_zips
          for v in tavg srad prec vapr; do
            curl --fail --location --retry 2 --connect-timeout 25 --max-time 300 \
              --user-agent 'Mois-original-pilot-climate-study/1.0 (github.com/zuizui0223/mois)' \
              --output ".trusted/climate_zips/wc2.1_10m_$v.zip" \
              "https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_$v.zip"
          done
          echo '5e567dcfe94379b94229492849ce91078b1c6e5210aaf435fba449fae6b95405  .trusted/climate_zips/wc2.1_10m_tavg.zip' | sha256sum -c -
          echo 'c72ee7f4f9a0eb4b5f6cd7a003eddc05bda22a2e5666d968ed4e817fd36b9026  .trusted/climate_zips/wc2.1_10m_srad.zip' | sha256sum -c -
          echo '1090f578f6402672a2b6438e252156f6cf867a25002a8ad6ffcbfa19e516ddc6  .trusted/climate_zips/wc2.1_10m_prec.zip' | sha256sum -c -
          echo '0501b5b5cbbc6e2fc2a3801efa9a126a5f9669f0f9a00642d2519c2324ce726d  .trusted/climate_zips/wc2.1_10m_vapr.zip' | sha256sum -c -
          python -m scripts.acquisition.mois_pin_worldclim_dynamic_monthly_climate_20261016 \
            --original-tavg-zip .trusted/climate_zips/wc2.1_10m_tavg.zip --original-tavg-sha256 5e567dcfe94379b94229492849ce91078b1c6e5210aaf435fba449fae6b95405 \
            --original-srad-zip .trusted/climate_zips/wc2.1_10m_srad.zip --original-srad-sha256 c72ee7f4f9a0eb4b5f6cd7a003eddc05bda22a2e5666d968ed4e817fd36b9026 \
            --original-prec-zip .trusted/climate_zips/wc2.1_10m_prec.zip --original-prec-sha256 1090f578f6402672a2b6438e252156f6cf867a25002a8ad6ffcbfa19e516ddc6 \
            --original-vapr-zip .trusted/climate_zips/wc2.1_10m_vapr.zip --original-vapr-sha256 0501b5b5cbbc6e2fc2a3801efa9a126a5f9669f0f9a00642d2519c2324ce726d \
            --out-private-source .trusted/original48_climate
          echo '9d0cf37a64534542d7788debef28c13f106a15c3bf7bf91be0653f3ce106baae  .trusted/original48_climate/dynamic_monthly_manifest.json' | sha256sum -c -
      - name: Real FCP original 96 ROI photos joined with original 48 climate layers by individual source site and month
        run: |
          mkdir -p .trusted/pilot_climate
          python -m scripts.analysis.mois_original96_monthly_climate_technical_pilot_20261016 \
            --original-96-source-zip .trusted/original96_roi_pilot.zip \
            --worldclim-dynamic-root .trusted/original48_climate \
            --worldclim-dynamic-sha256 9d0cf37a64534542d7788debef28c13f106a15c3bf7bf91be0653f3ce106baae \
            --out-source-audit .trusted/pilot_climate/real96_original_photo_four_climate.csv_aggregated.json
      - name: Upload only the small source-scoped 96-real-photo aggregate summary; never original photo coordinates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-original96-measured-flower-pilot-climatological-tavg-srad-prec-vpd-aggregate
          path: .trusted/pilot_climate/real96_original_photo_four_climate.csv_aggregated.json
          retention-days: 14
          if-no-files-found: error
