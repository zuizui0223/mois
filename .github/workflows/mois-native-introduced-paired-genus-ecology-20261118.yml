name: "MOIS Ecology: matched native-introduced genus composition × moisture NPP"
on:
  push:
    branches:
      - analysis/mois-ecology-moisture-temperature-interactions-20261118
    paths:
      - "scripts/analysis/mois_native_intro_paired_genus_ecology_20261118.py"
      - ".github/workflows/mois-native-introduced-paired-genus-ecology-20261118.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-native-introduced-paired-genus-ecology-20261118
  cancel-in-progress: false
jobs:
  matched-current-GBIF-flora:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install statistics and exact Parquet readers
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "pyarrow>=17,<25" \
            "scipy>=1.11,<2" "statsmodels>=0.14,<1"
      - name: Synthetic matched-cell genus-pool additivity and weighted spatial FE tests
        run: |
          python scripts/analysis/mois_native_intro_paired_genus_ecology_20261118.py --selftest
      - name: Download and SHA-validate the three authentic frozen prior run artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p sources
          for item in \
             '14241595575 decomp e014f500c806242b06ae7251ac399f8849a006f8a5a2836000bdad59c83c691f' \
             '14227246751 spatial e209257adbc185b4855f3b8d76aeaa50d2e2afe8a1feeb0f76013366e57c4d16' \
             '14219565387 NDVI e08e81d1c2afd1a2ee5312f3ebc4aeb5ab7678988c2453a2a9c63d28c82eb17a'; do
            set -- $item
            curl --fail --location --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" \
              --output "sources/$2.zip"
            echo "$3  sources/$2.zip" | sha256sum -c -
          done
      - name: Estimate same-cell native minus introduced ecological slopes and their exact genus decomposition
        run: |
          python scripts/analysis/mois_native_intro_paired_genus_ecology_20261118.py \
            --decomp sources/decomp.zip \
            --spatial sources/spatial.zip \
            --NDVI sources/NDVI.zip \
            --out results/mois_native_introduced_matched_ecology_20261118
      - name: Upload only signed ecological result tables and receipts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-native-introduced-matched-genus-pool-moisture-NPP-20261118
          path: results/mois_native_introduced_matched_ecology_20261118/
          if-no-files-found: error
          retention-days: 30
