name: MOIS all FCP 256 complete original ROI pixels added to 302242 source real dates

on:
  pull_request:
    paths:
      - "scripts/analysis/mois_full256_fcp_original_photo_and_date_merge.py"
      - "tests/test_mois_full256_fcp_original_photo_and_date_merge.py"
      - "tests/test_mois_full256_original_309439_real_result_coherence.py"
      - "results/mois_real309439_fullFCP256_original_photo_date_hue_season_decision_20261017.json"
      - "results/mois_309439_fcp_full256_original_photo_season_figure_data_20261017.csv"
      - "results/mois_309439_fcp_full256_locality_year_season_figure_data_20261017.csv"
      - ".github/workflows/mois-full256-FCP-original309439-dated-hues-source.yml"
      - "docs/MOIS_FULL256_FINISHED_FCP_309439_ACTUAL_SOURCE_20261017.md"
      - "docs/MOIS_GLOBAL_FLORAL_COLOUR_MOISTURE_AND_SEASONAL_SAMPLING_MANUSCRIPT_20261017.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-source-only-FCP-wave4-all256-exact-309439-photo-149653-date-hue-once
  cancel-in-progress: true

jobs:
  original-complete256-pixels-added-to-fully-dated302242-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test only genuine original FCP finished pixels and never alter existing source dates
        run: |
          python -m pip install -q 'numpy==2.1.3' 'pandas==2.2.3' 'requests==2.32.3' 'pytest==8.4.2'
          python -m pytest -q tests/test_mois_full256_fcp_original_photo_and_date_merge.py tests/test_mois_import_real_fcp_wave4.py tests/test_mois_full256_original_309439_real_result_coherence.py
      - name: Download only already successful full original 49800 real pixel ROIs and prior 302242 original dated photo union
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p real_full_FCP256 actual302242
          gh run download 38992543115 --repo zuizui0223/fcp \
            --name fcp-wave4-149900-method-expansion-actual-measured-and-inferred \
            --dir real_full_FCP256
          gh run download 39020466312 --repo zuizui0223/mois \
            --name mois-302242-original-pixels-146052-dated-four-hue-uuid-numeric-full3430502-source-provenance \
            --dir actual302242
          test -s real_full_FCP256/wave4-real/wave4_original_method_measured_photos.csv
          test -s real_full_FCP256/wave4-real/terminal_result.json
          test -s actual302242/mois_original302242_exact_observed_on_full_uuid_numeric_verified.csv.gz
          zip -j -q signed_original302242.zip actual302242/*
      - name: Append 7197 genuinely new original FCP photo pixels and 3601 classified source dates, recompute seasonal source biology
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_full256_fcp_original_photo_and_date_merge \
            --302242-original-photo-artifact signed_original302242.zip \
            --full256-original-FCP-artifact-dir real_full_FCP256 \
            --output actual_309439_complete_FCP_pixels_source
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('actual_309439_complete_FCP_pixels_source')
          d=json.loads((root/'mois_FCP_full256_309439_original_pixels_149653_dated_hues_source_receipt.json').read_text())
          assert d['FCP_full_original_256_worker_partitions']==256
          assert d['FCP_full_original_49800_photo_ids']==49800
          assert d['FCP_full_49800_original_four_hue_classifications']==24585
          assert d['original_FCP_pixels_overlapping_previous_source_photo_IDs']==42603
          assert d['source_original_observed_on_blank_but_independently_qualified_days_agree']==960
          assert d['new_original_genuinely_measured_photo_pixels']==7197
          assert d['new_original_four_hue_ROI_photo_labels']==3601
          assert d['now_original_measured_photo_IDs']==309439
          assert d['now_original_classifiable_four_hue_ROIs']==149662
          assert d['now_original_observation_day_present_photo_IDs']==309420
          assert d['now_original_observation_day_and_four_hue_ROIs']==149653
          assert d['source_photo_taxon_hue_date_and_location_identities_unmodified']
          assert d['historical_source_S3_API_date_priority_not_overridden']
          assert d['FCP_within_species_genetic_D_W_50km_not_imported']
          print('MOIS_REAL_FULL256_FCP_ORIGINAL_PHOTO_309439_AND_149653_DATED_FOUR_HUES_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-all256-full-FCP-original309439-149653-dated-colour-real-photo-source-and-season
          path: actual_309439_complete_FCP_pixels_source/
          retention-days: 90
          if-no-files-found: warn
