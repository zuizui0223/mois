name: MOIS 256 original K1 real photos compare 9-colour ROI vs 500px floral-box Lab proxy
on:
  push:
    branches: [feat/latest1043930-four-axes-20261025]
    paths:
      - scripts/analysis/mois_real256_same_photo_roi9_vs_box_lab.py
      - .github/workflows/mois-real256-roi9-box-lab-consistency.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-same-photographs-flower-box-proxy-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install source-only analytical libraries
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2
          python -m py_compile scripts/analysis/mois_real256_same_photo_roi9_vs_box_lab.py
      - name: Restore exactly SAME genuine original photo IDs from ROI9 atlas and real YOLO box CIELAB
        run: |
          set -euo pipefail
          mkdir -p p box
          gh release download mois-original1043930-recovered-continuous9-426765-and-ecology-20261025-v1 \
            --repo zuizui0223/mois --dir p \
            --pattern mois_real1043930_photo_continuous9_with_FCP_original_reuse.parquet \
            --pattern mois1043930_FCP447500_nine_palette_restoration_receipt.json
          gh run download 40197802202 --repo zuizui0223/mois \
            --name mois-real-K1-256-500px-floral-region-dominant-Lab-green-brown-v2 \
            --dir box
          printf '%s\n' \
            'b20bbefe15020c21c3b5b0f7edf3f8e08148a4ee7dda8bf772a89bf6b126f447  p/mois_real1043930_photo_continuous9_with_FCP_original_reuse.parquet' \
            'b4233c7818a56e67934fc7375ca3ddb110f79b7180d0f7e0adcb408b02d70c5c  box/fresh_flower_roi_Lab_mode/packet-0000000.csv.gz' \
            | sha256sum -c -
      - name: Quantify actual original-image ROI9 agreement and background risk of 500px modal colour
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_real256_same_photo_roi9_vs_box_lab \
            --palette p/mois_real1043930_photo_continuous9_with_FCP_original_reuse.parquet \
            --palette-receipt p/mois1043930_FCP447500_nine_palette_restoration_receipt.json \
            --box box/fresh_flower_roi_Lab_mode/packet-0000000.csv.gz \
            --box-summary box/fresh_flower_roi_Lab_mode/K1_medium_pixel_benchmark_summary.json \
            --output true_photo_box_audit
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('true_photo_box_audit/mois_K1_source_ROI9_vs_500px_flower_box_Lab_result.json').read_text())
          assert r['full_signed_original_K1_256_images']==256
          assert r['known_4state_photo_ROI_source_sample']==128
          assert r['previous_ROI_flip_gate_failed_source_sample']==128
          assert r['box_actual_colour_assays']==251
          assert r['known_ROI9_box_overlap']==128
          assert r['source_benchmark_not_blind_human_verified_petal_annotations']
          assert r['photo_bytes_downloaded_this_analytic_join']==0
          print('MOIS_ACTUAL_K1_SAME_PHOTO_BOX_VS_ROI9_CHECK_COMPLETE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-real256-ROI9-vs-YOLO-box-Lab-same-photo-validity
          path: true_photo_box_audit/
          retention-days: 90
          if-no-files-found: warn
