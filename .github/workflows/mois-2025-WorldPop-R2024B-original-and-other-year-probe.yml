name: MOIS 2025 WorldPop R2024B UC original GeoTIFF and 2019-2023 source-year probe
# Signed 2025 source probe: one-year raster, not a mixed-year population product
on:
  push:
    branches: [analysis/mois-viirs-popmatch-20261105]
    paths: [.github/workflows/mois-2025-original-WorldPop-UC-and-other-year-source.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mois-2025-full-WorldPop-r2024b-UC-original-geotiff-once
  cancel-in-progress: false
jobs:
  official2025-raster:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Load numeric raster and WGS84 geodesic routines
        run: python -m pip install -q numpy==2.1.3 rasterio==1.4.3 pyproj==3.7.2 requests==2.32.5
      - uses: actions/cache/restore@v4
        with:
          path: original_population2025/
          key: mois-pop-Global2-2025-UC-R2024B-865211479-original-GTIFF
      - name: Download original official WorldPop 2025 unadjusted 1km mosaic (2020 not substituted)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p original_population2025
          if [ ! -f original_population2025/global_pop_2025_UC_1km_R2024B_v1.tif ]; then
            curl --fail --location --retry 2 --connect-timeout 25 \
              --speed-time 90 --speed-limit 1024 --max-time 805 \
              'https://worldpop-public-data.soton.ac.uk/GIS/Population/Global_2015_2030/R2024B/2025/0_Mosaicked/v1/1km/unconstrained/global_pop_2025_UC_1km_R2024B_v1.tif' \
              --output original_population2025/global_pop_2025_UC_1km_R2024B_v1.tif
          fi
          test "$(stat -c%s original_population2025/global_pop_2025_UC_1km_R2024B_v1.tif)" -eq 865211479
          sha256sum original_population2025/global_pop_2025_UC_1km_R2024B_v1.tif
      - name: Source SHA, CRS, true zero, pixel area, and other years source HEAD with VIIRS source month
        timeout-minutes: 6
        run: |
          set -euo pipefail
          mkdir -p source_receipt
          python - <<'PY'
          import rasterio,pyproj,requests,hashlib,json,math,datetime as dt,calendar
          from pathlib import Path
          raster=Path('original_population2025/global_pop_2025_UC_1km_R2024B_v1.tif')
          sha=hashlib.sha256(raster.read_bytes()).hexdigest()
          info={'schema':'MOIS_Global2_R2024B_UC_2025_real_2025_year_full_GTIFF_source_v1',
              'year':2025,'release':'WorldPop Global2 R2024B v1 unconstrained',
              'source_url':'https://worldpop-public-data.soton.ac.uk/GIS/Population/Global_2015_2030/R2024B/2025/0_Mosaicked/v1/1km/unconstrained/global_pop_2025_UC_1km_R2024B_v1.tif',
              'original_file_SHA256':sha,'original_file_bytes':raster.stat().st_size,
              'source_units':'people per original pixel; not people/km2',
              'year2020_population_substituted':False,
              'no_photographs_downloaded_or_ROI_reinferred':True,
              'example_2025_pixels':[],
              'other_years_source_probes':[],
              'other_years_VIIRS_month_checks':[]}
          geod=pyproj.Geod(ellps='WGS84')
          with rasterio.open(raster) as ds:
              info.update({'crs':str(ds.crs),'width':ds.width,'height':ds.height,'count':ds.count,
                  'resolution':list(ds.res),'nodata':ds.nodata,'bounds':list(ds.bounds),
                  'tiled':ds.is_tiled,'source_transform':list(ds.transform)})
              assert ds.crs.to_epsg()==4326 and ds.count==1
              assert ds.width==43200 and ds.height==17280
              assert abs(ds.res[0]-1/120)<1e-6 and abs(ds.res[1]-1/120)<1e-6
              for name,lon,lat in [('Japan',139.7,35.7),('Taiwan',121.5,25),
                                   ('UK',-.12,51.5),('South Africa',18.43,-33.9),
                                   ('North NZ',174.76,-36.85),('Alaska',-149.9,61.2),
                                   ('Greenland',-51.73,64.18)]:
                  rr,cc=ds.index(lon,lat)
                  if not(0<=rr<ds.height and 0<=cc<ds.width):continue
                  val=float(next(ds.sample([(lon,lat)]))[0])
                  box=rasterio.windows.bounds(rasterio.windows.Window(cc,rr,1,1),ds.transform)
                  x0,y0,x1,y1=box
                  area,_=geod.polygon_area_perimeter([x0,x1,x1,x0],[y0,y0,y1,y1])
                  area=abs(area)/1e6
                  good=math.isfinite(val) and val>=0 and val!=ds.nodata
                  info['example_2025_pixels'].append({'name':name,'longitude':lon,'latitude':lat,
                      'count_per_pixel':val,'pixel_km2':area,
                      'density_per_km2':val/area if good else None,
                      'status':'VALID' if good else 'NODATA'})
          sess=requests.Session()
          sess.headers.update({'User-Agent':'MOIS botanical 2025 population source and years 2019-2023 probe/1.0'})
          for year in (2019,2021,2022,2023):
              url=info['source_url'].replace('/2025/','/'+str(year)+'/').replace('_2025_','_'+str(year)+'_')
              x={'year':year,'url':url}
              try:
                  r=sess.head(url,allow_redirects=True,timeout=25)
                  x.update({'status':r.status_code,'Content-Length':r.headers.get('Content-Length'),
                         'ETag':r.headers.get('ETag')})
              except Exception as e:x['error']=str(e)[:200]
              info['other_years_source_probes'].append(x)
              print('MOIS_WORLDPOP_R2024B_UC_OTHER_YEAR',json.dumps(x),flush=True)
              for mo in (1,7):
                  start=dt.datetime(year,mo,1,tzinfo=dt.timezone.utc)
                  end=dt.datetime(year,mo,calendar.monthrange(year,mo)[1],23,59,59,tzinfo=dt.timezone.utc)
                  params={'f':'json','geometryType':'esriGeometryMultipoint',
                     'geometry':json.dumps({'points':[[139.7,35.7],[121.5,25]],'spatialReference':{'wkid':4326}},separators=(',',':')),
                     'returnFirstValueOnly':'true','outFields':'*','interpolation':'RSP_NearestNeighbor',
                     'time':f'{int(start.timestamp()*1000)},{int(end.timestamp()*1000)}'}
                  x={'year':year,'month':mo}
                  try:
                      r=sess.get('https://di-lawimagery1.img.arcgis.com/arcgis/rest/services/NighttimeLightsMDNB/ImageServer/getSamples',
                            params=params,timeout=40)
                      obj=r.json()
                      years=[(s.get('attributes') or {}).get('year') for s in obj.get('samples',[])]
                      months=[(s.get('attributes') or {}).get('month') for s in obj.get('samples',[])]
                      x.update({'status':r.status_code,'source_years':years,'source_months':months,
                        'source_SHA256':hashlib.sha256(r.content).hexdigest(),
                        'samples':len(obj.get('samples',[])),'provider_error':obj.get('error')})
                  except Exception as e:x['error']=str(e)[:200]
                  info['other_years_VIIRS_month_checks'].append(x)
                  print('MOIS_VIIRS_OTHER_YEAR_SOURCE',json.dumps(x),flush=True)
          (Path('source_receipt')/'WorldPop_2025_R2024B_UC_original_geotiff_receipt.json').write_text(
              json.dumps(info,indent=2,sort_keys=True)+'\n')
          print('MOIS_WORLDPOP_2025_REAL_R2024B_GTIFF_SOURCE_SHA',json.dumps({
              'source_sha':info['original_file_SHA256'],
              'bytes':info['original_file_bytes'],'CRS':info['crs'],
              'pixels':(info['width'],info['height'])},sort_keys=True),flush=True)
          PY
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: original_population2025/
          key: mois-pop-Global2-2025-UC-R2024B-865211479-original-GTIFF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-2025-official-R2024B-unconstrained-full-raster-SHA-other-years-probe
          path: source_receipt/
          retention-days: 90
          if-no-files-found: warn
