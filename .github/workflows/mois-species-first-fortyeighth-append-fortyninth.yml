name: MOIS fortyeighth signed 8 append and fortyninth depth128 original image ROI
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-species-first-fortyeighth-append-fortyninth.yml
      - scripts/analysis/mois_species_first_fortyeighth_to_fortyninth.py
      - scripts/analysis/mois_species_first_fortyninth_audit.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-fortyeighth8-signed-to-fortyninth-depth128-one-source
  cancel-in-progress: false
jobs:
  append-fortyeighth-and-source-fortyninth:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      groups: ${{ steps.plan.outputs.groups }}
      has_next: ${{ steps.plan.outputs.has_next }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      OLD_SOURCE_RUN: '43448044044'
      OLD_AUDIT_RUN: '43448044044'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests and Python compile
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          python -m unittest discover -s tests -p test_mois_species_first_twelfth_to_thirteenth.py -v
          python -m unittest discover -s tests -p test_mois_species_first_wave14_artifact_paths.py -v
          python -m py_compile scripts/analysis/mois_species_first_fortyeighth_to_fortyninth.py scripts/analysis/mois_species_first_fortyninth_audit.py
      - name: Gate recovered signed wave46 terminal; prevent duplicate immutable source
        id: gate
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          test "$(gh api "repos/$REPO/actions/runs/$OLD_AUDIT_RUN" --jq .status)" = completed || exit 0
          test "$(gh api "repos/$REPO/actions/runs/$OLD_AUDIT_RUN" --jq .conclusion)" = success || exit 0
          test "$(gh api "repos/$REPO/actions/runs/$OLD_SOURCE_RUN" --jq .status)" = completed || exit 0
          test "$(gh api "repos/$REPO/actions/runs/$OLD_SOURCE_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name == "append-fortyseventh-and-source-fortyeighth" and .conclusion == "success")] | length')" = 1 || exit 0
          test "$(gh api "repos/$REPO/actions/runs/$OLD_SOURCE_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name == "fortyeighth-real-original-worker (0)" and .conclusion == "success")] | length')" = 1 || exit 0
          test "$(gh api "repos/$REPO/actions/runs/$OLD_AUDIT_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name == "fortyeighth-real-original-audit" and .conclusion == "success")] | length')" = 1 || exit 0
          candidates="$(gh run list --repo "$REPO" --workflow mois-species-first-fortyeighth-append-fortyninth.yml --branch analysis/mois-species-first-palette9-20261111 --limit 100 --json databaseId --jq ".[] | select(.databaseId < $GITHUB_RUN_ID) | .databaseId")"
          for candidate in $candidates; do
            state="$(gh api "repos/$REPO/actions/runs/$candidate" --jq .status)"
            if [ "$state" != completed ]; then
              echo "MOIS_WAVE48_PRIOR_RUN_IN_FLIGHT $candidate"
              exit 0
            fi
            count="$(gh api "repos/$REPO/actions/runs/$candidate/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "mois-fortyeighth4096-verified-append-fortyninth-prioritized-original-source")] | length')"
            if [ "$count" != 0 ]; then
              echo "MOIS_WAVE48_ALREADY_FROZEN_PRIOR_SOURCE_NO_DUPLICATE $candidate"
              exit 0
            fi
          done
          audit_digest="$(gh api "repos/$REPO/actions/runs/$OLD_AUDIT_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="mois-fortyeighth28-real-original-photo-nineROI-audit") | .digest')"
          source_digest="$(gh api "repos/$REPO/actions/runs/$OLD_SOURCE_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="mois-fortyseventh4096-verified-append-fortyeighth-prioritized-original-source") | .digest')"
          worker_digest="$(gh api "repos/$REPO/actions/runs/$OLD_SOURCE_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="mois-fortyeighth28-real-original-worker-0") | .digest')"
          test "$audit_digest" = 'sha256:758e8d3a2ddb94538cf84ab43c1c313f317a2708cef33e348af8038279442f48'
          test "$source_digest" = 'sha256:bff92996d667fe67be6e9247c94cd199409d7b558d580269f81546ee138e9f60'
          test "$worker_digest" = 'sha256:26a55329b7d5d0bad2f7b94872ecb1dbe7e5117421ead7ccc4826b89e88c47a6'
          gh run download "$OLD_AUDIT_RUN" --repo "$REPO" --name mois-fortyeighth28-real-original-photo-nineROI-audit --dir _precheck
          python - <<'PY'
          import json
          from scripts.analysis.mois_species_first_palette9 import sha256
          d=json.load(open('_precheck/receipt.json'))
          assert d['schema']=='mois_species_first_fortyeighth_authentic_originalROI9_audit_v1'
          assert [d['actual_independent_original_photo_attempts'],d['actual_genuine_strict9_numeric_success'],d['actual_clear_nine_palette_hues'],d['actual_technical_unknowns']]==[8,1,1,7]
          assert d['photo_observation_source_taxon_ID_collisions']==0
          assert d['source_shard_count']==1 and len(d['original_photo_worker_receipt_sha256'])==1
          assert d['frozen_original_manifest_sha256']=='bd33949a1495381d8a00421899ea1ab6c0077ff2192c305e0a4a9000671bffc3'
          assert d['audited_derivative_sha256']==sha256('_precheck/mois_fortyeighth_actual_original_nine_roi.csv.gz')
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"
