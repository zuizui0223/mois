          d=json.loads(Path('source/manifest.json').read_text())
          assert 0<=d['work_units']<=16
          print("has_next="+str(d["work_units"]>0).lower())
          print("groups="+json.dumps(list(range((d["work_units"]+3)//4)) or [0],separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: mois-fortyeighth4096-verified-append-fortyninth-prioritized-original-source
          path: |
            updated/
            source/
          retention-days: 90
          if-no-files-found: error
  fortyninth-real-original-worker:
    needs: append-fortyeighth-and-source-fortyninth
    if: needs.append-fortyeighth-and-source-fortyninth.outputs.ready == 'true' && needs.append-fortyeighth-and-source-fortyninth.outputs.has_next == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.append-fortyeighth-and-source-fortyninth.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-fortyeighth4096-verified-append-fortyninth-prioritized-original-source
          path: frozen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap frozen YOLO11 EfficientSAM original ROI-v4
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Acquire only new original photos; measure real 9-component RGB ROI
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-fortyninth-photo-provider"
          python -m scripts.acquisition.mois_full_index_real_original_photo_measure work --source frozen/source --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" --group "${{ matrix.group }}" --output measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-fortyninth28-real-original-worker-${{ matrix.group }}
          path: measured/
          retention-days: 90
          if-no-files-found: warn
  fortyninth-real-original-audit:
    needs: [append-fortyeighth-and-source-fortyninth,fortyninth-real-original-worker]
    if: needs.append-fortyeighth-and-source-fortyninth.outputs.ready == 'true' && needs.append-fortyeighth-and-source-fortyninth.outputs.has_next == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-fortyeighth4096-verified-append-fortyninth-prioritized-original-source
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: mois-fortyninth28-real-original-worker-*
          path: workers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute source and worker receipt SHAs, strict9 sums, technical unknowns
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m scripts.analysis.mois_species_first_fortyninth_audit --source frozen/source --workers workers --output audited
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-fortyninth28-real-original-photo-nineROI-audit
          path: audited/
          retention-days: 90
          if-no-files-found: warn
