name: MOIS independent documented white vs 2020 VIIRS population matched cells
on:
  push:
    branches: [analysis/mois-viirs-popmatch-20261105]
    paths:
      - .github/workflows/mois-viirs-independent-white-2020.yml
      - scripts/analysis/mois_viirs_independent_white_2020.py
      - tests/test_mois_viirs_independent_white_2020.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-real-direct-floral-white-viirs2020-aggregate-only
  cancel-in-progress: false
jobs:
  independent-species-flower-colour:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test no imputation, species ID consistency and pairing
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
          python -m pytest -q tests/test_mois_viirs_independent_white_2020.py
          python -m py_compile scripts/analysis/mois_viirs_independent_white_2020.py
      - name: Reuse exact MOIS, Kew and independent Island SOURCE NUMERIC records
        run: |
          set -euo pipefail
          mkdir -p original
          gh run download 41007444495 --repo zuizui0223/mois \
            --name mois-nohuman-canonical-climate-joined-20261030 --dir original
          gh run download 39225659840 --repo zuizui0223/mois \
            --name mois-real350399-Kew-WCVP-native-source-TDWG3-no-point-status --dir original
          gh run download 41946071715 --repo zuizui0223/mois \
            --name mois-2020-VIIRS4month-WorldPop2020-taxonequal-source-cells --dir original
          gh run download 34191508045 --repo zuizui0223/island \
            --name source-scale-batch-integration-34191508045 --dir original
          echo 'f033661d76e07898a5c13199a55c5d0ce6e55353daa48b0058c456979e90644c  original/canonical_observations_climate.csv.gz' | sha256sum -c -
          echo 'dc5bb0e3686fde0cfd327e4336245d0ceae3c7657b3bd12841bb814cc94d1eb2  original/mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz' | sha256sum -c -
          echo '9cd6aa7ca29f00c64283bcc08dcb778e212b644b837e64070051339b11d8b7b3  original/mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz' | sha256sum -c -
          echo '7e86170218814abe2845da9a0282aecfdc930819b9d0c439bae8df4a0679c577  original/direct_species_trait_ledger.csv.gz' | sha256sum -c -
          echo 'd8d0b7d5327a9add2107b2c6a1fa0e5aa6358d0813ef90da6f70e478e7a4f336  original/candidate_source_cells_2020.csv' | sha256sum -c -
          echo '32b53d23d4beac39846e3c618f7a4f5d8b24164a126cf63c4cc530b2e720aae6  original/population_matched_bright_dark_pairs_2020.csv' | sha256sum -c -
      - name: Independently compute source-documented white outcomes without publishing source trait rows
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_viirs_independent_white_2020 \
            --canonical original/canonical_observations_climate.csv.gz \
            --wcvp-lookup original/mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz \
            --wcvp-names original/mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz \
            --island-direct original/direct_species_trait_ledger.csv.gz \
            --candidate-cells original/candidate_source_cells_2020.csv \
            --matched-pairs original/population_matched_bright_dark_pairs_2020.csv \
            --out independent_summary
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('independent_summary/independent_white_population_matched_aggregate_only.json').read_text())
          assert x['population_matched_pairs']==128
          assert x['direct_colour_supported_pairs']==47
          assert abs(x['direct_white_bright_minus_dark_mean_pp']-6.608946608946607)<1e-9
          assert not x['rights_restricted_individual_species_labels_published']
          assert x['source_photo_images_downloaded']==0 and x['new_roi_inference']==0
          assert not x['MNAR_sensitivity_scenarios_run']
          assert list(Path('independent_summary').iterdir())==[
              Path('independent_summary/independent_white_population_matched_aggregate_only.json')]
          print('MOIS_ALAN_INDEPENDENT_WHITE_REAL_47_PAIRED_SOURCE_SHA_OK',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-VIIRS2020-independent-white-SPECIES-AGGREGATE-ONLY
          path: independent_summary/independent_white_population_matched_aggregate_only.json
          retention-days: 90
          if-no-files-found: error
