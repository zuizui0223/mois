name: MOIS bulk128 original medium-image pixel integrity tests only
on:
  push:
    branches: [feat/mois-bulk128-131072-20261026]
    paths:
      - .github/workflows/mois-bulk128-medium-fast-qa.yml
      - scripts/acquisition/mois_bulk128_medium500_photo_worker.py
      - tests/test_mois_bulk128_medium500_photo_worker.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-precolour-source-and-real-Lab-model-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test true original photo-ID and observation source join, 500px Lab and explicit unknowns
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 Pillow==11.3.0 pandas==2.2.3 scikit-image==0.25.2
          python -m py_compile scripts/acquisition/mois_full93m_medium_pixel_scan.py
          python -m py_compile scripts/acquisition/mois_bulk128_medium500_photo_worker.py
          python -m unittest discover -s tests -p test_mois_bulk128_medium500_photo_worker.py -v
          python -m unittest discover -s tests -p test_mois_full93m_medium_pixel_scan.py -v
          echo MOIS_BULK128_500PX_PHOTO_SOURCE_AND_UNKNOWN_LAB_TESTS_PASSED
