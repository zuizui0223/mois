name: mois — interspecific moisture source integrity and model invariants

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-receipt-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact transferred FCP source blobs, scoped numbers and negative gates
        run: python scripts/check_mois_migration.py
      - name: Syntax-check original raw source recovery without downloading or publishing images
        run: bash -n scripts/recover_mois_original_inputs.sh
      - name: Compile separately implemented original-source coefficient verification code
        run: python -m py_compile scripts/analysis/verify_mois_original_source_two_axis_wls_20261014.py scripts/analysis/replay_mois_world24_from_genus_moments_20261014.py scripts/analysis/replay_mois_original_matched_spatial_576_20261014.py scripts/analysis/replay_mois_world_quality_geocell_soil36_from_original_zips_20261014.py
      - name: Build and verify internally redistributable numerical-source snapshot (no original photo IDs)
        run: |
          python scripts/build_mois_internal_evidence_package.py --write
          python scripts/build_mois_internal_evidence_package.py --check
      - name: Retain temporary internal numerical audit snapshot (not reviewer data archive)
        uses: actions/upload-artifact@v4
        with:
          name: mois-internal-numerical-evidence-snapshot
          path: dist/mois_internal_numerical_evidence_20261014.zip
          retention-days: 14
          if-no-files-found: error

  synthetic-model-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact synthetic test dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
      - name: Assert global hue model and matched geographic support invariants
        run: python -m pytest -q tests/test_fcp_macro_abiotic_direction_20261013.py tests/test_spatial_support_decomposition.py

  paper-claims-and-figures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install narrow manuscript regression dependencies
        run: python -m pip install pytest==8.4.2
      - name: Verify GEB-structured manuscript, source-receipt statistical claims and publication boundaries
        run: python -m pytest -q tests/test_mois_geb_manuscript_20261014.py tests/test_mois_geb_submission_integrity_20261014.py tests/test_mois_original_source_recovery_20261014.py tests/test_mois_world24_bootstrap_replay_20261014.py tests/test_mois_original_matched_spatial_full576_20261014.py tests/test_mois_world_quality_spatial_soil36_maxT_20261014.py
      - name: Verify reproducible Figure 2 is identical to source JSON receipt generation
        run: node scripts/render_mois_figure2_source_receipts.mjs --check
      - name: Verify Figure 3 taxonomic and geographic transfer from source receipts
        run: node scripts/render_mois_figure3_transfer.mjs --check
      - name: Verify Figure 4 all photographed hue directions and original maxT source intervals
        run: node scripts/render_mois_four_hue_moisture.mjs --check
      - name: Verify regenerated double-anonymous and continuously numbered GEB review copies
        run: node scripts/build_mois_blinded_review_copy.mjs --check
