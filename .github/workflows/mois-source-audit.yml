name: mois — original interspecific moisture source integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-receipt-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact transferred FCP source blobs, scoped numbers and negative gates
        run: python scripts/check_mois_migration.py
