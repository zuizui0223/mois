name: mois — interspecific moisture source integrity and model invariants

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-receipt-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact transferred FCP source blobs, scoped numbers and negative gates
        run: python scripts/check_mois_migration.py
      - name: Recompute sharp original-photo nonresponse identification receipt
        run: python scripts/analysis/mois_photo_nonresponse_bounds_20261014.py --check
      - name: Verify global photo-white near-parity and balancing-selection nonclaim
        run: python scripts/analysis/mois_original_photo_white_balance_20261014.py --check
      - name: Syntax-check original raw source recovery without downloading or publishing images
        run: bash -n scripts/recover_mois_original_inputs.sh
      - name: Compile separately implemented original-source coefficient verification code
        run: python -m py_compile scripts/analysis/verify_mois_original_source_two_axis_wls_20261014.py scripts/analysis/replay_mois_world24_from_genus_moments_20261014.py scripts/analysis/replay_mois_original_matched_spatial_576_20261014.py scripts/analysis/replay_mois_world_quality_geocell_soil36_from_original_zips_20261014.py scripts/analysis/loo_mois_world_genus_moisture_20261014.py scripts/analysis/mois_replay_species_genus_balance_20261014.py scripts/analysis/mois_replay_genus_clustering_20261015.py scripts/analysis/replay_mois_genus_between_within_moisture_20261015.py scripts/analysis/replay_mois_genus_sign_mosaic_20261015.py scripts/analysis/mois_replay_climate_regime_moisture_20261015.py
      - name: Build and verify internally redistributable numerical-source snapshot (no original photo IDs)
        run: |
          python scripts/build_mois_internal_evidence_package.py --write
          python scripts/build_mois_internal_evidence_package.py --check
      - name: Retain temporary internal numerical audit snapshot (not reviewer data archive)
        uses: actions/upload-artifact@v4
        with:
          name: mois-internal-numerical-evidence-snapshot
          path: dist/mois_internal_numerical_evidence_20261014.zip
          retention-days: 14
          if-no-files-found: error

  synthetic-model-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact synthetic test dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
      - name: Assert global hue model and matched geographic support invariants
        run: python -m pytest -q tests/test_fcp_macro_abiotic_direction_20261013.py tests/test_spatial_support_decomposition.py tests/test_mois_species_genus_source_balance_20261014.py tests/test_mois_genus_clustering_20261015.py tests/test_mois_between_within_genus_moisture_20261015.py tests/test_mois_genus_sign_mosaic_20261015.py tests/test_mois_climate_regime_moisture_20261015.py

  paper-claims-and-figures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install narrow manuscript regression dependencies
        run: python -m pip install pytest==8.4.2
      - name: Verify GEB-structured manuscript, source-receipt statistical claims and publication boundaries
        run: python -m pytest -q tests/test_mois_geb_manuscript_20261014.py tests/test_mois_geb_submission_integrity_20261014.py tests/test_mois_original_source_recovery_20261014.py tests/test_mois_world24_bootstrap_replay_20261014.py tests/test_mois_original_matched_spatial_full576_20261014.py tests/test_mois_world_quality_spatial_soil36_maxT_20261014.py tests/test_mois_single_genus_influence_20261014.py tests/test_mois_photo_nonresponse_bounds_20261014.py tests/test_mois_original_photo_white_balance_20261014.py tests/test_mois_figure5_ecological_scales_20261015.py tests/test_mois_original_geography_20261015.py
      - name: Verify reproducible Figure 2 is identical to source JSON receipt generation
        run: node scripts/render_mois_figure2_source_receipts.mjs --check
      - name: Verify Figure 3 taxonomic and geographic transfer from source receipts
        run: node scripts/render_mois_figure3_transfer.mjs --check
      - name: Verify Figure 4 all photographed hue directions and original maxT source intervals
        run: node scripts/render_mois_four_hue_moisture.mjs --check
      - name: Verify source-locked Figure 5 of photo-white weighting and taxonomic scales
        run: node scripts/render_mois_figure5_ecological_scales.mjs --check
      - name: Render Figure 5 at full and downscaled sizes for visual inspection
        run: |
          python -m pip install --quiet cairosvg==2.8.2
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          fig = Path("figures/mois_white_moisture_ecological_scales.svg")
          out = Path("artifacts/mois_figure5_visual")
          out.mkdir(parents=True, exist_ok=True)
          for width in (1560, 780):
              cairosvg.svg2png(url=str(fig), write_to=str(out / f"figure5_{width}px.png"), output_width=width)
          print("Rendered both source-backed Figure 5 visual proofs")
          PY
      - name: Preserve temporary Figure 5 PNG visual proofs (not reviewer source data)
        uses: actions/upload-artifact@v4
        with:
          name: mois-figure5-ecological-scales-visual-proof
          path: artifacts/mois_figure5_visual/*.png
          retention-days: 14
          if-no-files-found: error
      - name: Verify regenerated double-anonymous and continuously numbered GEB review copies
        run: node scripts/build_mois_blinded_review_copy.mjs --check
