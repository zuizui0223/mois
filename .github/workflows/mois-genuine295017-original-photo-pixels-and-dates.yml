name: MOIS 295017 actual original photo pixels / 140247 source-dated hue outcomes

on:
  pull_request:
    paths:
      - "scripts/analysis/mois_merge_real_FCP180_and_MOIS_three4096_original_photos.py"
      - "tests/test_mois_merge_FCP180_three_original_photo_waves.py"
      - ".github/workflows/mois-genuine295017-original-photo-pixels-and-dates.yml"
      - "docs/MOIS_REAL295017_GENUINE_NEW_ORIGINAL_ROI_PHOTOS_AND_DATES_20261017.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-295017-genuine-source-FCP180-plus-MOIS-three-real4096-pixels
  cancel-in-progress: false

jobs:
  actual-original-photo-identity-dedup-and-public-date-enrichment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test original photo ID, hue, observation namespace and immutable historic date guards
        run: |
          python -m pip install -q 'numpy==2.1.3' 'pandas==2.2.3' 'pytest==8.4.2'
          python -m pytest -q tests/test_mois_merge_FCP180_three_original_photo_waves.py
      - name: Restore only already completed genuine original ROI photo pixel artifacts and 100543 public dates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original_FCP180 original_mois3waves verified_historic_dates
          gh run download 39014753277 --repo zuizui0223/mois \
            --name mois-actually-measured-FCP-wave4-completed-photo-partitions-snapshot \
            --dir original_FCP180
          gh run download 39013017991 --repo zuizui0223/mois \
            --name mois-260600-original-photographs-3x4096-new-genuine-photo-ROI-pixels \
            --dir original_mois3waves
          gh run download 39012110980 --repo zuizui0223/mois \
            --name mois-final-authentic-original127504-dated-hue-photos-fullhistorical-S3-API-source-season \
            --dir verified_historic_dates
          test -s original_FCP180/mois_fcp_wave4_PARTIAL_completed_pixel_original_photo_union.csv.gz
          test -s original_mois3waves/mois_all_real_original_hue_measured_248312_plus_new_waves.csv.gz
          test -s verified_historic_dates/mois_original100543_s3_or_verified_API_dates_photo_source.csv.gz
          zip -j -q FCP180_authentic_pixels.zip original_FCP180/*
          zip -j -q MOIS_3wave_authentic_pixels.zip original_mois3waves/*
          zip -j -q historic_100543_verified_dates.zip verified_historic_dates/*
      - name: Exact original photo-ID union, preserve numerical obs vs UUID identity conflicts, restore real observed dates
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_merge_real_FCP180_and_MOIS_three4096_original_photos \
            --fcp180-real-original-zip FCP180_authentic_pixels.zip \
            --mois3-real-original-zip MOIS_3wave_authentic_pixels.zip \
            --historic-verified-public-dates-zip historic_100543_verified_dates.zip \
            --output real295017_source
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('real295017_source/mois_real295017_signed_photo_union_date_and_colour_receipt.json').read_text())
          assert r['original_measured_photographs']==295017
          assert r['original_measured_photo_four_hue_labels']==142538
          assert r['photo_ids_with_verified_observed_dates']==289170
          assert r['photo_ids_with_both_date_and_automatic_four_hue']==140247
          assert r['new_original_photo_pixels']==8191
          assert r['new_original_four_hue_photo_labels']==3133
          assert r['source_shared_conflicts']['observation_ID_source_namespace_mismatches']==1
          assert r['source_shared_conflicts']['inat_taxon_id_source_conflicts']==0
          assert r['source_shared_conflicts']['morph_source_conflicts']==0
          assert r['source_shared_conflicts']['observed_on_source_conflicts']==0
          assert r['FCP_within_species_D_W_50km_inference_not_imported']
          print('MOIS_GENUINE_295017_ORIGINAL_PHOTOGRAPHS_142538_REAL_HUES_140247_DATED_HUES_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-295017-original-photo-142538-genuine-hues-140247-verified-observation-dates
          path: real295017_source/
          retention-days: 90
          if-no-files-found: error
