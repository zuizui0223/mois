name: MOIS data first - next 8192 cached photos, no ecological analysis
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - scripts/acquisition/mois_collect_remaining_pool.py
      - tests/test_mois_collect_remaining_pool.py
      - .github/workflows/mois-data-first-next8192.yml
  push:
    branches: [main]
    paths: [.github/workflows/mois-data-first-next8192.yml]
  workflow_dispatch:
    inputs:
      resume_run:
        description: Earlier run with completed units to restore; leave empty for the first run
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-cached-next8192-photo-acquisition-only
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      run_images: ${{ steps.source.outputs.run_images }}
      archive_run: ${{ steps.source.outputs.archive_run }}
      prefetch: ${{ steps.speed.outputs.prefetch }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 pytest==8.4.2
          python -m pytest -q tests/test_mois_collect_remaining_pool.py tests/test_mois_prefetch.py tests/test_mois_prefetch_group.py
      - name: Reuse the completed data before considering any image acquisition
        id: source
        run: |
          set -euo pipefail
          echo 'run_images=false' >> "$GITHUB_OUTPUT"
          if gh release view mois-cached-next8192-measured-data-only-v1 --repo zuizui0223/mois >/dev/null 2>&1; then
            echo 'This data snapshot already exists; no image acquisition repeated.'
            exit 0
          fi
          # All 32 image units completed. The old PR run failed only at Release upload.
          # Inspect the completed artifact, not the failed overall run conclusion.
          gh api repos/zuizui0223/mois/actions/artifacts/12143251048 > complete_artifact.json
          python - <<'PY'
          import json
          a=json.load(open('complete_artifact.json'))
          assert a['id']==12143251048 and a['name']=='next8192-complete-data-only'
          assert a['workflow_run']['id']==39132545774 and not a['expired']
          assert a['digest']=='sha256:3cc0720245a06f1a88e8c90b5f2d668eaea1d96a5f68808e6a25eb236d66cfbb'
          PY
          echo 'archive_run=39132545774' >> "$GITHUB_OUTPUT"
          echo 'All 8192 photo attempts are already measured; restore final data only.'
      - name: Enable overlap only after exact paired results and a measured speed improvement
        if: steps.source.outputs.run_images == 'true'
        id: speed
        run: |
          set -euo pipefail
          state=$(gh api repos/zuizui0223/mois/actions/runs/39137639189 --jq .conclusion)
          if [ "$state" != success ]; then
            echo 'prefetch=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download 39137639189 --repo zuizui0223/mois --name mois-prefetch-paired-real-photo-benchmark --dir speed_check
          python - <<'PY'
          import json,os
          from pathlib import Path
          b=json.loads((Path('speed_check')/'benchmark.json').read_text())
          ok=(b['schema']=='mois_prefetch_paired_real_photo_replay_v1'
              and b['source_sha256']=='3483808cc4ae773073e191baac282e8cc87f1dd8996b6369067f89980ab93cf3'
              and b['all_terminal_columns_exactly_equal']
              and b['both_pairs_faster'] and b['speed_ratio']>1.05)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('prefetch='+str(ok).lower()+'\n')
          print('Paired small-sample benchmark enables overlap:',ok)
          PY
  # Retain the original executor for provenance, but a completed immutable
  # snapshot is never launched again. Future data must have a new source roster.
  images:
    needs: check
    if: needs.check.outputs.run_images == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == 'zuizui0223/mois')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [0,1,2,3,4,5,6,7]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      RESUME_RUN: ${{ inputs.resume_run }}
      USE_PREFETCH: ${{ needs.check.outputs.prefetch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: next8192-source
          path: source
      - name: Restore any completed units without overwriting their photo results
        run: |
          set -euo pipefail
          mkdir -p measurements
          if [ -n "$RESUME_RUN" ]; then
            gh run download "$RESUME_RUN" --repo zuizui0223/mois --name "next8192-group-${{ matrix.group }}" --dir measurements
          fi
      - name: Install the same frozen FCP loader and model once per group
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy Pillow ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Acquire images, measure colours and save completed units; no statistical model
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-cached-photo-rate"
          if [ "$USE_PREFETCH" = true ]; then
            python -m scripts.acquisition.mois_prefetch --source source --group "${{ matrix.group }}" --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" --output measurements
          else
            start=$(( ${{ matrix.group }} * 4 ))
            for shard in $(seq "$start" "$((start+3))"); do
              python -m scripts.acquisition.mois_collect_remaining_pool measure --source source --shard "$shard" --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" --output measurements
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next8192-group-${{ matrix.group }}
          path: measurements/
          if-no-files-found: warn
          retention-days: 90
  save:
    needs: [check, images]
    if: always() && needs.check.result == 'success' && (needs.check.outputs.archive_run != '' || needs.images.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the existing completed photo table without loading a model
        env:
          ARCHIVE_RUN: ${{ needs.check.outputs.archive_run }}
        run: |
          set -euo pipefail
          test "$ARCHIVE_RUN" = 39132545774
          gh run download "$ARCHIVE_RUN" --repo zuizui0223/mois --name next8192-complete-data-only --dir completed
      - name: Verify unchanged complete source, actual counts and original model receipt
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 pyarrow==19.0.1
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import pandas as pd
          p=Path('completed')
          r=json.loads((p/'receipt.json').read_text())
          s=json.loads((p/'source.json').read_text())
          actual=hashlib.sha256((p/'measured_photos.parquet').read_bytes()).hexdigest()
          assert actual==r['photo_data_sha256']=='11be4908cbd92221bf5cc3df4c1fc6d9b9fa412ccd2702b90762b9b1abfc22fe'
          assert r['schema']=='mois_cached_remaining_complete_data_only_v1'
          assert r['source_sha256']==s['data_sha256']=='93585144e539ce7d4fe6e69b24bd209a292f425b7ce84329d6cd8615177f5a8d'
          d=pd.read_parquet(p/'measured_photos.parquet')
          known=d.morph.isin(['white','yellow_orange','red_pink','blue_purple'])
          failed=d.measurement_status.eq('image_acquisition_failed')
          assert len(d)==8192 and d.photo_id.is_unique and d.measurement_id.is_unique
          assert int(known.sum())==r['classified']==2780
          assert int(failed.sum())==r['acquisition_failed']==50
          assert int((~failed).sum())==r['downloaded']==8142
          assert int((~known & ~failed).sum())==r['acquired_unclassified']==5362
          assert known.eq(d.classified_four_hue.astype(str).eq('true')).all()
          assert not r['ecological_models_run'] and not r['raw_photo_bytes_retained']
          print('MOIS_8192_ALREADY_MEASURED_DATA_RESTORED_NO_IMAGE_RERUN',json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: next8192-complete-data-only
          path: completed/
          if-no-files-found: error
          retention-days: 90
      - name: Archive only from the trusted main branch, never a PR merge ref
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          tag=mois-cached-next8192-measured-data-only-v1
          if gh release view "$tag" --repo zuizui0223/mois >/dev/null 2>&1; then
            gh release download "$tag" --repo zuizui0223/mois --dir previous --pattern receipt.json
            cmp previous/receipt.json completed/receipt.json
          else
            gh release create "$tag" completed/*.parquet completed/*.json --repo zuizui0223/mois --target "$GITHUB_SHA" \
              --title 'MOIS next 8192 cached original photos: acquired images and colour data' \
              --notes 'Complete measured data recovered without image reprocessing. 8192 attempts, 8142 acquired, 2780 classified, 50 acquisition failures, 5362 acquired but unclassifiable. Original photo IDs, source metadata, model and SHA unchanged. No ecological analysis or raw image redistribution.'
          fi
