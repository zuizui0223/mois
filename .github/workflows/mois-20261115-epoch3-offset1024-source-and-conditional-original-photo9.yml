name: MOIS epoch3 offset1024 128 prior-zero-ROI taxa created-post-earliest-scan conditional genuine ROI9
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-20261115-epoch3-offset1024-source-and-conditional-original-photo9.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-epoch3-offset1024-20261115-immutable-one-source-one-pixel
  cancel-in-progress: false

jobs:
  source-only-historical-independent-new-created-CC-pictures:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      has_new: ${{ steps.freeze.outputs.has_new }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require preceding measured source worker independent audit formal atlas and final no-candidate 24
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          repo='zuizui0223/mois'
          get=lambda run,kind:json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/{kind}?per_page=100']))
          jobs=get(43669250173,'jobs')['jobs']
          assert len(jobs)==4 and all(j['conclusion']=='success' for j in jobs)
          expected={
            'mois-20261115-epoch2-offset2048-new-created-128taxa-signed-1231340-ID-disjoint-source':
              '90d4464d60a828f3e90d76587ec632b869a4b3b6b996f8754296f16ce80c9202',
            'mois-20261115-epoch2-offset2048-genuine-FCP-ROI9-pixel-terminal':
              'da462e973702287e6437a035b55db2ddb3666db10f92bcfa283e381b45fd0023',
            'mois-20261115-epoch2-offset2048-independent-strict9-audit':
              '4781ab7801d7c5139f5dad05cbc529a6143c9601816cdb34bc42f754c1da55bf',
            'mois-20261115-epoch2-offset2048-genuine-original-42111-taxonomy-append':
              '2686b566485c8f13593e4ba463ae4b84d6d3b497c37ba6eabee4e0a9bd6a1696'}
          arts=get(43669250173,'artifacts')['artifacts']
          assert all(sum(a['name']==n and a['digest']=='sha256:'+h and not a['expired'] for a in arts)==1 for n,h in expected.items())
          assert get(43670550152,'jobs')['jobs'][0]['conclusion']=='success'
          tail=get(43670550152,'artifacts')['artifacts']
          assert sum(a['id']==14143773288 and a['digest']=='sha256:945c8cd2ebc980e2fc101d8f6216c33997b886b0391a6645d99c459756ba74f8' and not a['expired'] for a in tail)==1
          PY
          # Gate next offset on complete prior 128-taxon source proof (not on PR QA checks).
          test "$(gh api "repos/$REPO/actions/runs/43687426193" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/43687426193/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="mois-20261115-epoch3-offset896-signed-1231341-ID-disjoint-source" and .digest=="sha256:dd7aa2694135e460340ef443c115f93c087ad206595956a1874571405d532ece" and (.expired|not))] | length')" = 1
          mkdir -p prior_epoch3
          gh run download 43687426193 --repo "$REPO" --name mois-20261115-epoch3-offset896-signed-1231341-ID-disjoint-source --dir prior_epoch3
          python - <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          p=Path("prior_epoch3")
          h=lambda f:hashlib.sha256((p/f).read_bytes()).hexdigest()
          r=json.loads((p/"receipt.json").read_text())
          assert h("receipt.json")=="abfe1cbba90424ffbc8d21662033e24940806b20020eab06f69c632573d644a0"
          assert r["source_status_SHA256"]==h("source_taxon_status.csv")=="b89f231f1347964b7ff5b506c7abcac4272308c054cb8ef1742f8950d7b7c3e9"
          assert r["source_candidates_SHA256"]==h("source_candidates.csv")=="01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b"
          assert (r["hash_disjoint_taxon_offset"],r["searched_zero_numeric_taxa"],r["source_API_error_count"],r["new_independent_original_photo_candidates"],r["old_original_photo_attempt_ID_count"])==(896,128,0,0,1231341)
          rows=list(csv.DictReader((p/"source_taxon_status.csv").open()))
          assert len(rows)==len({x["inat_taxon_id"] for x in rows})==128
          assert all(x["status"]=="source_queried" for x in rows)
          repo='zuizui0223/mois'
          # Independently require earlier epoch3 offsets to be byte-consistent and taxon-disjoint.
          for offset,run,name,digest,receipt_sha,status_sha in [
            (0,43671381513,'mois-20261115-epoch3-offset0-signed-1231341-ID-disjoint-source',
             '775ef42cf2e6738f6a02010a3f7f8c26cbe386cd84f0ef3c66a26dbba925459d',
             'f1dc2db9dbb68785b16780623f1c2a048294ae83a3f04848d49d15a899d1a11e',
             '198022366763a7aca05497c8dc50d3cc3a3759137f477c2a6640a9db1017c597'),
            (128,43676734248,'mois-20261115-epoch3-offset128-signed-1231341-ID-disjoint-source',
             '3fc1c124ccdd9408206b0b4707fd98c566938d35bdf3c7aeea65c46aa840a6ae',
             'f98b8d3a9d3d20f929e11050a152544f69b14aad30f38c85107d1cd8bd727135',
             '619179f6b0f8f80accc9b55d1caa014e6637d62f33ec2ed3005f698503f9ae30'),
            (256,43677032522,'mois-20261115-epoch3-offset256-signed-1231341-ID-disjoint-source',
             'a344b3c247a5c352853f11244816c7800c98f89504dbdcc9f09d4fd2c078d663',
             '16e96326baadfdcd1e390e490ae8d7db068ad6e5bdfe9422a70d9ce7a2573d42',
             '82bbe373a23f35c1a346606e66f8e52bf47d914971b89c85371d81428b623bb6'),
            (384,43678669338,'mois-20261115-epoch3-offset384-signed-1231341-ID-disjoint-source',
             'becac5657528ac816f0f0aed0b55aa1f931de999c2a807f7984800184c1f5249',
             'bd0969939a3d68ab443f3c531bd731a3d3bd25067e5865e2f7c57c8a3eba5c3f',
             '17962b8d29ef0b9f3fc1d196106a9a09a5bc1ebb65bde57920b39a17aeef57e8'),
            (512,43679061928,'mois-20261115-epoch3-offset512-signed-1231341-ID-disjoint-source',
             '71d44381194a16c08a0a85a861750011e28aadc080aaca194162b8fd606d43e8',
             'b61624ed9a4dedb82b19681f7e5eea41688e05ca7c08c2ae6ce9bea7ae050d6e',
             '57d09ec13f9e73fb17f17afe7d4a293a300c485512be5af916dd4c34c388cc1e'),
            (640,43684480684,'mois-20261115-epoch3-offset640-signed-1231341-ID-disjoint-source',
             '7c2c1c54fdc642b745b85a7e30069f312d7888a94b9169c80ebf7adab656c5c8',
             '4ed440e25adbb6e3efd6df7f4b792c26baf4b2f94bf4f4e73703466acf550463',
             'de4db1ca57a63428e108879c7a269c952577c4bd53e48817833b519036a72fc7'),
            (768,43684813161,'mois-20261115-epoch3-offset768-signed-1231341-ID-disjoint-source',
             '33704ad045547889c2aaae18fdac96f104537e43f0a57014643197a3ab28afb4',
             '1a0f60e010e66db610b5c037974721a5da2c13ae6b31be1a0467986df75c4200',
             '017af7a2e78ad22d7bc4253e24a1c6559c0196a60f941fa2ed72529b972aa9b2')]:
            import subprocess
            artifacts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts?per_page=100']))['artifacts']
            assert sum(z['name']==name and z['digest']=='sha256:'+digest and not z['expired'] for z in artifacts)==1
            folder=Path('prior_epoch3_'+str(offset));folder.mkdir(exist_ok=True)
            subprocess.run(['gh','run','download',str(run),'--repo',repo,'--name',name,'--dir',str(folder)],check=True)
            prior=json.loads((folder/'receipt.json').read_bytes())
            actual=lambda f:hashlib.sha256((folder/f).read_bytes()).hexdigest()
            assert actual('receipt.json')==receipt_sha
            assert prior['source_status_SHA256']==actual('source_taxon_status.csv')==status_sha
            assert prior['source_candidates_SHA256']==actual('source_candidates.csv')
            assert (prior['hash_disjoint_taxon_offset'],prior['searched_zero_numeric_taxa'],prior['source_API_error_count'],prior['new_independent_original_photo_candidates'],prior['old_original_photo_attempt_ID_count'])==(offset,128,0,0,1231341)
            earlier=list(csv.DictReader((folder/'source_taxon_status.csv').open()))
            assert len(earlier)==len({z['inat_taxon_id'] for z in earlier})==128
            assert all(z['status']=='source_queried' for z in earlier)
            assert not {z['inat_taxon_id'] for z in earlier}&{z['inat_taxon_id'] for z in rows}
          previous_groups=[]
          for offset in (0,128,256,384,512,640,768):
            with (Path('prior_epoch3_'+str(offset))/'source_taxon_status.csv').open() as fx:
              previous_groups.append({z['inat_taxon_id'] for z in csv.DictReader(fx)})
          assert len(set.union(*previous_groups))==896
          print("MOIS_EPOCH3_PRIOR_128_SIGNED_SOURCE_GATE_SUCCESS",flush=True)
          PY
          mkdir -p final24 predecessor/source predecessor/worker predecessor/audit predecessor/atlas
          gh run download 43670550152 --repo "$REPO" --name mois-20261115-epoch2-offset2176-new-created-24taxa-signed-1231341-ID-disjoint-source --dir final24
          gh run download 43669250173 --repo "$REPO" --name mois-20261115-epoch2-offset2048-new-created-128taxa-signed-1231340-ID-disjoint-source --dir predecessor/source
          gh run download 43669250173 --repo "$REPO" --name mois-20261115-epoch2-offset2048-genuine-FCP-ROI9-pixel-terminal --dir predecessor/worker
          gh run download 43669250173 --repo "$REPO" --name mois-20261115-epoch2-offset2048-independent-strict9-audit --dir predecessor/audit
          gh run download 43669250173 --repo "$REPO" --name mois-20261115-epoch2-offset2048-genuine-original-42111-taxonomy-append --dir predecessor/atlas
          python - <<'PY'
          from pathlib import Path
          import csv,json,hashlib
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          f=Path('final24'); r=json.loads((f/'receipt.json').read_bytes())
          assert h(f/'receipt.json')=='97fc613e8ff61483df0d9f9920b4da2fc8599ea659a70579ce9c7eabe8603a1b'
          assert r['hash_disjoint_taxon_offset']==2176 and r['searched_zero_numeric_taxa']==24
          assert r['old_original_photo_attempt_ID_count']==1231341
          assert r['new_independent_original_photo_candidates']==0 and r['source_API_error_count']==0
          assert h(f/'source_taxon_status.csv')==r['source_status_SHA256']=='0890375839630bf345dd4d0dad7f44f28c4e2e5c53f3aa7e4ce777d483bd4630'
          assert h(f/'source_candidates.csv')==r['source_candidates_SHA256']
          tail_ids={z['inat_taxon_id'] for z in csv.DictReader((f/'source_taxon_status.csv').open())}
          assert len(tail_ids)==24
          p=Path('predecessor'); s=json.loads((p/'source/receipt.json').read_bytes())
          a=json.loads((p/'audit/receipt.json').read_bytes())
          t=json.loads((p/'atlas/receipt.json').read_bytes())
          w=json.loads((p/'worker/shard_000/receipt.json').read_bytes())
          assert s['new_independent_original_photo_candidates']==1
          assert h(p/'source/manifest.json')==s['source_manifest_SHA256']=='6b916e7c32fe35fe72e647fbbbe8823bd300310487165480e9a4231753d0d2ac'
          assert h(p/'source/shards/shard-000.csv')==s['source_shard_SHA256']
          assert w['downloaded']==1 and w['classifiable']==0 and w['unclassifiable_acquired']==1
          assert h(p/'worker/shard_000/receipt.json')==a['source_and_worker_sha256']['worker_receipt_sha256']
          assert h(p/'worker/shard_000/photos.csv')==a['source_and_worker_sha256']['worker_terminal_sha256']
          assert h(p/'audit/new_real_original_nine_photo9_delta.parquet')==a['verified_delta_sha256']
          assert a['new_strict9_numeric_photos']==0 and a['new_technical_unknowns']==1 and a['technical_unknown_nine_fractions_all_missing']
          assert h(p/'atlas/mois_42111_post20261114_new_independent_original_photo9.csv.gz')==t['derived_atlas_sha256']=='6d08bfc203f317f1fc4a8d3d5f22015a7d0b393cba8ce9fcb18dd0ea74fe1909'
          assert t['cumulative_photo_attempts']==1231341 and t['cumulative_numeric_taxa']==39911 and t['zero_numeric_remaining']==2200
          photos=list(csv.DictReader((p/'worker/shard_000/photos.csv').open()))
          assert len(photos)==1 and photos[0]['photo_id']=='763511862' and photos[0]['observation_id']=='bc35b23d-a3e9-45e5-9820-f9abd0c10418'
          assert photos[0]['image_sha256']=='7dd161d2f6bd95068e59e5a8b64290538208145b8d0e655f236bbb43cf126a12'
          print('MOIS_PREDECESSOR_SIGNED_SOURCE_PIXEL_AUDIT_ATLAS_AND_FINAL24_BYTE_GATE_SUCCESS',flush=True)
          PY

      - name: Restore all 1231341 original photo ID and observation UUID history, 97 recent raw hashes, official atlas
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p old/history old/new11 old/new64 old/new18 old/offset1152 old/offset1536 old/offset1792 old/offset2048 latest
          gh run download 43546479575 --repo "$REPO" --name mois-postsnapshot-two-CC-photos-full-1231244-ID-source --dir old/history
          gh run download 43561529394 --repo "$REPO" --name mois-five-postsnapshot11-real-original-iNat-photo9-42111-taxa-append --dir old/new11
          gh run download 43562522326 --repo "$REPO" --name mois-new1909-fresh-original-real-ROI9-42111-taxonomy-appended --dir old/new64
          gh run download 43566369683 --repo "$REPO" --name mois-postsnap-remaining18-genuine-ROI9-cumulative-atlas --dir old/new18
          gh run download 43599310470 --repo "$REPO" --name mois-20261114-offset1152-independent-strict9-audit --dir old/offset1152
          gh run download 43608952945 --repo "$REPO" --name mois-20261114-offset1536-independent-strict9-audit --dir old/offset1536
          gh run download 43612554673 --repo "$REPO" --name mois-20261114-offset1792-independent-strict9-audit --dir old/offset1792
          gh run download 43669250173 --repo "$REPO" --name mois-20261115-epoch2-offset2048-independent-strict9-audit --dir old/offset2048
          cp predecessor/atlas/mois_42111_post20261114_new_independent_original_photo9.csv.gz latest/atlas.csv.gz
          python - <<'PY'
          from scripts.acquisition.mois_epoch3_new_created_disjoint_photo9 import m, select_epoch3_taxa
          import pandas as pd,numpy as np,csv
          old,uuid,sha=m.history()
          a=m.read_atlas('latest/atlas.csv.gz')
          assert len(old)==1231341 and len(sha)==97 and len(a)==42111
          assert '763511862' in old and 'bc35b23d-a3e9-45e5-9820-f9abd0c10418' in uuid
          n=select_epoch3_taxa(a,128,1024)
          assert len(n)==128 and len(set(n))==128
          with open('final24/source_taxon_status.csv') as f:last={x['inat_taxon_id'] for x in csv.DictReader(f)}
          assert not set(n)&last
          k=['observed_mean_'+v for v in ('white','yellow','orange','red','pink','magenta','purple','blue','bronze')]
          nz=a.after_strict9.gt(0); v=a.loc[nz,k].to_numpy(float)
          assert np.isfinite(v).all() and (v>=0).all() and (abs(v.sum(1)-1)<0.001).all()
          assert a.loc[~nz,k].isna().all().all()
          print('MOIS_EPOCH3_ALL_HISTORY_ID_UUID_AND_97_RAW_SHA_9_VECTOR_GATE_SUCCESS',flush=True)
          PY

      - name: Query 128 new-epoch hash-disjoint taxa for only unused CC originals; prevent same source re-start
        id: freeze
        run: |
          set -euo pipefail
          # Preceding offset896 source-only terminal SUCCESS and zero candidates verified.
          # Any earlier run of this offset1024 workflow is a hard stop, even on retry.
          test "$(gh api "repos/$REPO/actions/runs/43687426193" --jq .conclusion)" = success
          test "$(gh run list --repo "$REPO" --workflow mois-20261115-epoch3-offset1024-source-and-conditional-original-photo9.yml --limit 100 --json databaseId --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID)] | length")" = 0
          python -m scripts.acquisition.mois_epoch3_new_created_disjoint_photo9 source --atlas latest/atlas.csv.gz --output newest --offset 1024
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv,json
          r=json.load(open('newest/receipt.json'))
          assert r['schema']=='mois_incremental_20261115_epoch3_post_earliest_epoch2_scan_cc_original_photo9_v1'
          assert r['created_utc_lower_bound']=='2026-11-14T18:43:28+00:00'
          assert r['old_original_photo_attempt_ID_count']==1231341
          assert r['hash_disjoint_taxon_offset']==1024 and r['searched_zero_numeric_taxa']==128
          assert r['source_API_error_count']==0 and r['old_original_photo_obs_ID_overlap']==0
          assert r['strict9_numeric_photos']==0 and not r['original_pixels_fetched']
          rows=list(csv.DictReader(open('newest/source_taxon_status.csv')))
          assert len(rows)==len({x['inat_taxon_id'] for x in rows})==128
          with open('prior_epoch3/source_taxon_status.csv') as f:
            previous={x['inat_taxon_id'] for x in csv.DictReader(f)}
          assert len(previous)==128 and not (previous & {x['inat_taxon_id'] for x in rows})
          assert r['old_all_image_raw_SHA_disjointness_proven'] is False
          assert not r['original_pixels_fetched']

          print('has_new='+str(r['new_independent_original_photo_candidates']>0).lower())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-20261115-epoch3-offset1024-signed-1231341-ID-disjoint-source
          path: newest/
          retention-days: 90
          if-no-files-found: error

  pixel-worker-only-if-new-independent-originals:
    needs: source-only-historical-independent-new-created-CC-pictures
    if: needs.source-only-historical-independent-new-created-CC-pictures.outputs.has_new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-20261115-epoch3-offset1024-signed-1231341-ID-disjoint-source
          path: signed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap frozen FCP YOLO11 EfficientSAM original ROI-v4
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Acquire only frozen source new originals and measure nine RGB ROI fractions
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-epoch3-offset1024-original-only"
          python -m scripts.acquisition.mois_full_index_real_original_photo_measure work --source signed --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" --group 0 --output pixel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-20261115-epoch3-offset1024-genuine-FCP-ROI9-pixel-terminal
          path: pixel/
          retention-days: 90
          if-no-files-found: warn

  independent-byte-identity-and-strict9-audit:
    needs: [source-only-historical-independent-new-created-CC-pictures,pixel-worker-only-if-new-independent-originals]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore signed source, worker, all old IDs and recent raw SHA
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p signed pixel old/history old/new11 old/new64 old/new18 old/offset1152 old/offset1536 old/offset1792 old/offset2048
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261115-epoch3-offset1024-signed-1231341-ID-disjoint-source --dir signed
          gh run download "$GITHUB_RUN_ID" --repo "$REPO" --name mois-20261115-epoch3-offset1024-genuine-FCP-ROI9-pixel-terminal --dir pixel
          gh run download 43546479575 --repo "$REPO" --name mois-postsnapshot-two-CC-photos-full-1231244-ID-source --dir old/history
          gh run download 43561529394 --repo "$REPO" --name mois-five-postsnapshot11-real-original-iNat-photo9-42111-taxa-append --dir old/new11
          gh run download 43562522326 --repo "$REPO" --name mois-new1909-fresh-original-real-ROI9-42111-taxonomy-appended --dir old/new64
          gh run download 43566369683 --repo "$REPO" --name mois-postsnap-remaining18-genuine-ROI9-cumulative-atlas --dir old/new18
          gh run download 43599310470 --repo "$REPO" --name mois-20261114-offset1152-independent-strict9-audit --dir old/offset1152
          gh run download 43608952945 --repo "$REPO" --name mois-20261114-offset1536-independent-strict9-audit --dir old/offset1536
          gh run download 43612554673 --repo "$REPO" --name mois-20261114-offset1792-independent-strict9-audit --dir old/offset1792
