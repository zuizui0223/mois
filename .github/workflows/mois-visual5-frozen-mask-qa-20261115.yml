name: MOIS diagnostic frozen FCP-v4 5 mismatched-photo masks (no atlas promotion)
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-visual5-frozen-mask-qa-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-frozen-v4-mask-QA5-single-source-20261115
  cancel-in-progress: false

jobs:
  capture-signed-five-masks-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check this is first unique QA5 attempt and prior genuine worker is signed SUCCESS
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          old=$(gh run list --repo "$REPO" --workflow mois-visual5-frozen-mask-qa-20261115.yml \
            --limit 100 --json databaseId --jq ".[] | select(.databaseId < $GITHUB_RUN_ID) | .databaseId")
          test -z "$old" || { echo "An earlier same frozen-mask run already exists: $old"; exit 1; }
          test "$(gh api "repos/$REPO/actions/runs/43673586307" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/43673586307/artifacts" \
            --jq '.artifacts[] | select(.id==14145521186) | .digest')" \
            = 'sha256:b35e963d208a82da580dc6d093b95b000530ce9f2204791102c3a70e49e8608f'
          test "$(gh api "repos/$REPO/actions/runs/43673586307/artifacts" \
            --jq '.artifacts[] | select(.id==14145555692) | .digest')" \
            = 'sha256:8d49aeb4b9362f76a3b2b290850b6e7b0a42847052c2e4dc5e9bb7e25d79bce4'
      - name: Install pinned FCP ROI-v4 dependencies and test mask geometry + identity
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 pyarrow==19.0.1 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          python -m unittest discover -s tests -p test_mois_visual5_frozen_mask_qa_20261115.py -v
      - name: Restore exactly two signed frozen 38-photo source and numerical worker ZIPs
        run: |
          set -euo pipefail
          mkdir -p input
          for entry in '14145521186 source' '14145555692 worker'; do
            set -- $entry
            curl --fail --location --silent --show-error --retry 2 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/actions/artifacts/$1/zip" \
              --output "input/$2.zip"
          done
          echo 'b35e963d208a82da580dc6d093b95b000530ce9f2204791102c3a70e49e8608f  input/source.zip' | sha256sum -c -
          echo '8d49aeb4b9362f76a3b2b290850b6e7b0a42847052c2e4dc5e9bb7e25d79bce4  input/worker.zip' | sha256sum -c -
      - name: Bootstrap byte-identical FCP YOLO11 detector and EfficientSAM models, no algorithm edits
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Replay same five photo bytes and compare all 12 palette counts before retaining masks
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-exact-five-mask-replay-rate-gate"
          python -m scripts.analysis.mois_visual5_frozen_mask_qa_20261115 \
            --source-zip input/source.zip --worker-zip input/worker.zip \
            --fcp-checkout "$RUNNER_TEMP/fcp" --sam-dir "$RUNNER_TEMP/sam" \
            --output mask_qa5
          python - <<'PY'
          import json
          r=json.load(open('mask_qa5/receipt.json'))
          assert r['replayed_photo_count']==5 and r['mask_byte_exact_palette_replays']==5
          assert r['mask_size_and_flip_replays']==5
          assert r['new_independent_original_photo_ids']==0
          assert r['new_nine_palette_numeric_measurements']==0
          assert r['photographic_colour_labels_changed']==0 and r['main_catalogue_changes']==0
          assert r['raw_image_bytes_in_artifact'] is False
          print('MOIS_FROZEN5_MASK_LOCATION_QA_VERIFIED',r['output_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-5-frozen-mask-location-QA-no-RGB-no-colour-promotion-20261115
          path: mask_qa5/
          retention-days: 7
          if-no-files-found: warn
