name: MOIS 2020 real VIIRS radiance vs pop-matched original white ROI cells
on:
  push:
    branches: [analysis/mois-viirs-popmatch-20261105]
    paths:
      - .github/workflows/mois-viirs-2020-population-match.yml
      - scripts/analysis/mois_viirs_2020_population_match.py
      - tests/test_mois_viirs_2020_population_match.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-2020-viirs-pop-original-photo-cell-crosssection-v1
  cancel-in-progress: false
jobs:
  empirical-matched-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test calendar-year, raw cloud coverage, original-photo source and conditional matching rules
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 requests==2.32.5 pytest==8.4.2
          python -m pytest -q tests/test_mois_viirs_2020_population_match.py
          python -m py_compile scripts/analysis/mois_viirs_2020_population_match.py
      - name: Reuse ONLY 20261030 frozen source-observation climate and photo-colour numbers
        run: |
          set -euo pipefail
          mkdir -p input
          gh run download 41007444495 --repo zuizui0223/mois --name mois-nohuman-canonical-climate-joined-20261030 --dir input
          echo 'f033661d76e07898a5c13199a55c5d0ce6e55353daa48b0058c456979e90644c  input/canonical_observations_climate.csv.gz' | sha256sum -c -
      - name: Retrieve four 2020 raw-radiance months and independent 2020 population density at source-locked 0.05-degree cells
        timeout-minutes: 27
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_viirs_2020_population_match \
            --canonical input/canonical_observations_climate.csv.gz \
            --out matched_2020 --workers 10
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          r=json.loads(Path('matched_2020/receipt.json').read_text())
          assert r['schema']=='mois_2020_quarterly_VIIRS_pop_density_original_strict9_cell_pilot_v1'
          assert r['cells_exposed']>500
          assert r['source']['source_subarm']=='historical_main'
          assert r['source']['year']==2020
          assert r['existing_original_photo_images_downloaded']==0
          assert r['new_flower_ROI_inference']==0
          assert r['HuiWalter_or_MNAR_sensitivity_not_run']
          assert r['photographed_taxon_colour_composition_NOT_species_absence']
          assert r['four_months_NOT_true_annual_VIIRS_composite']
          for name,digest in r['output_sha256'].items():
              actual=hashlib.sha256((Path('matched_2020')/name).read_bytes()).hexdigest()
              assert digest==actual,(name,digest,actual)
          print('MOIS_2020_VIIRS_WORLDPOP_REAL_SOURCE_SHA_VERIFIED',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-2020-VIIRS4month-WorldPop2020-taxonequal-source-cells
          path: matched_2020/
          retention-days: 90
          if-no-files-found: error
