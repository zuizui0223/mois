name: MOIS epoch6 new-created offset256 signed disjoint genuine original ROI9
# New hash-partitioned epoch after completed 2,199-taxon sweep; no original photo/UUID reuse.
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-20261117-epoch6-offset256-new-created-window-and-conditional-original-photo9.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-epoch6-offset256-only-once-signed-history
  cancel-in-progress: false

jobs:
  source-only-first128:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      PYTHONUNBUFFERED: '1'
    outputs:
      has_new: ${{ steps.freeze.outputs.has_new }}
