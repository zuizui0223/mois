name: "MOIS Ecology: verified DoPI v2 positive flower visitor guilds x global photo9"
on:
  push:
    branches:
      - analysis/mois-gift-independent-pollination-mode-20261118
    paths:
      - scripts/analysis/mois_dopi_v2_positive_flower_visitors_photo9_20261118.py
      - .github/workflows/mois-dopi-v2-positive-guild-ninehue-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-dopi-v2-positive-guild-ninehue-20261118
  cancel-in-progress: false
jobs:
  external-documented-visitors:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install study-level statistical workflow
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "scipy>=1.11,<2"
          python -m py_compile \
            scripts/analysis/mois_dopi_v2_positive_flower_visitors_photo9_20261118.py
      - name: Download SHA-locked original MOIS 37,104 species hue9 source adapter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14411131896/zip" \
            -o source/mois_37104_photo9_signed.zip
          echo "d024e4f497c67c0eb3073244dc84189e50fe1c22deec2231f27adef8ab5d7035  source/mois_37104_photo9_signed.zip" | sha256sum -c
      - name: Retrieve immutable public Zenodo DoPI v2 original CSV URL from release metadata
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request,urlopen
          from pathlib import Path
          request=Request("https://zenodo.org/api/records/22876365",
                   headers={"User-Agent":"MOIS-ecological-documented-visitors/1.0"})
          with urlopen(request,timeout=55) as stream:
              meta=json.load(stream)
          title=str(meta.get("metadata",{}).get("title",""))
          doi=str(meta.get("doi") or meta.get("metadata",{}).get("doi") or "")
          assert "dopi" in title.lower(),title
          assert doi.lower()=="10.5281/zenodo.22876365",doi
          items=[f for f in meta["files"]
              if f.get("key","").lower() in ("dopi_dataset_2.0.csv",
                 "dopi_dataset_2.0.csv.gz","dopi_dataset.csv",
                 "dopi_dataset.csv.gz","dopi_dataset.zip")]
          assert len(items)==1,[f.get("key") for f in meta["files"]]
          f=items[0]
          assert f["key"]=="DoPI_dataset_2.0.csv",f["key"]
          u=f.get("links",{}).get("self")
          assert u.startswith("https://"),u
          assert f.get("size")==384896230,f.get("size")
          Path("source/dopi_download_url.txt").write_text(u+"\n")
          Path("source/DOI_EVIDENCE_AND_SOURCE.txt").write_text(
              f"DoPI v2 DOI {doi}\nSource: {title}\n"
              f"Source file: {f['key']}\n"
              "Original DoPI 676900 raw rows; positive visitor grades 1/2/3 only.\n"
              "No copyrighted raw DoPI rows uploaded as artifacts.\n")
          print("MOIS_ORIGINAL_PUBLIC_DOPI_V2_VERSION_AND_SIZE_MATCH",doi,f["size"])
          PY
      - name: Download exact public 384896230 byte DoPI v2 dataset, verify original source digest
        run: |
          set -euo pipefail
          url="$(cat source/dopi_download_url.txt)"
          curl --fail --location --silent --show-error --retry 4 \
            --retry-all-errors --connect-timeout 50 --max-time 1200 \
            "$url" -o source/DoPI_dataset_2.0.csv
          test "$(stat -c %s source/DoPI_dataset_2.0.csv)" = "384896230"
          echo "b95d3084399ed2c0978af2485801108a27d14e843b9fed2611934ea582b745c8  source/DoPI_dataset_2.0.csv" | sha256sum --check --strict
      - name: Actual named visitor guild photo9 species and same-study comparisons without absence inference
        run: |
          python scripts/analysis/mois_dopi_v2_positive_flower_visitors_photo9_20261118.py \
            --mois source/mois_37104_photo9_signed.zip \
            --dopi source/DoPI_dataset_2.0.csv \
            --out results/mois_DOPI_V2_named_positive_visitors_photo9_20261118
      - name: Upload only aggregated numerical ecology evidence, no named plant-study or original DoPI rows
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-DoPI-v2-independent-real-positive-guild-photo9-20261118
          path: results/mois_DOPI_V2_named_positive_visitors_photo9_20261118/
          retention-days: 30
          if-no-files-found: error
