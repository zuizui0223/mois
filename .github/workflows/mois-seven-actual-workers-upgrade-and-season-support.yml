name: MOIS seven real 256-photo RGB workers supersede old512 without duplicating season-targeted256
on:
  pull_request:
    paths:
      - "scripts/analysis/mois_upgrade_seven_completed_fourth256_photo_shards.py"
      - "tests/test_mois_upgrade_seven_completed_fourth256_photo_shards.py"
      - "docs/MOIS_SEVEN_COMPLETED_PHOTO_SHARDS_SOURCE_AND_SEASON_SUPPORT_20261017.md"
      - ".github/workflows/mois-seven-actual-workers-upgrade-and-season-support.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-seven-genuine-fourth256-image-roi-pixels-and-targeted-season-source
  cancel-in-progress: false
jobs:
  original-7-worker-source-ROI-verify-and-reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test no duplicate images and no unclassified photos counted as new hues
        run: |
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 pytest==8.4.2
          python -m pytest -q tests/test_mois_upgrade_seven_completed_fourth256_photo_shards.py tests/test_mois_checkpoint_real_fourth_photo_pixel_shards.py tests/test_mois_reconcile_real_disjoint_fourth512_targeted256.py
      - name: Download authentic prior photo/date, prior measured512, targeted256 and checked union310207
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original old_plan earlier512 targeted256 previously310207
          gh run download 39028400690 --repo zuizui0223/mois \
            --name mois-all256-full-FCP-original309439-149653-dated-colour-real-photo-source-and-season --dir original
          gh run download 39032258023 --repo zuizui0223/mois \
            --name mois-fourth4096-frozen-new-unmeasured-photo-ID-source-plan --dir old_plan
          gh run download 39034832999 --repo zuizui0223/mois \
            --name mois-real309951-original-photo-149865-real-ROI-149856-dated-hues-fourth512-checkpoint --dir earlier512
          gh run download 39033985014 --repo zuizui0223/mois \
            --name mois-targeted256-original-real-photo-pixels-season-siteyear-and-day-source --dir targeted256
          gh run download 39037101965 --repo zuizui0223/mois \
            --name mois-original310207-real-photo-pixels-149927-dated-hues-sampling-arm-safe --dir previously310207
          (cd original && zip -j -q original309439-source-archive.zip ./*.gz ./*.csv ./*.json)
          (cd old_plan && zip -j -q real-fourth4096-original-photo-source-plan.zip ./*.csv ./*.json)
          test -s original/original309439-source-archive.zip
          test -s previously310207/mois_310207_source_disjoint_768_real_photo_pixel_reconciliation.json
      - name: Retrieve exactly seven finished immutable original 256-image photo source/model terminal artifacts
        shell: bash
        run: |
          set -euo pipefail
          for shard in 0 1 2 3 4 5 6; do
            mkdir -p "real_workers/shard_$shard"
            gh run download 39032258023 --repo zuizui0223/mois \
              --name "mois-fourth4096-real-original-ROI256-shard-$shard" \
              --dir "real_workers/shard_$shard"
            test -s "real_workers/shard_$shard/mois_original_256_fresh_ROI_shard_$(printf '%02d' "$shard").csv"
          done
      - name: Reconcile only actual original RGB pixels, supersede old512 and compute source season-year support
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_upgrade_seven_completed_fourth256_photo_shards \
            --prior309439 original \
            --photo4096-source-zip old_plan/real-fourth4096-original-photo-source-plan.zip \
            --seven-completed-workers real_workers \
            --earlier512 earlier512 \
            --targeted256 targeted256 \
            --earlier310207 previously310207 \
            --output full311487
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('full311487/mois_311487_real_seven_worker_and_targeted256_source_qc.json').read_text())
          assert r['genuine_image_workers']==list(range(7))
          assert r['only_new_1280_photo_pixels_beyond_existing_310207']==1280
          assert r['only_new_471_four_hue_date_ROIs_beyond_existing_310207']==471
          assert (r['overall_actual_photo_pixels_with_disjoint_unique_IDs'],
                  r['overall_automatic_four_hue_original_photo_ROIs'],
                  r['overall_date_plus_automatic_four_hue_photo_ROIs']) == (311487,150407,150398)
          assert r['old512_is_subset_of_seven_workers_not_separate_cohort']
          assert r['season_enriched_targeted_pixels_not_globally_representative']
          print('MOIS_REAL311487_SOURCE_IDENTITIES_AND_SEASON_SUPPORT_VALID')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-311487-original-real-photo-RGB-150407-colour-150398-dated-seven-shards-targeted-source
          path: full311487/
          retention-days: 90
          if-no-files-found: error
