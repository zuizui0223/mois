name: "MOIS Ecology: two-way genus spatial bootstrap for altitude southern same-hue signal"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - scripts/analysis/mois_native_intro_sharedgenus_spatial_genus_stress_20261118.py
      - .github/workflows/mois-nativeintro-samegenus-spatial-genus-multiplier-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-nativeintro-crossed-genus-spatial-stress-20261118
  cancel-in-progress: false
jobs:
  spatial-genus-crossed-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal source-verified genus/space resampling dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3"
          python -m py_compile \
            scripts/analysis/mois_native_intro_sharedgenus_spatial_genus_stress_20261118.py
      - name: Fetch and verify original source of genuine WCVP same-cell shared-genera photo9 pair observations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14402781999/zip" \
            -o source/original_same_cell_genus_pair_colour.zip
          echo "f352fd89958c89a0ccb45136b555b97a13ad6fab2374496ae11b1000f83896c0  source/original_same_cell_genus_pair_colour.zip" | sha256sum -c
      - name: Test whether Southern and highland positive signals persist to both other genera and geographic blocks
        run: |
          python scripts/analysis/mois_native_intro_sharedgenus_spatial_genus_stress_20261118.py \
            --source source/original_same_cell_genus_pair_colour.zip \
            --out results/mois_samecell_photo9_two_way_genus_block_sensitivity_20261118
      - name: Upload signed 4000 replicate multiplier intervals and genus influence diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-samecell-9hue-introduction-500km-genus-crossed-bootstrap-20261118
          path: results/mois_samecell_photo9_two_way_genus_block_sensitivity_20261118/
          retention-days: 30
          if-no-files-found: error
