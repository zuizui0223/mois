name: MOIS GBIF submit first250 signed global cell SQL ONCE after secrets installed

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-GBIF-colxr-37104-first250-authenticated-one-shot-20261115
  cancel-in-progress: false

jobs:
  single-authenticated-GBIF-first250:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GBIF_USERNAME: ${{ secrets.GBIF_USERNAME }}
      GBIF_USER: ${{ secrets.GBIF_USER }}
      GBIF_PASSWORD: ${{ secrets.GBIF_PASSWORD }}
      REPO: zuizui0223/mois
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse missing GBIF secrets before any external API call
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          assert bool(os.environ.get('GBIF_USERNAME') or os.environ.get('GBIF_USER')) and bool(os.environ.get('GBIF_PASSWORD')), (
             'GBIF_USERNAME (or GBIF_USER) and GBIF_PASSWORD are required in GitHub Actions repository secrets; '
             'no GBIF submission made')
          print('GBIF_SECRET_PRESENCE_CONFIRMED_NO_SECRET_VALUE_LOGGED')
          PY
      - name: Prevent any repeat execution or accidental duplicate GBIF download jobs
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          previous=$(gh run list --repo "$REPO" --workflow mois-gbif-37104-first250-on-demand-after-secrets.yml \
            --limit 100 --json databaseId --jq ".[] | select(.databaseId < $GITHUB_RUN_ID) | .databaseId")
          test -z "$previous" || { echo "PRIOR_FIRST250_ON_DEMAND_JOB_EXISTS_DO_NOT_RESUBMIT: $previous"; exit 1; }
          # Prior SQL authentication gate run finished without a request; source receipt fixed.
          test "$(gh api "repos/$REPO/actions/runs/43708178817" --jq .conclusion)" = success
          gh api "repos/$REPO/actions/runs/43708178817/artifacts" \
            --jq '.artifacts[] | select(.id==14159013597) | .digest' \
            | grep -Fx 'sha256:8c642ab261e6b0498e33f7f305946a89af610d9c2c75c07cfda7c81207e3571b'
      - name: Restore only 149 SHA-pinned GBIF SQL query JSONs, not unverified species names
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/zuizui0223/mois/actions/artifacts/14159013597/zip' \
            --output frozen149.zip
          echo '8c642ab261e6b0498e33f7f305946a89af610d9c2c75c07cfda7c81207e3571b  frozen149.zip' | sha256sum -c -
      - name: Submit EXACTLY one signed first250 query via GBIF Basic auth; do not claim a DOI
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,io,zipfile,json,hashlib,urllib.request,urllib.error,base64,pathlib,re
          out=pathlib.Path('submission');out.mkdir()
          z=zipfile.ZipFile('frozen149.zip')
          frozen=json.loads(z.read('receipt.json'))
          previous=json.loads(z.read('first250_auth_gate_receipt.json'))
          assert frozen['sql_request_count']==149 and frozen['source_colxr_species_key_count']==37104
          assert previous['status']=='GBIF_CREDENTIALS_NOT_CONFIGURED'
          assert previous['authenticated_download_submission_attempted'] is False
          assert previous['GBIF_download_key'] is None
          assert previous['public_validator_status']==201
          name='colxr_isea3h_r8_sql_request_000.json'
          raw=z.read(name)
          assert hashlib.sha256(raw).hexdigest()==frozen['request_files_sha256'][name]
          request=json.loads(raw)
          sql=request['sql']
          k=re.search(r'specieskey IN \((.*?)\)',sql,re.I)
          assert k is not None and len(re.findall(r"'[A-Z0-9]{2,16}'",k.group(1)))==250
          assert request['format']=='SQL_TSV_ZIP'
          assert 'GBIF_ISEA3HCode(8' in sql
          username=os.environ.get('GBIF_USERNAME') or os.environ.get('GBIF_USER')
          pwd=os.environ['GBIF_PASSWORD']
          encoded=base64.b64encode((username+':'+pwd).encode()).decode()
          req=urllib.request.Request('https://api.gbif.org/v1/occurrence/download/request',
              data=raw,method='POST',headers={
                'Accept':'application/json','Content-Type':'application/json',
                'Authorization':'Basic '+encoded,
                'User-Agent':'MOIS-signed-GBIF-global-grid-first250-20261115'})
          try:
              with urllib.request.urlopen(req,timeout=90) as response:
                  status=response.status
                  result=response.read(10240).decode('utf-8').strip()
          except urllib.error.HTTPError as e:
              # Fail closed on any unknown provider-side submission state. Never retry a POST here.
              print('GBIF_FIRST250_HTTP_FAILED',e.code)
              raise
          assert status==201 and re.fullmatch(r'[0-9]{7}-[0-9]{15,}',result), (
              'Unexpected GBIF response: manual source audit before any future request')
          audit={
              'schema':'mois_COLXR_37104_GBIF_first250_authenticated_real_download_submit_v1',
              'source_149_SQL_ZIP_SHA256':'8c642ab261e6b0498e33f7f305946a89af610d9c2c75c07cfda7c81207e3571b',
              'signed_query_SHA256':hashlib.sha256(raw).hexdigest(),
              'first_chunk_species_keys':250,
              'all_37104_species_and_149_requests_frozen':True,
              'GBIF_server_HTTP_status':status,
              'GBIF_download_key':result,
              'GBIF_download_DOI':None,
              'GBIF_download_grid_data_retrieved':False,
              'authenticated_submission_succeeded':True,
              'remaining_148_chunks_submitted':False,
              'plaintext_GBIF_credentials_recorded':False,
              'requires_future_download_status_and_DOI_verification':True
          }
          (out/'receipt.json').write_text(json.dumps(audit,sort_keys=True,indent=2)+'\n')
          print('MOIS_FIRST250_GBIF_REAL_SQL_DOWNLOAD_SUBMITTED_PENDING',json.dumps(audit,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-COLXR-GBIF-first250-actual-submission-receipt-if-present
          path: submission/receipt.json
          retention-days: 90
          if-no-files-found: warn
