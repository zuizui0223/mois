name: MOIS ALAN enlarge real moth-family flower-visit plant identities (NO photos)
on:
  push:
    branches: [analysis/mois-viirs-popmatch-20261105]
    paths:
      - .github/workflows/mois-ALAN-globi-moth-species-real-evidence.yml
      - scripts/analysis/mois_alan_globi_moth_plant_source_increment.py
      - tests/test_mois_alan_globi_moth_plant_source_increment.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-alan-real-globi-moth-plant-evidence-bounded
  cancel-in-progress: false
jobs:
  species-guild-source-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test GloBI family taxonomy filter, false positives, species identity
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 requests==2.32.5
          python -m unittest discover -s tests -p test_mois_alan_globi_moth_plant_source_increment.py -v
          python -m py_compile scripts/analysis/mois_alan_globi_moth_plant_source_increment.py
      - name: Reuse original MOIS, WCVP, and Island trait numeric datasets
        run: |
          set -euo pipefail
          mkdir -p original
          gh run download 41007444495 --repo zuizui0223/mois --name mois-nohuman-canonical-climate-joined-20261030 --dir original
          gh run download 39225659840 --repo zuizui0223/mois --name mois-real350399-Kew-WCVP-native-source-TDWG3-no-point-status --dir original
          gh run download 34191508045 --repo zuizui0223/island --name source-scale-batch-integration-34191508045 --dir original
          echo 'f033661d76e07898a5c13199a55c5d0ce6e55353daa48b0058c456979e90644c  original/canonical_observations_climate.csv.gz' | sha256sum -c -
          echo 'dc5bb0e3686fde0cfd327e4336245d0ceae3c7657b3bd12841bb814cc94d1eb2  original/mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz' | sha256sum -c -
          echo '9cd6aa7ca29f00c64283bcc08dcb778e212b644b837e64070051339b11d8b7b3  original/mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz' | sha256sum -c -
          echo '7e86170218814abe2845da9a0282aecfdc930819b9d0c439bae8df4a0679c577  original/direct_species_trait_ledger.csv.gz' | sha256sum -c -
      - name: Retrieve bounded GloBI true plant-moth interaction evidence; hash every source request
        timeout-minutes: 25
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_alan_globi_moth_plant_source_increment \
            --canonical original/canonical_observations_climate.csv.gz \
            --names original/mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz \
            --accepted original/mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz \
            --direct original/direct_species_trait_ledger.csv.gz \
            --out source_coverage --page-size 250 --max-pages 8
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import pandas as pd
          r=json.loads(Path('source_coverage/guild_source_integration_receipt.json').read_text())
          assert r['schema']=='MOIS_ALAN_GloBI_live_API_moth_family_source_feasibility_v1'
          assert r['validated_record_count']>0
          assert not r['new_original_image_downloads'] and not r['new_image_inferences']
          assert not r['MNAR_sensitivity_scenarios_run']
          assert r['moth_family_visit_not_documented_effective_nocturnal_pollination']
          assert r['butterfly_family_visit_not_proven_no_moth_visit']
          assert r['no_white_imputation'] and r['no_moth_absence_from_no_record']
          assert r['source_accepted_species_with_linked_flower_interaction']>=0
          for filename,digest in r['result_SHA256'].items():
              assert hashlib.sha256((Path('source_coverage')/filename).read_bytes()).hexdigest()==digest
          print('MOIS_ALAN_GLOBI_MOTH_GUILD_NEW_SOURCE_REAL_DATA_RECEIPT_OK',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-ALAN-globi-moth-butterfly-species-source-coverage-NO-PHOTOS
          path: source_coverage/
          retention-days: 90
          if-no-files-found: warn
