name: MOIS LGM photo9 sensitivity by genus, confidence, latitude and 9 hues
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-LGM-photo9-hue-robustness-20261116.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-real-37104-LGM-3GCM-hue-sensitivity-20261116
  cancel-in-progress: false

jobs:
  source-verified-sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned data and model packages
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 \
            rasterio==1.4.3 pyproj==3.7.1 statsmodels==0.14.4 scipy==1.15.2
          python -m py_compile scripts/analysis/mois_lgm_photo9_sensitivity_20261116.py
      - name: Download and verify original successful LGM three-GCM analysis
        run: |
          set -euo pipefail
          mkdir -p sources
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/14225733755/zip" \
            --output sources/LGM_original.zip
          echo 'db3b5b4fa2133194963be9233411bb6bb50bc86393d1dc50d996cc4cc78b25ab  sources/LGM_original.zip' | sha256sum -c -
      - name: Test confidence / genus-size / latitude / coverage sensitivity using same 37104 accepted species
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_lgm_photo9_sensitivity_20261116 \
            --source sources/LGM_original.zip --output MOIS_LGM_hue_QA
          python - <<'PY'
          import json
          data=json.load(open('MOIS_LGM_hue_QA/receipt.json'))
          assert data['source_zip_sha256']=='db3b5b4fa2133194963be9233411bb6bb50bc86393d1dc50d996cc4cc78b25ab'
          assert data['n_accepted_species']==37104 and data['n_analysed']==29483
          print('MOIS_LGM_QUALITY_AUDIT',json.dumps(data,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-real-LGM-3GCM-photo9-coverage-genus-quality-ninehue-robustness
          path: MOIS_LGM_hue_QA/
          retention-days: 90
          if-no-files-found: warn
