name: MOIS latest1043930 real moisture dryness and high altitude within-genus ecology
on:
  push:
    branches: [feat/latest1043930-four-axes-20261025]
    paths:
      - scripts/analysis/mois_latest1043930_water_elevation.py
      - .github/workflows/mois-latest1043930-water-elevation.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  latest-humidity-rain-elevation-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install environment-only source macroecological model libraries
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          python -m py_compile scripts/analysis/mois_latest1043930_water_elevation.py
      - name: Restore signed latest1043930 true image ROIs and matched updated WorldClim climate
        run: |
          set -euo pipefail
          mkdir -p photos climate
          gh run download 40187688390 --repo zuizui0223/mois \
            --name mois-1043930-latest-original-photo-four-hue-fully-signed-union \
            --dir photos
          gh run download 40188040027 --repo zuizui0223/mois \
            --name mois-real-latest1043930-photoid-original-worldclim-humidity-elevation \
            --dir climate
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('photos/mois_latest_1043930_photo_union_receipt.json').read_text())
          c=json.loads(Path('climate/mois_latest1043930_photo_climate_receipt.json').read_text())
          assert p['source_pixel_attempts']==c['original_exact_photo_attempts']==1043930
          assert p['source_four_hue_classified']==c['four_hue_classified']==459235
          assert c['four_hue_classified_climate_complete']==458174
          assert c['new_original_photo_ID_climate_sites_sampled']==693531
          print('MOIS_LATEST1043930_REAL_HUE_AND_NEW_ENVIRONMENT_AUTHENTICATED',flush=True)
          PY
      - name: Actually re-estimate local water dryness and elevation with genus and acquisition-arm control
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_latest1043930_water_elevation \
            --photo photos/mois_latest_1043930_true_original_photo_hue_observation.parquet \
            --climate climate/mois_latest1043930_original_photo_climate_six_columns.parquet \
            --output latest_water_elev
      - uses: actions/upload-artifact@v4
        with:
          name: mois-real1043930-water-humidity-elevation-within-genus-local-refit
          path: latest_water_elev/
          retention-days: 90
          if-no-files-found: error
