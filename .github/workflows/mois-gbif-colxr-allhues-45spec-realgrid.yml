name: MOIS actual GBIF COL XR accepted species 9-colour 100km distribution pilot
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-gbif-colxr-allhues-45spec-realgrid.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-gbif-colxr-ninehue-45spec-original-realgrid
  cancel-in-progress: false
jobs:
  actual-global-colxr-45spec-grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      MATCH_RUN: '42932546397'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test occurrence quality and accepted-colxr nine-colour labels
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyproj==3.7.1
          python -m unittest discover -s tests -p test_mois_gbif_colxr_occurrence_grid_pilot.py -v
      - name: Verify authentic globally matched GBIF COL XR source without refetching images
        run: |
          set -euo pipefail
          mkdir -p input
          gh run download "$MATCH_RUN" --repo "$REPO" \
            --name mois-global-full-nine-hue-species-GBIF-COLXR-batch-name-reconciliation \
            --dir input
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,pandas as pd
          p=Path('input/mois_gbif_colxr_exact_accepted_species_hue_roster.csv.gz')
          r=json.loads(Path('input/receipt.json').read_text())
          assert r['successful_exact_accepted_colxr_species']==26852 and r['actual_requested_nominal_taxa']==28309
          data=pd.read_csv(p,compression='gzip',dtype=str,keep_default_na=False)
          assert len(data)==26852 and data.key.is_unique and data.inat_taxon_id.is_unique
          assert data.status.eq('colxr_exact_accepted_species').all()
          assert data.COL_XR_checklistKey.nunique()==1
          assert data.COL_XR_checklistKey.iloc[0]=='7ddf754f-d193-4cc9-b351-99906754a03b'
          print('MOIS_GLOBAL26852_ORIGINAL_NINEPALETTE_ACCEPTED_SOURCE_CHECK',hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          PY
      - name: Preselect five accepted species per recorded photo hue with source-hash seed (45 source taxa, real names)
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd,hashlib,json
          names=pd.read_csv('input/mois_gbif_colxr_exact_accepted_species_hue_roster.csv.gz',
                            compression='gzip',dtype=str,keep_default_na=False)
          a=names.copy()
          a['source_species']=a.species
          a['dominant_hue9']=a.source_hue9
          palette=['white','yellow','orange','red','pink','magenta','purple','blue','bronze']
          assert set(a.dominant_hue9)==set(palette),set(a.dominant_hue9)
          a['hash_rank']=a.key.map(lambda x:hashlib.sha256(('MOIS-GBIF-ALL9-DISTRIBUTION-PILOT-20261111|'+x).encode()).hexdigest())
          pick=(a.sort_values('hash_rank',kind='stable').groupby('dominant_hue9',sort=True)
                .head(5).drop(columns='hash_rank'))
          assert len(pick)==45 and pick.key.is_unique and pick.inat_taxon_id.is_unique
          Path('pilot_source').mkdir()
          pick.to_csv('pilot_source/source45.csv',index=False)
          trace={
             'schema':'mois_colxr_verified26852_9hue_45_species_source_v1',
             'full_original_accepted_species_count':26852,
             'seed':'MOIS-GBIF-ALL9-DISTRIBUTION-PILOT-20261111',
             'source_accepted_match_sha256':hashlib.sha256(
               Path('input/mois_gbif_colxr_exact_accepted_species_hue_roster.csv.gz').read_bytes()).hexdigest(),
             'nine_palette_category_source_counts':{k:int(v) for k,v in pick.dominant_hue9.value_counts().items()},
             'source_selected_species':45,
             'source_selection_without_occurence_or_climate_outcome':True,
             'GBIF_occurrence_rows_queried_yet':0,
             'GBIF_authenticated_download_submitted':False}
          Path('pilot_source/receipt.json').write_text(json.dumps(trace,indent=2,sort_keys=True)+'\n')
          print('MOIS_9HUE_GBIF_ACCEPTED_45SPECIES_REAL_SOURCE',trace['nine_palette_category_source_counts'],flush=True)
          PY
      - name: Fetch every filtered GBIF occurrence for small-count taxa, bin 100km equal-area EPSG6933
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_gbif_colxr_occurrence_grid_pilot \
            --matches pilot_source/source45.csv \
            --max-per-hue 5 --max-occurrences 1200 \
            --output actual_distributions
          python - <<'PY'
          from pathlib import Path
          import json,pandas as pd
          s=json.loads(Path('actual_distributions/receipt.json').read_text())
          assert s['schema']=='mois_gbif_colxr_exact_species_100km_grid_pilot_v1'
          assert s['source_GBIF_taxonomy']=='COL XR'
          assert s['sample_species_queried']==45 and s['hue_categories_queried']==9
          assert s['photo_hue_at_GBIF_locations_measured'] is False
          d=pd.read_csv('actual_distributions/gbif_species_distributions_pilot_receipt.csv')
          g=pd.read_csv('actual_distributions/gbif_species_by_100km_grid_photo_hue_overlay_pilot.csv')
          if not g.empty:
             assert g.GBIF_colxr_accepted_species_key.nunique()<=45
             assert g.photo_palette9.nunique()<=9
             assert g.colour_at_gbif_location_measured.eq(False).all()
          print('MOIS_REAL45_GBIF_NINEPALETTE_SPECIES_BY_100KM',
                json.dumps({k:s[k] for k in ('successfully_enumerated_species',
                    'species_grid_rows','status_counts')},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-gbif-colxr-45accepted-9hue-real-occurrence-100km-grid
          path: |
            pilot_source/
            actual_distributions/
          retention-days: 90
          if-no-files-found: warn
