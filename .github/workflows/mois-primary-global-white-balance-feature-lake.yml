name: MOIS original photo global near-half white chromatic and immutable feature-lake
on:
  pull_request:
    paths:
      - scripts/analysis/mois_primary_global_white_balance_feature_lake.py
      - tests/test_mois_primary_global_white_balance_feature_lake.py
      - docs/MOIS_GLOBAL_WHITE_CHROMATIC_BALANCE_AND_FEATURE_LAKE_20261017.md
      - .github/workflows/mois-primary-global-white-balance-feature-lake.yml
  push:
    branches: [main]
    paths:
      - scripts/analysis/mois_primary_global_white_balance_feature_lake.py
      - tests/test_mois_primary_global_white_balance_feature_lake.py
      - docs/MOIS_GLOBAL_WHITE_CHROMATIC_BALANCE_AND_FEATURE_LAKE_20261017.md
      - .github/workflows/mois-primary-global-white-balance-feature-lake.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-immutable-309439-photo-balance-cache-v1
  cancel-in-progress: false
jobs:
  original-RGB-hue-and-abiotic-parquet:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify white versus all other colours and unknown ROI source
        run: |
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 pytest==8.4.2
          python -m pytest -q tests/test_mois_primary_global_white_balance_feature_lake.py
      - name: Recover three previously completed real original-photo and environment sources
        run: |
          set -euo pipefail
          mkdir -p source_309439 annual_309439 partial_248312
          gh run download 39028400690 --repo zuizui0223/mois \
            --name mois-all256-full-FCP-original309439-149653-dated-colour-real-photo-source-and-season \
            --dir source_309439
          gh run download 39029308911 --repo zuizui0223/mois \
            --name mois-original309439-actual-photo-hue-six-water-genus999-maxT \
            --dir annual_309439
          gh run download 38992341847 --repo zuizui0223/mois \
            --name mois-248312-REAL-site-worldclim19-bio-elev2p5m-terrain-monthnormal \
            --dir partial_248312
      - name: Verify all photo IDs, persist reusable hue and static/annual abiotic data
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_primary_global_white_balance_feature_lake \
            --original-photo source_309439/mois_original309439_fullFCP256_actual_photo_hues_and_source_dates.csv.gz \
            --original-annual-climate annual_309439/original_309439_maxT/mois_real_309439_source_photo_with_six_original_climate_anchors.csv.gz \
            --partial-soil-terrain partial_248312/mois_248312_original_photo_worldclim_static_monthly_normal_terrain.csv.gz \
            --output white_environment_cache
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('white_environment_cache')
          r=json.loads((p/'primary309439_immutable_photo_feature_lake_manifest.json').read_text())
          s=json.loads((p/'primary309439_white_chromatic_balance.json').read_text())
          assert r['original_measured_RGB_photo_IDs']==309439
          assert r['known_four_hue_original_ROIs']==149662
          assert sum(s['known_hue_counts'].values())==149662
          assert s['balance_is_not_maintained_50_50_equilibrium']
          assert s['fitness_cost_benefit_are_hypotheses_not_estimated']
          print('MOIS_GENUINE_PRIMARY_PHOTO_BALANCE_LAKE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-original309439-global-nearhalf-hue-abiotic-parquet-cache
          path: white_environment_cache/
          retention-days: 90
          if-no-files-found: error

  archive-versioned-primary-lake:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: original-RGB-hue-and-abiotic-parquet
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-original309439-global-nearhalf-hue-abiotic-parquet-cache
          path: white_environment_cache
      - name: Publish immutable measured photo-ID features only once
        run: |
          set -euo pipefail
          tag=mois-primary-309439-featurelake-546266e2bbaa-v1
          if gh release view "$tag" --repo zuizui0223/mois >/dev/null 2>&1; then
            echo "Existing immutable source snapshot is retained"
          else
            gh release create "$tag" white_environment_cache/*.parquet \
              white_environment_cache/*.json white_environment_cache/*.csv \
              --repo zuizui0223/mois --target "$GITHUB_SHA" \
              --title "MOIS primary 309439 photo-ID hue and environment cache v1" \
              --notes "Original measured 309439-photo RGB ROI; 149662 classifiable. 50:50 is descriptive, not adaptive equilibrium. Static soil/terrain partially missing; no raw licensed images."
          fi
