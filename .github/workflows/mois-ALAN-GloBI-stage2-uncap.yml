name: MOIS ALAN GloBI stage2 uncap recorded butterfly families + 2019-2024 photo
on:
  push:
    branches: [analysis/mois-viirs-popmatch-20261105]
    paths:
      - .github/workflows/mois-ALAN-GloBI-stage2-uncap.yml
      - scripts/analysis/mois_alan_globi_stage2_uncap_20261105.py
      - tests/test_mois_alan_globi_stage2_uncap_20261105.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-ALAN-source-stage2-only-still-truncated-GloBI-pages
  cancel-in-progress: false
jobs:
  provider-source-increment:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source cap detection and independent units
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 requests==2.32.5
          python -m unittest discover -s tests -p test_mois_alan_globi_stage2_uncap_20261105.py -v
          python -m py_compile scripts/analysis/mois_alan_globi_stage2_uncap_20261105.py
      - name: Reuse signed stage1 GloBI and previously recorded photo/taxon source
        run: |
          set -euo pipefail
          mkdir -p previous
          gh run download 41975735211 --repo zuizui0223/mois \
            --name mois-ALAN-expanded-GloBI-original-signed-source-multi-year-photo-support --dir previous
          gh run download 41007444495 --repo zuizui0223/mois \
            --name mois-nohuman-canonical-climate-joined-20261030 --dir previous
          gh run download 39225659840 --repo zuizui0223/mois \
            --name mois-real350399-Kew-WCVP-native-source-TDWG3-no-point-status --dir previous
          gh run download 34191508045 --repo zuizui0223/island \
            --name source-scale-batch-integration-34191508045 --dir previous
          echo '6e5ba3ca7466677615d68ac8a5657a82aca12c32c4386970b9ab8830ab283f31  previous/GloBI_extended_source_cache.csv.gz' | sha256sum -c -
          echo '8c1185b9d43587e2eadd566eec3920699eb48d00ea0b711dd9d5d581f5aeeed1  previous/additional_GloBI_pages_sha256.csv' | sha256sum -c -
          echo 'f033661d76e07898a5c13199a55c5d0ce6e55353daa48b0058c456979e90644c  previous/canonical_observations_climate.csv.gz' | sha256sum -c -
          echo 'dc5bb0e3686fde0cfd327e4336245d0ceae3c7657b3bd12841bb814cc94d1eb2  previous/mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz' | sha256sum -c -
          echo '9cd6aa7ca29f00c64283bcc08dcb778e212b644b837e64070051339b11d8b7b3  previous/mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz' | sha256sum -c -
          echo '7e86170218814abe2845da9a0282aecfdc930819b9d0c439bae8df4a0679c577  previous/direct_species_trait_ledger.csv.gz' | sha256sum -c -
      - name: Retrieve only missing butterfly GloBI pages and re-audit white four-group empirical support
        timeout-minutes: 22
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_alan_globi_stage2_uncap_20261105 \
            --prior previous/GloBI_extended_source_cache.csv.gz \
            --page-log previous/additional_GloBI_pages_sha256.csv \
            --canonical previous/canonical_observations_climate.csv.gz \
            --names previous/mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz \
            --accepted previous/mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz \
            --direct previous/direct_species_trait_ledger.csv.gz \
            --output source_stage2 --max-pages 24
          python - <<'PY'
          import json,hashlib,pandas as pd
          from pathlib import Path
          p=Path('source_stage2')
          rec=json.loads((p/'source_stage2_receipt.json').read_text())
          assert rec['schema']=='MOIS_ALAN_GloBI_stage2_precise_pagination_20261105'
          assert rec['source_stage1_count'] if 'source_stage1_count' in rec else rec['original_stage1_interaction_rows']==41106
          assert rec['initial_truncated_queries_corrected']==5
          assert rec['provider_errors']==0
          assert rec['photo_image_downloads_or_inferences']==0
          assert not rec['MNAR_scenarios_run']
          for file,digest in rec['output_SHA256'].items():
              assert hashlib.sha256((p/file).read_bytes()).hexdigest()==digest,(file,digest)
          t=pd.read_csv(p/'source_same_photo_colour_support_stage1_vs_stage2.csv')
          assert len(t)==15
          assert not t.isna().any().any()
          print('MOIS_GLOBI_STAGE2_REAL_FIVE_CAPPED_QUERIES_AND_SHAS_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-ALAN-GloBI-stage2-actual-records-2019-2024-supported-source
          path: source_stage2/
          retention-days: 90
          if-no-files-found: warn
