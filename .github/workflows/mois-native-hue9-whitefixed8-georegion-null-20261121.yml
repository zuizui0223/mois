name: "MOIS ecology: native regional nine-hue and white-fixed eight-hue nulls"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - scripts/analysis/mois_native_hue9_whitefixed8_georegion_null_20261121.py
      - scripts/analysis/mois_native_taxon_grain_audit_20261121.py
      - tests/test_native_georegion_null_20261121.py
      - .github/workflows/mois-native-hue9-whitefixed8-georegion-null-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-native-hue9-whitefixed8-georegion-null-20261121
  cancel-in-progress: false
jobs:
  native-geographic-pool-null:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and source-geography dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'numpy==2.1.3' 'pandas==2.2.3' 'pyarrow==19.0.1' \
            'pyproj==3.7.1' 'geopandas==1.1.1' 'shapely==2.2.0' \
            'pyogrio==0.13.0' 'pytest>=8,<10'
          python -m py_compile scripts/analysis/mois_native_hue9_whitefixed8_georegion_null_20261121.py
      - name: Validate synchronous species labels, fixed white identity and rank tests
        run: python -m pytest -q tests/test_native_georegion_null_20261121.py
      - name: Recover exact original data and reference results
        run: |
          set -euo pipefail
          mkdir -p source/WCVP
          for item in \
            '14166701658 GBIF 422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2' \
            '14219399376 ENV d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc' \
            '14400177816 NATIVE cbe1eef381e3e1a0062dbf5134b047f947338b7c499d2ecc0cd22ee8855909fd' \
            '14685235918 GLOBAL9 3516b3d232f2bbe8d0358de4d9cca677d3eba6c255b80a87f60c43c954dc6d33' \
            '14684484835 GLOBAL8 b1243a8505efb7837781341383ebf41cd0f72c0a0b94c6a2052b1b2f85087683'; do
            read -r artifact label digest <<< "$item"
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" \
              -o "source/$label.zip"
            echo "$digest  source/$label.zip" | sha256sum -c
          done
          tag='mois-real350399-kew-wcvp-native-tdwg3-source-v1'
          for fn in \
            'mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz' \
            'mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz' \
            'mois350399_wcvp_TDWG3_source_only_taxon_native_receipt.json'; do
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$fn" \
              -o "source/WCVP/$fn"
          done
          echo 'a3af69d99e389c20eac4d8bc2c5ab4a586a58c401d65743d9dbac1189baaaf9c  source/WCVP/mois350399_wcvp_TDWG3_source_only_taxon_native_receipt.json' | sha256sum -c
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/tdwg/wgsrpd/52da7828aba9d461dd133c27b3bd7a4407161f54/geojson/level3.geojson' \
            -o source/TDWG3.geojson
          echo 'c172bcf6aba20e19477adc60aebf0023068f0175dca8480f0760b090dcf64840  source/TDWG3.geojson' | sha256sum -c
      - name: Replay 199 original draws and run 999 native nine-hue and white-fixed eight-hue draws
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_native_hue9_whitefixed8_georegion_null_20261121 \
            --gbif source/GBIF.zip --env source/ENV.zip \
            --native-reference source/NATIVE.zip \
            --global9-reference source/GLOBAL9.zip \
            --global8-reference source/GLOBAL8.zip \
            --wcvp source/WCVP --tdwg source/TDWG3.geojson \
            --permutations 999 \
            --out results/mois_native_georegion_9hue_whitefixed8_20261121
      - name: Audit original source species units against the WCVP status crosswalk
        run: |
          python -m scripts.analysis.mois_native_taxon_grain_audit_20261121 \
            --source source \
            --out results/mois_native_georegion_9hue_whitefixed8_20261121/wcvp_taxon_grain_audit.json
      - name: Preserve complete permutation draws, cell expectations, source gates and receipts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-native-georegion-ninehue-whitefixed8-999-permutations-20261121
          path: results/mois_native_georegion_9hue_whitefixed8_20261121/
          retention-days: 60
          if-no-files-found: error
