name: "MOIS QA: first 16 native genera exact licensed original photos and botanical contact"
on:
  push:
    branches:
      - analysis/mois-species-first-palette9-20261111
    paths:
      - scripts/acquisition/mois_20261119_targeted_16_native_photo_contact_proof.py
      - .github/workflows/mois-targeted-16-native-photo-contact-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-targeted-first16-photo-proof-20261119
  cancel-in-progress: true
jobs:
  real-licensed-photo-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original-species crosswalk and photo QA libraries
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "pyarrow>=17,<25" \
            "Pillow>=11,<13"
          python -m py_compile scripts/acquisition/mois_20261119_targeted_16_native_photo_contact_proof.py
      - name: Pin the cross-PR source 199 genera list to exact revision and blob
        run: |
          set -euo pipefail
          mkdir -p inputs old/history old/new11 old/new64 old/new18
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/zuizui0223/mois/5490acde18199e6507bd613853521e5f48aa7b49/analysis_specs/MOIS_NATIVE_PHOTO9_199_GENERA_QA_QUEUE_20261119.csv" \
            -o inputs/targets_199.csv
          actual="$(git hash-object inputs/targets_199.csv)"
          test "$actual" = "efc85eb9cc9fa842d630d69ab1962fa7a5029ab1"
          echo "MOIS_199_GENUS_QA_CSV_PINNED_TO_ORIGINAL_GIT_BLOB $actual"
      - name: Download signed original species ID crosswalk and all 1,231,337 original ID history
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14219399376/zip" \
            -o inputs/ENV.zip
          echo "d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc  inputs/ENV.zip" | sha256sum -c
          gh run download 43546479575 --repo "$GITHUB_REPOSITORY" \
            --name mois-postsnapshot-two-CC-photos-full-1231244-ID-source \
            --dir old/history
          gh run download 43561529394 --repo "$GITHUB_REPOSITORY" \
            --name mois-five-postsnapshot11-real-original-iNat-photo9-42111-taxa-append \
            --dir old/new11
          gh run download 43562522326 --repo "$GITHUB_REPOSITORY" \
            --name mois-new1909-fresh-original-real-ROI9-42111-taxonomy-appended \
            --dir old/new64
          gh run download 43566369683 --repo "$GITHUB_REPOSITORY" \
            --name mois-postsnap-remaining18-genuine-ROI9-cumulative-atlas \
            --dir old/new18
      - name: Download real original CC photos and preserve only QA contact thumbnails and IDs
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_20261119_targeted_16_native_photo_contact_proof \
            --targets inputs/targets_199.csv \
            --source-env inputs/ENV.zip \
            --out results/mois_targeted_native_petals_original_16_20261119 \
            --pace 0.9
      - name: Preserve source CC licenses, image SHA256 and photo contact sheet for botanical manual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mois-native-priority-first16-licensed-original-photos-petal-QA-20261119
          path: results/mois_targeted_native_petals_original_16_20261119/
          retention-days: 30
          if-no-files-found: warn
