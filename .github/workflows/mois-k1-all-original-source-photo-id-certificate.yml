name: MOIS certify all new K1 source photo IDs disjoint from historical images
on:
  push:
    branches: [main]
    paths:
      - scripts/acquisition/mois_k1_original_source_disjoint_certificate.py
      - tests/test_mois_k1_original_source_disjoint_certificate.py
      - .github/workflows/mois-k1-all-original-source-photo-id-certificate.yml
  pull_request:
    paths:
      - scripts/acquisition/mois_k1_original_source_disjoint_certificate.py
      - tests/test_mois_k1_original_source_disjoint_certificate.py
      - .github/workflows/mois-k1-all-original-source-photo-id-certificate.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-K1-full76753-frozen-all-ID-disjoint-old929138-v1
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact-photo K1 exclusion, source probability, SHA and shell contracts
        run: |
          set -euo pipefail
          python -m pip install -q PyYAML==6.0.2
          python -m py_compile scripts/acquisition/mois_k1_original_source_disjoint_certificate.py
          python -m unittest discover -s tests -p test_mois_k1_original_source_disjoint_certificate.py -v
          python - <<'PY'
          import subprocess,yaml
          workflow=yaml.safe_load(open('.github/workflows/mois-k1-all-original-source-photo-id-certificate.yml'))
          commands=[s['run'] for job in workflow['jobs'].values()
                    for s in job['steps'] if 'run' in s]
          assert len(commands)>=4
          for command in commands:
              p=subprocess.run(['bash','-n'],input=command,text=True,capture_output=True)
              assert p.returncode==0,p.stderr
          print('MOIS_K1_76753_ORIGINAL_SOURCE_SHA_CERTIFICATE_SHELL_TESTS_PASS',len(commands))
          PY
  freeze-entire-original-source-without-images:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      TAG: mois-original-K1-76753-photo-ID-disjoint-from-929138-historical-v1
    steps:
      - uses: actions/checkout@v4
      - name: Skip historical metadata rereads after immutable certificate was published
        id: gate
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo ready=false >> "$GITHUB_OUTPUT"
            echo 'K1 complete source photo ID SHA-certificate already published; no full repeat.'
          else
            echo ready=true >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Recover only signed precolour K1 source and frozen old photo metadata Parquets
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          gh run download 40066261878 --repo "$REPO" \
            --name mois-full93m-balanced-onephoto-K1-new-precolour-original-ROI-source \
            --dir source
          echo '4da66dc0d34f440269c2202f95b0f39ad369531fd625676e8ec69df4ae939f1c  source/manifest.json' | sha256sum -c -
          gh release download mois-real-pixel-checkpoint-39969920310-v1 --repo "$REPO" \
            --dir historical/main --pattern combined_actual_photo_checkpoint.parquet \
            --pattern checkpoint_receipt.json
          gh release download mois-tier06-group00-first64bucket-warm-original-RGB-v1 --repo "$REPO" \
            --dir historical/group00 --pattern measured_photos.parquet --pattern receipt.json
          gh release download mois-tier06-all16-first4bucket-broad-warm-original-RGB-v1 --repo "$REPO" \
            --dir historical/r1 --pattern measured_photos.parquet --pattern receipt.json
          gh release download mois-tier06-all16-buckets004to011-broad-warm-original-RGB-v1 --repo "$REPO" \
            --dir historical/r2 --pattern measured_photos.parquet --pattern receipt.json
      - name: Audit all real source K1 photo IDs/observations against 929138 original pixels ONCE
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_k1_original_source_disjoint_certificate \
            --source source --prior historical --output certificate
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('certificate/K1_original_source_disjointness_certificate.json').read_text())
          assert d['historical_verified_unique_original_photo_IDs']==929138
          assert d['historical_verified_four_hue_original_photo_ROIs']==416915
          assert d['K1_all_new_precolour_source_original_photo_IDs']==76753
          assert d['K1_exact_historical_photo_ID_collisions']==0
          assert len(d['K1_new_source_photo_counts_by_group'])==75
          assert d['actual_photo_bytes_downloaded_or_model_inference_in_this_certificate']==0
          print('MOIS_K1_FULL_GLOBAL_NEW_SOURCE_UNIQUE_PHOTO_CERTIFIED',929138,76753,0)
          PY
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: mois-all-76753-verified-precolour-K1-new-original-ID-roster
          path: certificate/
          retention-days: 90
          if-no-files-found: error
      - name: Publish immutable exact K1 photo ID population proof
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release download "$TAG" --repo "$REPO" --dir old \
              --pattern K1_original_source_disjointness_certificate.json
            cmp old/K1_original_source_disjointness_certificate.json \
              certificate/K1_original_source_disjointness_certificate.json
          else
            gh release create "$TAG" \
              certificate/K1_original_source_disjointness_certificate.json \
              certificate/K1_all_original_new_photo_source_IDs.csv.gz \
              --repo "$REPO" --target "$GITHUB_SHA" \
              --title 'MOIS all 76753 original K1 photo IDs SHA-verified disjoint from 929138 historical photographs' \
              --notes 'One-off original source SHA verification of all 300 signed K1 precolour work shards, exactly 76753 new photo IDs and their observation-specific joint selection probabilities versus independently audited 929138 actual previous original photos. Deterministic compressed reusable photo/observation/stratum work roster. No image pixels downloaded, classified, imputed, redistributed or counted as wild/native or verified flowering.'
          fi
