name: MOIS ninth 4096 signed ROI append and tenth 4096 fresh-original photo inference
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - scripts/analysis/mois_species_first_ninth_to_tenth.py
      - tests/test_mois_species_first_ninth_to_tenth.py
      - scripts/analysis/mois_species_first_tenth_audit.py
      - .github/workflows/mois-species-first-ninth-append-tenth4096.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-species-first-ninth-frozen-to-tenth4096
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify signed 16 ninth workers, unknowns, and tenth photo queue unit tests
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          python -m unittest discover -s tests -p test_mois_species_first_ninth_to_tenth.py -v
          python -m compileall -q scripts/analysis/mois_species_first_ninth_to_tenth.py scripts/analysis/mois_species_first_tenth_audit.py
  real-ninth-append-and-tenth-source:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      COMPLETED_NINTH: '43002995827'
      FIFTH_SOURCE_RUN: '42970701175'
      EIGHTH_SOURCE_RUN: '42990631949'
      NINTH_SOURCE_RUN: '43002995827'
      SEVENTH_SOURCE_RUN: '42980109440'
      FIRST_RUN: '42913236517'
      SECOND_RUN: '42925844766'
      THIRD_RUN: '42950141749'
      FOURTH_RUN: '42959597251'
      GLOBAL_SOURCE_RUN: '42846819580'
      BASE_TAG: mois-original-1181146-exact-photo-crossarm-451643-strict9-taxongap-20261027-v1
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate on all ninth original-photo workers and 16-shard audited terminal SUCCESS
        id: gate
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          state=$(gh run view "$COMPLETED_NINTH" --repo "$REPO" --json conclusion --jq .conclusion)
          if [ "$state" != success ]; then
            echo "Cannot append unsigned ninth original ROI9: $state"
            exit 0
          fi
          # Same signed ninth source must not launch two tenth acquisitions.
          prior=$(gh run list --repo "$REPO" \
            --workflow mois-species-first-ninth-append-tenth4096.yml \
            --branch analysis/mois-species-first-palette9-20261111 \
            --limit 50 --json databaseId,status,conclusion \
            --jq ".[] | select(.databaseId != $GITHUB_RUN_ID) | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\") | .databaseId" | head -n 1 || true)
          if [ -n "$prior" ]; then
            echo "Another tenth acquisition already succeeded or is in progress: $prior"
            exit 0
          fi
          gh run download "$COMPLETED_NINTH" --repo "$REPO" \
            --name mois-ninth4096-complete-signed-original-nineROI-audit --dir gate_audit
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('gate_audit/receipt.json').read_text())
          assert a['schema']=='mois_species_first_ninth4096_authentic_originalROI9_audit_v1'
          assert a['actual_independent_original_photo_attempts']==4096
          assert a['actual_genuine_strict9_numeric_success']==1299
          assert a['actual_clear_nine_palette_hues']==962
          assert a['actual_technical_unknowns']==2797
          assert a['photo_observation_source_taxon_ID_collisions']==0
          assert len(a['sixteen_original_photo_worker_receipt_sha256'])==16
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Download only historical signed metadata, original worker receipts and newly completed photo ROIs
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          mkdir -p fifth seventh eighth ninth audited workers baseline first second third fourth global
          gh release download "$BASE_TAG" --repo "$REPO" --dir baseline \
            --pattern mois_1181146_unique_original_photo_continuous9_by_arm.parquet
          gh run download "$FIRST_RUN" --repo "$REPO" \
            --name mois-first256-91species-appended-and-next1024-palette-source --dir first
          gh run download "$SECOND_RUN" --repo "$REPO" \
            --name mois-real1280-wave2-cumulative-9palette-and-fresh-wave3-source --dir second
          gh run download "$THIRD_RUN" --repo "$REPO" \
            --name mois-real2304-wave3-361spec-9palette-and-fresh-wave4-source --dir third
          gh run download "$FOURTH_RUN" --repo "$REPO" \
            --name mois-fourth-genuine-ROI9-append-and-fifth1024-new-species-photo-source --dir fourth
          gh run download "$FIFTH_SOURCE_RUN" --repo "$REPO" \
            --name mois-fifth1024-9roi-integrated-and-sixth4096-source --dir fifth
          gh run download "$SEVENTH_SOURCE_RUN" --repo "$REPO" \
            --name mois-sixth4096-real-append-seventh4096-prioritized-photo-source --dir seventh
          gh run download "$EIGHTH_SOURCE_RUN" --repo "$REPO" \
            --name mois-seventh4096-real-append-eighth4096-prioritized-photo-source --dir eighth
          gh run download "$NINTH_SOURCE_RUN" --repo "$REPO" \
            --name mois-eighth4096-real-append-ninth4096-prioritized-photo-source --dir ninth
          gh run download "$COMPLETED_NINTH" --repo "$REPO" \
            --name mois-ninth4096-complete-signed-original-nineROI-audit --dir audited
          for group in 0 1 2 3; do
            gh run download "$COMPLETED_NINTH" --repo "$REPO" \
              --name "mois-ninth4096-real-original-worker-$group" \
              --dir "workers/mois-ninth4096-real-original-worker-$group"
          done
          gh run download "$GLOBAL_SOURCE_RUN" --repo "$REPO" \
            --name mois-global-16groups-full93m-zero9-next-first-photo-and-fallbacks --dir global
      - name: Audit ninth genuine photo9 terminal, preserve mixed retries, select tenth 4096 originals
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_species_first_ninth_to_tenth \
            --atlas ninth/updated/mois_species_first_42111_after_eighth.csv.gz \
            --source ninth/source --workers workers --audited audited \
            --baseline baseline/mois_1181146_unique_original_photo_continuous9_by_arm.parquet \
            --first first/updated/mois_genuine_first256_strict9_append_only.parquet \
            --second second/global_after1280/mois_real1024_wave2_original9_photo_delta.parquet \
            --third third/cumulative/mois_wave3_actual1024_strict9_photo_delta.parquet \
            --fourth fourth/after_wave4/mois_wave4_genuine_original1024_strict9_delta.parquet \
            --fifth fifth/after_fifth/mois_fifth1024_real_original9_photo_delta.parquet \
            --sixth seventh/updated/mois_sixth4096_real_original9_photo_delta.parquet \
            --seventh eighth/updated/mois_seventh4096_real_original9_photo_delta.parquet \
            --eighth ninth/updated/mois_eighth4096_real_original9_photo_delta.parquet \
            --global-options global/mois_global_species_first_zero9_fallback_photo_options.csv.gz \
            --quota 4096 --output updated
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.analysis.mois_species_first_palette9 import sha256
          r=json.loads(Path('updated/receipt.json').read_text())
          assert r['schema']=='mois_species_first_ninth4096_append_tenth4096_v1'
          assert r['ninth_actual_independent_original_photo_attempts']==4096
          assert r['ninth_actual_strict9_photo_successes']==1299
          assert r['ninth_new_source_taxa_with_clear_dominant_hue9']==962
          assert r['ninth_actual_technical_unknowns']==2797
          assert r['prior_photo_or_observation_ID_reused'] is False
          assert r['cumulative_original_photo_attempts']==1201882
          assert r['cumulative_original_numeric_photo_roi9']==458748
          assert r['source_taxa_with_numerical_nineROI']==35604+r['ninth_new_source_taxa_with_first_numeric9']
          assert r['source_taxa_with_clear_sampled_nine_palette']==33345
          assert r['source_taxa_without_nineROI']+r['source_taxa_with_numerical_nineROI']==42111
          assert r['tenth_source_distinct_new_photo_observation_taxon']==4096
          assert r['tenth_source_first_unmeasured']+r['tenth_source_retry_unclear']==4096
          for key,name in [('atlas','mois_species_first_42111_after_ninth.csv.gz'),
                           ('delta','mois_ninth4096_real_original9_photo_delta.parquet'),
                           ('next','mois_tenth4096_prioritized_original_photo_queue.csv')]:
            assert r['output_sha256'][key]==sha256(Path('updated')/name)
          print('MOIS_NINTH_SIGNED_APPEND_AND_TENTH_NEW_ORIGINAL_SOURCE_VERIFIED',r['ninth_new_source_taxa_with_first_numeric9'],r['tenth_source_first_unmeasured'],r['tenth_source_retry_unclear'],flush=True)
          PY
      - name: Freeze sixteen independent 256-photo tenth original image sources by SHA
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p source/shards
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          from scripts.analysis.mois_species_first_palette9 import sha256
          queue=pd.read_csv('updated/mois_tenth4096_prioritized_original_photo_queue.csv',
                            dtype=str,keep_default_na=False)
          assert len(queue)==4096 and queue.photo_id.is_unique and queue.observation_id.is_unique and queue.inat_taxon_id.is_unique
          assert set(queue.shard)==set(str(i) for i in range(16))
          hashes={}
          for i in range(16):
              block=queue.loc[queue.shard==str(i)]
              assert len(block)==256
              file=Path('source/shards')/f'shard-{i:03d}.csv'
              block.to_csv(file,index=False,lineterminator='\n')
              hashes[str(i)]=sha256(file)
          r=json.loads(Path('updated/receipt.json').read_text())
          manifest={"schema":"mois_full_source_observation_sampling_cohort_v1",
                    "source_arm":"MOIS_SPECIES_FIRST_TENTH_PRIORITIZED4096",
                    "colour_measured":False,
                    "work_units":16,"worker_ids":list(range(16)),
                    "new_photo_attempts_planned":4096,
                    "source_previous_attempts":1201882,
                    "source_full_original_photo_IDs":93209351,
                    "photo_shard_sha256":hashes,
                    "first_unmeasured_taxa":r['tenth_source_first_unmeasured'],
                    "new_image_on_unresolved_taxon":r['tenth_source_retry_unclear'],
                    "source_prior_no_reused_original_photo_or_observation":True}
          Path('source/manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          print('MOIS_TENTH4096_ORIGINAL_SOURCES_SHA_FROZEN',r['tenth_source_first_unmeasured'],
                r['tenth_source_retry_unclear'],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: mois-ninth4096-real-append-tenth4096-prioritized-photo-source
          path: |
            updated/
            source/
          retention-days: 90
          if-no-files-found: error
  tenth-original-photo-workers:
    needs: real-ninth-append-and-tenth-source
    if: needs.real-ninth-append-and-tenth-source.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [0,1,2,3]
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-ninth4096-real-append-tenth4096-prioritized-photo-source
          path: frozen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse unmodified frozen FCP ROI-v4 YOLO11/EfficientSAM source model
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Tenth original photo acquisition and real nine-component inference, 4 x 256 photos per worker
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-tenth4096-photo-provider"
          python -m scripts.acquisition.mois_full_index_real_original_photo_measure work \
            --source frozen/source --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" \
            --group "${{ matrix.group }}" --output measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-tenth4096-real-original-worker-${{ matrix.group }}
          path: measured/
          retention-days: 90
          if-no-files-found: warn
  tenth-original-terminal-audit:
    needs: [real-ninth-append-and-tenth-source, tenth-original-photo-workers]
    if: needs.real-ninth-append-and-tenth-source.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-ninth4096-real-append-tenth4096-prioritized-photo-source
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: mois-tenth4096-real-original-worker-*
          path: workers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict 16 original worker SHA audit, complete original photo IDs and technical unknowns
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3
          python -m scripts.analysis.mois_species_first_tenth_audit \
            --source frozen/source --workers workers --output audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-tenth4096-complete-signed-original-nineROI-audit
          path: audit/
          retention-days: 90
          if-no-files-found: warn
