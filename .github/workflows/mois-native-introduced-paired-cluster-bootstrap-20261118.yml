name: "MOIS Ecology: bootstrap native/introduced white contrast and genus components"
on:
  push:
    branches:
      - analysis/mois-ecology-moisture-temperature-interactions-20261118
    paths:
      - "scripts/analysis/mois_native_intro_paired_bootstrap_20261118.py"
      - ".github/workflows/mois-native-introduced-paired-cluster-bootstrap-20261118.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  spatial-block-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numeric source-independent checks
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3"
      - name: Restore frozen same-cell ecological model result by original artifact ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p source
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14389295373/zip" \
            -o source/matched_native_intro_original.zip
          echo "3efaf6ee359aca4a49713d55f5bbadd0c86467ccd4d27c300f1e06936245759a  source/matched_native_intro_original.zip" | sha256sum -c
      - name: Run 20000 replicate 500 km block means bootstrap, equal cells and min status support
        run: |
          python scripts/analysis/mois_native_intro_paired_bootstrap_20261118.py \
            --source source/matched_native_intro_original.zip \
            --out results/mois_native_intro_cluster_bootstrap_20261118
      - uses: actions/upload-artifact@v4
        with:
          name: mois-native-introduced-clusterbootstrap-500km-20261118
          path: results/mois_native_intro_cluster_bootstrap_20261118/
          if-no-files-found: error
          retention-days: 30
