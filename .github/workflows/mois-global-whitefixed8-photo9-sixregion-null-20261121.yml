name: "MOIS ecology: nonwhite eight hues after fixing all white species and six regional species pools"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - scripts/analysis/mois_global_photo9_whitefixed8_georegion_null_20261121.py
      - .github/workflows/mois-global-whitefixed8-photo9-sixregion-null-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-global-whitefixed-eight-hue-macroregions-20261121
  cancel-in-progress: false
jobs:
  true-whitefixed-eight-hue-geo-permutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned original GIS and accepted-species parquet stack
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'numpy==2.1.3' 'pandas==2.2.3' 'pyarrow==19.0.1' 'pyproj==3.7.1'
          python -m py_compile scripts/analysis/mois_global_photo9_whitefixed8_georegion_null_20261121.py
      - name: Verify unchanged true 37,104 accepted-hue species / 5,493,931 GBIF species-cell records
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14166701658/zip" \
            -o source/GBIF_37104_5493931.zip
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14219399376/zip" \
            -o source/ENV_photo9_37104.zip
          echo '422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2  source/GBIF_37104_5493931.zip' | sha256sum -c
          echo 'd8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc  source/ENV_photo9_37104.zip' | sha256sum -c
      - name: Reproduce old white fixed eight-hue null then compare new hemisphere/region conditioned species pools
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_global_photo9_whitefixed8_georegion_null_20261121 \
            --gbif source/GBIF_37104_5493931.zip \
            --env source/ENV_photo9_37104.zip \
            --out results/mois_whitefixed8_regional_conditioned_20261121
      - name: Always publish auditable measured nonwhite source null and 100km geography
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mois-whitefixed-eight-hues-six-georegions-genus-range-mobility-null-20261121
          path: results/mois_whitefixed8_regional_conditioned_20261121/
          retention-days: 60
          if-no-files-found: warn