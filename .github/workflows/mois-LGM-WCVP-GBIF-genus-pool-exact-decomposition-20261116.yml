name: MOIS GBIF LGM WCVP taxon-pool 3-component exact decomposition
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-LGM-WCVP-GBIF-genus-pool-exact-decomposition-20261116.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-GBIF-LGM-WCVP-native-intro-three-component-decomposition-20261116
  cancel-in-progress: false

jobs:
  exact-taxon-pool-decomposition:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned stats stack, compile and test exact algebra
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 \
            statsmodels==0.14.4 scipy==1.15.2
          python -m py_compile scripts/analysis/mois_lgm_native_intro_pool_decomposition_20261116.py
          python -m unittest discover -s tests -p 'test_mois_lgm_native_intro_pool_decomposition_20261116.py' -v
      - name: Retrieve and pin original GBIF WCVP 100km source artifacts
        run: |
          set -euo pipefail
          mkdir -p sources
          for artifact in \
            '14228652073 NATIVE b72b7358ed5382d625583ad61b90952e4e77377296fe90ae677bf9481aa80a7f' \
            '14227246751 SPATIAL e209257adbc185b4855f3b8d76aeaa50d2e2afe8a1feeb0f76013366e57c4d16' \
            '14230412217 COMMON ba725090afbd732c9dacc8e098161aad2bf88042994f5c683db465519969356a'; do
            set -- $artifact
            curl --fail --location --silent --show-error --retry 3 --retry-delay 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/$1/zip" \
              -o "sources/$2.zip"
            echo "$3  sources/$2.zip" | sha256sum -c -
          done
      - name: Run 500km/1000km exact additive climate-slope decomposition
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_lgm_native_intro_pool_decomposition_20261116 \
            --native sources/NATIVE.zip --spatial sources/SPATIAL.zip \
            --common sources/COMMON.zip --output MOIS_GBIF_pool_decomp
          python - <<'PY'
          import json
          p="MOIS_GBIF_pool_decomp/receipt.json"
          a=json.load(open(p))
          assert a["source_GBIF_accepted_species"]==37104
          assert a["source_GBIF_species_100km_pairs"]==5493931
          assert a["decomposition_algebra_exact"]
          for k in ("strict","moderate"):
              z=a["results"][k]
              assert z["common_genus_eligible_cells"]>2000
              assert z["500km_models"]["additivity_check_max_abs"]<1e-10
          print("MOIS_GBIF_TRUE_SPECIES_POOL_EXACT_DECOMPOSITION_VERIFIED",
                json.dumps({k:v["500km_models"]["component_models"]
                  for k,v in a["results"].items()},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-GBIF-WCVP-LGM-genus-pool-exact-3part-100km-500km
          path: MOIS_GBIF_pool_decomp/
          retention-days: 90
          if-no-files-found: warn
