name: MOIS GBIF anonymous public S3 occurrence 37104-species spatial pilot 6 files

on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-gbif-noauth-S3-six-files-spatial-pilot-20261115.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-six-public-parquet-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      GBIF_USERNAME: ''
      GBIF_PASSWORD: ''
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install unsigned public S3/Parquet processing and QA tests
        run: |
          set -euo pipefail
          python -m pip install -q boto3==1.40.0 botocore==1.40.0 pandas==2.2.3 numpy==2.1.3 pyarrow==19.0.1 pyproj==3.7.1
          python -m unittest discover -s tests -p test_mois_gbif_anon_species_grid_scan_20261115.py -v
      - name: Restore the exact 10,346-public-file source and COL XR 37,104 names (not images)
        run: |
          set -euo pipefail
          mkdir -p input
          for entry in '14164808564 manifest 473c9eff45abba0cafa589494973c48af918a0251fcc3d7fb857d8f0b090cc4c' \
                       '14157705123 accepted abcd3aee766c85a92b86a8f93f8ed696bbe49d0f6cf2f64e5f75b457abf78e6a'; do
            set -- $entry
            curl --fail --location --silent --show-error --retry 2 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/$1/zip" \
              --output "input/$2.zip"
            echo "$3  input/$2.zip" | sha256sum -c -
          done
      - name: Process six actual snapshot files for exact accepted species + 100km equal-area cells
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_gbif_anon_species_grid_scan_20261115 \
            --accepted input/accepted.zip --manifest input/manifest.zip \
            --partition 0 --max-files 6 --output pilot6
          python - <<'PY'
          import json,pandas as pd
          r=json.load(open('pilot6/receipt.json'))
          d=pd.read_csv('pilot6/species_x_EPSG6933_100km_cells.csv.gz')
          assert r['files_actually_scanned']==6 and r['full_partition_scan'] is False
          assert r['scan_counters']['parquet_rows_scanned']>100000
          assert r['scan_counters']['passed_strict_taxon_and_geography']>0
          assert d.specieskey.nunique()>100
          assert d.occurrence_count.sum()==r['scan_counters']['passed_strict_taxon_and_geography']
          print('MOIS_GBIF_37104_NOAUTH_PUBLIC_REAL_SIX_PARQUET_GEO_OCCURRENCES',r['scan_counters'],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-GBIF-public-noauth-37104-taxonomy-6-Parquet-EPSG6933-grid-pilot
          path: pilot6/
          retention-days: 90
          if-no-files-found: warn
