name: MOIS 540 accepted GBIF species 9-photo-hue three-cohort independent QC
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-gbif-540-three-cohort-QA-20261115.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  three-independent-nonpetal-photo-hue-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies and test permutation / source grain
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 scipy==1.15.2 statsmodels==0.14.4
          python -m unittest discover -s tests -p test_mois_gbif_continent_two_cohort_qa_20261115.py -v
      - name: Restore exact signed GBIF 3x180 country/continent responses and full 37104 traits
        run: |
          set -euo pipefail
          mkdir -p input
          for spec in '14158822487 discovery 2181898c7428172cd039b208a5e3fc5169c12d3a8d324bef05a84f3a6a89a446' \
                      '14159523021 holdout1 ec1df9eb35e856b1020e92a755aff8be8c121b640602e8e3191d528cc531df1a' \
                      '14160537231 holdout2 bdc41d485245f5f17134e0bf61a33f8bccbe261b6d5f53f2124af17029f02389' \
                      '14157705123 accepted abcd3aee766c85a92b86a8f93f8ed696bbe49d0f6cf2f64e5f75b457abf78e6a'; do
            set -- $spec
            curl --fail --location --silent --show-error --retry 2 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/$1/zip" \
              --output "input/$2.zip"
            echo "$3  input/$2.zip" | sha256sum -c -
          done
      - name: Reconcile 540 accepted names, 9 photo-hue traits and real georeferenced GBIF country/continent
        run: |
          set -euo pipefail
          python - <<'PY'
          import io,zipfile,json,hashlib
          from pathlib import Path
          import numpy as np,pandas as pd
          from scipy.stats import chi2,kruskal
          import statsmodels.formula.api as smf
          from scripts.analysis.mois_gbif_continent_two_cohort_qa_20261115 import chi_stat,bh,HUES,REGIONS
          base=Path('input');out=Path('GBIF540_output');out.mkdir()
          frames=[];conts=[]
          for cohort in ('discovery','holdout1','holdout2'):
              with zipfile.ZipFile(base/(cohort+'.zip')) as z:
                  f=pd.read_csv(io.BytesIO(z.read('species_GBIF_country_continent_facets.csv')),dtype={'gbif_colxr_species_key':str})
                  c=pd.read_csv(io.BytesIO(z.read('species_x_continent_real_GBIF_records.csv')),dtype={'gbif_colxr_species_key':str})
                  receipt=json.loads(z.read('receipt.json'))
              assert len(f)==180 and f.gbif_colxr_species_key.is_unique
              assert f.groupby('photo_hue9').size().reindex(HUES,fill_value=0).eq(20).all()
              assert int(f.GBIF_georeferenced_occurrence_total.sum())==receipt['georeferenced_occurrences_total_for_sample']
              f['cohort']=cohort;c['cohort']=cohort;frames.append(f);conts.append(c)
          d=pd.concat(frames,ignore_index=True);ct=pd.concat(conts,ignore_index=True)
          assert len(d)==540 and d.gbif_colxr_species_key.is_unique and d.inat_taxon_id.is_unique
          with zipfile.ZipFile(base/'accepted.zip') as z:
              traits=pd.read_csv(io.BytesIO(z.read('current_exact_accepted_COLXR_species.csv.gz')),
                                 compression='gzip',dtype={'key':str,'inat_taxon_id':str},low_memory=False)
          assert len(traits)==37104 and traits.key.is_unique
          attrs=['key','inat_taxon_id','species','source_hue9','hue_status']
          t=traits[attrs].rename(columns={'inat_taxon_id':'match_source_taxon_id','species':'matched_species'})
          d['inat_taxon_id']=d.inat_taxon_id.astype(str)
          d=d.merge(t,left_on='gbif_colxr_species_key',right_on='key',how='left',validate='one_to_one',indicator=True)
          assert d._merge.eq('both').all() and (d.inat_taxon_id==d.match_source_taxon_id).all()
          assert (d.photo_hue9==d.source_hue9).all() and (d.photo_hue_status==d.hue_status).all()
          d=d.drop(columns=['_merge'])
          d['white_photo']=(d.photo_hue9=='white').astype(int)
          d['log_country']=np.log1p(d.countries_GBIF_1plus)
          d['log_occ']=np.log1p(d.GBIF_georeferenced_occurrence_total)
          per=[]
          for cohort in ('discovery','holdout1','holdout2'):
              s=d[d.cohort.eq(cohort)]
              m=smf.ols('log_country ~ white_photo + log_occ',data=s).fit(cov_type='HC3')
              kw=kruskal(*[s.loc[s.photo_hue9.eq(h),'countries_GBIF_1plus'] for h in HUES])
              per.append(dict(cohort=cohort,species=180,photo_white_beta=float(m.params['white_photo']),
                white_p_HC3=float(m.pvalues['white_photo']),
                white_95CI_low=float(m.conf_int().loc['white_photo',0]),
                white_95CI_high=float(m.conf_int().loc['white_photo',1]),
                nine_hue_Kruskal_p=float(kw.pvalue),
                GBIF_georeferenced_occurrence_count=int(s.GBIF_georeferenced_occurrence_total.sum())))
          per=pd.DataFrame(per)
          pooled=smf.ols('log_country ~ white_photo + log_occ + C(cohort)',data=d).fit(cov_type='HC3')
          nine=smf.ols('log_country ~ C(photo_hue9) + log_occ + C(cohort) + C(photo_hue_status)',data=d).fit(cov_type='HC3')
          terms=[x for x in nine.params.index if x.startswith('C(photo_hue9)')]
          R=np.zeros((len(terms),len(nine.params)))
          for i,t in enumerate(terms):R[i,list(nine.params.index).index(t)]=1
          nine_p=float(nine.wald_test(R,scalar=True).pvalue)
          # Region tests use source-preserved species records; no photo-specific colour.
          rng=np.random.default_rng(20261115);regions=[]
          for cohort in ('discovery','holdout1','holdout2'):
              s=d[d.cohort.eq(cohort)].copy()
              categories=pd.Categorical(s.photo_hue9,categories=HUES).codes
              permutations=np.array([rng.permutation(categories) for _ in range(10000)])
              c=ct.loc[ct.cohort.eq(cohort)].pivot(index='gbif_colxr_species_key',columns='continent',values='GBIF_georeferenced_records')
              c=c.reindex(index=s.gbif_colxr_species_key,columns=REGIONS,fill_value=0).fillna(0)
              for place in REGIONS:
                  y=c[place].gt(0).to_numpy(int)
                  actual=chi_stat(categories,y)
                  p=(1+sum(chi_stat(v,y)>=actual for v in permutations))/10001
                  hue_counts=np.bincount(categories,weights=y,minlength=9).astype(int)
                  regions.append(dict(cohort=cohort,continent=place,p_10k=float(p),
                    **{'hue_'+h+'_present_out_of20':int(k) for h,k in zip(HUES,hue_counts)}))
          regions=pd.DataFrame(regions)
          regions['q_BH_within6']=regions.groupby('cohort').p_10k.transform(lambda x:pd.Series(bh(x),index=x.index))
          regions['q_BH_across18']=bh(regions.p_10k)
          replicated=[x for x in REGIONS if regions.loc[regions.continent.eq(x),'q_BH_within6'].lt(0.05).all()]
          assert len(regions)==18 and replicated==[]
          assert len(d)==540 and sum(d.GBIF_georeferenced_occurrence_total)==6023946
          per.to_csv(out/'540_country_range_white_vs_nine_hues_by_cohort.csv',index=False)
          regions.to_csv(out/'18_three_cohort_sixcontinent_permutation_QA.csv',index=False)
          d.to_csv(out/'540_species_exact_accepted_country_photo_hue_QA.csv',index=False)
          report={'schema':'mois_540_real_GBIF_country_9hue_3cohort_independent_QA_v1',
            'source_accepted_COLXR_species':37104,'source_sampled_GBIF_species':540,
            'photo_hue9_per_cohort':20,'cohort_species_overlap_count':0,
            'sum_GBIF_georeferenced_occurrence_counts':6023946,
            'pooled_photo_white_effort_cohort_beta':float(pooled.params['white_photo']),
            'pooled_white_HC3_95CI':[float(v) for v in pooled.conf_int().loc['white_photo']],
            'pooled_white_HC3_p':float(pooled.pvalues['white_photo']),
            'nine_hue_effort_cohort_and_photo_evidence_adjusted_joint_HC3_p':nine_p,
            'continent_regions_BH_significant_all_three':replicated,
            'photo_status_counts':{str(k):int(v) for k,v in d.photo_hue_status.value_counts().items()},
            'botanical_petal_accuracy_estimated':False,
            'GBIF_native_distribution_identified':False,
            'GBIF_37104_global_species_grid_DOI':None,
            'output_sha256':{x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in out.iterdir()}}
          (out/'receipt.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          assert abs(report['pooled_photo_white_effort_cohort_beta']-0.18245558857293914)<1e-8
          assert abs(report['pooled_white_HC3_p']-0.12460854676687858)<1e-8
          assert abs(report['nine_hue_effort_cohort_and_photo_evidence_adjusted_joint_HC3_p']-0.6400098977521886)<1e-8
          print('MOIS_GBIF_540_3COHORT_REAL_ALL_NINE_HUES_AUDITED',json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-GBIF-540-three-independent-hue-cohorts-full-quality-and-continent
          path: GBIF540_output/
          retention-days: 90
          if-no-files-found: error
