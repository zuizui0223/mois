name: MOIS wave57 depth256 verified unused photo source and real ROI9
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-species-first-fiftyseventh-depth256-real-original.yml
      - scripts/analysis/mois_species_first_fiftysixth_to_fiftyseventh.py
      - scripts/analysis/mois_species_first_fiftyseventh_audit.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-wave57-previous-signed-depth256-source-only-one-acquisition
  cancel-in-progress: false
jobs:
  append-fiftysixth-and-source-fiftyseventh:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      groups: ${{ steps.plan.outputs.groups }}
      has_next: ${{ steps.plan.outputs.has_next }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      OLD_SOURCE_RUN: '43469043483'
      OLD_AUDIT_RUN: '43469043483'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests and Python compile
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          python -m unittest discover -s tests -p test_mois_species_first_twelfth_to_thirteenth.py -v
          python -m unittest discover -s tests -p test_mois_species_first_wave14_artifact_paths.py -v
          python -m unittest discover -s tests -p test_mois_species_first_fiftysixth_to_fiftyseventh_receipt_count.py -v
          python -m py_compile scripts/analysis/mois_species_first_fiftysixth_to_fiftyseventh.py scripts/analysis/mois_species_first_fiftyseventh_audit.py
      - name: Gate signed wave51 terminal with command-level failure diagnostics; prevent duplicate source
        id: gate
        run: |
          set -euo pipefail
          # Check fully signed immutable wave51 terminal; do not redownload prior original images.
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "MOIS_WAVE51_PREV_RUN_STATUS $(gh api "repos/$REPO/actions/runs/$OLD_SOURCE_RUN" --jq .status)"
          echo "MOIS_WAVE49_PREV_RUN_CONCLUSION $(gh api "repos/$REPO/actions/runs/$OLD_SOURCE_RUN" --jq .conclusion)"
          echo "MOIS_WAVE49_PREV_JOBS $(gh api "repos/$REPO/actions/runs/$OLD_SOURCE_RUN/jobs?per_page=100" --jq '[.jobs[] | [.name,.conclusion]]')"
          echo "MOIS_WAVE49_PREV_ARTIFACTS $(gh api "repos/$REPO/actions/runs/$OLD_SOURCE_RUN/artifacts?per_page=100" --jq '[.artifacts[] | [.name,.digest]]')"
          test "$(gh api "repos/$REPO/actions/runs/$OLD_AUDIT_RUN" --jq .status)" = completed || exit 0
          test "$(gh api "repos/$REPO/actions/runs/$OLD_AUDIT_RUN" --jq .conclusion)" = success || exit 0
          test "$(gh api "repos/$REPO/actions/runs/$OLD_SOURCE_RUN" --jq .status)" = completed || exit 0
          test "$(gh api "repos/$REPO/actions/runs/$OLD_SOURCE_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name == "append-fiftyfifth-and-source-fiftysixth" and .conclusion == "success")] | length')" = 1 || exit 0
          test "$(gh api "repos/$REPO/actions/runs/$OLD_SOURCE_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name == "fiftysixth-real-original-worker (0)" and .conclusion == "success")] | length')" = 1 || exit 0
          test "$(gh api "repos/$REPO/actions/runs/$OLD_AUDIT_RUN/jobs?per_page=100" --jq '[.jobs[] | select(.name == "fiftysixth-real-original-audit" and .conclusion == "success")] | length')" = 1 || exit 0
          candidates="$(gh run list --repo "$REPO" --workflow mois-species-first-fiftyseventh-depth256-real-original.yml --branch analysis/mois-species-first-palette9-20261111 --limit 100 --json databaseId --jq ".[] | select(.databaseId < $GITHUB_RUN_ID) | .databaseId")"
          for candidate in $candidates; do
            state="$(gh api "repos/$REPO/actions/runs/$candidate" --jq .status)"
            if [ "$state" != completed ]; then
              echo "MOIS_WAVE49_PRIOR_RUN_IN_FLIGHT $candidate"
              exit 0
            fi
            count="$(gh api "repos/$REPO/actions/runs/$candidate/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "mois-fiftysixth4096-verified-append-fiftyseventh-prioritized-original-source")] | length')"
            if [ "$count" != 0 ]; then
              echo "MOIS_WAVE49_ALREADY_FROZEN_PRIOR_SOURCE_NO_DUPLICATE $candidate"
              exit 0
            fi
          done
          audit_digest="$(gh api "repos/$REPO/actions/runs/$OLD_AUDIT_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="mois-fiftysixth28-real-original-photo-nineROI-audit") | .digest')"
          source_digest="$(gh api "repos/$REPO/actions/runs/$OLD_SOURCE_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="mois-fiftyfifth4096-verified-append-fiftysixth-prioritized-original-source") | .digest')"
          worker_digest="$(gh api "repos/$REPO/actions/runs/$OLD_SOURCE_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="mois-fiftysixth28-real-original-worker-0") | .digest')"
          echo "MOIS_WAVE49_DIGESTS audit=$audit_digest source=$source_digest worker=$worker_digest"
          test "$audit_digest" = 'sha256:36b773677fb72d280044193d2b67b82da9a37abbf58797042eb4593ec6a447a9'
          test "$source_digest" = 'sha256:6a2b669d1e007b6f611f3b0d8b70fe425053cc2fa946829e26f4ee0d043a94eb'
          test "$worker_digest" = 'sha256:9bf1884c3817afc926b2962cadfc079f9b9f26f69af1f6d1c6227328552a3191'
          gh run download "$OLD_AUDIT_RUN" --repo "$REPO" --name mois-fiftysixth28-real-original-photo-nineROI-audit --dir _precheck
          python - <<'PY'
          import json
          from scripts.analysis.mois_species_first_palette9 import sha256
          d=json.load(open('_precheck/receipt.json'))
          assert d['schema']=='mois_species_first_fiftysixth_authentic_originalROI9_audit_v1'
          assert [d['actual_independent_original_photo_attempts'],d['actual_genuine_strict9_numeric_success'],d['actual_clear_nine_palette_hues'],d['actual_technical_unknowns']]==[1,1,1,0]
          assert d['photo_observation_source_taxon_ID_collisions']==0
          assert d['source_shard_count']==1 and len(d['original_photo_worker_receipt_sha256'])==1
          assert d['frozen_original_manifest_sha256']=='f3c477edb26ad6394a2437945f221e1844bf57bb610ac483e5137bcfd4fcaaa8'
          assert d['audited_derivative_sha256']==sha256('_precheck/mois_fiftysixth_actual_original_nine_roi.csv.gz')
          PY
          # Depth256 16-group signed terminal is mandatory; no stale metadata or concurrent wave57.
          test "$(gh api "repos/$REPO/actions/runs/43470558914" --jq .status)" = completed || exit 0
          test "$(gh api "repos/$REPO/actions/runs/43470558914" --jq .conclusion)" = success || exit 0
          test "$(gh api "repos/$REPO/actions/runs/43470558914/jobs?per_page=100" --jq '[.jobs[] | select((.name | startswith("sixteen-signed-source-groups")) and .conclusion == "success")] | length')" = 16 || exit 0
          test "$(gh api "repos/$REPO/actions/runs/43470558914/jobs?per_page=100" --jq '[.jobs[] | select(.name == "global-depth256-combine" and .conclusion == "success")] | length')" = 1 || exit 0
          test "$(gh api "repos/$REPO/actions/runs/43470558914/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "mois-all16-signed93m-current-unlabelled-depth256-new-photo-candidates") | .digest')" = 'sha256:043ee9fa29893c2df74628fc7d049bed42151f549649539e7eddf6f388ccd3db' || exit 0
          test "$(gh api "repos/$REPO/actions/runs/43470118921/jobs?per_page=100" --jq '[.jobs[] | select(.name == "append-fiftysixth-and-source-fiftyseventh" and .conclusion == "success")] | length')" = 1 || exit 0
          test "$(gh api "repos/$REPO/actions/runs/43470118921/jobs?per_page=100" --jq '[.jobs[] | select((.name | startswith("fiftyseventh-real-original-worker")) and .conclusion == "success")] | length')" = 0 || exit 0
          echo 'MOIS_WAVE57_DEPTH128_EMPTY_AND_DEPTH256_ALL16_SIGNED_SAFE_TO_SOURCE' 
          echo 'ready=true' >> "$GITHUB_OUTPUT"
