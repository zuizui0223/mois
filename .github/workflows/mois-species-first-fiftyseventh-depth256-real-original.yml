            --fortyfirst fortysecond_source/updated/mois_fortyfirst4096_real_original9_photo_delta.parquet \
            --fortysecond fortythird_source/updated/mois_fortysecond4096_real_original9_photo_delta.parquet \
            --fortythird fortyfourth_source/updated/mois_fortythird4096_real_original9_photo_delta.parquet \
            --fortyfourth fortyfifth_source/updated/mois_fortyfourth4096_real_original9_photo_delta.parquet \
            --fortyfifth fortysixth_source/updated/mois_fortyfifth4096_real_original9_photo_delta.parquet \
            --fortysixth fortyseventh_source/updated/mois_fortysixth4096_real_original9_photo_delta.parquet \
            --fortyseventh fortyeighth_source/updated/mois_fortyseventh4096_real_original9_photo_delta.parquet \
            --fortyeighth fortyninth_source/updated/mois_fortyeighth4096_real_original9_photo_delta.parquet \
            --fortyninth fiftieth_source/updated/mois_fortyninth4096_real_original9_photo_delta.parquet \
            --fiftieth fiftyfirst_source/updated/mois_fiftieth4096_real_original9_photo_delta.parquet \
            --fiftyfirst fiftysecond_source/updated/mois_fiftyfirst4096_real_original9_photo_delta.parquet \
            --fiftysecond fiftythird_source/updated/mois_fiftysecond4096_real_original9_photo_delta.parquet \
            --fiftythird fiftyfourth_source/updated/mois_fiftythird4096_real_original9_photo_delta.parquet \
            --fiftyfourth fiftyfifth_source/updated/mois_fiftyfourth4096_real_original9_photo_delta.parquet \
            --fiftyfifth fiftysixth_source/updated/mois_fiftyfifth4096_real_original9_photo_delta.parquet \
            --global-options global/mois_full93m_unlabelled_depth256_original_photo_options.csv.gz \
            --quota 4096 --output updated
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.analysis.mois_species_first_palette9 import sha256
          r=json.load(open('updated/receipt.json'))
          assert r['fiftysixth_actual_independent_original_photo_attempts']==1
          assert r['fiftysixth_actual_strict9_photo_successes']==1
          assert r['fiftysixth_actual_technical_unknowns']==0
          assert r['fiftysixth_new_source_taxa_with_clear_dominant_hue9']==1
          assert r['cumulative_original_photo_attempts']==1231244 and r['cumulative_original_numeric_photo_roi9']==467536
          assert r['source_taxa_with_numerical_nineROI']==39882+r['fiftysixth_new_source_taxa_with_first_numeric9']
          assert r['source_taxa_with_clear_sampled_nine_palette']==39145
          assert r['source_taxa_with_numerical_nineROI']+r['source_taxa_without_nineROI']==42111
          assert r['prior_photo_or_observation_ID_reused'] is False
          assert r['cumulative_original_photo_attempts']==1231244
          assert r['cumulative_original_numeric_photo_roi9']==467536
          assert r['source_taxa_with_clear_sampled_nine_palette']==39145
          assert sha256(Path('updated')/'mois_species_first_42111_after_fiftysixth.csv.gz')=='c504e2549f0659b9e0849a0178f689ee4caa70c7cd1ccd9ca003836c447d706b'
          assert 0 <= r['fiftyseventh_source_distinct_new_photo_observation_taxon'] <=4096
          for k,n in [('atlas','mois_species_first_42111_after_fiftysixth.csv.gz'),('delta','mois_fiftysixth4096_real_original9_photo_delta.parquet'),('next','mois_fiftyseventh4096_prioritized_original_photo_queue.csv')]:
            assert r['output_sha256'][k]==sha256(Path('updated')/n)
          print('MOIS_WAVE49_APPENDED_REAL_STRICT9_NEW_NUMERIC_TAXA_AND_WAVE46_UNUSED_SOURCE',r['fiftysixth_new_source_taxa_with_first_numeric9'],r['fiftyseventh_source_distinct_new_photo_observation_taxon'],flush=True)
          PY
      - name: Freeze signed 256-photo source shards with final partial shard
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p source/shards
          python - <<'PY'
          import json
          import numpy as np
          import pandas as pd
          from pathlib import Path
          from scripts.analysis.mois_species_first_palette9 import sha256
          q=pd.read_csv('updated/mois_fiftyseventh4096_prioritized_original_photo_queue.csv',dtype=str,keep_default_na=False)
          n=len(q)
          assert 0<=n<=4096 and q.photo_id.is_unique and q.observation_id.is_unique and q.inat_taxon_id.is_unique
          units=(n+255)//256
          assert q.shard.eq(pd.Series((np.arange(n)//256).astype(str))).all()
          digests={}
          for i in range(units):
            part=q.iloc[i*256:min(n,(i+1)*256)]
            assert 1<=len(part)<=256
            p=Path('source/shards')/f'shard-{i:03d}.csv'
            part.to_csv(p,index=False,lineterminator='\n')
            digests[str(i)]=sha256(p)
          m={'schema':'mois_full_source_observation_sampling_cohort_v1','source_arm':'MOIS_SPECIES_FIRST_FIFTYSEVENTH_PRIORITIZED4096','colour_measured':False,'work_units':units,'worker_ids':list(range(units)),'new_photo_attempts_planned':n,'source_previous_attempts':1231244,'source_full_original_photo_IDs':93209351,'photo_shard_sha256':digests,'source_prior_no_reused_original_photo_or_observation':True}
          Path('source/manifest.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          print('MOIS_WAVE49_GENUINE_ORIGINAL_PHOTO_SOURCE_SHARDS_FROZEN',n,units,flush=True)
          PY
      - name: Dispatch only nonempty 1024-photo worker groups
        if: steps.gate.outputs.ready == 'true'
        id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path('source/manifest.json').read_text())
          assert 0<=d['work_units']<=16
          print("has_next="+str(d["work_units"]>0).lower())
          print("groups="+json.dumps(list(range((d["work_units"]+3)//4)) or [0],separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: mois-fiftysixth4096-verified-append-fiftyseventh-prioritized-original-source
          path: |
            updated/
            source/
          retention-days: 90
          if-no-files-found: error
  fiftyseventh-real-original-worker:
    needs: append-fiftysixth-and-source-fiftyseventh
    if: needs.append-fiftysixth-and-source-fiftyseventh.outputs.ready == 'true' && needs.append-fiftysixth-and-source-fiftyseventh.outputs.has_next == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.append-fiftysixth-and-source-fiftyseventh.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-fiftysixth4096-verified-append-fiftyseventh-prioritized-original-source
          path: frozen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap frozen YOLO11 EfficientSAM original ROI-v4
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Acquire only new original photos; measure real 9-component RGB ROI
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-fiftyseventh-photo-provider"
          python -m scripts.acquisition.mois_full_index_real_original_photo_measure work --source frozen/source --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" --group "${{ matrix.group }}" --output measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-fiftyseventh28-real-original-worker-${{ matrix.group }}
          path: measured/
          retention-days: 90
          if-no-files-found: warn
  fiftyseventh-real-original-audit:
    needs: [append-fiftysixth-and-source-fiftyseventh,fiftyseventh-real-original-worker]
    if: needs.append-fiftysixth-and-source-fiftyseventh.outputs.ready == 'true' && needs.append-fiftysixth-and-source-fiftyseventh.outputs.has_next == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-fiftysixth4096-verified-append-fiftyseventh-prioritized-original-source
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: mois-fiftyseventh28-real-original-worker-*
          path: workers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute source and worker receipt SHAs, strict9 sums, technical unknowns
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m scripts.analysis.mois_species_first_fiftyseventh_audit --source frozen/source --workers workers --output audited
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-fiftyseventh28-real-original-photo-nineROI-audit
          path: audited/
          retention-days: 90
          if-no-files-found: warn
