name: Mois bounded real iNaturalist phenology annotation count pilot

on:
  push:
    branches:
      - manuscript/geographic-conditional-moisture-research-20261014
    paths:
      - .github/workflows/mois-inat-phenology-count-pilot-20261016.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-observation-counts-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify small public annotation-query client before any iNaturalist request
        run: |
          python -m pip install pytest==8.4.2
          python -m py_compile scripts/analysis/mois_real_inat_phenology_count_bias_pilot_20261016.py
          python -m pytest -q tests/test_mois_real_inat_phenology_count_bias_pilot_20261016.py
      - name: Fetch at most 35 serial counts on photographed plants, phenology and observed months
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .trusted/phenology
          python -m scripts.analysis.mois_real_inat_phenology_count_bias_pilot_20261016 \
            --out-aggregate .trusted/phenology/real_inat_public_photo_phenology_counts.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.trusted/phenology/real_inat_public_photo_phenology_counts.json').read_text())
          assert d['queries_total']==35
          assert len(d['cohorts'])==7
          assert d['status']=='REAL_INAT_API_PUBLIC_PHOTO_OBSERVATION_PHENOLOGY_COUNTS_NOT_FCP_SOURCE'
          assert not d['actual_original_source_FCP_42111_taxon_frame_sampled']
          assert not d['original_93209351_photo_ID_manifest_used']
          assert not d['annotations_assumed_frozen_as_of_2026_09_27']
          assert not d['whole_plant_population_or_all_flowering_species_inferred']
          assert d['no_iNaturalist_image_pixels_opened']
          print('MOIS_INAT_REAL_FLOWERS_ANNOTATION_OBSERVATION_ONLY_QUERY_AUDIT_SUCCESS')
          PY
      - name: Persist only aggregate observation counts plus query audit receipts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-public-inat-phenology-annotation-availability-35-queries-20261016
          path: .trusted/phenology/real_inat_public_photo_phenology_counts.json
          retention-days: 14
          if-no-files-found: error
