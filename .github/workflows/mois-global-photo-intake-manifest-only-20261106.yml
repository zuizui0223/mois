name: MOIS global acquired-original manifest verification NO new provider images
on:
  push:
    branches: [analysis/mois-viirs-popmatch-20261105]
    paths: [.github/workflows/mois-global-photo-intake-manifest-only-20261106.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-global-photo-ledger-dataonly-20261106
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: restored
        with:
          path: global_photo_intake
          key: mois-global-new-original-20261106-once-v1
      - name: Reuse the completed artifact if the cache was evicted
        if: steps.restored.outputs.cache-hit != 'true'
        run: |
          mkdir -p global_photo_intake
          gh run download 42183089388 --repo zuizui0223/mois \
            --name mois-global-new-original-photos-attribution-SHA-NOT-ROI9-20261106 --dir global_photo_intake
      - name: Verify original bytes, licences and ID counts from cached files only
        run: |
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 pillow==11.1.0 pyarrow==19.0.1
          mkdir -p baseline
          gh release download mois-original-1181146-exact-photo-crossarm-451643-strict9-taxongap-20261027-v1 \
            --repo zuizui0223/mois --pattern mois_1181146_unique_original_photo_continuous9_by_arm.parquet --dir baseline
          echo '3fbd0f0ec7eb347b3bbc7ab509ec9312ec6d797ed932dcf7bb425959898c3835  baseline/mois_1181146_unique_original_photo_continuous9_by_arm.parquet' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          import pandas as pd
          from PIL import Image
          root=Path('global_photo_intake');out=Path('compact');out.mkdir()
          receipt=json.loads((root/'receipt.json').read_text())
          selected=pd.DataFrame(json.loads((root/'selected_source_ids.json').read_text()))
          attempts=pd.read_json(root/'attempts.jsonl',lines=True,dtype={'photo_id':str,'observation_uuid':str})
          selected.photo_id=selected.photo_id.astype(str)
          assert attempts.photo_id.is_unique and selected.photo_id.is_unique
          prior=pd.read_parquet('baseline/mois_1181146_unique_original_photo_continuous9_by_arm.parquet',columns=['photo_id','observation_id'])
          assert len(prior)==1181146
          assert not set(attempts.photo_id)&set(prior.photo_id.astype(str))
          assert not set(attempts.observation_uuid)&set(prior.observation_id.dropna().astype(str))
          checked=0
          for row in attempts.to_dict('records'):
              if row['status'] not in ('downloaded_decoded','already_cached_no_refetch'):continue
              files=list((root/'originals').glob(str(row['photo_id'])+'.*'))
              assert len(files)==1
              p=files[0]
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256']
              with Image.open(p) as image:
                  image.load()
                  assert image.size==(int(row['width']),int(row['height']))
              checked+=1
          assert checked==receipt['actual_downloaded_and_decoded_photo_ids']
          assert receipt['scope']['minimum_island_area_km2'] is None
          assert receipt['scope']['include_mainland'] is True
          data=selected.merge(attempts,on=['photo_id','observation_uuid'],validate='one_to_one')
          data.drop(columns=['photograph_original_dimensions'],errors='ignore').to_csv(out/'new_originals_ID_license_SHA_acquisition.csv',index=False)
          attempted=set(attempts.photo_id)
          queue=pd.read_json(root/'pending_photo_id_queue.jsonl',lines=True,dtype={'photo_id':str})
          queue.loc[~queue.photo_id.isin(attempted)].to_json(out/'never_attempted_next_photo_queue.jsonl',lines=True,orient='records')
          receipt.update(independently_verified_original_byte_hashes=checked,
                         exact_prior_observation_UUID_overlap=0,
                         downloaded_unique_observation_UUIDs=int(data.loc[data.status.eq('downloaded_decoded'),'observation_uuid'].nunique()),
                         downloaded_nominal_taxa=int(data.loc[data.status.eq('downloaded_decoded'),'taxon_id'].nunique()),
                         next_never_attempted_photo_ids=int((~queue.photo_id.isin(attempted)).sum()),
                         verification_provider_photo_requests=0)
          (out/'verified_acquisition_receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          for name in ['source_intake.json','licensing.txt']:
              shutil.copyfile(root/name,out/name)
          (out/'manifest_SHA256.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir()},indent=2,sort_keys=True))
          print('MOIS_GLOBAL_ORIGINALS_INDEPENDENTLY_VERIFIED',json.dumps(receipt,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-global-512-new-original-ID-licence-SHA-and-next-queue-NO-PIXELS
          path: compact/
          retention-days: 90
          if-no-files-found: error
