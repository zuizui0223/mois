name: MOIS LGM same100km cell WCVP regional native versus introduced hue
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-LGM-WCVP-native-introduced-matched-cell-20261116.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-LGM-WCVP-native-intro-same100km-500kmblock-20261116
  cancel-in-progress: false

jobs:
  original-source-matched-native-intro:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned packages and verify synthetic same-cell contrasts
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 \
            statsmodels==0.14.4 scipy==1.15.2
          python -m py_compile scripts/analysis/mois_lgm_native_introduced_matched_cells_20261116.py
          python -m unittest discover -s tests -p test_mois_lgm_native_introduced_matched_cells_20261116.py -v
      - name: Retrieve previously source-signed WCVP native/introduced LGM and 100km spatial data
        run: |
          set -euo pipefail
          mkdir -p sources
          for entry in \
            '14228652073 NATIVE b72b7358ed5382d625583ad61b90952e4e77377296fe90ae677bf9481aa80a7f' \
            '14227246751 SPATIAL e209257adbc185b4855f3b8d76aeaa50d2e2afe8a1feeb0f76013366e57c4d16'; do
            set -- $entry
            curl --fail --location --silent --show-error --retry 3 --retry-delay 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/$1/zip" \
              --output "sources/$2.zip"
            echo "$3  sources/$2.zip" | sha256sum -c -
          done
      - name: Within exactly same GBIF cell compare WCVP native and introduced photographic hue fractions
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_lgm_native_introduced_matched_cells_20261116 \
            --native sources/NATIVE.zip \
            --spatial sources/SPATIAL.zip \
            --output MOIS_LGM_native_intro_matched
          python - <<'PY'
          import json
          r=json.load(open("MOIS_LGM_native_intro_matched/receipt.json"))
          assert r["n_source_species"]==37104
          assert r["n_original_source_species_cell_pairs"]==5493931
          assert r["native_at_TDWG3_does_not_validate_wild_individual"]
          assert r["present_occurrences_do_not_reconstruct_LGM_refugia"]
          for mode in ("strict","moderate"):
              assert r["results"][mode]["min_30_each"]["n_matched_cells"]>500
          print("MOIS_SAME_CELL_LGM_WCVP_COMPARISON_SUCCESS",json.dumps({
             mode:{threshold:{
               'n_matched_cells':item['n_matched_cells'],
               'beta500':item['models']['difference_500'].get('effect_white_fraction_per_SD_LGM_warming'),
               'p500':item['models']['difference_500'].get('p')}
               for threshold,item in r['results'][mode].items()}
             for mode in r["results"]},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-LGM-WCVP-native-introduced-same-grid-matched-500km
          path: MOIS_LGM_native_intro_matched/
          retention-days: 90
          if-no-files-found: warn
