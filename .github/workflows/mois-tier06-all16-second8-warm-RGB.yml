name: MOIS second all16 tier06 buckets4to11 genuine original warm RGB
on:
  pull_request:
    paths:
      - scripts/acquisition/mois_tier06_all16_second8_broad_warm_photo_queue.py
      - tests/test_mois_tier06_all16_second8_broad_warm_photo_queue.py
      - .github/workflows/mois-tier06-all16-second8-warm-RGB.yml
  push:
    branches: [main]
    paths:
      - scripts/acquisition/mois_tier06_all16_second8_broad_warm_photo_queue.py
      - .github/workflows/mois-tier06-all16-second8-warm-RGB.yml
  workflow_dispatch:
    inputs:
      resume_run:
        description: Previous source-identical real warm tier06 run ID for worker reuse
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-tier06-all16-buckets004to011-warm-RGB
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 pyarrow==19.0.1 numpy==2.1.3
          python -m py_compile scripts/acquisition/mois_tier06_all16_second8_broad_warm_photo_queue.py
          python -m unittest discover -s tests -p test_mois_tier06_all16_second8_broad_warm_photo_queue.py -v
          python -m scripts.acquisition.mois_tier06_all16_second8_broad_warm_photo_queue --help | grep -F -- '--broad-previous-parquet'
          python -m unittest discover -s tests -p test_mois_warm_original_roi.py -v
          python -m pip install -q PyYAML==6.0.2
          python - <<'PY'
          import subprocess,yaml
          d=yaml.safe_load(open('.github/workflows/mois-tier06-all16-second8-warm-RGB.yml'))
          n=0
          for job in d['jobs'].values():
              for step in job['steps']:
                  if 'run' in step:
                      p=subprocess.run(['bash','-n'],input=step['run'],text=True,capture_output=True)
                      assert p.returncode==0,(step.get('name'),p.stderr)
                      n+=1
          assert n>=10
          print('MOIS_NEW_SOURCE_BUCKETS4TO11_ALL_BASH_STEPS_VALID',n)
          PY
  source:
    needs: qa
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      groups: ${{ steps.queue.outputs.groups }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      RESUME_RUN: ${{ inputs.resume_run || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skip already fully published real photos; require explicit resume to avoid reacquisition
        id: gate
        run: |
          set -euo pipefail
          echo ready=false >> "$GITHUB_OUTPUT"
          if gh release view mois-tier06-all16-buckets004to011-broad-warm-original-RGB-v1 --repo "$REPO" >/dev/null 2>&1; then
            echo 'Already published completed original source photos. Skip.'
            exit 0
          fi
          if [ -n "$RESUME_RUN" ]; then
            [[ "$RESUME_RUN" =~ ^[0-9]+$ ]]
            gh release view mois-tier06-all16-buckets004to011-broad-warm-original-RGB-source-v1 \
              --repo "$REPO" --json isDraft --jq .isDraft | grep -qx false
          elif [ "$GITHUB_EVENT_NAME" != 'pull_request' ] && gh release view mois-tier06-all16-buckets004to011-broad-warm-original-RGB-source-v1 --repo "$REPO" >/dev/null 2>&1; then
            echo 'Original source already reserved. Set resume_run to prevent duplicate image downloads.' >&2
            exit 1
          fi
          echo ready=true >> "$GITHUB_OUTPUT"
      - name: Download only all16 signed tier06 512-bucket source archives
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 pyarrow==19.0.1
          mkdir -p routed metadata
          gh release download mois-complete-93209351-original-photo-target-tiers-v1 \
            --repo "$REPO" --dir metadata \
            --pattern mois_all_original_photo_target_tiers_receipt.json
          for group in $(seq -w 0 15); do
            tag="mois-signed-tier06-group$group-512-compute-buckets-v1"
            gh release download "$tag" --repo "$REPO" --dir "routed/group$group" \
              --pattern routing_receipt.json \
              --pattern "tier06-group$group-512-source-buckets.tar"
          done
      - name: Load prior original RGB pixels and technical photo-ID reservations to prevent repeat downloads
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          gh release download mois-real-pixel-checkpoint-39918209309-v1 \
            --repo "$REPO" --dir main-prior \
            --pattern checkpoint_receipt.json \
            --pattern combined_actual_photo_checkpoint.parquet
          gh release download mois-tier06-group00-first64bucket-warm-original-RGB-v1 \
            --repo "$REPO" --dir group00-prior \
            --pattern receipt.json --pattern measured_photos.parquet
          gh release download mois-tier06-all16-first4bucket-broad-warm-original-RGB-v1 \
            --repo "$REPO" --dir broad-previous \
            --pattern receipt.json --pattern measured_photos.parquet
          gh release download mois-93m-tier06-16-new-original-photo-warm-parity-v1 \
            --repo "$REPO" --dir technical \
            --pattern technical_original_photo_id_reservations.csv
          gh run download 38749681793 --repo zuizui0223/fcp \
            --name fcp-42111-real-source-photo-opportunity-counts-20260927-complete-not-colours \
            --dir counts
      - name: Freeze broad all16 original-observation hash source cohort with source and previous-photo SHA
        id: queue
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          names=$(find counts -name all_42111_species_photo_opportunity_counts.csv -print -quit)
          test -n "$names"
          python -m scripts.acquisition.mois_tier06_all16_second8_broad_warm_photo_queue \
            --registry metadata/mois_all_original_photo_target_tiers_receipt.json \
            --routed routed \
            --main-parquet main-prior/combined_actual_photo_checkpoint.parquet \
            --main-receipt main-prior/checkpoint_receipt.json \
            --group00-parquet group00-prior/measured_photos.parquet \
            --group00-receipt group00-prior/receipt.json \
            --broad-previous-parquet broad-previous/measured_photos.parquet \
            --broad-previous-receipt broad-previous/receipt.json \
            --technical-csv technical/technical_original_photo_id_reservations.csv \
            --counts-file "$names" --first-buckets 8 --output current
          python - <<'PY'
          import os,json
          m=json.load(open('current/manifest.json'))
          assert m['schema']=='mois_full_source_observation_sampling_cohort_v1'
          assert m['complete_tier06_source_photo_IDs']==597070
          assert m['full_frame_photo_ids']==93209351
          assert m['source_tier']==6 and m['source_group']=='all16'
          assert m['compute_bucket_count']==512 and m['admitted_bucket_count']==8 and m['admitted_bucket_start']==4
          assert m['admitted_buckets']==list(range(4,12)) and m['previous_broad_original_photo_attempts']==4468
          assert 3000<=m['new_photo_attempts_planned']<=12000
          assert m['not_probability_complete_global_source']
          assert m['native_photo_status_not_inferred_or_hard_filtered'] and not m['colour_measured']
          assert len(m['group_ids'])<=12
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('groups='+json.dumps(m['group_ids'])+'\n')
          print('MOIS_NEW_SOURCE_PHOTOS_QUEUED_FROM_SIGNED_ROUTED_TIER06',m['new_photo_attempts_planned'])
          PY
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: mois-tier06-all16-buckets004to011-precolour-source-shards
          path: current/
          retention-days: 90
          if-no-files-found: error
      - name: Publish immutable source-only manifest before pixels
        if: steps.gate.outputs.ready == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          tag=mois-tier06-all16-buckets004to011-broad-warm-original-RGB-source-v1
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release download "$tag" --repo "$REPO" --dir old --pattern manifest.json
            cmp old/manifest.json current/manifest.json
          else
            tar -cf tier06-buckets004to011-precolour-source-shards.tar -C current .
            gh release create "$tag" current/manifest.json tier06-buckets004to011-precolour-source-shards.tar \
              --repo "$REPO" --target "$GITHUB_SHA" \
              --title 'MOIS precolour second tier06 original source buckets4..11/512 across all 16 taxon groups' \
              --notes 'Source-only original photo/observation identities and all original source SHA verified; distinct from 897840 previous six-arm pixels, 4138 old group00 and 4468 first broad photos plus the independent technical holdout. Tier06 group00 is taxon-partition restricted and buckets4..11/512 are a new photo-disjoint source cohort, NOT full global probability coverage. No pixels opened, no precolour native status filtering, no morphological labels inferred.'
          fi
  measure:
    needs: source
    if: github.event_name != 'pull_request' && needs.source.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: ${{ fromJSON(needs.source.outputs.groups) }}
    env:
      GH_TOKEN: ${{ github.token }}
      RESUME_RUN: ${{ inputs.resume_run || '' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: mois-tier06-all16-buckets004to011-precolour-source-shards
          path: source
      - name: Reuse original source-sealed group units only when explicitly resuming
        run: |
          set -euo pipefail
          mkdir -p measured
          if [ -n "$RESUME_RUN" ]; then
            gh run download "$RESUME_RUN" --repo zuizui0223/mois \
              --name 'mois-tier06-all16-buckets004to011-RGB-group-${{ matrix.group }}' --dir measured || true
          fi
      - name: Restore unchanged original YOLO11 + EfficientSAM FCP ROI-v4 source and model
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          (cd "$RUNNER_TEMP/fcp" && bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam")
      - name: Run original source images once with warm, byte-immutable FCP ROI-v4 across four work units
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-tier06-new-original-image-rate"
          python -m scripts.acquisition.mois_warm_original_roi \
            --source source --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" \
            --group '${{ matrix.group }}' --output measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-tier06-all16-buckets004to011-RGB-group-${{ matrix.group }}
          path: measured/
          retention-days: 90
          if-no-files-found: warn
  collect:
    needs: [source,measure]
    if: github.event_name != 'pull_request' && needs.source.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
      - uses: actions/download-artifact@v4
        with:
          name: mois-tier06-all16-buckets004to011-precolour-source-shards
          path: source
      - uses: actions/download-artifact@v4
        with:
          pattern: mois-tier06-all16-buckets004to011-RGB-group-*
          path: workers
      - name: Independently check every original observation, image terminal and frozen method SHA
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.acquisition.mois_completed_pixel_checkpoint import collect_wave
          from scripts.analysis.mois_reassemble_original_new4096_measurements import METHOD
          rows,check=collect_wave(Path('source'),Path('workers'),METHOD)
          plan=json.loads(Path('source/manifest.json').read_text())
          assert check['wave_complete'] and check['attempted']==plan['new_photo_attempts_planned']
          assert len(rows)==check['attempted'] and len({r['photo_id'] for r in rows})==len(rows)
          Path('tier06_terminal_source_validation.json').write_text(json.dumps(check,indent=2,sort_keys=True)+'\n')
          print('MOIS_TIER06_NEW_ORIGINAL_PIXELS_SOURCE_SHA_VALIDATED',check['attempted'],check['classifiable'])
          PY
          python -m scripts.acquisition.mois_full_index_real_original_photo_measure collect \
            --source source --workers workers --output finished
          cp source/manifest.json finished/source.json
          cp tier06_terminal_source_validation.json finished/
      - uses: actions/upload-artifact@v4
        with:
          name: mois-tier06-all16-buckets004to011-authenticated-original-RGB
          path: finished/
          retention-days: 90
          if-no-files-found: error
      - name: Release actual source-authenticated measured photos only
        run: |
          set -euo pipefail
          tag=mois-tier06-all16-buckets004to011-broad-warm-original-RGB-v1
          if gh release view "$tag" --repo zuizui0223/mois >/dev/null 2>&1; then
            gh release download "$tag" --repo zuizui0223/mois --dir old --pattern receipt.json
            cmp old/receipt.json finished/receipt.json
          else
            gh release create "$tag" finished/*.json finished/*.parquet \
              --repo zuizui0223/mois --target "$GITHUB_SHA" \
              --title 'MOIS real original RGB from all16 source tier06 buckets4..11' \
              --notes 'New original photo IDs only, from signed 93m tier06 all16 observation hash buckets4..11/512, proven disjoint from the first4-bucket cohort. Verified distinct from prior 879408 terminal photo IDs and separate tier06 16-photo technical holdout. Full-resolution frozen FCP ROI-v4 unchanged, model sessions reused per group; all failed/uncertain image colours preserved as unknowns. Broad all16 taxon source group coverage remains compute-partial, NOT a representative world-flora colour sample. No raw image bytes redistributed.'
          fi
