name: MOIS admit all FCP original 447500 genuine RGB photo pixels by photo ID

on:
  pull_request:
    paths:
      - scripts/acquisition/mois_reuse_complete_FCP447500_real_original_ROI_pixels.py
      - tests/test_mois_reuse_complete_FCP447500_real_original_ROI_pixels.py
      - .github/workflows/mois-reuse-full-FCP447500-original-photo-RGB.yml
  push:
    branches: [main]
    paths:
      - scripts/acquisition/mois_reuse_complete_FCP447500_real_original_ROI_pixels.py
      - .github/workflows/mois-reuse-full-FCP447500-original-photo-RGB.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mois-reuse-complete-fcp447500-original-pixels-immutable-v1
  cancel-in-progress: false

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 pytest==8.4.2
          python -m pytest -q tests/test_mois_reuse_complete_FCP447500_real_original_ROI_pixels.py
          python -m py_compile scripts/acquisition/mois_reuse_complete_FCP447500_real_original_ROI_pixels.py

  actual-verified-FCP-photo-reuse:
    needs: source-contracts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-only Parquet/CSV runtime (no image classifier or original photo HTTP)
        run: python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
      - name: Download exactly completed FCP 447500 actual original RGB outcome release
        run: |
          set -euo pipefail
          mkdir -p original_FCP
          gh release download fcp-all4730-original-method-actual-colour-results-20261017 \
            --repo zuizui0223/fcp --dir original_FCP \
            --pattern fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz \
            --pattern fcp_all4730_actual_colour_results_receipt.json
          echo '99f7ee68c3fd009e8ab60fd0cfcdf1fb407e3a8de07edd38341b27889310bc25  original_FCP/fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz' | sha256sum -c -
          echo 'b0b152fcfaa1e0015a6e5524192265bb95c1663c10b5da3a4e885cb7be49747c  original_FCP/fcp_all4730_actual_colour_results_receipt.json' | sha256sum -c -
          tar -tzf original_FCP/fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz | sed -n '1,28p'
          tar -xzf original_FCP/fcp_all4730_original_method_actual_measured_data_and_inference.tar.gz -C original_FCP
          test -s original_FCP/measured/fcp_all4730_original_method_measured_photos.csv.gz
          test -s original_FCP/measured/fcp_all4730_original_photo_combine_receipt.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('original_FCP')
          release=json.loads((root/'fcp_all4730_actual_colour_results_receipt.json').read_text())
          photo=root/'measured/fcp_all4730_original_method_measured_photos.csv.gz'
          joined=root/'measured/fcp_all4730_original_photo_combine_receipt.json'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert release['schema']=='fcp_all4730_permanent_measured_original_photo_results_v1'
          assert release['genuinely_measured_photo_rows']==447500
          assert release['genuinely_measured_100photo_species']==4475
          assert sha(photo)==release['source_archive_sha256']
          assert sha(joined)==release['source_join_receipt_sha256']
          print('FCP447500_GENUINE_ORIGINAL_PHOTO_CLASSIFICATIONS_NOT_METADATA_OPPORTUNITIES')
          PY
      - name: Download original MOIS 350399 actual ROI source Parquets without remeasurement
        run: |
          set -euo pipefail
          gh release download mois-primary-real317631-next4096-incremental-all19-featurelake-v3 \
            --repo zuizui0223/mois --dir old/core \
            --pattern primary317631_actual_photo_hue_RGB_attempts.parquet \
            --pattern mois_317631_new4096_incremental_climate_feature_lake_receipt.json
          gh release download mois-broad-world-angiosperm-newtaxa4096-real-RGB-ROI-v1 \
            --repo zuizui0223/mois --dir old/broad \
            --pattern primary313535_plus_broad4096_genuine_original_hue_photos.parquet \
            --pattern mois_global_angiosperm_broad4096_actual_photo_colour_taxa_receipt.json
          gh release download mois-broad-wave2-4096-measured-data-only-v1 \
            --repo zuizui0223/mois --dir old/wave2 \
            --pattern wave2_measured_photos.parquet --pattern receipt.json
          gh release download mois-cached-next8192-measured-data-only-v1 \
            --repo zuizui0223/mois --dir old/cached8192 \
            --pattern measured_photos.parquet --pattern receipt.json
          gh release download mois-cached-tail16384-measured-data-only-v1 \
            --repo zuizui0223/mois --dir old/tail16384 \
            --pattern measured_photos.parquet --pattern receipt.json
      - name: Verify every existing MOIS actual-photo source SHA before appending
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          c=Path('old/core')
          r=json.loads((c/'mois_317631_new4096_incremental_climate_feature_lake_receipt.json').read_text())
          f='primary317631_actual_photo_hue_RGB_attempts.parquet'
          assert r['all_original_photo_attempts']==317631
          assert sha(c/f)==r['photo_ID_aligned_Zstd_files_sha256'][f]
          b=Path('old/broad')
          r=json.loads((b/'mois_global_angiosperm_broad4096_actual_photo_colour_taxa_receipt.json').read_text())
          f='primary313535_plus_broad4096_genuine_original_hue_photos.parquet'
          assert r['expanded_actual_original_photo_attempts']==317631 and sha(b/f)==r['new_combined_photo_parquet_SHA256']
          for key,f,n in (('wave2','wave2_measured_photos.parquet',4096),
                           ('cached8192','measured_photos.parquet',8192),
                           ('tail16384','measured_photos.parquet',16384)):
              path=Path('old')/key
              r=json.loads((path/'receipt.json').read_text())
              assert r['attempted']==n and sha(path/f)==r['photo_data_sha256']
          print('MOIS_PREEXISTING_350399_REAL_ORIGINAL_PIXELS_SIGNED')
          PY
      - name: Audit FCP 447500 actual classified original photo IDs vs MOIS and append only genuinely new IDs
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_reuse_complete_FCP447500_real_original_ROI_pixels \
            --core old/core/primary317631_actual_photo_hue_RGB_attempts.parquet \
            --broad old/broad/primary313535_plus_broad4096_genuine_original_hue_photos.parquet \
            --wave2 old/wave2/wave2_measured_photos.parquet \
            --cached8192 old/cached8192/measured_photos.parquet \
            --tail16384 old/tail16384/measured_photos.parquet \
            --fcp-measured original_FCP/measured/fcp_all4730_original_method_measured_photos.csv.gz \
            --fcp-receipt original_FCP/fcp_all4730_actual_colour_results_receipt.json \
            --fcp-combine-receipt original_FCP/measured/fcp_all4730_original_photo_combine_receipt.json \
            --output original_FCP_photo_import
          python - <<'PY'
          import json
          r=json.load(open('original_FCP_photo_import/mois_FCP447500_signed_original_photo_reuse_on350399_receipt.json'))
          assert r['full_original_FCP_real_photo_attempts']==447500
          assert r['MOIS_previous_real_photo_attempts']==350399
          assert (r['original_FCP_photo_IDs_already_in_MOIS']+
                  r['new_genuinely_measured_FCP_photo_IDs'])==447500
          assert r['union_total_genuinely_original_photo_IDs']==350399+r['new_genuinely_measured_FCP_photo_IDs']
          assert r['old_source_image_ROI_results_preserved'] and r['no_original_images_downloaded_or_redistributed']
          assert r['WCVP_native_or_environmental_analysis_run'] is False
          print('MOIS_FCP447500_ACTUAL_PHOTO_DATASET_EXPANDED_WITHOUT_REMEASURING_ONE_IMAGE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-all-FCP447500-completed-original-RGB-photo-ID-union-with350399
          path: original_FCP_photo_import/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve new source-authenticated expanded RGB photo data permanently
        run: |
          set -euo pipefail
          tag=mois-reuse-complete-FCP447500-actual-original-pixels-on350399-v1
          if gh release view "$tag" --repo zuizui0223/mois >/dev/null 2>&1; then
            echo "Already published original authentic FCP/MOIS pixel-photo data, no overwrite."
          else
            gh release create "$tag" original_FCP_photo_import/* \
              --repo zuizui0223/mois --target "$GITHUB_SHA" \
              --title 'MOIS photo-ID deduped 350399 real ROI + complete FCP 447500 original photo colours' \
              --notes 'Reuse the fully source-SHA authenticated FCP 447500 original iNaturalist flower-photo ROI labels, not FCP polymorphism statistics or source photo opportunities. MOIS 350399 existing photo IDs win without remeasurement or colour modification. Novel FCP original photo IDs are genuinely previously measured ROI outcomes; unknown original image classes are not chromatic. Source cohorts and already measured photo overlap/hue disagreements reported. This is NOT a new independent provider, a natural flora census, native-island range analysis, observed climate causal effect, FCP D/W inference or fitness.'
          fi
