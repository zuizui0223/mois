name: MOIS independent holdout 180 GBIF country range vs photo hue
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-gbif-180-colour-country-holdout-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-GBIF-independent-holdout180-country-SA-20261115
  cancel-in-progress: false
jobs:
  actual-GBIF-georeferenced-species-country-facets:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned analysis dependencies and run outcome-blind country facet tests
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 scipy==1.15.2 statsmodels==0.14.4
          python -m unittest discover -s tests -p test_mois_gbif_colour_country_facets_20261115.py -v
      - name: Verify official latest signed accepted 37104-colour source and refuse duplicate run
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          # Prior run 43706895018 failed at unittest import; NO GBIF API query started.
          # Refuse another successful or unknown prior run instead of blindly replaying.
          old=$(gh run list --repo "$REPO" --workflow mois-gbif-180-colour-country-holdout-20261115.yml \
            --limit 100 --json databaseId,conclusion --jq ".[] | select(.databaseId < $GITHUB_RUN_ID and .databaseId != 43708042835) | .databaseId")
          test -z "$old" || { echo "Another prior GBIF country extraction run exists: $old"; exit 1; }
          test "$(gh api "repos/$REPO/actions/runs/43703313170" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/43703313170/artifacts" \
            --jq '.artifacts[] | select(.id==14157705123) | .digest')" \
            = 'sha256:abcd3aee766c85a92b86a8f93f8ed696bbe49d0f6cf2f64e5f75b457abf78e6a'
          mkdir -p source
          curl --fail --location --silent --show-error --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/zuizui0223/mois/actions/artifacts/14157705123/zip' \
            --output source/colxr37104.zip
          echo 'abcd3aee766c85a92b86a8f93f8ed696bbe49d0f6cf2f64e5f75b457abf78e6a  source/colxr37104.zip' | sha256sum -c -
      - name: Fetch true GBIF public georeferenced occurrence country & continent facets for balanced nine hues
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_gbif_colour_country_facets_20261115 \
            --source source/colxr37104.zip --per-hue 20 --rank-start 20 --output gbif_real
          python - <<'PY'
          import json
          r=json.load(open('gbif_real/receipt.json'))
          assert r['source_accepted_COLXR_species']==37104 and r['within_hue_rank_start']==20
          assert r['sampled_accepted_species']==180 and r['sample_n_per_photo_hue']==20
          assert r['GBIF_country_coded_occurrences'] if 'GBIF_country_coded_occurrences' in r else True
          assert r['all_country_facets_complete_under_cap']
          assert r['photo_hue_is_occurrence_level_truth'] is False
          assert r['GBIF_authenticated_bulk_download_submitted'] is False
          print('MOIS_180_ACTUAL_GBIF_COUNTRY_FACET_RESPONSES_ALL_AUDITED')
          PY
      - name: Fit descriptive photo-hue vs observed country-coverage association with occurrence-effort guard
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd,numpy as np,json,hashlib
          from pathlib import Path
          from scipy.stats import kruskal,spearmanr
          import statsmodels.formula.api as smf
          s=pd.read_csv('gbif_real/species_GBIF_country_continent_facets.csv')
          assert len(s)==180 and s.gbif_colxr_species_key.is_unique
          assert s.groupby('photo_hue9').size().eq(20).all()
          s['has_record']=s.GBIF_georeferenced_occurrence_total.gt(0)
          s['log_georef_occ']=np.log1p(s.GBIF_georeferenced_occurrence_total)
          s['log_countries']=np.log1p(s.countries_GBIF_1plus)
          positive=s[s.has_record].copy()
          assert len(positive)>10 and positive.photo_hue9.nunique()==9,'Insufficient distribution data to compare 9 hue statuses'
          s['white_proxy']=(s.photo_hue9=='white').astype(int)
          positive['white_proxy']=(positive.photo_hue9=='white').astype(int)
          main=smf.ols('log_countries ~ white_proxy + log_georef_occ',data=positive).fit(cov_type='HC3')
          kw=kruskal(*[positive.loc[positive.photo_hue9.eq(k),'countries_GBIF_1plus'].values for k in ('white','yellow','orange','red','pink','magenta','purple','blue','bronze')])
          rho=spearmanr(positive.GBIF_georeferenced_occurrence_total,positive.countries_GBIF_1plus)
          med=positive.groupby('photo_hue9',as_index=False).agg(
             species=('gbif_colxr_species_key','size'),
             median_countries=('countries_GBIF_1plus','median'),
             mean_countries=('countries_GBIF_1plus','mean'),
             median_georeferenced_occurrences=('GBIF_georeferenced_occurrence_total','median'))
          med.to_csv('gbif_real/per_photo_hue_country_count_descriptive.csv',index=False)
          report={
            'schema':'mois_photo9_GBIF_country_diversity_descriptive_v1',
            'analysed_sample_n':len(s),'sample_per_hue':20,
            'positive_GBIF_occurrence_sample_n':len(positive),
            'primary_outcome':'log1p(number of countries with georeferenced GBIF occurrence)',
            'covariates':'white photo hue proxy and log1p(GBIF georeferenced record count)',
            'white_coef_effort_adjusted':float(main.params['white_proxy']),
            'white_coef_HC3_95CI':[float(x) for x in main.conf_int().loc['white_proxy']],
            'white_coef_HC3_p':float(main.pvalues['white_proxy']),
            'effort_coef_HC3':float(main.params['log_georef_occ']),
            'adjusted_R2':float(main.rsquared_adj),
            'nine_hue_kruskal_H':float(kw.statistic),
            'nine_hue_kruskal_p':float(kw.pvalue),
            'gbif_record_count_vs_countries_spearman_rho':float(rho.statistic),
            'GBIF_count_country_coverage_is_not_true_native_geographic_range':True,
            'sample_colour_balanced_not_world_species_colour_ratio':True,
            'photo_hue_is_not_measured_at_GBIF_occurrences':True,
            'GBIF_SQL_global_ISEA3H_149_packages_still_not_submitted':True,
            'input_csv_sha256':hashlib.sha256(Path('gbif_real/species_GBIF_country_continent_facets.csv').read_bytes()).hexdigest()
          }
          Path('gbif_real/descriptive_photo_hue_country_analysis_receipt.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print('MOIS_180_GBIF_COUNTRY_REAL_DISTRIBUTION_DESCRIPTIVE',json.dumps(report,sort_keys=True),flush=True)
          PY
      - name: Outcome-blind holdout test against the disjoint original 180 source species
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/zuizui0223/mois/actions/artifacts/14158822487/zip' \
            --output discovery180.zip
          echo '2181898c7428172cd039b208a5e3fc5169c12d3a8d324bef05a84f3a6a89a446  discovery180.zip' | sha256sum -c -
          python - <<'PY'
          import io,hashlib,json
          from pathlib import Path
          from zipfile import ZipFile
          import numpy as np,pandas as pd
          from scipy.stats import fisher_exact,chi2
          import statsmodels.formula.api as smf
          import statsmodels.api as sm
          with ZipFile('discovery180.zip') as z:
              first=pd.read_csv(io.BytesIO(z.read('source_selected_20_per_photo_hue.csv')),dtype=str)
              f=pd.read_csv(io.BytesIO(z.read('species_x_continent_real_GBIF_records.csv')),dtype=str)
          second=pd.read_csv('gbif_real/source_selected_20_per_photo_hue.csv',dtype=str)
          d=pd.read_csv('gbif_real/species_GBIF_country_continent_facets.csv',dtype={'gbif_colxr_species_key':str})
          continents=pd.read_csv('gbif_real/species_x_continent_real_GBIF_records.csv',dtype={'gbif_colxr_species_key':str})
          assert len(first)==len(second)==len(d)==180
          assert set(first.key).isdisjoint(set(second.key))
          assert d.gbif_colxr_species_key.is_unique and d.groupby('photo_hue9').size().eq(20).all()
          assert set(d.gbif_colxr_species_key)==set(second.key)
          pair=('orange','purple')
          sa=continents[continents.continent.eq('SOUTH_AMERICA')].copy()
          sa=sa[['gbif_colxr_species_key','GBIF_georeferenced_records']]
          q=d.merge(sa,on='gbif_colxr_species_key',how='left').fillna({'GBIF_georeferenced_records':0})
          q['south_america_count']=pd.to_numeric(q.GBIF_georeferenced_records)
          q['photo_hue9']=q.photo_hue9.astype(str)
          n_orange=int((q.photo_hue9.eq('orange')&q.south_america_count.ge(1)).sum())
          n_purple=int((q.photo_hue9.eq('purple')&q.south_america_count.ge(1)).sum())
          p_fisher=fisher_exact([[n_orange,20-n_orange],[n_purple,20-n_purple]],alternative='greater').pvalue
          n_orange10=int((q.photo_hue9.eq('orange')&q.south_america_count.ge(10)).sum())
          n_purple10=int((q.photo_hue9.eq('purple')&q.south_america_count.ge(10)).sum())
          p_fisher10=fisher_exact([[n_orange10,20-n_orange10],[n_purple10,20-n_purple10]],alternative='greater').pvalue
          hues=('white','yellow','orange','red','pink','magenta','purple','blue','bronze')
          codes=pd.Categorical(q.photo_hue9,categories=hues).codes
          assert set(codes)==set(range(9))
          def stat(g,y):
              n=np.bincount(g,minlength=9).astype(float)
              k=np.bincount(g,weights=y,minlength=9)
              r=y.mean()
              return float(np.sum((k-n*r)**2/(n*r)+(n-k-n*(1-r))**2/(n*(1-r)))) if 0<r<1 else 0.
          y=q.south_america_count.ge(1).to_numpy(int)
          obs=stat(codes,y)
          rng=np.random.default_rng(20261115)
          n_perms=10000
          p_global=(1+sum(stat(rng.permutation(codes),y)>=obs for _ in range(n_perms)))/(n_perms+1)
          q['SA_present']=(q.south_america_count>=1).astype(int)
          q['log_total_GBIF_count']=np.log1p(q.GBIF_georeferenced_occurrence_total.astype(float))
          null=smf.glm('SA_present ~ log_total_GBIF_count + C(photo_hue_status)',data=q,family=sm.families.Binomial()).fit()
          full=smf.glm('SA_present ~ C(photo_hue9) + log_total_GBIF_count + C(photo_hue_status)',data=q,family=sm.families.Binomial()).fit()
          LRT=2*(full.llf-null.llf)
          p_lrt=chi2.sf(LRT,full.df_model-null.df_model)
          summary={
            'schema':'mois_GBIF_180_heldout_SouthAmerica_photo_hue_replication_v1',
            'discovery_artifact_zip_sha256':'2181898c7428172cd039b208a5e3fc5169c12d3a8d324bef05a84f3a6a89a446',
            'discovery_species':180,'heldout_species':180,
            'overlap_species_keys':0,'hue_balance_per_hue':20,
            'holdout_rank_start':20,
            'prespecified_primary_region':'SOUTH_AMERICA',
            'discovery_primary_orange_present':14,'discovery_primary_purple_present':2,
            'heldout_orange_present':n_orange,'heldout_purple_present':n_purple,
            'heldout_orange_georeferenced_10plus':n_orange10,
            'heldout_purple_georeferenced_10plus':n_purple10,
            'prespecified_one_sided_orange_gt_purple_fisher_p':float(p_fisher),
            'sensitivity_one_sided_orange_gt_purple_min10_GBIF_occ_fisher_p':float(p_fisher10),
            'holdout_all9_photo_hue_10000perm_SouthAmerica_p':float(p_global),
            'holdout_all9_photo_hue_effort_status_adjusted_LRT_p':float(p_lrt),
            'discovery_result_is_posthoc':True,'holdout_result_is_prespecified':True,
            'photo_hue_never_measured_at_GBIF_occurrence':True,
            'native_versus_introduced_never_resolved':True,
            'phylogenetic_taxon_composition_not_controlled':True,
            'GBIF_global_species_grid_download_DOI':None
          }
          Path('gbif_real/SouthAmerica_heldout_replication_receipt.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n')
          q[['gbif_colxr_species_key','species','photo_hue9','photo_hue_status','south_america_count','GBIF_georeferenced_occurrence_total']].to_csv('gbif_real/heldout_SA_species_source_and_outcome.csv',index=False)
          print('MOIS_GBIF_SOUTH_AMERICA_HELDOUT_REPLICATION_REAL',json.dumps(summary,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-COLXR-180-heldout-GBIF-country-SA-replication-20261115
          path: gbif_real/
          retention-days: 90
          if-no-files-found: warn
