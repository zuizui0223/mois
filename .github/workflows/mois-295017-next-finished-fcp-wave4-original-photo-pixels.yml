name: MOIS append next finished real FCP photo pixels to 295017 measured original-date photo union

on:
  pull_request:
    paths:
      - "scripts/analysis/mois_append_finished_fcp_wave4_to_real295017.py"
      - "tests/test_mois_append_finished_fcp_wave4_to_real295017.py"
      - ".github/workflows/mois-295017-next-finished-fcp-wave4-original-photo-pixels.yml"
      - "docs/MOIS_NEXT_REAL_FCP_PIXELS_BEYOND295017_20261017.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-next-genuine-fcp-wave4-finished-original-295017-full-photo-and-dates
  cancel-in-progress: false

jobs:
  reassemble-authentic-completed-ROI-and-preserve-source-dates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check new original pixel/photo-date merge identities with synthetic source fixtures
        run: |
          python -m pip install -q 'numpy==2.1.3' 'pandas==2.2.3' 'pytest==8.4.2'
          python -m pytest -q tests/test_mois_append_finished_fcp_wave4_to_real295017.py
          python -m pytest -q tests/test_mois_reuse_fcp_wave4_partitions_now.py
      - name: Recover originally signed 252408-photo source and exact FCP 49800 photo selection firewall
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p historic252408 frozen_fcp original_worker_terminals old295017
          gh run download 39000213324 --repo zuizui0223/mois \
            --name mois-252408-original-photos-122383-measured-four-hue-pixels --dir historic252408
          gh run download 38992543115 --repo zuizui0223/fcp \
            --name fcp-wave4-unchanged-original-blind-firewall --dir frozen_fcp
          gh api repos/zuizui0223/fcp/actions/runs/38992543115 > original_FCP_pixel_run.json
          gh run download 38992543115 --repo zuizui0223/fcp \
            --pattern 'fcp-wave4-original-b*' --dir original_worker_terminals
          gh run download 39015660689 --repo zuizui0223/mois \
            --name mois-295017-original-photo-142538-genuine-hues-140247-verified-observation-dates \
            --dir old295017
          test -s old295017/mois_real295017_original_photo_pixels_three_waves_FCP180.csv.gz
          test -s old295017/mois_real295017_original_photo_hues_plus_verified_observed_dates.csv.gz
          test -s historic252408/mois_all_real_original_hue_measured_248312_plus_new_waves.csv.gz
          zip -j -q signed_real295017_source.zip old295017/*
      - name: Verify finished original FCP ROI worker pixels and blinded 49800 IDs with original source method
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_reuse_fcp_wave4_completed_roi_partitions \
            --prior-252408-original-photos historic252408/mois_all_real_original_hue_measured_248312_plus_new_waves.csv.gz \
            --prior-252408-photo-source-receipt historic252408/mois_real_additional_photo_waves_receipt.json \
            --fcp-wave4-original-blind-firewall frozen_fcp \
            --fcp-wave4-completed-original-pixel-partitions original_worker_terminals \
            --fcp-wave4-original-run-snapshot original_FCP_pixel_run.json \
            --output new_signed_finished_fcp_photo_source
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('new_signed_finished_fcp_photo_source/mois_fcp_wave4_PARTIAL_real_completed_original_ROI_receipt.json')
          r=json.loads(p.read_text())
          assert 180 < r['FCP_completed_ROI_partitions'] <= 256
          assert r['FCP_live_original_actions_run']==38992543115
          assert r['FCP_original_run_head_sha']=='ef448c9514e0c702e7887e00b288ee966728b0d5'
          assert r['FCP_real_completed_original_image_pixel_rows']>=35000
          assert not r['FCP_genetic_or_within_species_D_W_50km_polymorphism_statistics_imported']
          print('MOIS_TRUE_FCP_ORIGINAL_NEW_COMPLETED_PIXEL_PARTITION_COUNT',r['FCP_completed_ROI_partitions'])
          PY
      - name: Add ONLY unseen measured original photo IDs and immutable ROI colours, attach original observation day
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_append_finished_fcp_wave4_to_real295017 \
            --prior295017-authentic-archive signed_real295017_source.zip \
            --finished-fcp-photo-source new_signed_finished_fcp_photo_source/mois_fcp_wave4_PARTIAL_completed_pixel_original_photo_union.csv.gz \
            --finished-fcp-photo-receipt new_signed_finished_fcp_photo_source/mois_fcp_wave4_PARTIAL_real_completed_original_ROI_receipt.json \
            --output real_next_new_measured_original_pixels
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('real_next_new_measured_original_pixels')
          r=json.loads((root/'mois_next_finished_fcp_original_photo_new_pixel_date_hue_receipt.json').read_text())
          assert r['prior_original_measured_photo_IDs']==295017
          assert r['prior_original_four_hue_photo_ROIs']==142538
          assert r['prior_source_dated_four_hue_photos']==140247
          assert r['FCP_real_completed_photo_ROI_partitions']>180
          assert r['additional_original_photo_pixels']>0
          assert r['additional_original_four_hue_ROI_labels']>0
          assert r['additional_new_photo_hues_with_original_observed_date']>0
          assert r['expanded_distinct_measured_source_photo_IDs']==295017+r['additional_original_photo_pixels']
          assert r['expanded_dated_original_four_hue_ROIs']==140247+r['additional_new_photo_hues_with_original_observed_date']
          assert r['real_original_photo_pixels_and_source_hues_not_relabelled']
          assert r['old_99817_S3_API_historical_original_photo_dates_unmodified']
          assert r['FCP_original_local_D_W_or_genetic_50km_estimands_NOT_imported']
          print('MOIS_GENUINE_MEASURED_PIXEL_GROWTH',json.dumps({k:r[k] for k in (
            'FCP_real_completed_photo_ROI_partitions','additional_original_photo_pixels',
            'additional_original_four_hue_ROI_labels','expanded_distinct_measured_source_photo_IDs',
            'expanded_dated_original_four_hue_ROIs')},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-next-actually-measured-original-photos-after-295017-fcp-new-pixel-date-union
          path: real_next_new_measured_original_pixels/
          retention-days: 90
          if-no-files-found: warn
