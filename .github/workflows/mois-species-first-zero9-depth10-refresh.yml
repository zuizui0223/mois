name: MOIS full93m signed original-photo candidate depth10 refresh for still uncoloured taxa
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-species-first-zero9-depth10-refresh.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-species-first-zero9-all16-depth10-${{ github.ref }}
  cancel-in-progress: false
jobs:
  remaining-signed-groups:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ['00','01','02','03','04','05','06','07','08','09','10','11','12','13','14','15']
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      GROUP: ${{ matrix.group }}
      PHOTO_TAG: mois-original-1181146-exact-photo-crossarm-451643-strict9-taxongap-20261027-v1
      MASTER_TAG: mois-complete-93209351-original-photo-target-tiers-v1
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate breadth-only taxon opportunity selector
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 pyarrow==19.0.1
          python -m unittest discover -s tests -p test_mois_species_first_zero9_source.py -v
      - name: Reuse frozen 1.18m original-pixel photo IDs; download metadata ONLY
        run: |
          set -euo pipefail
          mkdir -p input tiers
          gh release download "$PHOTO_TAG" --repo "$REPO" --dir input \
            --pattern mois_1181146_unique_original_photo_continuous9_by_arm.parquet \
            --pattern mois_42111_original_taxon_9palette_before_after.csv.gz
          gh release download "$MASTER_TAG" --repo "$REPO" --dir input \
            --pattern mois_all_original_photo_target_tiers_receipt.json \
            --pattern "group-$GROUP-receipt.json"
          for tier in $(seq -w 0 13); do
            gh release download "$MASTER_TAG" --repo "$REPO" --dir tiers \
              --pattern "tier-$tier-group-$GROUP.tar"
          done
          test "$(find tiers -maxdepth 1 -name "tier-??-group-$GROUP.tar" -type f | wc -l)" -eq 14
      - name: Expand SHA-validated full93m original observation candidate pool to up to ten per previously unmeasured taxon, NO image download
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_species_first_zero9_source \
            --registry input/mois_all_original_photo_target_tiers_receipt.json \
            --group-receipt "input/group-$GROUP-receipt.json" \
            --archives tiers \
            --photos input/mois_1181146_unique_original_photo_continuous9_by_arm.parquet \
            --coverage input/mois_42111_original_taxon_9palette_before_after.csv.gz \
            --group "$((10#$GROUP))" --max-fallback 10 \
            --output "source_zero9_group$GROUP"
          python - <<'PY'
          import json,os,pandas as pd
          from pathlib import Path
          group=os.environ['GROUP']
          p=Path('source_zero9_group'+group)
          d=json.loads((p/'receipt.json').read_text())
          assert d['group']==int(group) and d['new_original_photo_downloads']==0
          assert d['source_zero9_taxa_with_eligible_candidate']==d['new_first_wave_distinct_species_photo_opportunities']
          q=pd.read_csv(p/f'mois_species_zero9_group{group}_next_first_photo.csv',dtype=str)
          assert q.inat_taxon_id.is_unique and q.photo_id.is_unique and q.observation_id.is_unique
          assert q.inat_taxon_id.map(lambda s:int(s)%128//8==int(group)).all()
          print('MOIS_ZERO9_METADATA_SOURCE_GROUP_DONE',group,len(q),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-source-full93m-zero9-depth10-group-${{ matrix.group }}
          path: source_zero9_group${{ matrix.group }}/
          retention-days: 90
          if-no-files-found: warn
  global-16group-unique-taxon-dedup:
    needs: remaining-signed-groups
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: always()
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: mois-source-full93m-zero9-depth10-group-*
          path: all_sources
          merge-multiple: false
      - name: Verify 16 group receipts and combine disjoint source-only photo/observation queue
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import pandas as pd
          sources=Path('all_sources')
          allrows=[];allfallback=[];reports=[]
          for n in range(16):
              folder=sources/f'mois-source-full93m-zero9-depth10-group-{n:02d}'
              receipt=folder/'receipt.json'
              assert receipt.is_file(),f'Missing source group {n} output receipt'
              d=json.loads(receipt.read_text())
              assert d['schema']=='mois_species_first_original93m_zero9_taxon_reverse_lookup_v1'
              assert d['group']==n and d['new_original_photo_downloads']==0
              first=folder/f'mois_species_zero9_group{n:02d}_next_first_photo.csv'
              backup=folder/f'mois_species_zero9_group{n:02d}_source_candidates.csv.gz'
              for file in (first,backup):
                  h=hashlib.sha256(file.read_bytes()).hexdigest()
                  assert d['output_sha256'][file.name]==h,file
              a=pd.read_csv(first,dtype=str)
              b=pd.read_csv(backup,dtype=str)
              assert len(a)==d['source_zero9_taxa_with_eligible_candidate']
              assert a.inat_taxon_id.map(lambda s:int(s)%128//8==n).all()
              allrows.append(a);allfallback.append(b);reports.append(d)
          q=pd.concat(allrows,ignore_index=True)
          allb=pd.concat(allfallback,ignore_index=True)
          assert q.inat_taxon_id.is_unique and q.photo_id.is_unique and q.observation_id.is_unique
          assert set(q.photo_id).issubset(set(allb.photo_id))
          assert allb.groupby('inat_taxon_id').size().max()<=10
          assert allb.photo_id.is_unique and allb.observation_id.is_unique
          output=Path('global_zero9_depth10');output.mkdir()
          q.to_csv(output/'mois_global_species_first_zero9_depth10_first_photo_queue.csv.gz',
                   index=False,compression='gzip')
          allb.to_csv(output/'mois_global_species_first_zero9_depth10_fallback_photo_options.csv.gz',
                      index=False,compression='gzip')
          rec={"schema":"mois_all16_zero9_source_depth10_disjoint_v1",
               "original_global_photo_metadata_population":93209351,
               "nominal_source_taxon_frame":42111,
               "input_original_photo_ROI9_attempts":1181146,
               "source_groups_signed":16,
               "source_zero9_taxa_with_any_original_photo":sum(x['source_zero9_taxa_with_any_photo'] for x in reports),
               "source_zero9_taxa_with_first_new_photo":len(q),
               "source_zero9_taxa_without_eligible_new_photo":sum(x['source_zero9_taxa_no_eligible_candidate'] for x in reports),
               "total_fallback_source_photos":len(allb),
               "selection_per_species_max":10,
               "new_RGB_image_downloads":0,
               "new_nine_palette_measurements":0,
               "GBIF_occurrence_records_downloaded":0,
               "full_global_tier_group_receipt_SHA256":{
                   str(x['group']):x['group_receipt_sha'] for x in reports}}
          (output/'receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          print('MOIS_GLOBAL_ALL16_ZERO9_DEPTH10_SOURCE_RESULT',json.dumps(rec,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-global-16groups-full93m-zero9-depth10-fresh-photo-fallbacks
          path: global_zero9/
          retention-days: 90
          if-no-files-found: error
