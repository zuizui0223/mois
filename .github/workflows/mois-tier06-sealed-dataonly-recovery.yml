name: MOIS tier06 signed completed warm RGB data-only recovery
on:
  pull_request:
    paths:
      - scripts/acquisition/mois_full_index_real_original_photo_measure.py
      - tests/test_mois_full_index_real_photo_measure.py
      - .github/workflows/mois-tier06-sealed-dataonly-recovery.yml
  push:
    branches: [main]
    paths:
      - scripts/acquisition/mois_full_index_real_original_photo_measure.py
      - .github/workflows/mois-tier06-sealed-dataonly-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-tier06-4138-real-warm-terminal-dataonly-release-v1
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 pyarrow==19.0.1
          python -m unittest discover -s tests -p test_mois_full_index_real_photo_measure.py -v
          python -m unittest discover -s tests -p test_mois_completed_pixel_checkpoint.py -v
          python -m py_compile scripts/acquisition/mois_full_index_real_original_photo_measure.py
  recover:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      ORIGINAL_RUN: '39722694770'
      ORIGINAL_SOURCE_TAG: mois-tier06-group00-first64bucket-warm-original-RGB-source-v1
      FINAL_TAG: mois-tier06-group00-first64bucket-warm-original-RGB-v1
      BASELINE_TAG: mois-real-pixel-checkpoint-39864144578-v1
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse redundant or in-flight original pixel recovery
        id: check
        run: |
          set -euo pipefail
          echo ready=false >> "$GITHUB_OUTPUT"
          if gh release view "$FINAL_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo 'All original tier06 warm pixels already published. No duplicate work.'
            exit 0
          fi
          # Original acquisition run intentionally ended red in its old collector:
          # require all FIVE image measurement jobs themselves to have succeeded.
          gh api "repos/$REPO/actions/runs/$ORIGINAL_RUN/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("measure (")) | select(.conclusion=="success")] | length' \
            | grep -qx '5'
          gh release view "$ORIGINAL_SOURCE_TAG" --repo "$REPO" \
            --json isDraft --jq .isDraft | grep -qx false
          echo ready=true >> "$GITHUB_OUTPUT"
      - name: Recover original immutable source and all FIVE already completed photo-worker groups
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python -m pip install -q pandas==2.2.3 numpy==2.1.3 pyarrow==19.0.1
          gh run download "$ORIGINAL_RUN" --repo "$REPO" \
            --name mois-tier06-first64buckets-precolour-source-shards --dir source
          gh release download "$ORIGINAL_SOURCE_TAG" --repo "$REPO" \
            --dir frozen --pattern manifest.json
          cmp source/manifest.json frozen/manifest.json
          echo '020ff1e52bca8479975f8f9d5f3072338bda29e3b9951c94e0a71608abe2038b  source/manifest.json' | sha256sum -c -
          # NEVER re-download original images. These 5 sealed jobs already
          # contain every original photo terminal and its source/ROI receipt.
          gh run download "$ORIGINAL_RUN" --repo "$REPO" \
            --pattern 'mois-tier06-warm-RGB-group-*' --dir workers
          gh release download "$BASELINE_TAG" --repo "$REPO" --dir prior \
            --pattern checkpoint_receipt.json \
            --pattern combined_actual_photo_checkpoint.parquet
      - name: SHA-validate all authentic tier06 photo terminal rows and unchanged original ROI model
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          import pandas as pd
          from scripts.acquisition.mois_completed_pixel_checkpoint import collect_wave
          from scripts.analysis.mois_reassemble_original_new4096_measurements import METHOD
          from scripts.acquisition.mois_full_index_real_original_photo_measure import sha
          root=Path('source')
          manifest=json.loads((root/'manifest.json').read_text())
          require=lambda yes,msg: None if yes else (_ for _ in ()).throw(ValueError(msg))
          rows,audit=collect_wave(root,Path('workers'),METHOD)
          require(audit['wave_complete'] and audit['attempted']==4138 and
                  audit['classifiable']==1573 and
                  manifest['new_photo_attempts_planned']==4138,
                  'Original warm photo/ROI terminal cohort not complete or altered')
          require(len({r['photo_id'] for r in rows})==4138,
                  'Duplicate original tier06 photo terminal ID')
          prior=Path('prior')
          base=json.loads((prior/'checkpoint_receipt.json').read_text())
          f=prior/'combined_actual_photo_checkpoint.parquet'
          require(base['schema']=='mois_sealed_actual_pixel_checkpoint_v1' and
                  base['combined_unique_photo_attempts']==879408 and
                  base['combined_four_hue_classified']==397768 and
                  sha(f)==base['output_sha256'][f.name],
                  'Baseline genuine original-photo checkpoint mismatch')
          old=pd.read_parquet(f,columns=['photo_id','observation_id'])
          old_ids=set(old.photo_id.astype(str))
          new_ids={r['photo_id'] for r in rows}
          require(len(old_ids)==len(old)==879408 and not old_ids.intersection(new_ids),
                  'A genuine original photo was already present in main checkpoint')
          old_obs={x for x in old.observation_id.fillna('').astype(str) if x.strip()}
          new_obs={r['observation_id'] for r in rows}
          require(not old_obs.intersection(new_obs),
                  'An original observation overlapped prior published photo pixels')
          diagnostics=[]
          for file in sorted(Path('workers').rglob('warm_roi_group_*.json')):
              diagnostics.append(json.loads(file.read_text()))
          require(len(diagnostics)==5
                  and sum(x['separate_original_main_calls'] for x in diagnostics)==17
                  and sum(x['frozen_yolo_and_onnx_initializations'] for x in diagnostics)==5
                  and sum(x['new_photos_downloaded'] for x in diagnostics)==4138,
                  'Warm fixed original-model worker runtime/identity accounting mismatch')
          flags={k:v for k,v in audit.items() if k not in ('completed_unit_audit',)}
          report=dict(
              schema='mois_tier06_warm_separate_arms_source_sha_union_audit_v1',
              original_tier06_acquisition_run=39722694770,
              original_tier06_photo_attempts=4138,
              original_tier06_four_hue_classified=1573,
              main_checkpoint_run=39864144578,
              main_checkpoint_original_photo_attempts=879408,
              main_checkpoint_four_hue_classified=397768,
              combined_disjoint_source_arm_actual_photo_ids=879408+4138,
              combined_disjoint_source_arm_classifiable_four_hue=397768+1573,
              original_photo_id_overlap=0,original_observation_id_overlap=0,
              all_frozen_FCP_original_ROI_method_receipts_verified=True,
              warm_original_model_sessions=5,
              original_blind_roi_photo_work_units=17,
              new_photo_image_fetches_in_THIS_recovery=0,
              use_mixed_sampling_source_arms_without_unweighted_global_prevalence=False,
              original_source_sha256=sha(root/'manifest.json'),
              prior_main_checkpoint_parquet_sha256=sha(f),
              completed_original_source_wave_receipt=flags,
              worker_warm_timings=[
                  {k:v for k,v in x.items() if k in (
                      'group','photo_work_units','new_photos_downloaded',
                      'group_wall_seconds','frozen_yolo_and_onnx_initializations',
                      'separate_original_main_calls')}
                  for x in diagnostics],
          )
          Path('tier06_verified_separate_arm_and_warm_diagnostics.json').write_text(
              json.dumps(report,indent=2,sort_keys=True)+'\n')
          Path('tier06_source_terminal_validation.json').write_text(
              json.dumps(audit,indent=2,sort_keys=True)+'\n')
          print('MOIS_TIER06_GENUINE_ORIGINAL_PHOTOS_RECONCILED_WITH_PRIOR',
                json.dumps({k:report[k] for k in (
                    'original_tier06_photo_attempts','original_tier06_four_hue_classified',
                    'combined_disjoint_source_arm_actual_photo_ids',
                    'combined_disjoint_source_arm_classifiable_four_hue',
                    'warm_original_model_sessions')},sort_keys=True))
          PY
      - name: Reassemble original measured ROI-v4 Parquet WITHOUT source image access
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_full_index_real_original_photo_measure collect \
            --source source --workers workers --output finished
          cp source/manifest.json finished/source.json
          cp tier06_verified_separate_arm_and_warm_diagnostics.json finished/
          cp tier06_source_terminal_validation.json finished/
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('finished/receipt.json').read_text())
          assert d['attempted']==4138 and d['classifiable']==1573
          assert d['source_deduplication_reporting_grain']=='prior_original_photo_or_observation'
          assert d['prior_photo_or_observation_source_rows_excluded']==23
          assert d['independent_technical_photo_or_observation_rows_excluded']==2
          print('MOIS_TIER06_ALREADY_COMPLETED_FROZEN_RGB_DATA_ONLY_PUBLISHED',d['attempted'],d['classifiable'])
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.ready == 'true'
        with:
          name: mois-tier06-4138-already-measured-original-pixels-sealed-dataonly
          path: finished/
          if-no-files-found: warn
          retention-days: 90
      - name: Publish immutable full 4138-photo true original ROIs and separate-arm audit
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if gh release view "$FINAL_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release download "$FINAL_TAG" --repo "$REPO" --dir old --pattern receipt.json
            cmp old/receipt.json finished/receipt.json
          else
            gh release create "$FINAL_TAG" finished/*.json finished/*.parquet \
              --repo "$REPO" --target "$GITHUB_SHA" \
              --title 'MOIS genuine 4138 original tier06 warm RGB outcomes; fixed ROI-v4' \
              --notes 'ONLY 5 previously sealed original 39722694770 photo worker artifacts were reassembled, without any additional image download, model startup or hue re-inference. Exact 4138 unique original photo terminal IDs, 1573 frozen full-res ROI four-hue labels, source/photo/observation SHA and model checks; no overlap with 879408 genuine photo main six-arm checkpoint. Original photo source restricted tier06/group00 first64/512 buckets and source-arm sampling probabilities remain separate, not a global unbiased species-level white-flower prevalence. Image pixels are NOT redistributed.'
          fi
