name: "MOIS Ecology: climate NPP AGB gradients of nine-hue assembly residual"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - scripts/analysis/mois_hue9_assembly_environment_spatial_20261118.py
      - .github/workflows/mois-hue9-assembly-climate-productivity-spatial-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-hue9-genus-breadth-ecological-drivers-20261118
  cancel-in-progress: false
jobs:
  original-GBIF-ecological-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source Parquet and spatial-ecology regression packages
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "pyarrow>=17,<25" \
            "scipy>=1.11,<2" "statsmodels>=0.14,<1" "scikit-learn>=1.5,<1.9"
      - name: Retrieve and verify four immutable signed true-source data archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p sources
          for item in \
            '14397106083 null 596166fa2fe8bfb28653c325a3a8f1a1495c0792688a7fdb781014cfedaa88c7' \
            '14227246751 spatial e209257adbc185b4855f3b8d76aeaa50d2e2afe8a1feeb0f76013366e57c4d16' \
            '14219565387 NDVI e08e81d1c2afd1a2ee5312f3ebc4aeb5ab7678988c2453a2a9c63d28c82eb17a' \
            '14235983742 NPP 68b2cfa1aeac9dc5d02cd310c9b2f45553a5be4db3319a1e40897612ad9b1bef'; do
            set -- $item
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" \
              -o "sources/$2.zip"
            echo "$3  sources/$2.zip" | sha256sum -c
          done
      - name: Real Shannon genus range size residual vs 500km FE and independent 1000km heldout models
        run: |
          python -m scripts.analysis.mois_hue9_assembly_environment_spatial_20261118 \
            --null sources/null.zip \
            --spatial sources/spatial.zip \
            --NDVI sources/NDVI.zip \
            --NPP sources/NPP.zip \
            --out results/mois_hue9_assembly_environment_spatial_20261118
      - name: Preserve numerical outputs with source SHA and spatial holdout
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-nine-hue-assembly-climate-NPP-AGB-spatial-CV-20261118
          path: results/mois_hue9_assembly_environment_spatial_20261118/
          retention-days: 30
          if-no-files-found: error
