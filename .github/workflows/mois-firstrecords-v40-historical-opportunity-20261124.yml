name: "MOIS ecology: historical first-recording opportunity falsification"
on:
  push:
    branches: [analysis/mois-global-floral-colour-assembly-null-20261118]
    paths:
      - scripts/analysis/mois_firstrecords_v40_historical_effort_audit_20261124.py
      - tests/test_mois_firstrecords_v40_historical_effort_20261124.py
      - .github/workflows/mois-firstrecords-v40-historical-opportunity-20261124.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-firstrecords-v40-historical-opportunity-20261124
  cancel-in-progress: true
jobs:
  pre-index-historical-coverage-and-colour:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies and confirm no future leakage in 3 tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "numpy==2.1.3" "pandas==2.2.3" "scikit-learn==1.8.0" "pytest>=8,<10"
          python -m pytest -q tests/test_mois_firstrecords_v40_historical_effort_20261124.py
      - name: Acquire canonical FirstRecords v4.0 and original signed species record archive
        run: |
          set -euo pipefail
          mkdir -p source/v4
          python - <<'PY'
          import urllib.request,hashlib,pathlib
          names={
            "FirstRecords_dataset_public_v4.0.csv":"cbba8f2c2c518519674fd4f0540809d4",
            "FirstRecords_taxonomy_table_public_v4.0.csv":"d3e21741364b33fabb3cef3b249543bd",
            "FirstRecords_location_table_public_v4.0.csv":"cb69dd1ad613cbfe24db316b89f5884a"}
          for name,expected in names.items():
              req=urllib.request.Request("https://zenodo.org/records/18759840/files/"+name+"?download=1",
                  headers={"User-Agent":"MOIS-2026-historical-first-recording-opportunity/1.0"})
              dest=pathlib.Path("source/v4")/name
              with urllib.request.urlopen(req,timeout=160) as r,dest.open("wb") as out:
                  while (b:=r.read(1024*1024)):out.write(b)
              actual=hashlib.md5(dest.read_bytes()).hexdigest()
              assert actual==expected,(name,actual)
              print("MOIS_FIRSTRECORDS_V40_MD5",name,actual,flush=True)
          PY
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14757922016/zip" \
            -o source/mois_signed_v40_species_50y.zip
          echo "afa9cbe259ca13d039692e4aa0a0e117045655a3f3fd6ee8e89ddd01b22f41e2  source/mois_signed_v40_species_50y.zip" | sha256sum -c
      - name: Audit historical recording intensity and genus-heldout photo9 predictive value
        run: |
          python -m scripts.analysis.mois_firstrecords_v40_historical_effort_audit_20261124 \
            --source source/mois_signed_v40_species_50y.zip \
            --v4 source/v4 \
            --out results/mois_v40_prior25_effort_20261124
      - name: Upload only derived source-audited outputs, never mirror the source CSVs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-v40-firstrecords-historical-effort-genus-holdout-20261124
          path: results/mois_v40_prior25_effort_20261124/
          retention-days: 60
          if-no-files-found: error
