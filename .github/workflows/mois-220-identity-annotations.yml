name: MOIS 220 existing photo identities and flowering annotations only
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - scripts/analysis/mois_220_identity_annotations.py
      - tests/test_mois_220_identity_annotations.py
      - .github/workflows/mois-220-identity-annotations.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-220-source-identity-annotation-audit
  cancel-in-progress: false
jobs:
  canonical-identities-no-image-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ID namespaces and never infer photo flowering from observation annotations
        run: python -m unittest discover -s tests -p test_mois_220_identity_annotations.py -v
      - name: Retrieve fixed original 220-row photo review source
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/zuizui0223/mois/actions/artifacts/14111328732/zip' \
            --output source.zip
      - name: Resolve existing IDs and copy official observation annotations; no images
        run: python -m scripts.analysis.mois_220_identity_annotations --source source.zip --output output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-220-canonical-identities-observation-annotations-20261114
          path: output/
          retention-days: 30
          if-no-files-found: warn
