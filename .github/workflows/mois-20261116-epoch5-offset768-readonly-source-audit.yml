name: MOIS epoch5 offset768 independent source ZIP and byte receipt audit
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - .github/workflows/mois-20261116-epoch5-offset768-readonly-source-audit.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-epoch5-offset768-source-readonly-audit-once
  cancel-in-progress: false
jobs:
  independent-byte-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
    steps:
      - uses: actions/checkout@v4
      - name: Verify terminal source and skipped non-source stages
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          repo="zuizui0223/mois"; rid=43809194943; aid=14200066748
          get=lambda p:json.loads(subprocess.check_output(["gh","api",p]))
          run=get(f"repos/{repo}/actions/runs/{rid}")
          assert (run["status"],run["conclusion"])==("completed","success")
          jobs={j["name"]:j["conclusion"] for j in get(f"repos/{repo}/actions/runs/{rid}/jobs?per_page=100")["jobs"]}
          assert jobs=={"source-only-first128":"success","pixel-worker-only-if-novel-original":"skipped",
                       "independent-strict9-audit":"skipped","formal-append-after-audit":"skipped"},jobs
          arts=get(f"repos/{repo}/actions/runs/{rid}/artifacts?per_page=100")["artifacts"]
          assert len(arts)==1 and arts[0]["id"]==aid and arts[0]["name"]=="mois-20261116-epoch5-offset768-signed-1231345-ID-source"
          assert arts[0]["digest"]=="sha256:193a1eabd8c2e617fff787975ed754d1fe1eb57b0195bddd1bccc2ecb0a90e77" and not arts[0]["expired"]
          print("MOIS_EPOCH5_OFFSET768_TERMINAL_SOURCE_AND_GITHUB_SIGNED_DIGEST_OK")
          PY
      - name: Independently hash actual ZIP bytes and every source component; exclude old photo and UUID
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/artifacts/14200066748/zip" -o /tmp/source.zip
          echo "193a1eabd8c2e617fff787975ed754d1fe1eb57b0195bddd1bccc2ecb0a90e77  /tmp/source.zip" | sha256sum -c -
          python - <<'PY'
          import json,zipfile,hashlib,csv,io,pathlib
          h=lambda b:hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile("/tmp/source.zip") as z:
            assert set(z.namelist())=={"receipt.json","source_taxon_status.csv","source_candidates.csv"}
            rb=z.read("receipt.json");r=json.loads(rb)
            sb=z.read("source_taxon_status.csv");cb=z.read("source_candidates.csv")
            assert h(sb)==r["source_status_SHA256"]
            assert h(cb)==r["source_candidates_SHA256"]=="01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b"
            assert (r["hash_disjoint_taxon_offset"],r["searched_zero_numeric_taxa"],r["source_API_error_count"],
                    r["old_original_photo_attempt_ID_count"],r["old_original_photo_obs_ID_overlap"],
                    r["new_independent_original_photo_candidates"],r["original_pixels_fetched"],
                    r["strict9_numeric_photos"])==(768,128,0,1231345,0,0,0,0),r
            assert r["old_all_image_raw_SHA_disjointness_proven"] is False
            assert r["recent_known_original_image_raw_SHA_count"]==101
            rows=list(csv.DictReader(io.StringIO(sb.decode())))
            ids=[x["inat_taxon_id"] for x in rows]
            assert len(ids)==len(set(ids))==128
            assert all(x["status"]=="source_queried" and x["accepted_unused_photo"]=="0" for x in rows)
            report={"run_id":43809194943,"source_artifact_id":14200066748,
              "source_zip_sha256":"193a1eabd8c2e617fff787975ed754d1fe1eb57b0195bddd1bccc2ecb0a90e77",
              "source_receipt_sha256":h(rb),"source_status_sha256":h(sb),"source_candidates_sha256":h(cb),
              "verified_taxa":128,"new_candidates":0,"API_errors":0,
              "old_photo_ids":1231345,"old_photo_observation_overlap":0,"old_full_raw_sha_proven":False,
              "pixel_worker":"skipped","independent_pixel_audit":"skipped","formal_append":"skipped",
              "strict9_increment":0,"numeric_taxon_increment":0,"clear_hue_increment":0,"gbif_exact_accepted_increment":0}
          pathlib.Path("audit.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print("MOIS_EPOCH5_OFFSET768_READONLY_SIGNED_SOURCE_AUDIT_SUCCESS",json.dumps(report,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-20261116-epoch5-offset768-readonly-audited-source-receipts
          path: audit.json
          retention-days: 90
          if-no-files-found: error
