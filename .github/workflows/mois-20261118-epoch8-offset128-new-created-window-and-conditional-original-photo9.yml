          PY
          mkdir -p /tmp/mois_artifacts
          while read -r id sha name; do
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" -o "/tmp/mois_artifacts/$id.zip"
            echo "$sha  /tmp/mois_artifacts/$id.zip" | sha256sum -c -
            echo "INDEPENDENT_BYTE_ZIP_SHA256 $id $name $sha"
          done < /tmp/latest_artifacts.tsv
          python - <<'PY'
          import json,csv,io,zipfile,hashlib,glob,os
          h=lambda b:hashlib.sha256(b).hexdigest()
          a={}
          for f in glob.glob("/tmp/mois_artifacts/*.zip"):
            with zipfile.ZipFile(f) as z:
              for n in z.namelist():
                if ".." in n.split("/"):raise AssertionError("unsafe zip path")
              # Explicit provenance check of every present inner receipt
              vals={n:z.read(n) for n in z.namelist() if not n.endswith("/")}
              a.update({os.path.basename(f)+"/"+n:v for n,v in vals.items()})
              name=" ".join(k for k in vals)
              if "source_taxon_status.csv" in vals:
                r=json.loads(vals["receipt.json"])
                if "manifest.json" in vals:
                  assert h(vals["manifest.json"])==r["source_manifest_SHA256"]
                else:
                  assert r["new_independent_original_photo_candidates"]==0
                if "shards/shard-000.csv" in vals:
                  assert h(vals["shards/shard-000.csv"])==r["source_shard_SHA256"]
                else:
                  assert r["new_independent_original_photo_candidates"]==0
                assert h(vals["source_taxon_status.csv"])==r["source_status_SHA256"]
                assert h(vals["source_candidates.csv"])==r["source_candidates_SHA256"]
                assert (r["hash_disjoint_taxon_offset"],r["searched_zero_numeric_taxa"],r["source_API_error_count"],r["old_original_photo_obs_ID_overlap"])==(128,128,0,0)
                assert r["old_all_image_raw_SHA_disjointness_proven"] is False
                rows=list(csv.DictReader(io.StringIO(vals["source_taxon_status.csv"].decode())))
                ids=[x["inat_taxon_id"] for x in rows]
                assert len(ids)==len(set(ids))==128
                assert all(x["status"]=="source_queried" for x in rows)
                print("SOURCE_MANIFEST_AND_RECEIPT_BYTE_SHA256",h(vals["receipt.json"]),h(vals["source_taxon_status.csv"]),h(vals["source_candidates.csv"]),flush=True)
                print("NEW_SOURCE_CANDIDATES",r["new_independent_original_photo_candidates"],flush=True)
              elif "receipt.json" in vals:
                receipt=json.loads(vals["receipt.json"])
                if "derived_atlas_sha256" in receipt:
                  assert h(vals["mois_42111_post20261114_new_independent_original_photo9.csv.gz"])==receipt["derived_atlas_sha256"]
                print("OTHER_INNER_RECEIPT_BYTE_SHA256",h(vals["receipt.json"]),flush=True)
          assert any(k.endswith("/source_taxon_status.csv") for k in a)
          print("INDEPENDENT_FINAL_BYTE_AUDIT_SUCCESS",len(a),flush=True)
          PY
