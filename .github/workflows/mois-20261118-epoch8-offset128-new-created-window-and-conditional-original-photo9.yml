          repo="zuizui0223/mois"
          get=lambda p:json.loads(subprocess.check_output(["gh","api",p]))
          final7=get(f"repos/{repo}/actions/runs/44235063258")
          assert (final7["status"],final7["conclusion"])==("completed","success")
          finjobs={j["name"]:j["conclusion"] for j in get(f"repos/{repo}/actions/runs/44235063258/jobs?per_page=100")["jobs"]}
          assert finjobs["source-only-first128"]==finjobs["independent-final-byte-audit"]=="success"
          assert all(finjobs[k]=="skipped" for k in ("pixel-worker-only-if-novel-original","independent-strict9-audit","formal-append-after-audit"))
          fina={x["id"]:x for x in get(f"repos/{repo}/actions/runs/44235063258/artifacts?per_page=100")["artifacts"]}
          assert len(fina)==1 and fina[14396233558]["digest"]=="sha256:5fcd21233648d4a5983c709002548d5f34c861a3b6cb25c9bbabb6ad3d61dca9" and not fina[14396233558]["expired"]
