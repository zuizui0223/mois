name: MOIS eleventh 446 new real-photo hue taxa COL XR accepted species only
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths:
      - scripts/analysis/mois_gbif_colxr_wave11_incremental.py
      - .github/workflows/mois-gbif-colxr-wave11-new-names.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-colxr-eleventh-446-only-original-hue-new-taxa
  cancel-in-progress: false
jobs:
  new-eleventh-original-photo-hue-species-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: zuizui0223/mois
      ELEVENTH_APPENDED_RUN: '43052143525'
      PRIOR_TENTH_COLXR_RUN: '43039772284'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check only official accepted species, no old key changes
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3
          python -m unittest discover -s tests -p test_mois_gbif_colxr_wave10_incremental.py -v
          python -m py_compile scripts/analysis/mois_gbif_colxr_wave11_incremental.py
      - name: Fetch SHA authenticated eleventh original atlas and tenth COL XR accepted name registry
        run: |
          set -euo pipefail
          mkdir -p updated previous
          gh run download "$ELEVENTH_APPENDED_RUN" --repo "$REPO" \
            --name mois-eleventh2048-verified-append-twelfth-prioritized-original-source --dir updated
          gh run download "$PRIOR_TENTH_COLXR_RUN" --repo "$REPO" \
            --name mois-gbif-colxr-tenth-only-new-906-hue-realphoto-accepted-nine-fractions --dir previous
          python - <<'PY'
          from pathlib import Path
          import json
          from scripts.analysis.mois_gbif_colxr_batch_match import source_sha
          atlas=Path('updated/updated/mois_species_first_42111_after_eleventh.csv.gz')
          r=json.loads(Path('updated/updated/receipt.json').read_text())
          assert r['schema']=='mois_species_first_eleventh4096_append_twelfth4096_v1'
          assert r['eleventh_actual_strict9_photo_successes']==620
          assert r['eleventh_new_source_taxa_with_clear_dominant_hue9']==446
          assert r['source_taxa_with_clear_sampled_nine_palette']==34697
          assert source_sha(atlas)==r['output_sha256']['atlas']
          old=json.loads(Path('previous/receipt.json').read_text())
          assert old['schema']=='mois_species_first_real_wave10_gbif_colxr_new_names_v1'
          assert old['current_exact_colxr_accepted_species']==32431
          oldnames=Path('previous/all_current_photo9_gbif_colxr_names.csv.gz')
          assert source_sha(oldnames)==old['signed_file_SHA256'][oldnames.name]
          print('MOIS_ELEVENTH_ATLAS_AND_PREVIOUS_32431_GBIF_ACCEPTED_SHA_SIGNED',flush=True)
          PY
      - name: Run official GBIF v2 COL XR only for eleventh newly hue-labelled 446 nominal source taxa
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_gbif_colxr_wave11_incremental \
            --atlas updated/updated/mois_species_first_42111_after_eleventh.csv.gz \
            --prior-names previous/all_current_photo9_gbif_colxr_names.csv.gz \
            --prior-receipt previous/receipt.json \
            --append-receipt updated/updated/receipt.json \
            --output wave11_colxr --batch-size 200 --pause 1.0
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('wave11_colxr/receipt.json').read_text())
          assert r['schema']=='mois_species_first_real_wave11_gbif_colxr_new_names_v1'
          assert r['photo_source_taxa_dominant_hue']==34697
          assert 0<r['new_nine_hue_nominal_taxa_queried']<=446
          assert 0<=r['new_exact_colxr_accepted_species']<=446
          assert r['previous_gbif_accepted_species']==32431
          assert r['current_exact_colxr_accepted_species']==32431+r['new_exact_colxr_accepted_species']
          assert r['current_GBIF_species_numeric9_fractional_traits']==r['current_exact_colxr_accepted_species']
          assert r['GBIF_authenticated_bulk_occurrence_download_submitted'] is False
          print('MOIS_ELEVENTH_GENUINE_NINEHUE_GBIF_COLXR_INCREMENT',json.dumps(
             {k:r[k] for k in ('new_nine_hue_nominal_taxa_queried',
             'new_exact_colxr_accepted_species','current_exact_colxr_accepted_species',
             'GBIF_ISEA3H_SQL_request_count')},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-gbif-colxr-eleventh-only-new-446-hue-realphoto-accepted-nine-fractions
          path: wave11_colxr/
          retention-days: 90
          if-no-files-found: warn
