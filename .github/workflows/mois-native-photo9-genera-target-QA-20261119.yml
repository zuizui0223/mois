name: "MOIS QA: source-backed botanical photo validation target queue"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - scripts/analysis/build_mois_native_photo9_genus_validation_queue_20261119.py
      - .github/workflows/mois-native-photo9-genera-target-QA-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  generate-genus-qa-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic source reader
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "pandas>=2.1,<3"
      - name: Retrieve and SHA-check source WCVP native 10882-species ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --location \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14525280772/zip" \
            -o original_10882_native.zip
          echo "955f4c0fdf2ba1be49f3195e065db52b048e28400b4a7938dc8c97222c4e280d  original_10882_native.zip" | sha256sum -c
      - name: Produce 199 one-sided genera and priority 75 missing-colour species
        run: |
          python -m scripts.analysis.build_mois_native_photo9_genus_validation_queue_20261119 \
            --source original_10882_native.zip \
            --out results/mois_native_photo9_genus_QA_queue_20261119
      - name: Archive candidate exact names, image quality flags and provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-native-photo9-75-priority-species-199-genus-QA-queue-20261119
          path: results/mois_native_photo9_genus_QA_queue_20261119/
          if-no-files-found: error
          retention-days: 30
