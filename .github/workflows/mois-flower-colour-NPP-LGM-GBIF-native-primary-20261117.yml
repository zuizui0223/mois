name: MOIS primary floral-colour white and nine-hue versus GBIF NPP LGM woody AGB
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-flower-colour-NPP-LGM-GBIF-native-primary-20261117.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-GBIF-MOD17-original-photo9-colour-primary-NPP-LGM-20261117
  cancel-in-progress: false

jobs:
  true-flower-colour-species-and-native-regional-cells:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned analytical dependencies; prove floral-colour is actual response
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 \
            statsmodels==0.14.4 scipy==1.15.2
          python -m py_compile scripts/analysis/mois_flower_colour_LGM_NPP_GBIF_20261117.py
          python -m unittest discover -s tests -p 'test_mois_flower_colour_LGM_NPP_GBIF_20261117.py' -v

      - name: Restore signed true GBIF, photo9 species traits, three GCM paleoclimate and 23-year NPP
        run: |
          set -euo pipefail
          mkdir -p source
          for artifact in \
            '14166701658 GBIF 422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2' \
            '14219399376 ENV d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc' \
            '14225733755 LGM db3b5b4fa2133194963be9233411bb6bb50bc86393d1dc50d996cc4cc78b25ab' \
            '14235983742 NPP 68b2cfa1aeac9dc5d02cd310c9b2f45553a5be4db3319a1e40897612ad9b1bef' \
            '14228652073 NATIVE b72b7358ed5382d625583ad61b90952e4e77377296fe90ae677bf9481aa80a7f' \
            '14227246751 SPATIAL e209257adbc185b4855f3b8d76aeaa50d2e2afe8a1feeb0f76013366e57c4d16' \
            '14219565387 NDVI e08e81d1c2afd1a2ee5312f3ebc4aeb5ab7678988c2453a2a9c63d28c82eb17a'; do
            set -- $artifact
            curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/$1/zip" \
              -o "source/$2.zip"
            echo "$3  source/$2.zip" | sha256sum -c -
          done

      - name: Fit original white-versus-coloured species and GBIF native 100km floral colour
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_flower_colour_LGM_NPP_GBIF_20261117 \
            --gbif source/GBIF.zip --env source/ENV.zip \
            --lgm source/LGM.zip --npp source/NPP.zip \
            --native source/NATIVE.zip --spatial source/SPATIAL.zip \
            --ndvi source/NDVI.zip \
            --out MOIS_flower_colour_NPP_LGM
          python - <<'PY'
          import json,pyarrow.parquet as pq
          from pathlib import Path
          d=json.loads(Path('MOIS_flower_colour_NPP_LGM/receipt.json').read_text())
          assert d['source_37k_species']==37104
          assert d['source_5493931_GBIF_species_cells']==5493931
          assert d['primary_goal_is_flower_colour']
          assert d['n_complete_species']>20000
          s=d['results']['source_species_level']['white']
          assert s['status']=='fitted'
          assert s['n_species']>15000
          assert s['n_genera']>1000
          assert d['n_eligible_native_strict_cells']>5000
          for grp in ('strict','moderate'):
              for category in ('native','introduced','all'):
                  obj=d['results']['source_current_native_vs_introduced_cells'][grp][category]
                  assert obj['n_eligible_100km_cells']>300
          print('MOIS_PRIMARY_FLORAL_COLOUR_REAL_GBIF_NPP_LGM_VERIFIED',
                json.dumps({
                  'n_complete_species':d['n_complete_species'],
                  'white_source_counts':s['n_species'],
                  'white_genus_counts':s['n_genera'],
                  'species_model':s['models']['species_equal']['with_NPP']['effects'],
                  'genus_model':s['models']['genus_equal']['with_NPP']['effects'],
                  'strict_native_cells':d['n_eligible_native_strict_cells'],
                  'strict_native_effects':d['results']['source_current_native_vs_introduced_cells'][
                     'strict']['native']['models']['500km_full']['effects']
                 },sort_keys=True),flush=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-Genuine-GBIF37104-photo9-floral-colour-primary-NPP-LGM-native-spatial
          path: MOIS_flower_colour_NPP_LGM/
          retention-days: 90
          if-no-files-found: warn
