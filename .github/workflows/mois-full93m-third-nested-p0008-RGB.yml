name: MOIS third nested 93m observation RGB p0008 after second full integration
on:
  pull_request:
    paths:
      - scripts/acquisition/mois_full_index_observation_queue.py
      - scripts/acquisition/mois_full_index_real_original_photo_measure.py
      - tests/test_mois_full_index_observation_queue.py
      - tests/test_mois_full_index_real_photo_measure.py
      - tests/test_mois_p0008_workflow_contract.py
      - tests/test_mois_queue_from_full93m_target_tiers.py
      - scripts/acquisition/mois_queue_from_full93m_target_tiers.py
      - .github/workflows/mois-full93m-third-nested-p0008-RGB.yml
  workflow_run:
    workflows:
      - "MOIS source-photo append genuine second p0004 18119 to 612483 original ROI results"
      - "MOIS recover completed first 93m original RGB release"
    types: [completed]
  workflow_dispatch:
    inputs:
      resume_run:
        description: "Optional previous p0008 run to reuse already completed original image pixel units"
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-third-nested-p0008-original93m-observation-acquisition
  cancel-in-progress: false
jobs:
  test-source-and-real-ROI:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
          python -m unittest discover -s tests -p 'test_mois_full_index_observation_queue.py' -v
          python -m unittest discover -s tests -p 'test_mois_full_index_real_photo_measure.py' -v
          python -m unittest discover -s tests -p 'test_mois_p0008_workflow_contract.py' -v
          python -m unittest discover -s tests -p 'test_mois_queue_from_full93m_target_tiers.py' -v
  freeze-source-queue:
    needs: test-source-and-real-ROI
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'zuizui0223/mois' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      groups: ${{ steps.queue.outputs.groups }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start only after signed 630602 pixel FCP+first+second source
        id: gate
        run: |
          set -euo pipefail
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          for tag in mois-complete-93209351-original-photo-target-tiers-v1 mois-genuine630602-original-pixels-first-two-93m-waves-v1; do
            if ! gh release view "$tag" --repo zuizui0223/mois --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
              echo "Waiting for exact authenticated Release: $tag"
              exit 0
            fi
          done
          if gh release view mois-full93m-observation-third-original-RGB-p0008-v1 --repo zuizui0223/mois >/dev/null 2>&1; then
            echo 'Third nested p0008 source photo RGB already sealed; never re-infer same pixels.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Install original photo/Parquet reader
        if: steps.gate.outputs.ready == 'true'
        run: python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
      - name: Download only new p0008 tier-02 original-photo ID targets, not 93m rows
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p tier-download tier-index counts old/final
          gh release download mois-complete-93209351-original-photo-target-tiers-v1 \
            --repo zuizui0223/mois --dir tier-download \
            --pattern 'tier-02-group-*.tar' \
            --pattern 'group-??-receipt.json' \
            --pattern mois_all_original_photo_target_tiers_receipt.json
          test "$(find tier-download -maxdepth 1 -name 'tier-02-group-*.tar' | wc -l)" -eq 16
          test "$(find tier-download -maxdepth 1 -name 'group-??-receipt.json' | wc -l)" -eq 16
          for file in tier-download/tier-02-group-*.tar; do
            tar -xf "$file" -C tier-index
          done
          test "$(find tier-index/tier-02 -name 'part-*.csv.gz' | wc -l)" -eq 128
          gh run download 38749681793 --repo zuizui0223/fcp \
            --name fcp-42111-real-source-photo-opportunity-counts-20260927-complete-not-colours \
            --dir counts
          countfile=$(find counts -name all_42111_species_photo_opportunity_counts.csv -print -quit)
          echo 'ef26c16252dd785f2d08bde3b18938c7624d73a54386fa3d3974dceb09ed97a9  '"$countfile" | sha256sum -c -
          gh release download mois-genuine630602-original-pixels-first-two-93m-waves-v1 \
            --repo zuizui0223/mois --dir old/final \
            --pattern mois_FCP_and_first_second_93m_actual_original_photo_ROIs.parquet \
            --pattern mois_p0004_actual_photo_append_receipt.json
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('old/final')
          doc=json.loads((root/'mois_p0004_actual_photo_append_receipt.json').read_text())
          file=root/'mois_FCP_and_first_second_93m_actual_original_photo_ROIs.parquet'
          h=hashlib.sha256()
          with file.open('rb') as inp:
              for buf in iter(lambda:inp.read(1<<20),b''):h.update(buf)
          assert doc['schema']=='mois_FCP_and_full93m_second_p0004_real_original_photo_append_v1'
          assert doc['all_unique_original_photo_attempts']==630602
          assert doc['second_nested_actual_image_attempts']==18119
          assert doc['old_four_hue_classified']==295801
          assert doc['old_original_image_petal_ROI_rows_immutable']
          assert doc['new_source_photo_IDs_disjoint_from_all_old_FCP_and_MOIS']
          assert doc['native_climate_pollination_models_not_run']
          assert h.hexdigest()==doc['output_sha256'][file.name]
          print('MOIS_P0008_630602_PREVIOUS_GENUINE_RGB_IDS_SHA_VERIFIED')
          PY
      - name: Build p0008 only-new tier-02 real RGB ROI work queue with no taxon cap
        id: queue
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import glob
          import subprocess
          import sys
          from pathlib import Path
          import pandas as pd
          existing=Path('old/final/mois_FCP_and_first_second_93m_actual_original_photo_ROIs.parquet')
          old=pd.read_parquet(existing,columns=['photo_id'])
          assert len(old)==630602 and old.photo_id.astype(str).is_unique
          Path('prior.csv').write_text('photo_id\n'+'\n'.join(old.photo_id.astype(str))+'\n')
          receipts=sorted(glob.glob('tier-download/group-??-receipt.json'))
          assert len(receipts)==16,receipts
          counts=next(Path('counts').rglob('all_42111_species_photo_opportunity_counts.csv'))
          cmd=[sys.executable,'-m','scripts.acquisition.mois_queue_from_full93m_target_tiers',
              '--registry','tier-download/mois_all_original_photo_target_tiers_receipt.json',
              '--targets','tier-index','--counts',str(counts),
              '--previous','prior.csv','--output','current',
              '--tier','2','--compute-bucket','0','--compute-bucket-count','1']
          for receipt in receipts:cmd+=['--group-receipt',receipt]
          subprocess.run(cmd,check=True)
          d=json.load(open('current/manifest.json'))
          assert d['schema']=='mois_full_source_observation_sampling_cohort_v1'
          assert d['full_frame_photo_ids']==93209351
          assert d['full_source_original_tier']==2
          assert d['source_tier_total_photo_candidates']==36583
          assert d['source_tier_compute_bucket_total_photos']==36583
          assert d['sampled_photo_ids_before_prior_dedup']==36583
          assert d['selection_probability']==0.0008
          assert d['new_photo_attempts_planned']>0
          assert d['compute_bucket_is_exhaustive_processing_partition_not_statistical_inclusion_cap']
          assert d['new_photo_attempts_planned']+d['previously_measured_photo_ids_skipped']+d['selected_new_photos_unsupported_by_frozen_loader']==36583
          assert d['all_unselected_source_photos_eligible_at_higher_probability']
          print('MOIS_P0008_ONLY_NEW_DISJOINT_TIER2_PHOTOS_READY_NO_93M_RESCAN',d['new_photo_attempts_planned'])
          with open(__import__('os').environ['GITHUB_OUTPUT'],'a') as out:
              out.write('groups='+json.dumps(d['group_ids'])+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: mois-93m-p0008-precolour-observation
          path: current/
          retention-days: 90
          if-no-files-found: error
  measure-original-RGB:
    needs: freeze-source-queue
    if: needs.freeze-source-queue.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.freeze-source-queue.outputs.groups) }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-93m-p0008-precolour-observation
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse previous completed sealed units when explicitly resuming
        run: |
          mkdir -p measured
          if [ -n "${{ inputs.resume_run || '' }}" ]; then
            gh run download "${{ inputs.resume_run || '' }}" --repo zuizui0223/mois \
              --name "mois-93m-p0008-RGB-group-${{ matrix.group }}" --dir measured
          fi
      - name: Bootstrap the SAME frozen original YOLO11/EfficientSAM model only once per 4 photo units
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy==1.15.2 Pillow==11.1.0 ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Four source-signed original ROI batches with bounded paced photo prefetch, no repeated photos
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-93m-photo-rate"
          python -m scripts.acquisition.mois_full_index_real_original_photo_measure work \
            --source source --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" \
            --group "${{ matrix.group }}" --output measured
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-93m-p0008-RGB-group-${{ matrix.group }}
          path: measured/
          if-no-files-found: warn
          retention-days: 90
  persist-authenticated-RGB:
    needs: [freeze-source-queue,measure-original-RGB]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pandas==2.2.3 numpy==2.1.3 pyarrow==19.0.1
      - uses: actions/download-artifact@v4
        with:
          name: mois-93m-p0008-precolour-observation
          path: source
      - uses: actions/download-artifact@v4
        with:
          pattern: mois-93m-p0008-RGB-group-*
          path: actual_pixels
          merge-multiple: false
      - name: Reconcile EVERY photo-ID, all original model receipts and unknown hue outcomes
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_full_index_real_original_photo_measure collect \
            --source source --workers actual_pixels --output genuine_photos
          cp source/manifest.json genuine_photos/source.json
      - uses: actions/upload-artifact@v4
        with:
          name: mois-93m-p0008-observation-genuine-original-RGB
          path: genuine_photos/
          retention-days: 90
          if-no-files-found: error
      - name: Archive only genuine photo/pixel outputs to immutable GitHub Release
        run: |
          set -euo pipefail
          tag=mois-full93m-observation-third-original-RGB-p0008-v1
          if gh release view "$tag" --repo zuizui0223/mois >/dev/null 2>&1; then
            gh release download "$tag" --repo zuizui0223/mois --dir previous --pattern receipt.json
            cmp previous/receipt.json genuine_photos/receipt.json
          else
            gh release create "$tag" genuine_photos/*.json genuine_photos/*.parquet \
              --repo zuizui0223/mois --target "$GITHUB_SHA" \
              --title 'MOIS genuinely measured original RGB photos from full 93m source' \
              --notes '93,209,351 original source photo candidates retained in full. Third nested fixed 0.0008 observation-probability pre-colour cohort with every eligible selected-observation photo, source-matched photo IDs and FCP frozen ROI-v4. Previously unselected photo observations remain eligible for higher nested probability waves. Acquired unknowns and provider failures separate. Not a worldwide wild-flora census, nor 93m flower colours, pigment cost, or ecological analysis.'
          fi
