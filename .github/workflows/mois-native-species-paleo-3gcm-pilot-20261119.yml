name: "MOIS Paleo: WCVP-native species three-GCM LGM climate analogue pilot"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - scripts/analysis/mois_native_species_LGM_3gcm_climatic_analogue_pilot_20261119.py
      - .github/workflows/mois-native-species-paleo-3gcm-pilot-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-native-species-3gcm-analogues-20261119
  cancel-in-progress: true
jobs:
  true-source-paleo-climate-analogues:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install signed Parquet, native geographic provenance and species climate validation
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "pyarrow>=17,<25" \
            "scipy>=1.11,<2" "scikit-learn>=1.5,<1.9" \
            "geopandas>=1.0,<1.2" "shapely>=2,<3" "pyproj>=3.6,<4"
          python -m py_compile scripts/analysis/mois_native_species_LGM_3gcm_climatic_analogue_pilot_20261119.py
      - name: Retrieve four immutable original GBIF-colour-climate-LGM archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p sources/WCVP
          for spec in \
            '14166701658 GBIF 422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2' \
            '14219399376 ENV d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc' \
            '14225733755 LGM db3b5b4fa2133194963be9233411bb6bb50bc86393d1dc50d996cc4cc78b25ab' \
            '14397855889 ECO 4f5d8fc3a308482fc3645d796a779d1a4725c51ed2afbf6a06e61fd6213f3ee6'; do
            set -- $spec
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" \
              -o "sources/$2.zip"
            echo "$3  sources/$2.zip" | sha256sum -c
          done
      - name: Rehydrate WCVP accepted native range and verify pinned TDWG3 polygons
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="mois-real350399-kew-wcvp-native-tdwg3-source-v1"
          for fn in \
            'mois350399_wcvp_source_taxon_exact_name_resolution.csv.gz' \
            'mois350399_wcvp_accepted_native_distribution_TDWG3.csv.gz' \
            'mois350399_wcvp_TDWG3_source_only_taxon_native_receipt.json'; do
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$fn" \
              -o "sources/WCVP/$fn"
          done
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/tdwg/wgsrpd/52da7828aba9d461dd133c27b3bd7a4407161f54/geojson/level3.geojson" \
            -o sources/TDWG3.geojson
          echo "c172bcf6aba20e19477adc60aebf0023068f0175dca8480f0760b090dcf64840  sources/TDWG3.geojson" | sha256sum -c
      - name: Validate source WCVP native species and project three LGM models within native regions
        run: |
          python -m scripts.analysis.mois_native_species_LGM_3gcm_climatic_analogue_pilot_20261119 \
            --GBIF sources/GBIF.zip --ENV sources/ENV.zip \
            --LGM sources/LGM.zip --ECO sources/ECO.zip \
            --WCVP sources/WCVP --TDWG sources/TDWG3.geojson \
            --max-per-hue 0 \
            --out results/mois_WCVP_native_species_LGM_threeGCM_20261119
      - name: Archive source-verified candidate climatically analogous cells, holdout diagnostics and receipts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-WCVP-native-species-LGM-threeGCM-climate-analogues-20261119
          path: results/mois_WCVP_native_species_LGM_threeGCM_20261119/
          retention-days: 30
          if-no-files-found: error
