name: "MOIS ecology: Seebens alien first-record source schema"
on:
  push:
    branches: [analysis/mois-global-floral-colour-assembly-null-20261118]
    paths: [.github/workflows/mois-alien-firstrecord-source-probe-20261122.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  first-record-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source workbook read-only inspection requirements
        run: python -m pip install --disable-pip-version-check "openpyxl==3.1.5" "pandas==2.2.3" "numpy==2.1.3"
      - name: Download canonical Seebens v3.1 source; verify public checksum
        run: |
          set -euo pipefail
          mkdir -p data/firstrecord
          python - <<'PY'
          import json, urllib.request, hashlib, pathlib, time
          root=pathlib.Path("data/firstrecord")
          api="https://zenodo.org/api/records/10039630"
          with urllib.request.urlopen(urllib.request.Request(api,headers={"User-Agent":"MOIS-ecology-source-audit/1.0"}),timeout=55) as r:
              meta=json.load(r)
          files=meta.get("files", [])
          target="GlobalAlienSpeciesFirstRecordDatabase_v3.1_freedata.xlsx"
          matches=[f for f in files if f.get("key")==target]
          assert len(matches)==1, "official version 3.1 workbook not uniquely found"
          f=matches[0]
          url=f.get("links",{}).get("content") or f"https://zenodo.org/records/10039630/files/{target}?download=1"
          path=root/target
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"MOIS-ecology-source-audit/1.0"}),timeout=90) as r, path.open("wb") as out:
              while (b:=r.read(2**20)): out.write(b)
          md5=hashlib.md5(path.read_bytes()).hexdigest()
          assert md5=="a112cb0dabee93db49b2de6ecf3c0829", f"Source MD5 mismatch: {md5}"
          manifest={"source":"Seebens et al. Global Alien Species First Record Database","version":"3.1","record_url":"https://zenodo.org/records/10039630","record_doi":"10.5281/zenodo.10039630","filename":target,"md5":md5,"sha256":hashlib.sha256(path.read_bytes()).hexdigest(),"bytes":path.stat().st_size,"source_file_checksum":f.get("checksum"),"license_note":"research; first records are not introduction dates"}
          (root/"source_manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print("MOIS_SEEBENS_SOURCE_CHECKED",json.dumps(manifest),flush=True)
          PY
      - name: Inspect original spreadsheet without altering source
        run: |
          python - <<'PY'
          import json, pathlib, openpyxl
          root=pathlib.Path("data/firstrecord")
          fn=root/"GlobalAlienSpeciesFirstRecordDatabase_v3.1_freedata.xlsx"
          wb=openpyxl.load_workbook(fn,read_only=True,data_only=True)
          sheets=[]
          for sh in wb:
              sample=[]
              for row in sh.iter_rows(min_row=1,max_row=8,values_only=True):
                  sample.append([str(x)[:140] if x is not None else None for x in row[:30]])
              sheets.append({"sheet":sh.title,"rows":sh.max_row,"columns":sh.max_column,"first8rows_first30cols":sample})
          result={"source_manifest":json.loads((root/"source_manifest.json").read_text()),"sheets":sheets,"warning":"FirstRecord includes dates from ranges; original date field must be checked; first observation is not first introduction."}
          (root/"schema_probe.json").write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print("MOIS_SEEBENS_SOURCE_SCHEMA",json.dumps({"sheets":sheets},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-seebens-v31-source-schema-20261122
          path: |
            data/firstrecord/source_manifest.json
            data/firstrecord/schema_probe.json
          retention-days: 60
          if-no-files-found: error
