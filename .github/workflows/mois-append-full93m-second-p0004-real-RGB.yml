name: MOIS source-photo append genuine second p0004 18119 to 612483 original ROI results
on:
  pull_request:
    paths:
      - scripts/acquisition/mois_append_first_second93m_probability_original_photos.py
      - tests/test_mois_append_first_second93m_probability_original_photos.py
      - .github/workflows/mois-append-full93m-second-p0004-real-RGB.yml
  workflow_run:
    workflows:
      - "MOIS second nested 93m observation RGB p0004 after first source"
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mois-source-original-pixels-from-612483-plus-second18119-v1
  cancel-in-progress: false
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original-image photo ID isolation and signed four-hue classifiability
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 pytest==8.4.2
          python -m pytest -q tests/test_mois_append_first_second93m_probability_original_photos.py
          python -m py_compile scripts/acquisition/mois_append_first_second93m_probability_original_photos.py
  append-real-second-RGB:
    needs: source-contracts
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'zuizui0223/mois' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1
      - name: Download ONLY source-signed completed photo-measurement releases (no source photo HTTP)
        run: |
          set -euo pipefail
          gh release view mois-full93m-observation-second-original-RGB-p0004-v1 \
            --repo zuizui0223/mois --json isDraft --jq '.isDraft' | grep -qx false
          gh release download mois-actual-FCP594081-plus-full93m-first18462-photo-ID-union-v1 \
            --repo zuizui0223/mois --dir prior \
            --pattern mois_original_p0002_plus_FCP594081_unique_actual_photo_ROIs.parquet \
            --pattern mois_p0002_plus_FCP594081_actual_pixel_unioned_source_receipt.json
          gh release download mois-full93m-observation-second-original-RGB-p0004-v1 \
            --repo zuizui0223/mois --dir second \
            --pattern measured_photos.parquet \
            --pattern receipt.json \
            --pattern source.json
      - name: SHA-verify and append second genuine 18119 original-photo IDs to prior immutable 612483 ROIs
        run: |
          set -euo pipefail
          python -m scripts.acquisition.mois_append_first_second93m_probability_original_photos \
            --base prior/mois_original_p0002_plus_FCP594081_unique_actual_photo_ROIs.parquet \
            --base-receipt prior/mois_p0002_plus_FCP594081_actual_pixel_unioned_source_receipt.json \
            --second second/measured_photos.parquet \
            --second-receipt second/receipt.json \
            --second-manifest second/source.json \
            --output expanded
          python - <<'PY'
          import json
          p='expanded/mois_p0004_actual_photo_append_receipt.json'
          r=json.load(open(p))
          assert r['old_original_photo_attempts']==612483
          assert r['second_nested_actual_image_attempts']==18119
          assert r['all_unique_original_photo_attempts']==630602
          assert r['old_four_hue_classified']==295801
          assert r['previous_genuine_four_hue_classified_ROIs'] if 'previous_genuine_four_hue_classified_ROIs' in r else True
          assert r['old_original_image_petal_ROI_rows_immutable']
          assert r['new_source_photo_IDs_disjoint_from_all_old_FCP_and_MOIS']
          assert r['native_climate_pollination_models_not_run']
          print('MOIS_630602_REAL_UNIQUE_SOURCE_PHOTOS_P0004_APPEND_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-FCP-and-first-and-second-p0004-authentic-original-ROI-photos
          path: expanded/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve immutable source photo-ID original RGB p0004 union
        run: |
          set -euo pipefail
          tag=mois-genuine630602-original-pixels-first-two-93m-waves-v1
          if gh release view "$tag" --repo zuizui0223/mois >/dev/null 2>&1; then
            gh release download "$tag" --repo zuizui0223/mois \
              --pattern mois_p0004_actual_photo_append_receipt.json --dir existing
            cmp existing/mois_p0004_actual_photo_append_receipt.json \
                expanded/mois_p0004_actual_photo_append_receipt.json
            echo 'Existing original ROI source archive matches exactly.'
          else
            gh release create "$tag" expanded/* --repo zuizui0223/mois \
              --target "$GITHUB_SHA" \
              --title 'MOIS real 630602 unique original image photos including nested p0004' \
              --notes 'Only genuine original photo ROIs: prior source-SHA 612483 unique original pixels, plus new source-SHA verified 18119 different photo IDs from p=.0004 nested observation draw of all 93209351 metadata candidates. Old FCP, MOIS and first p=.0002 photographic hues untouched. All original technical acquisition errors/unknown ROI hues retained; no raw photo image bytes redistributed. This is not a 93m image colour census or floral-petal botanical verification; no WCVP/native/island/climate/pollinator model or evolutionary interpretation.'
          fi
