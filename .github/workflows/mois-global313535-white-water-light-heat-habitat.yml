name: MOIS source-original 313535 white colour versus water solar heat terrain and soil
on:
  pull_request:
    paths:
      - scripts/analysis/mois_global313535_water_light_heat_habitat_partition.py
      - tests/test_mois_global313535_water_light_heat_habitat_partition.py
      - docs/MOIS_313535_WHITE_COLOUR_WATER_LIGHT_HABITAT_MAIN_TEST_20261018.md
      - .github/workflows/mois-global313535-white-water-light-heat-habitat.yml
  push:
    branches: [main]
    paths:
      - scripts/analysis/mois_global313535_water_light_heat_habitat_partition.py
      - tests/test_mois_global313535_water_light_heat_habitat_partition.py
      - docs/MOIS_313535_WHITE_COLOUR_WATER_LIGHT_HABITAT_MAIN_TEST_20261018.md
      - .github/workflows/mois-global313535-white-water-light-heat-habitat.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-313535-original-photo-white-water-light-heat-abiotic
  cancel-in-progress: false
jobs:
  signed-photo-hue-and-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic controls for actual hue denominators, equal genus, source-matched soil/terrain
        run: |
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 scipy==1.15.2 statsmodels==0.14.4 pyarrow==19.0.1 pytest==8.4.2
          python -m pytest -q tests/test_mois_global313535_water_light_heat_habitat_partition.py
      - name: Restore exact prior actual original 313535 photo site and 4-hue feature SHA source
        run: |
          set -euo pipefail
          mkdir -p source313535
          gh release download mois-primary-313535-fullfourth4096-featurelake-v2 \
            --repo zuizui0223/mois --dir source313535 \
            --pattern 'primary313535_*parquet' \
            --pattern 'primary313535_fullfourth4096_featurelake_manifest.json'
          test -s source313535/primary313535_fullfourth4096_original_photo_hues.parquet
          test -s source313535/primary313535_fullfourth4096_annual_worldclim.parquet
          test -s source313535/primary313535_original_partial_soil_terrain.parquet
          test -s source313535/primary313535_fullfourth4096_featurelake_manifest.json
      - name: Compute global white/coloured environmental rain x solar, rain x heat and matched genus abiotic blocks
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_global313535_water_light_heat_habitat_partition \
            --photo-feature-release source313535 --output real_white_environment
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path('real_white_environment')
          a=json.loads((p/'mois_313535_white_abiotic_environment_partition_decision.json').read_text())
          assert a['actual_RGB_original_photo_attempts']==313535
          assert a['classifiable_original_four_hue_photo_ROIs']==151239
          assert a['original_white_ROI_photos']==71427
          assert a['water_light_and_water_heat_3x3_source_cells']==18
          assert a['season_enriched_photo_cohort_EXCLUDED_from_main_sample']
          assert a['1970_2000_annual_climate_normals_not_observed_year_month_weather']
          assert a['four_hue_not_equal_to_anthocyanin_chemistry']
          for section in ('all_annual_climate_source','landscape_terrain','partially_covered_soil'):
            assert a['genus_cluster_observational_abiotic_model_receipts'][section]['qualifying_genera']>=50
          data=pd.read_csv(p/'mois_313535_white_fractions_water_light_heat_tertiles.csv')
          assert len(data)==18 and data.classified_original_photo_ROIs.min()>0
          print('MOIS_REAL313535_ORIGINAL_WHITE_RAIN_SOLAR_HEAT_SOIL_TERRAIN_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-source313535-white-rain-solar-heat-abiotic-spatial-results
          path: real_white_environment/
          retention-days: 90
          if-no-files-found: error

  publish-ecological-abiotic-results:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: signed-photo-hue-and-environment
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mois-source313535-white-rain-solar-heat-abiotic-spatial-results
          path: ecological_result
      - name: Immutable source-provenance release, no original licensed images
        run: |
          set -euo pipefail
          tag=mois-real313535-white-water-light-habitat-observational-v1
          if gh release view "$tag" --repo zuizui0223/mois >/dev/null 2>&1; then
            echo "Prior scientific release retained and never overwritten"
          else
            gh release create "$tag" ecological_result/*.csv ecological_result/*.json \
              --repo zuizui0223/mois --target "$GITHUB_SHA" \
              --title 'MOIS original 313535 photo white/chromatic moisture light and habitat ecology' \
              --notes 'Immutable 313535 source photo IDs, 151239 successful ROI labels. Exploratory annual 1970-2000 climate water×solar/heat composition, genus-conditional models, matched historical soil/terrain coverage and photographic classifiability. No proven 50:50 adaptive balance, UV pigment cost, photo-specific flowering or fitness.'
          fi
