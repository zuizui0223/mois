name: MOIS original 400 live observation phenology frozen evidence and scientific-boundary QC

on:
  push:
    branches:
      - analysis/mois-400-current-inat-plant-phenology-20261017
    paths:
      - ".github/workflows/mois-400-observation-phenology-frozen-result-qc.yml"
      - "tests/test_mois_audit_400_live_observation_phenology.py"
      - "tests/test_mois_real_400_observation_phenology_result_receipt.py"
      - "results/mois_400_live_observation_phenology_20261017/**"
      - "scripts/analysis/mois_audit_400_live_observation_phenology.py"
  pull_request:
    paths:
      - ".github/workflows/mois-400-observation-phenology-frozen-result-qc.yml"
      - "tests/test_mois_audit_400_live_observation_phenology.py"
      - "tests/test_mois_real_400_observation_phenology_result_receipt.py"
      - "results/mois_400_live_observation_phenology_20261017/**"
      - "scripts/analysis/mois_audit_400_live_observation_phenology.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  attest-original-400-live-tags-from-archived-run-without-requerying-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLIC_SOURCE_RUN: "38989216871"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify 400 source/phenology API contracts and taxon-conditioned annotation missingness
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest==8.4.2 requests
          python -m pytest -q \
            tests/test_mois_live_inat_phenology_2025.py \
            tests/test_mois_audit_400_live_observation_phenology.py \
            tests/test_mois_real_400_observation_phenology_result_receipt.py

      - name: Verify the actual archived 400 original-source public iNaturalist read, no live API refetch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen_API_evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLIC_SOURCE_RUN" > frozen_API_evidence/origin_run.json
          python - <<'PY'
          import json
          r=json.load(open("frozen_API_evidence/origin_run.json"))
          assert r["id"]==38989216871
          assert r["status"]=="completed" and r["conclusion"]=="success"
          assert r["run_attempt"]==1
          assert r["head_sha"]=="5746e241c8b01babd95ea26fe3c8b20e995ebaeb"
          assert r["head_repository"]["full_name"]=="zuizui0223/mois"
          print("MOIS_REAL_ORIGINAL_400_PUBLIC_PLANT_ANNOTATION_ORIGIN_VERIFIED")
          PY
          gh run download "$PUBLIC_SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name mois-400-original-source-live-observation-phenology-coverage-NOT-PHOTO-BLOOM \
            --dir frozen_API_evidence

      - name: Compare public aggregate 10 source seasons byte-for-byte to the archived genuine live API result
        shell: bash
        run: |
          set -euo pipefail
          cmp \
            frozen_API_evidence/current_public_400_plant_phenology_qc/current_live_iNaturalist_400_taxon_siteyear_season_phenology_availability.csv \
            results/mois_400_live_observation_phenology_20261017/source_siteyear_season_annotation_coverage.csv
          python - <<'PY'
          import json,hashlib,csv
          from pathlib import Path
          root=Path("frozen_API_evidence/current_public_400_plant_phenology_qc")
          d=json.loads((root/"mois_400_original_phenology_live_observation_ancillary_receipt.json").read_text())
          repo=json.loads(Path("results/mois_400_live_observation_phenology_20261017/verified_source_400_annotation_coverage_receipt.json").read_text())
          assert d["status"]=="CURRENT_PUBLIC_OBSERVATION_PHENOLOGY_EFFORT_ONLY_NOT_BOTANICAL_OPEN_FLOWERS"
          assert repo["status"]=="VERIFIED_400_CURRENT_OBSERVATION_ANNOTATION_AVAILABILITY_NOT_FLOWER_PHOTO_STAGE"
          assert repo["live_source_original_full_receipt_sha256"]==hashlib.sha256((root/"mois_400_original_phenology_live_observation_ancillary_receipt.json").read_bytes()).hexdigest()
          assert repo["group_csv_sha256"]==d["taxon_season_phenology_availability_sha256"]
          assert repo["full_400_live_annotation_data_sha256"]==d["source_400_original_photo_current_observation_annotations_sha256"]
          assert d["n_live_current_v2_uuid_ids_resolved"]==400
          assert d["n_live_current_v1_full_annotation_records"]==400
          assert d["n_live_original_observed_on_and_photo_id_both_match"]==400
          assert repo["n_source_observations_without_interpretable_plant_phenology_annotation"]==280
          assert repo["n_source_observations_with_any_current_plant_phenology_annotation"]==120
          assert repo["n_botanically_reviewed_open_photo_petals"]==0
          assert repo["no_global_or_within_taxon_white_flowers_or_monthly_weather_effect_estimated"] is True
          print("MOIS_400_REAL_LIVE_ANNOTATION_PUBLIC_SOURCE_QC_280_UNKNOWN_OF_400_120_TAGGED_NOT_OPEN_FLOWER")
          PY

      - name: Preserve source archive verification only; no new current API requests
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: mois-400-live-observation-phenology-frozen-source-integrity-only
          if-no-files-found: error
          retention-days: 90
          path: frozen_API_evidence/origin_run.json
