name: MOIS actual global 37104 species 19 BIO monthly weather MODIS NDVI features
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-global-37104-BIO19-weather-MODIS-NDVI-features.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-BIO19-weatherNDVI-37104-global-feature-source-v1
  cancel-in-progress: false
jobs:
  source-verified-full-climate-and-remote-sensing:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned spatial and Parquet readers; reject missing NDVI / climate pixels
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 \
            pyarrow==19.0.1 pyproj==3.7.1 rasterio==1.4.3
          python -m unittest discover -s tests -p test_mois_global_bioclim_ndvi_rf_features_20261116.py -v
      - name: Restore signed global 37104 species GBIF grid and actual MODIS NDVI source
        run: |
          set -euo pipefail
          mkdir -p source
          for spec in \
           '14166701658 global 422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2' \
           '14192037667 photo 63a260c0a9c68d5c7198c6f4a821bd391eae25954a31cf060e6b1fbac544e313' \
           '14217387246 ndvi eb6e44a22696f3098a0bdf9e5c28e346556b9b98435853812cd594190bc8f3d6'; do
            set -- $spec
            curl --fail --location --silent --show-error --retry 2 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/$1/zip" \
              --output "source/$2.zip"
            echo "$3  source/$2.zip" | sha256sum -c -
          done
      - name: Fetch all 19 WorldClim BIO and monthly weather climatology archives (real official public raster)
        run: |
          set -euo pipefail
          for variable in bio prec tavg srad vapr wind; do
            url="https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_${variable}.zip"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 --max-time 480 "$url" \
              --output "source/$variable.zip"
            echo "WORLDCLIM_SOURCE_REAL_DOWNLOAD $variable $(stat -c%s "source/$variable.zip")"
          done
          echo '00513224583665ec0f2f955a4ec252730c4deb2004cce9e793492a3f26df4dcf  source/bio.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile,hashlib
          from pathlib import Path
          for typ in ("bio","prec","tavg","srad","vapr","wind"):
              p=Path("source")/(typ+".zip")
              z=zipfile.ZipFile(p)
              n=sum(x.lower().endswith(".tif") for x in z.namelist())
              assert n==(19 if typ=="bio" else 12),(typ,n,z.namelist()[:6])
              print("MOIS_WC21_MONTHLY_OR_BIO_SOURCE_VERIFIED",typ,n,p.stat().st_size,
                    hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          PY
      - name: Map 19 bioclimatic plus monthly radiation wind humidity rainfall and real NDVI to all 18577 GBIF 100km cells
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_global_bioclim_ndvi_rf_features_20261116 \
            --gbif source/global.zip --photo source/photo.zip --ndvi source/ndvi.zip \
            --bio source/bio.zip --prec source/prec.zip --tavg source/tavg.zip \
            --srad source/srad.zip --vapr source/vapr.zip --wind source/wind.zip \
            --output features
          python - <<'PY'
          import json,pandas as pd
          d=json.load(open('features/receipt.json'))
          assert d['global_accepted_species']==37104 and d['unique_100km_cells']==18577
          assert d['global_S3_provenance_verified'] and d['WorldClim_all_19_BIO']
          assert d['species_with_both_NDVI_and_BIO19']>20000
          assert d['NDVI_is_biomass'] is False
          x=pd.read_parquet('features/WorldClim19_weather_NDVI_37104_COLXR_photo9_species.parquet')
          assert len(x)==37104 and x.key.is_unique
          assert all('BIO%02d'%i in x for i in range(1,20))
          assert all("MODIS_NDVI_2001_2021_"+s in x for s in ('mean','sd'))
          print('MOIS_ALL37104_BIO19_MONTHLY_WEATHER_REAL_MODIS_NDVI_FEATURES_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-global-37104-full-BIO19-monthly-weather-MODIS-NDVI-real-features-v1
          path: features/
          retention-days: 90
          if-no-files-found: warn
