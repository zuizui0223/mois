name: MOIS 400 selected original photos - two blinded open-flower reviewer handoffs

on:
  pull_request:
    paths:
      - "scripts/analysis/mois_prepare_400_botanical_review_handoff.py"
      - "tests/test_mois_prepare_400_botanical_review_handoff.py"
      - ".github/workflows/mois-400-independent-botanist-review-handoff.yml"
      - "docs/MOIS_400_BOTANICAL_REVIEW_HANDOFF_20261017.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  botanical-review-source-only-no-new-colour:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test independent botanical opening/tissue reviewer forms
        run: |
          python -m pip install -q pytest==8.4.2
          python -m pytest -q tests/test_mois_prepare_400_botanical_review_handoff.py
      - name: Verify exact 400 original photo-ID source and recover availability-only photo manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original_selected
          gh api repos/zuizui0223/mois/actions/runs/38929402279 > original_selected/source_run.json
          python - <<'PY'
          import json
          p=json.load(open("original_selected/source_run.json"))
          assert p["id"]==38929402279
          assert p["status"]=="completed" and p["conclusion"]=="success"
          assert p["head_sha"]=="adfd0a6edfc3438080ade2a3d9e76587d7322898"
          assert p["head_repository"]["full_name"]=="zuizui0223/mois"
          print("MOIS_ORIGINAL_400_PRECOLOUR_SELECTION_VERIFIED")
          PY
          gh run download 38929402279 --repo zuizui0223/mois \
            --name mois-5taxa-400-original-photo-ID-disjoint-season-wave-UNREVIEWED \
            --dir original_selected
      - name: Make separate colour/month/climate-blinded photo-specific open-flower/tissue review sheets
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_prepare_400_botanical_review_handoff \
            --source-original-400 original_selected/new_mois_photo_wave/first_five_taxa_temporal_colour_blind_original_photo_manifest.csv \
            --outdir blinded_forms
      - name: Confirm no review has been performed and no source season or photo colours are shown
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          o=Path("blinded_forms")
          p=json.loads((o/"MOIS_400_INDEPENDENT_REVIEW_HANDoFF_RECEIPT.json").read_text())
          assert p["status"]=="400_ORIGINAL_PHOTO_REVIEW_FORMS_BOTH_UNFILLED_NOT_COLOUR"
          assert p["n_original_photos"]==p["distinct_observers"]==400
          assert p["reviewer_form_A_SHA256"]=="576a55e7e613faf8c93652b4ac2d72b79f8a38bec4bfe8267c8d67bbc3fed322"
          assert p["reviewer_form_B_SHA256"]=="bfbbfc92106585ca260fbd5a33573ad2598209d19907a52bbce2b941b1164203"
          assert p["coordinator_only_photo_to_token_mapping_SHA256"]=="6119a9606b4d90eb80a8a90e7fd2576631d14063de320e788e7c274fd050a3c4"
          assert p["n_actual_independent_botanical_reviews_completed"]==0
          assert p["new_photo_pixels_measured"]==0
          for who in ("A","B"):
              with (o/f"mois_400_botanical_open_flower_reviewer_{who}_UNFILLED.csv").open() as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==400
              assert all(not r["reviewer_id"] and not r["open_flower_stage"] and not r["roi_organ"] for r in rows)
              assert all("selected_season" not in r and "observed_on" not in r and "morph" not in r for r in rows)
          print("MOIS_400_BOTANICAL_BLIND_REVIEWER_HANDOFF_NO_BIOLOGICAL_OUTCOME_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-400-original-photos-INDEPENDENT-botanist-reviewer-A-unfilled
          path: blinded_forms/mois_400_botanical_open_flower_reviewer_A_UNFILLED.csv
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-400-original-photos-INDEPENDENT-botanist-reviewer-B-unfilled
          path: blinded_forms/mois_400_botanical_open_flower_reviewer_B_UNFILLED.csv
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-400-photo-botanical-review-UNREVIEWED-provenance-only
          path: blinded_forms/MOIS_400_INDEPENDENT_REVIEW_HANDoFF_RECEIPT.json
          retention-days: 90
