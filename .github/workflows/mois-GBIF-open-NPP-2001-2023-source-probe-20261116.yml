name: MOIS authenticated-free global annual NPP 2001-2023 source integrity and schema probe
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-GBIF-open-NPP-2001-2023-source-probe-20261116.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mois-GBIF-real-MOD17-NPP-open-UHH-v1-probe-20261116
  cancel-in-progress: false

jobs:
  inspect-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned netCDF reader
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 netCDF4==1.7.2
      - name: Download source-published MODIS C061 global annual NPP/GPP 0.5degree 2001 to 2023
        run: |
          set -euo pipefail
          mkdir -p source NPP_probe
          curl --fail --location --silent --show-error --retry 5 --retry-delay 8 \
            --connect-timeout 30 --max-time 900 \
            'https://www.fdr.uni-hamburg.de/record/14635/files/MODIS-C061_MOD17A3HGF__NPP_GPP__Yearly__LPDAAC__GLOBAL_0.5degree__UHAM-ICDC__2001-2023__fv0.01.nc.zip?download=1' \
            --output source/NPP_MOD17_C061_2001_2023.zip
          echo 'd9109919b8ca9121c51e90a2ae8f12b6  source/NPP_MOD17_C061_2001_2023.zip' | md5sum --check -
          python - <<'PY'
          import hashlib,zipfile,json,os
          from pathlib import Path
          p=Path('source/NPP_MOD17_C061_2001_2023.zip')
          with zipfile.ZipFile(p) as z:
              info=[{'name':o.filename,'size':o.file_size,'crc':o.CRC}
                    for o in z.infolist() if not o.is_dir()]
              assert len(info)>0, 'official MODIS annual ZIP has no files'
          meta={'source_doi':'10.25592/uhhfdm.14635','source_version':'2024_fv0.01',
                'source_baseline_years':'2001-2023','source_md5':hashlib.md5(p.read_bytes()).hexdigest(),
                'source_zip_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                'source_zip_bytes':p.stat().st_size,'files':info}
          Path('NPP_probe/source_archive.json').write_text(json.dumps(meta,indent=2)+'\n')
          print('MOIS_MOD17_NPP_OPEN_SOURCE_AUTHENTIC',json.dumps(meta),flush=True)
          PY
      - name: Inspect true netCDF members, variables, units, dimensions, masks, quality
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import tempfile,json,netCDF4,numpy as np
          p=Path('source/NPP_MOD17_C061_2001_2023.zip')
          with ZipFile(p) as z:
              n=[s for s in z.namelist() if s.lower().endswith('.nc')]
              print('MOIS_NPP_NC_MEMBER_COUNT',len(n),'first',n[:5],'last',n[-5:],flush=True)
              assert len(n)>=20, 'not the annual netCDF collection'
              audit=[]
              with tempfile.TemporaryDirectory() as t:
                  for member in (n[0],n[len(n)//2],n[-1]):
                      path=Path(t)/Path(member).name
                      path.write_bytes(z.read(member))
                      with netCDF4.Dataset(path,'r') as ds:
                          keys=list(ds.variables.keys())
                          info={}
                          for name,obj in ds.variables.items():
                              attrs={a:str(obj.getncattr(a))[:300] for a in obj.ncattrs()}
                              info[name]={'shape':tuple(int(x) for x in obj.shape),
                                          'dtype':str(obj.dtype),'dimensions':obj.dimensions,
                                          'attrs':attrs}
                          audit.append({'member':member,
                             'dimensions':{k:len(v) for k,v in ds.dimensions.items()},
                             'variables':info,
                             'global_attributes':{a:str(ds.getncattr(a))[:400]
                                                  for a in ds.ncattrs()}})
                      path.unlink()
          Path('NPP_probe/netcdf_schema.json').write_text(json.dumps(audit,indent=2,default=str)+'\n')
          print('MOIS_NPP_REAL_NETCDF_SCHEMA',json.dumps(audit,default=str)[:29000],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-global-MOD17A3HGF-C061-2001-2023-open-NPP-source-probe
          path: NPP_probe/
          retention-days: 90
          if-no-files-found: warn
