name: "MOIS Ecology: genuine global island elev Arctic southern 9-colour gradients"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - "scripts/analysis/mois_hue9_geographic_island_elevation_arctic_south_20261118.py"
      - ".github/workflows/mois-hue9-island-elev-arctic-south-20261118.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-global-island-elevation-arctic-south-photo9-20261118
  cancel-in-progress: false
jobs:
  actual-global-landmass-elevation-9colour:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install historical GSHHG geometry reader WorldClim DEM and signed Parquet
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "pyarrow>=17,<25" \
            "geopandas>=1.0,<1.2" "shapely>=2.0,<3" \
            "pyproj>=3.6,<4" "rasterio>=1.4,<2"
          python -m py_compile scripts/analysis/mois_hue9_geographic_island_elevation_arctic_south_20261118.py
      - name: Download and SHA-validate original genuine 37k species GBIF cells and null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source
          for spec in \
            '14166701658 GBIF 422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2' \
            '14219399376 ENV d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc' \
            '14397106083 NINE 596166fa2fe8bfb28653c325a3a8f1a1495c0792688a7fdb781014cfedaa88c7'; do
            set -- $spec
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" \
              --output "source/$2.zip"
            echo "$3  source/$2.zip" | sha256sum -c
          done
      - name: Reuse same original GSHHG high resolution coastlines as earlier MOIS island study
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 420 \
            "https://github.com/GenericMappingTools/gshhg-gmt/releases/download/2.3.7/gshhg-shp-2.3.7.zip" \
            -o source/GSHHG_2p3p7.zip
          echo "8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41  source/GSHHG_2p3p7.zip" | sha256sum -c
      - name: Obtain actual publicly served WorldClim2.1 ten-minute elevation raster
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 420 \
            "https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_elev.zip" \
            -o source/wc2.1_10m_elev.zip
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          root=Path("source")
          z=root/"wc2.1_10m_elev.zip"
          with zipfile.ZipFile(z) as f:
              candidates=[name for name in f.namelist()
                          if name.lower().endswith(".tif")]
              assert len(candidates)==1,candidates
              extracted=root/"wc2.1_10m_elev.tif"
              extracted.write_bytes(f.read(candidates[0]))
          print("MOIS_WC21_REAL_ELEVATION_SOURCE",z.stat().st_size,
                hashlib.sha256(z.read_bytes()).hexdigest(),
                extracted.stat().st_size,
                hashlib.sha256(extracted.read_bytes()).hexdigest(),flush=True)
          PY
      - name: Build exact global GBIF original-hue null gradients for islands elevations polar circle hemispheres
        run: |
          python -m scripts.analysis.mois_hue9_geographic_island_elevation_arctic_south_20261118 \
            --GBIF source/GBIF.zip \
            --ENV source/ENV.zip \
            --NINE source/NINE.zip \
            --GSHHG source/GSHHG_2p3p7.zip \
            --ELEV_ZIP source/wc2.1_10m_elev.zip \
            --ELEV_TIF source/wc2.1_10m_elev.tif \
            --out results/mois_hue9_geography_island_elev_arctic_south
      - name: Upload authenticated geographic 100km cells and permutation tests, no imagery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-global-photo9-island-alpine-arctic-south-genus-breadth-20261118
          path: results/mois_hue9_geography_island_elev_arctic_south/
          retention-days: 30
          if-no-files-found: error
