name: "MOIS Ecology: photo hue x moisture x temperature within-genus"
on:
  push:
    branches:
      - analysis/mois-ecology-moisture-temperature-interactions-20261118
    paths:
      - "scripts/analysis/mois_ecology_moisture_temperature_20261118.py"
      - ".github/workflows/mois-ecology-thermal-moisture-nine-hues-20261118.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: mois-ecological-thermal-moisture-20261118
  cancel-in-progress: false
jobs:
  genus-controlled-ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "pyarrow>=17,<25" \
            "statsmodels>=0.14,<1" "scipy>=1.11,<2" "scikit-learn>=1.5,<1.9"
      - name: Synthetic fixed-effects and heldout arithmetic smoke test
        run: |
          python scripts/analysis/mois_ecology_moisture_temperature_20261118.py --selftest
      - name: Download and SHA-lock genuine accepted-species climate and productivity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p sources
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14238869787/zip" \
            -o sources/current_NPP_LGM.zip
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14219399376/zip" \
            -o sources/current_BIO19_AGB_NDVI.zip
          echo "1da364ff63c506f9e2c06d1d71c9609a2c48fec7a428a21ba2c3c4c6ff8f4800  sources/current_NPP_LGM.zip" | sha256sum -c
          echo "d8b97528188d9f8d63cb802d5b3f6e8f7f251937fd30af42aeae47e43ebad1fc  sources/current_BIO19_AGB_NDVI.zip" | sha256sum -c
      - name: Actual nine-hue within-genus ecological interaction plus out-of-genus validation
        run: |
          python scripts/analysis/mois_ecology_moisture_temperature_20261118.py \
            --main sources/current_NPP_LGM.zip \
            --env sources/current_BIO19_AGB_NDVI.zip \
            --out results/mois_thermal_moisture_ecology_20261118
      - name: Upload numerical estimates and source receipts only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mois-thermal-moisture-nine-hue-within-genus-real-20261118
          path: results/mois_thermal_moisture_ecology_20261118/
          retention-days: 30
          if-no-files-found: error
