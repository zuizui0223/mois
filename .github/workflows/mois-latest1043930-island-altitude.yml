name: MOIS latest1043930 real-photo island mainland and high-altitude analysis
on:
  push:
    branches: [feat/latest1043930-four-axes-20261025]
    paths:
      - scripts/analysis/mois_latest1043930_island_altitude.py
      - .github/workflows/mois-latest1043930-island-altitude.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-source1043930-original-photo-gshhg-island-altitude-20261025
  cancel-in-progress: false
jobs:
  real-latest-one-million-gshhg:
    if: github.repository == 'zuizui0223/mois'
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install original high-resolution GSHHG geography and source-climate models
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 \
            pyarrow==19.0.1 geopandas==1.0.1 shapely==2.0.6 \
            statsmodels==0.14.5 scipy==1.15.2 pyogrio==0.10.0
          python -m py_compile scripts/analysis/mois_latest1043930_island_altitude.py
      - name: Restore exact newest 1043930 genuine photo rows and newly completed full original WorldClim photo IDs
        run: |
          set -euo pipefail
          mkdir -p photos climate coast
          gh run download 40187688390 --repo zuizui0223/mois \
            --name mois-1043930-latest-original-photo-four-hue-fully-signed-union \
            --dir photos
          gh run download 40188040027 --repo zuizui0223/mois \
            --name mois-real-latest1043930-photoid-original-worldclim-humidity-elevation \
            --dir climate
          gh run download 39112342916 --repo zuizui0223/mois \
            --name mois-real313535-island-mainland-macro-geography --dir coast
          curl --fail --location --silent --show-error --retry 3 --max-time 400 \
            https://github.com/GenericMappingTools/gshhg-gmt/releases/download/2.3.7/gshhg-shp-2.3.7.zip \
            -o coast/gshhg-shp-2.3.7.zip
          echo '8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41  coast/gshhg-shp-2.3.7.zip' | sha256sum -c -
      - name: Actual 1m-photo coastline overlay, matched climate island mainland and paired elevation analysis
        timeout-minutes: 48
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_latest1043930_island_altitude \
            --photo photos/mois_latest_1043930_true_original_photo_hue_observation.parquet \
            --climate climate/mois_latest1043930_original_photo_climate_six_columns.parquet \
            --cache coast --coast coast/gshhg-shp-2.3.7.zip \
            --output island_elevation_latest1043930
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('island_elevation_latest1043930/mois_latest1043930_island_altitude_result.json').read_text())
          assert m['real_original_source_photo_attempts']==1043930
          assert m['latest_four_hue_classified']==459235
          assert m['geographic_photo_ID_assignments']['previous_coastline_assigned_photo_IDs_reused']==313535
          assert sum(x['source_original_photo_attempts'] for x in m['island_mainland_photo_source_raw'].values())==1043930
          assert m['island_mainland_environment_matched_and_spatial_regression']['optimal_match_pairs']>=20
          assert m['elevation_same_landmass_nearby_5deg']['paired_same_landmass_neighbourhoods']>=15
          assert m['all_original_photo_ids_retained_once'] and m['technical_image_4hue_unknowns_not_imputed']
          print('MOIS_LATEST1043930_ISLAND_AND_HIGH_ELEVATION_REMEASURED_NOT_REUSED_350K',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-real-latest1043930-island-mainland-elevation-gshhg
          path: island_elevation_latest1043930/
          retention-days: 90
          if-no-files-found: error
