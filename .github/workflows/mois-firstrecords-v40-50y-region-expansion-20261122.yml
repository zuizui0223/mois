name: "MOIS ecology: 2026 FirstRecords inter-regional 50y photo9"
on:
  push:
    branches: [analysis/mois-global-floral-colour-assembly-null-20261118]
    paths:
      - scripts/analysis/mois_firstrecords_v40_interregional_firstrecords_photo9_20261122.py
      - tests/test_mois_firstrecords_v40_interregional_20261122.py
      - .github/workflows/mois-firstrecords-v40-50y-region-expansion-20261122.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-v40-real-firstrecord-regional-50y
  cancel-in-progress: true
jobs:
  regional-first-record-chronology:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned source and numerical analysis dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "numpy==2.1.3" "pandas==2.2.3" "pytest>=8,<10"
          python -m pytest -q tests/test_mois_firstrecords_v40_interregional_20261122.py
          python -m py_compile scripts/analysis/mois_firstrecords_v40_interregional_firstrecords_photo9_20261122.py
      - name: Verify original DOI v4.0 2026 files and canonical MOIS species-color source
        run: |
          set -euo pipefail
          mkdir -p source/v4
          python - <<'PY'
          import urllib.request,hashlib,pathlib
          expected={
              "FirstRecords_dataset_public_v4.0.csv":"cbba8f2c2c518519674fd4f0540809d4",
              "FirstRecords_taxonomy_table_public_v4.0.csv":"d3e21741364b33fabb3cef3b249543bd",
              "FirstRecords_location_table_public_v4.0.csv":"cb69dd1ad613cbfe24db316b89f5884a"}
          base="https://zenodo.org/records/18759840/files/"
          for name,md5 in expected.items():
              url=base+name+"?download=1"
              request=urllib.request.Request(url,headers={"User-Agent":"MOIS-FirstRecords4-permutation-study/1.0"})
              p=pathlib.Path("source/v4")/name
              with urllib.request.urlopen(request,timeout=135) as r,p.open("wb") as out:
                  while (buf:=r.read(1024*1024)):out.write(buf)
              received=hashlib.md5(p.read_bytes()).hexdigest()
              assert received==md5,(name,received)
              print("MOIS_FIRSTRECORDS_V40_PUBLISHER_MD5_OK",name,received,flush=True)
          PY
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14166701658/zip" \
            -o source/mois_GBIF.zip
          echo "422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2  source/mois_GBIF.zip" | sha256sum -c
      - name: Measure 25/50/100-year unique new first-record locations per source species and strict colour association
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_firstrecords_v40_interregional_firstrecords_photo9_20261122 \
            --v4 source/v4 --gbif source/mois_GBIF.zip --permutations 999 \
            --out results/v4_firstrecord_50y_20261122
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-firstrecords-v40-exact-highconfidence-50y-999-20261122
          path: results/v4_firstrecord_50y_20261122/
          retention-days: 60
          if-no-files-found: warn
