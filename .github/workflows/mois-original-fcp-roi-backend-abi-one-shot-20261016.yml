name: Mois real frozen FCP original ROI-v4 backend ABI check

# One-shot original FCP repo integration. A new photo/palette method requires
# explicit source review; it never automatically changes the Mois pipeline.
on:
  push:
    branches:
      - manuscript/geographic-conditional-moisture-research-20261014
    paths:
      - .github/workflows/mois-original-fcp-roi-backend-abi-one-shot-20261016.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-real-original-method-without-photo-pixels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact current reviewed Mois original blooming/photo worker
        uses: actions/checkout@v4
        with:
          path: mois
          ref: manuscript/geographic-conditional-moisture-research-20261014

      - name: Checkout immutable original FCP PR200 source for REAL backend checks
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/fcp
          ref: c00e3db156ec2f214b13e83f3e91dd8d863d83dc
          path: original_fcp
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install numeric libraries for original FCP terminal contract checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.1.3 pandas==2.2.3 pillow==11.3.0 pytest==8.4.2

      - name: Verify real original FCP blob, Python method ABI, original ROI result palette and URI restrictions
        shell: bash
        working-directory: mois
        env:
          MOIS_ORIGINAL_FCP_REPOSITORY: ${{ github.workspace }}/original_fcp
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_mois_original_fcp_backend_actual_integration_20261016.py
          echo MOIS_REAL_ORIGINAL_FCP_BACKEND_METHOD_ABI_CONFIRMED_NO_IMAGE_PIXELS
