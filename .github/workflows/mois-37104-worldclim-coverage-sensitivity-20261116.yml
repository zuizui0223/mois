name: MOIS 37104 real GBIF WorldClim photo hue 16 source-signed sensitivities

on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-37104-worldclim-coverage-sensitivity-20261116.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  exact-37104-source-sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned fixed-effect numerical dependencies
        run: python -m pip install -q pandas==2.2.3 numpy==2.1.3 statsmodels==0.14.4 scipy==1.15.2
      - name: Restore exact signed successful full WorldClim 37104 species cohort
        run: |
          set -euo pipefail
          mkdir -p original
          curl --fail --location --silent --show-error --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/zuizui0223/mois/actions/artifacts/14192392368/zip' \
            --output original/climate_global.zip
          echo '82f06f69043a2080a961d5586ab4ecc2342b7d7d739c4ac819147971f4d8e069  original/climate_global.zip' | sha256sum -c -
          test "$(gh api repos/zuizui0223/mois/actions/runs/43791207244 --jq .conclusion)" = success
      - name: Recompute conditional photo-white climate coefficients at 4 climate coverage levels and with/without colour contradictions
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_worldclim_species_hue_sensitivity_20261116 \
            --source original/climate_global.zip --output out
          python - <<'PY'
          import json,pandas as pd
          r=json.load(open('out/receipt.json'))
          x=pd.read_csv('out/BIO1_BIO12_white_photo_genusFE_coverage_quality_sensitivity.csv')
          assert r['tests']==len(x)==16
          assert x.taxa.min()>26000
          assert set(x.climate_coverage_threshold)=={0.5,0.75,0.9,1.}
          assert x.p_genus_clustered.between(0,1).all()
          base=x[(x.climate_coverage_threshold==0.75)
                 &(~x.omit_species_photo_modal_vs_mean9_conflicts)]
          a=base.set_index('response')
          assert abs(a.at['mean_annual_temperature_C','beta']-0.09445000684234892)<1e-6
          assert abs(a.at['log_annual_precip','beta']-0.015191341630759804)<1e-6
          assert not r['petal_colour_at_GBIF_location_measured']
          print('MOIS_WORLDCLIM_16_CLIMATE_SENSITIVITIES_SIGNED_SOURCE_REPLICATED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mois-GBIF-all37104-WorldClim-BIO1-BIO12-coverage-photoQC-sensitivity-20261116
          path: out/
          retention-days: 90
          if-no-files-found: error
