name: MOIS recover all remaining 2020 original mainland-and-island 30630 environment targets
on:
  push:
    branches: [analysis/mois-viirs-popmatch-20261105]
    paths: [.github/workflows/mois-global-2020-remaining30630-bulk-original.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-global-2020-remaining30630-actual-original-v1
  cancel-in-progress: false
jobs:
  global-original-2020-remainder:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source identity, no false missingness, and 30630-plan unit tests
        run: |
          set -euo pipefail
          python -m pip install -q requests==2.32.5 pandas==2.2.3 numpy==2.1.3 geopandas==1.1.2 shapely==2.1.2
          python -m unittest discover -s tests -p test_mois_global_multipoint_numeric_20261107.py -v
          python -m unittest discover -s tests -p test_mois_global2020_multipoint_bulk4096_20261107.py -v
          python -m py_compile scripts/analysis/mois_global2020_prepare_next4096_20261107.py
          python -m py_compile scripts/analysis/mois_global2020_multipoint_bulk4096_20261107.py
      - name: Restore SHA-locked original canonical, coast, 1014 legacy and all 5440 previous new 2020 environment sites
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p src/shoreline src/first256 src/next1024 src/next64 src/first4096
          gh run download 41007444495 --repo zuizui0223/mois --name mois-nohuman-canonical-climate-joined-20261030 --dir src
          gh run download 42175243391 --repo zuizui0223/mois --name mois-GSHHG-2.3.7-high-L1-L2-SHA-source-no-images --dir src/shoreline
          gh run download 41946071715 --repo zuizui0223/mois --name mois-2020-VIIRS4month-WorldPop2020-taxonequal-source-cells --dir src
          gh run download 42192184774 --repo zuizui0223/mois --name mois-global-noarea-2020-256-real-values-and-response-SHAs --dir src/first256
          gh run download 42219556580 --repo zuizui0223/mois --name mois-global-next1024-combined-real-values-response-SHAs --dir src/next1024
          gh run download 42322001600 --repo zuizui0223/mois --name mois-global-multipoint-64-new-targets-2020-source-responses-and-replay --dir src/next64
          gh run download 42324300132 --repo zuizui0223/mois --name mois-global-original-2020-new4096-multipoint-SHA-replay --dir src/first4096
          echo 'f033661d76e07898a5c13199a55c5d0ce6e55353daa48b0058c456979e90644c  src/canonical_observations_climate.csv.gz' | sha256sum -c -
          echo '3562db1e5783e77d3bb408bd33817b4d7cccf31ad4d4ad42586469708fd407e3  src/viirs_population_source_matched_cells_2020.csv' | sha256sum -c -
          echo '303424afe40b41e7bda2ec0ae456dd27820a50e17f7ca23204c81036adf21466  src/first256/global_output/values.csv' | sha256sum -c -
          echo '7aa0193178d664818bca777749074fc88fe0b9e594e83e5eb34d6f72110efce9  src/next1024/next_output/all1024_values.csv' | sha256sum -c -
          echo 'a513250fa9911a35c7f40380684ae97f52d7cdfea7bf828cdcd7cbe1be34192c  src/next64/result/values.csv' | sha256sum -c -
          echo 'fa06170ce59e41b6d7e486c236acf7d004091a035f7cbddbb3632bcd788ffa65  src/first4096/source4096/source_locked_2020_new4096.csv' | sha256sum -c -
      - name: Reproduce all remaining 30630 original 2020 photo-cell landmass source targets with no area/latitude filter
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_global2020_prepare_next4096_20261107 \
            --canonical src/canonical_observations_climate.csv.gz \
            --shoreline src/shoreline \
            --legacy src/viirs_population_source_matched_cells_2020.csv \
            --previous256 src/first256/global_output/values.csv \
            --previous1024 src/next1024/next_output/all1024_values.csv \
            --previous64 src/next64/result/values.csv \
            --previous4096 src/first4096/source4096/source_locked_2020_new4096.csv \
            --out source_remaining
          echo 'f9805adb2533c6a26a632e6d011b2468637e7603bc7b1afb209b06ab38a2fd35  source_remaining/source_locked_2020_remaining30630.csv' | sha256sum -c -
          python - <<'PY'
          import json
          r=json.load(open('source_remaining/source_receipt.json'))
          assert r['new_selected_targets']==30630
          assert r['mainland']==27003 and r['island']==3627
          assert r['previous_new_requests_count']==5440
          assert r['photo_attempts_referenced']==51934
          assert r['previous_strict9_success_referenced']==20683
          assert r['island_area_cutoff'] is None and r['latitude_cutoff'] is None
          print('MOIS_REMAINING30630_SOURCE_GEOGRAPHY_SHA_VERIFIED',json.dumps(r,sort_keys=True),flush=True)
          PY
      - uses: actions/cache/restore@v4
        with:
          path: output/raw
          key: mois-2020-30630-f9805adb-source-raw-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mois-2020-30630-f9805adb-source-raw-v1-
      - name: Actual bulk extraction of remaining 30630 world known-land 2020 points using bounded multiband batches
        timeout-minutes: 32
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_global2020_multipoint_bulk4096_20261107 \
            --targets source_remaining/source_locked_2020_remaining30630.csv \
            --out output --expected-manifest-sha f9805adb2533c6a26a632e6d011b2468637e7603bc7b1afb209b06ab38a2fd35 \
            --expected-rows 30630 --workers 4
      - name: Offline replay all original source bytes with no new HTTP and verify photo-independent result count
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_global2020_multipoint_bulk4096_20261107 \
            --targets source_remaining/source_locked_2020_remaining30630.csv \
            --out output --expected-manifest-sha f9805adb2533c6a26a632e6d011b2468637e7603bc7b1afb209b06ab38a2fd35 \
            --expected-rows 30630 --workers 4 --offline
          python - <<'PY'
          import csv,json,hashlib,math
          from pathlib import Path
          p=Path('output');a=json.loads((p/'receipt.json').read_text());b=json.loads((p/'replay_receipt.json').read_text())
          assert a['targets_attempted']==b['targets_attempted']==30630
          assert a['planned_API_requests']==480
          assert a['API_requests_new']+a['API_requests_reused_from_saved_raw']==480
          assert b['API_requests_new']==0 and b['API_requests_reused_from_saved_raw']==480
          assert a['data_SHA256']==b['data_SHA256']
          assert (p/'values.csv').read_bytes()==(p/'replay_values.csv').read_bytes()
          assert a['data_SHA256']==hashlib.sha256((p/'values.csv').read_bytes()).hexdigest()
          assert a['input_manifest_SHA256']=='f9805adb2533c6a26a632e6d011b2468637e7603bc7b1afb209b06ab38a2fd35'
          assert a['attempted_by_land']=={'island':3627,'mainland':27003}
          assert a['new_photo_downloads_or_ROI_inferences']==0
          assert a['island_area_minimum'] is None and a['latitude_cutoff'] is None
          assert len(a['responses_source_SHA256'])==480
          for file,expected in a['responses_source_SHA256'].items():
              assert hashlib.sha256((p/'raw'/file).read_bytes()).hexdigest()==expected,file
          rows=list(csv.DictReader((p/'values.csv').open()))
          assert len(rows)==30630 and len({x['target_id'] for x in rows})==30630
          assert sum(r['complete']=='True' for r in rows)==a['targets_complete']
          print('MOIS_2020_ALL_KNOWN_LAND_LAST30630_ACTUALLY_ACQUIRED_AND_REPLAYED',
            json.dumps({k:a[k] for k in ('targets_attempted','targets_complete',
              'targets_quality_incomplete','complete_by_land','viirs_valid_month_values',
              'population_valid_values','API_requests_new','API_requests_reused_from_saved_raw')},
              sort_keys=True),flush=True)
          PY
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: output/raw
          key: mois-2020-30630-f9805adb-source-raw-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-global-original-2020-remaining30630-all-land-source-SHA-multipoint
          path: |
            source_remaining/
            output/
          retention-days: 90
          if-no-files-found: warn
