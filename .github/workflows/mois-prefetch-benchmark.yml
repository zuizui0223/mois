name: MOIS paired prefetch speed and exact photo result check
on:
  pull_request:
    types: [synchronize]
    paths:
      - scripts/acquisition/mois_prefetch.py
      - scripts/acquisition/mois_prefetch_benchmark.py
      - tests/test_mois_prefetch.py
      - .github/workflows/mois-prefetch-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-prefetch-paired-benchmark
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify overlap, source order, bounded storage and original error handling
        run: |
          python -m pip install -q pytest==8.4.2
          python -m pytest -q tests/test_mois_prefetch.py
      - name: Install the unchanged FCP loader and original flower model
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 scipy Pillow ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Reuse the completed wave source; no new candidate search
        run: |
          gh run download 39115773617 --repo zuizui0223/mois --name wave2-cached-source --dir source
      - name: Same 16 real photos and measured load delays, sequential-prefetch then prefetch-sequential
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-benchmark-photo-rate"
          python -m scripts.acquisition.mois_prefetch_benchmark --source source --runtime "$RUNNER_TEMP/fcp" --sam "$RUNNER_TEMP/sam" --output benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-prefetch-paired-real-photo-benchmark
          path: benchmark/
          if-no-files-found: warn
          retention-days: 90
