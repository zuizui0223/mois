name: MOIS GBIF family-conditioned genus segregation versus woody AGB and NDVI
on:
  push:
    branches: [analysis/mois-species-first-palette9-20261111]
    paths: [.github/workflows/mois-GBIF-WCVP-family-null-woody-AGB-NDVI-20261116.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mois-GBIF-family-null-genus-woody-AGB-NDVI-20261116
  cancel-in-progress: false

jobs:
  original-signed-current-vegetation-exposures:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned stats and verify independent AGB/NDVI ablation tests
        run: |
          set -euo pipefail
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 \
            statsmodels==0.14.4 scipy==1.15.2
          python -m py_compile scripts/analysis/mois_gbif_family_excess_biomass_ndvi_20261116.py
          python -m unittest discover -s tests -p 'test_mois_gbif_family_excess_biomass_ndvi_20261116.py' -v
      - name: Restore SHA-signed GBIF family-null, source region, LGM, and MODIS NDVI
        run: |
          set -euo pipefail
          mkdir -p sources
          for item in \
            '14234623179 FAMILY 0259071f76ffad271e5113b792c7c21f27c0c1d10ef99a215ff3a7779ce6a27b' \
            '14227246751 SPATIAL e209257adbc185b4855f3b8d76aeaa50d2e2afe8a1feeb0f76013366e57c4d16' \
            '14228652073 NATIVE b72b7358ed5382d625583ad61b90952e4e77377296fe90ae677bf9481aa80a7f' \
            '14219565387 NDVI e08e81d1c2afd1a2ee5312f3ebc4aeb5ab7678988c2453a2a9c63d28c82eb17a'; do
            set -- $item
            curl --fail --location --silent --show-error --retry 3 --retry-delay 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/zuizui0223/mois/actions/artifacts/$1/zip" \
              --output "sources/$2.zip"
            echo "$3  sources/$2.zip" | sha256sum -c -
          done
      - name: Model GBIF/WCVP genus segregation vs log woody biomass and vegetation greenness
        run: |
          set -euo pipefail
          python -m scripts.analysis.mois_gbif_family_excess_biomass_ndvi_20261116 \
            --family sources/FAMILY.zip \
            --spatial sources/SPATIAL.zip \
            --native sources/NATIVE.zip \
            --ndvi sources/NDVI.zip \
            --output MOIS_GBIF_family_biomass
          python - <<'PY'
          import json
          r=json.load(open('MOIS_GBIF_family_biomass/receipt.json'))
          assert r['source_GBIF_accepted_species']==37104
          assert r['taxon_response_without_photo_hue']
          assert r['woody_AGB_not_NPP_or_individual_flower_allocation']
          for mode in ('strict','moderate'):
              s=r['models'][mode]
              assert s['n_complete']>2500
              x=s['models']['residual_after_family_conditioning']
              assert x['500km_full_AGB_and_NDVI']['n_cells']>2400
              assert len(x['500km_full_AGB_and_NDVI']['effect'])==3
          print('MOIS_GBIF_FAMILY_NULL_BIOMASS_NDVI_SOURCE_VERIFIED',
                json.dumps({k:{
                   'n':m['n_complete'],
                   'effects':m['models']['residual_after_family_conditioning']['500km_full_AGB_and_NDVI']['effect'],
                   'AGB_NDVI_rho':m['AGB_NDVI_Spearman']}
                 for k,m in r['models'].items()},sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-GBIF-WCVP-family-genus-segregation-woodyAGB-NDVI
          path: MOIS_GBIF_family_biomass/
          retention-days: 90
          if-no-files-found: warn
