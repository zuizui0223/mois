name: "MOIS Ecology: spatial rainfall effects partitioned by white and chromaticity"
on:
  push:
    branches:
      - analysis/mois-global-floral-colour-assembly-null-20261118
    paths:
      - scripts/analysis/mois_hue9_chainrule_environment_components_20261118.py
      - .github/workflows/mois-hue9-assembly-rainfall-shannon-components-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-hue9-component-ecological-rainfall-20261118
  cancel-in-progress: false
jobs:
  ecological-white-vs-chromatic-components:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source verified numerical and statistical dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "pandas>=2.1,<3" "pyarrow>=17,<25" \
            "scipy>=1.11,<2" "statsmodels>=0.14,<1" "scikit-learn>=1.5,<1.9"
      - name: Download original signed 396M GBIF effort plus matched Shannon climate and exact partition outputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source
          for asset in \
             '14166701658 GBIF 422f6d6489e61c6e57c5d51db614e47f613039781a901e3fd3481c13b2b085c2' \
             '14397855889 ENVIRONMENT 4f5d8fc3a308482fc3645d796a779d1a4725c51ed2afbf6a06e61fd6213f3ee6' \
             '14398092175 CHAIN 4b76d95df58d794a70338b71d61ee91a0e49a6c2c67bb721e806822000e0f804'; do
             set -- $asset
             curl -fsSL --retry 3 \
               -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" \
               -o "source/$2.zip"
             echo "$3  source/$2.zip" | sha256sum -c
          done
      - name: On exactly the same real GBIF grid cells, decompose current and LGM rainfall Shannon slopes
        run: |
          python -m scripts.analysis.mois_hue9_chainrule_environment_components_20261118 \
            --environment source/ENVIRONMENT.zip \
            --chain source/CHAIN.zip \
            --GBIF source/GBIF.zip \
            --out results/mois_hue9_rainfall_component_ecology_20261118
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mois-global-nine-hue-rainfall-exact-white-chromatic-ecology-20261118
          path: results/mois_hue9_rainfall_component_ecology_20261118/
          retention-days: 30
          if-no-files-found: error
