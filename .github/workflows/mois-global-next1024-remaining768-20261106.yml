name: MOIS global next1024 remaining768 exact environmental targets
on:
  push:
    branches: [analysis/mois-viirs-popmatch-20261105]
    paths: [.github/workflows/mois-global-next1024-remaining768-20261106.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-global-noarea-2020-256-source-data
  cancel-in-progress: false
jobs:
  remaining-environment-values:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test unchanged numerical collector
        run: |
          set -euo pipefail
          python -m pip install -q requests==2.32.5
          python -m unittest discover -s tests -p test_mois_global_cached_environment_20261106.py -v
      - name: Reuse previous 256 and the already completed next-block0 measurements
        run: |
          set -euo pipefail
          mkdir -p previous first next_input
          gh run download 42192184774 --repo zuizui0223/mois --name mois-global-noarea-2020-256-real-values-and-response-SHAs --dir previous
          gh run download 42216763620 --repo zuizui0223/mois --name mois-global-next1024-block0-256-real-environment-raw-SHAs --dir first
          echo '303424afe40b41e7bda2ec0ae456dd27820a50e17f7ca23204c81036adf21466  previous/global_output/values.csv' | sha256sum -c -
          echo '2f0e843dab6387e8d8f7e9ad91b2893801fbf5a99b59e465002bc15af292c81e  first/output/values.csv' | sha256sum -c -
      - name: Verify entire fixed 1024 manifest before any remaining provider request
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,csv,io,json,hashlib
          from pathlib import Path
          from scripts.analysis.mois_global_cached_environment_20261106 import spec,key,MONTHS
          rows=[]
          for i in range(16):
              raw=gzip.decompress(base64.b64decode(Path(f'config/mois_next1024_20261106/part_{i:02d}.csv.gz.b64').read_text()))
              part=list(csv.DictReader(io.StringIO(raw.decode())))
              assert len(part)==64
              rows.extend(part)
          def encode(items):
              out=io.StringIO(newline='')
              w=csv.DictWriter(out,fieldnames=list(items[0]),lineterminator='\n')
              w.writeheader();w.writerows(items)
              return out.getvalue().encode()
          whole=encode(rows)
          assert hashlib.sha256(whole).hexdigest()=='94a9685b0051d573cd0a7ec2c06579e2c7382944bd1146ac38d5b85d86316472'
          assert len(rows)==1024 and len({r['target_id'] for r in rows})==1024
          assert all(r['target_id'].startswith('2020|') for r in rows)
          assert sum(r['land_class']=='mainland' for r in rows)==903
          assert sum(r['land_class']=='island' for r in rows)==121
          assert sum(abs(float(r['query_latitude']))>60 for r in rows)==15
          Path('next_input/all1024_targets.csv').write_bytes(whole)
          expected=['01da6df6c7b2a5b21c70b4a2a65364f0eb6c9c4cbb16ac0b0f7c6ff5fdd04d34','46567d7f838a5f37bdc37e703d7d9d07e54907d7eb716f2c8dbefb06da5d4473','abee76da35a744aa7efee0209de963b33192d05f9a05db27344379c302ecc89d','b829d284bb31f39b6f3ad43ad4a354d5920d60f386ac71c6d4c5d54334696e19']
          for block in range(4):
              raw=encode(rows[block*256:(block+1)*256])
              assert hashlib.sha256(raw).hexdigest()==expected[block]
              Path(f'next_input/targets_{block}.csv').write_bytes(raw)
          assert Path('next_input/targets_0.csv').read_bytes()==Path('first/input/targets.csv').read_bytes()
          old=list(csv.DictReader(Path('previous/global_output/values.csv').open()))
          first=list(csv.DictReader(Path('first/output/values.csv').open()))
          assert {r['target_id'] for r in first}=={r['target_id'] for r in rows[:256]}
          def keys(items):
              return {key(spec(p,2020,m,r['query_longitude'],r['query_latitude'])) for r in items for p,m in [('viirs',m) for m in MONTHS]+[('population_global1',0)]}
          assert len(keys(rows))==5120 and not keys(rows)&keys(old)
          assert len(keys(rows[256:]))==3840 and not keys(rows[256:])&keys(first)
          r={'schema':'mois_fixed_next1024_remaining768_source_v1','fixed_1024_sha256':hashlib.sha256(whole).hexdigest(),'first_block_reused_from_run':42216763620,'previous256_run':42192184774,'new_targets_to_query':768,'reused_measured_targets':256,'previous_request_overlap':0,'already_completed_block0_request_overlap':0,'area_cutoff':None,'latitude_cutoff':None,'selection_unchanged_from_prepared_manifest':True}
          Path('next_input/selection_receipt.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print('REMAINING768_SOURCE_AND_NO_DUPLICATE_REQUESTS_CONFIRMED',json.dumps(r),flush=True)
          PY
      - uses: actions/cache/restore@v4
        with:
          path: next_output
          key: mois-next1024-rest768-94a9685b-raw-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mois-next1024-rest768-94a9685b-raw-v1-
      - name: Preserve already measured block0 without re-requesting
        run: |
          set -euo pipefail
          mkdir -p next_output/block_0
          cp -a first/output/. next_output/block_0/
      - name: Acquire remaining three sequential blocks with maximum four provider requests in flight
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            python -m scripts.analysis.mois_global_cached_environment_20261106 --targets next_input/targets_${i}.csv --out next_output/block_${i} --workers 4
            python -m scripts.analysis.mois_global_cached_environment_20261106 --targets next_input/targets_${i}.csv --out next_output/block_${i} --workers 4 --offline
          done
      - name: Verify all1024 output and count only measured usable values
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          records=[];summaries=[]
          for i in range(4):
              p=Path(f'next_output/block_{i}')
              a=json.loads((p/'receipt.json').read_text());b=json.loads((p/'replay_receipt.json').read_text())
              assert a['targets_planned']==256 and a['targets_attempted']==256
              assert b['requests_new']==0 and b['requests_reused']==1280
              assert (p/'values.csv').read_bytes()==(p/'replay_values.csv').read_bytes()
              assert a['values_sha256']==b['values_sha256']==hashlib.sha256((p/'values.csv').read_bytes()).hexdigest()
              assert a['targets_complete']==b['targets_complete']
              assert a['area_filter'] is None and a['latitude_filter'] is None
              assert a['new_photo_requests']==0 and a['ROI_reinference']==0
              records.extend(csv.DictReader((p/'values.csv').open()));summaries.append(a)
          assert len(records)==1024 and len({r['target_id'] for r in records})==1024
          source=list(csv.DictReader(Path('next_input/all1024_targets.csv').open()))
          assert [r['target_id'] for r in records]==[r['target_id'] for r in source]
          target=Path('next_output/all1024_values.csv')
          with target.open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(records[0]),lineterminator='\n');w.writeheader();w.writerows(records)
          receipt={'schema':'mois_global_all_next1024_measured_v1','targets_attempted':1024,'targets_complete':sum(r['targets_complete'] for r in summaries),'complete_classes':{k:sum(r['complete_classes'][k] for r in summaries) for k in ('mainland','island')},'requests_new_this_workflow':sum(r['requests_new'] for r in summaries[1:]),'requests_reused_from_prior_block0_run':1280,'requests_reused_within_remaining_blocks':sum(r['requests_reused'] for r in summaries[1:]),'successful_values_all1024':sum(r['successful_numerical_values_total'] for r in summaries),'new_successful_values_this_workflow':sum(r['new_successful_values'] for r in summaries[1:]),'first256_from_run':42216763620,'new_photo_downloads_or_ROI_inferences':0,'area_or_latitude_exclusions':False,'offline_replay_new_requests':0,'values_sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'fixed_target_manifest_sha256':'94a9685b0051d573cd0a7ec2c06579e2c7382944bd1146ac38d5b85d86316472','population_2020_requested_but_response_year_not_echoed':True,'four_month_values_not_official_annual_composite':True}
          Path('next_output/combined_receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('MOIS_NEXT1024_COMPLETE_ACTUAL_COUNTS',json.dumps(receipt,sort_keys=True),flush=True)
          PY
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: next_output
          key: mois-next1024-rest768-94a9685b-raw-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-global-next1024-combined-real-values-response-SHAs
          path: |
            next_output/
            next_input/
          retention-days: 90
          if-no-files-found: error
