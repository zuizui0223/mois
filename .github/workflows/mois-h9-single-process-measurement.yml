name: MOIS H9 source-frozen single-process actual image measurement
on:
  pull_request:
    paths:
      - scripts/analysis/mois_h9_measure_verified_candidates.py
      - tests/test_mois_h9_measure_verified_candidates.py
      - .github/workflows/mois-h9-single-process-measurement.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mois-h9-single-process-source-a901359a7ed7
  cancel-in-progress: false
jobs:
  measure-frozen-h9:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test without API calls or model downloads
        run: |
          python -m pip install -q numpy==2.1.3 pandas==2.2.3 pytest==8.4.2
          python -m pytest -q tests/test_mois_h9_measure_verified_candidates.py
      - name: Restore completed H9 source, never repeat the 187 API queries
        run: |
          set -euo pipefail
          mkdir -p h9_source
          gh run download 39100593204 --repo zuizui0223/mois \
            --name mois-fcp-h9-one-page-flowering-photo-source-only --dir h9_source
          echo 'a901359a7ed72d7baf0dd21dd7f4bf4d6ee43a09acbe65cca3a1fa0d1b0ba2aa  h9_source/mois_fcp_H9_original_flowering_photo_refills_first256_unknown.csv' | sha256sum -c -
      - name: Bootstrap same FCP loader and frozen ROI-v4 method
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fcp"
          git -C "$RUNNER_TEMP/fcp" remote add origin https://github.com/zuizui0223/fcp.git
          git -C "$RUNNER_TEMP/fcp" fetch -q --no-tags --depth=1 origin 74bf69a52cd68bfc7dbe6158f4a681235caa6ca0
          git -C "$RUNNER_TEMP/fcp" checkout -q --detach FETCH_HEAD
          python -m pip install -q scipy Pillow ultralytics==8.4.112 onnxruntime==1.23.2 scikit-image==0.25.2
          cd "$RUNNER_TEMP/fcp"
          bash scripts/acquisition/bootstrap_fcp_original_roi_v4.sh --full --sam-dir "$RUNNER_TEMP/sam"
      - name: Measure actual originals with one model invocation
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$RUNNER_TEMP/fcp"
          export FCP_PROVIDER_GLOBAL_RATE_FILE="$RUNNER_TEMP/mois-h9-original-photo-rate"
          python -m scripts.analysis.mois_h9_measure_verified_candidates \
            --source h9_source --runtime "$RUNNER_TEMP/fcp" \
            --sam "$RUNNER_TEMP/sam" --out h9_measured
      - name: Confirm all attempted photos, outcomes and timing are reported
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('h9_measured/mois_h9_measured_photo_receipt.json').read_text())
          assert r['attempted_photos']==34
          assert sum(r['hue_counts'].values())==r['classified_photos']
          assert r['classified_photos']+r['download_failures']+r['hue_unknown_after_download']==34
          assert r['new_classifier_evaluator_invocations']<=1
          assert r['method_attestation']['location_blind']
          assert not r['model_changed']
          print('MOIS_H9_SINGLE_PROCESS_REAL_SOURCE_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mois-h9-real-original-photo-one-process-${{ github.run_id }}-${{ github.run_attempt }}
          path: h9_measured/
          retention-days: 90
          if-no-files-found: warn
