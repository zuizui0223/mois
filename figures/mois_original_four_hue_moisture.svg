<title id="f4title">All four photographed flower-colour responses to global precipitation and vapour pressure</title>
<desc id="f4desc">Original 20,694 species genus-equal climate analysis. White has a positive simultaneous confidence interval excluding zero for both water variables. The other three hues show individual intervals including zero. Source-controlled, not a universal causal pigment effect.</desc>
