<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="fig2-title fig2-desc">
<title id="fig2-title">Photographic selection and matched rainfall contrasts</title>
<desc id="fig2-desc">Original data show 100543 photos, 45953 classifiable. Wet dry classes differ in classifiability. The original matched photo contrast shows a positive between species slope but not within species.</desc>
