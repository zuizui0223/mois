<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="870" viewBox="0 0 1560 870" role="img" aria-labelledby="f5-title f5-desc">
<title id="f5-title">Global photographed flower white balance and contrasting taxonomic scale moisture associations</title>
<desc id="f5-desc">Panel A shows three differently weighted near-half photographic white proportions and a stricter genus sample. Panel B shows positive within-genus and between-genus photographed white slopes for precipitation and atmospheric vapour, with ordinary whole-genus bootstrap 95% intervals. Panel C shows positive, negative and invariant nominal genus contributions underlying worldwide positive slopes. Neither photograph frequencies nor coefficients measure genetic colour frequencies, natural selection or plant fitness.</desc>
