<rect x="0" y="0" width="1560" height="14" rx="0" fill="#2F5870"/>
<text x="49" y="69" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#263849" text-anchor="start">GLOBAL NEAR-PARITY, DIFFERENT ECOLOGICAL SCALES</text>
<text x="49" y="110" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#546878" text-anchor="start">Source-classified flower photographs · distinct statistical targets · no inferred pigment fitness</text>
